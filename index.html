平衡后，再开隔断阀、关旁路阀。", "reg": "公用 4.3.4", "lecture": "\u003cp>天然气置换氮气做完以后，系统里是压力很低的天然气\u003cspan class=\"cite\">见考点 3.2\u003c/span>。投运，就是从上游把系统充压到运行压力、投入运行。投运前先检查需投运系统的气体置换工作已经完成\u003cspan class=\"cite\">公用 4.3.4\u003c/span>。\u003c/p>\n\u003cp>充压的做法是\u003cspan class=\"cite\">公用 4.3.4\u003c/span>：\u003c/p>\n\u003col>\n\u003cli>缓慢开启系统入口阀的旁路阀，给系统充压。调整旁路手阀的开度，控制管线中的升压速度不超过 0.2MPa/min。\u003c/li>\n\u003cli>加强压力表监视，避免升压过程中超过管道设计压力。\u003c/li>\n\u003cli>入口阀前后压力表显示压力平衡后，再逐渐开启该系统的隔断阀门，然后关闭旁路阀。\u003c/li>\n\u003cli>充压全程用便携式可燃气体检测仪连续检测天然气泄漏，一发现泄漏，立即停止充天然气。\u003c/li>\n\u003c/ol>\n\u003ch4>为什么先开旁路\u003c/h4>\n\u003cp>上游是管网来的高压气，下游刚置换完压力很低，入口阀两侧压差很大。这时直接开主阀，有三个问题：压差把阀芯紧紧压在阀座上，开阀力矩很大，不好开；阀刚开出一道缝时，气流以极高的速度从缝里冲过，会冲刷阀座密封面；阀一开，下游压力几乎一下子就升上去，升压速度控制不住\u003cspan class=\"infer\">原理\u003c/span>。\u003c/p>\n\u003cp>旁路阀口径小，先用它充压，流量受限，升压慢，还能用开度来调。等主阀前后压力平衡了，主阀两侧没有压差，开起来轻，也不会冲刷密封面\u003cspan class=\"infer\">原理\u003c/span>。入口单元的 ESD 阀就设有旁路阀，规程写它的用途是「平衡ESD阀前后压力，便于开启ESD阀」\u003cspan class=\"cite\">公用 4.2.2.2\u003c/span>，说的是同一个道理。\u003c/p>\n\u003ch4>为什么要控制升压速度\u003c/h4>\n\u003cp>规程只写了升压速度不超过 0.2MPa/min 和不超过管道设计压力，没写原因\u003cspan class=\"cite\">公用 4.3.4\u003c/span>。从原理上看有这几条：\u003c/p>\n\u003cul>\n\u003cli>升压慢，充气流量就小，管内气流速度低，不容易把残留的锈渣、焊渣吹起来撞击管壁，也减少气流摩擦产生静电，这些都是可能的点火源\u003cspan class=\"infer\">原理\u003c/span>。\u003c/li>\n\u003cli>调压器、安全阀、仪表都怕压力冲击。升得慢，自力式调压器能跟得上，下游不会一下子冲高，安全阀也不会被冲得起跳\u003cspan class=\"infer\">推断\u003c/span>。\u003c/li>\n\u003cli>慢慢升，运行人员有时间盯压力表、用便携式检测仪查漏，在压力还低的时候就发现泄漏并停止充气，漏点处的泄漏量和危险都小\u003cspan class=\"infer\">推断\u003c/span>。\u003c/li>\n\u003c/ul>\n\u003cp>严密性试验只在较低的压力下查过漏\u003cspan class=\"cite\">见考点 3.1\u003c/span>，第一次升到运行压力就是在充天然气的这个过程中，所以全程连续检测泄漏尤其要紧\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003ch4>题库这道题\u003c/h4>\n\u003cp>题库有一道题问「进行天然气置换时」气体的升压速率一般不超过多少，选项是 0.1、0.3、0.5MPa/min，答案 0.3MPa/min\u003cspan class=\"cite\">题库 RJ-49df51d6\u003c/span>。规程 4.3.3 的三种置换都没写升压速率，这道题在本厂规程里没有对应条文，按题库答案记\u003cspan class=\"cite\">公用 4.3.3\u003c/span>。规程的 0.2MPa/min 是投运充天然气时的限值，和这道题问的不是一件事，不要拿来互相比\u003cspan class=\"cite\">公用 4.3.4\u003c/span>。\u003c/p>", "sources": [{"t": "公用规程 第 811～818 行", "lines": [[811, "4.3.4 系统投运"], [812, "1) 检查需投运系统的气体置换工作已完成。"], [813, "2）缓慢开启系统入口阀旁路阀对系统冲压，调整旁路手阀开度，控制管线中升压速度不应超过"], [814, "0.2MPa/min。"], [815, "3）加强压力表监视，避免系统升压过程中超过管道设计压力。待入口阀前后压力表显示压力平衡"], [816, "后，逐渐开启该系统隔断阀门，关闭旁路阀。"], [817, "4） 充压过程中应采用便携式可燃气体检测仪进行连续的天然气泄露检测， 如发现有泄漏立即停止"], [818, "充天然气操作。"]]}, {"t": "公用规程 第 634～639 行", "lines": [[634, "2) 紧急切断阀(ESD)"], [635, "调压站进口设置1个100%容量的ESD阀， 调压站及燃机在发生火灾或其他危险情况时， 能够紧急切断"], [636, "上游供气，确保整个供气系统及电厂的安全。"], [637, "紧急切断阀(ESD)为气动执行机构， 动力气源采用仪用压缩空气， 配置为失气关阀， 设置有旁路阀，"], [638, "用于平衡ESD阀前后压力， 便于开启ESD阀。 当发生需要紧急切断阀关闭的情况时， 可以现场手动或在集"], [639, "控室远程操作关闭阀门。阀位开关可以将紧急切断阀的开关位置反馈给DCS系统。"]]}, {"t": "公用规程 第 771～771 行", "lines": [[771, "4.3.3 气体置换"]]}], "cards": ["D:3.3-3", "RJ-49df51d6", "D:3.3-2", "D:3.3-5", "D:3.3-1", "D:3.3-4", "D:3.3-6"]}, "3.4": {"id": "3.4", "name": "调压站的停运", "cat": "三", "gist": "正常停运要等 3 台燃机和 2 台启动锅炉全停。上游突然断气、站内着火、系统压力骤降，这三种情况要紧急停运：停增压机，关入口 ESD，开放散阀泄压。检修停运要把检修单元隔离、放散、用氮气置换、泄压到零才能开工。长期停运时各单元充氮，保持约 0.3～0.5 MPa，关严所有通大气的阀门。", "reg": "公用 4.3.8～4.3.11", "lecture": "\u003cp>规程把调压站的停运分成四种：正常停运、紧急停运、检修停运、长期停运\u003cspan class=\"cite\">公用 4.3.8～4.3.11\u003c/span>。规程里正常停运和紧急停运的操作，第一步都是「停止天然气增压机运行」\u003cspan class=\"cite\">公用 4.3.8、4.3.9.2\u003c/span>。本厂管网升压以后增压机已经停运\u003cspan class=\"cite\">见考点 2.6\u003c/span>，这一步现在只需确认增压机在停运状态。\u003c/p>\n\u003ch4>正常停运\u003c/h4>\n\u003cp>要等调压站的用户全部停下来，也就是 3 台燃机和 2 台启动锅炉全部停运，调压站才具备停运条件\u003cspan class=\"cite\">公用 4.3.8\u003c/span>。然后根据具体情况，选择是否关闭调压站入口 ESD 阀或各增压机出口手阀\u003cspan class=\"cite\">公用 4.3.8\u003c/span>。所以正常停运不一定关入口 ESD 阀。短时间停运时，站内一直保持天然气压力，下次投运就不用重新充压\u003cspan class=\"infer\">推断：规程没写选择的依据\u003c/span>。\u003c/p>\n\u003ch4>紧急停运\u003c/h4>\n\u003cp>出现下面三种情况，调压站要紧急退出\u003cspan class=\"cite\">公用 4.3.9.1\u003c/span>：\u003c/p>\n\u003cul>\n\u003cli>上游供气突然停止，管道内压力急剧下降\u003c/li>\n\u003cli>调压站系统发生火灾\u003c/li>\n\u003cli>调压站系统压力突然急剧下降\u003c/li>\n\u003c/ul>\n\u003cp>操作是：停止天然气增压机运行（现已停运），关闭入口紧急切断阀，也就是入口单元的 ESD 阀\u003cspan class=\"cite\">公用 4.2.2.2\u003c/span>，然后打开放散阀，把调压站系统的压力放散掉\u003cspan class=\"cite\">公用 4.3.9.2\u003c/span>。和正常停运相比，紧急停运一定要关入口 ESD，并且要把系统压力放掉。\u003c/p>\n\u003cp>压力本来就在掉，为什么还要放散？规程没写原因。站内压力急剧下降，多半是上游断了气，或者站内有大的泄漏、管道破裂；着火时，站内的燃气更是在往火里送。关掉入口 ESD 只切断了新来的气，站内管道和设备里还存着大量带压天然气。打开放散阀，让这部分气从放散塔高处有组织地排走，站内压力很快降下来，漏点和着火点就没有气可漏、可烧\u003cspan class=\"infer\">推断：规程没写原因\u003c/span>。\u003c/p>\n\u003cp>调压站一关 ESD、一放散，燃机的燃气来源也就断了。4.3.9 没写和机组怎么配合；调压站严重泄漏的处理里，写的是立即停机，再切断调压站 ESD 和出口阀\u003cspan class=\"cite\">公用 4.5.4.2\u003c/span>\u003cspan class=\"cite\">见考点 3.6\u003c/span>。\u003c/p>\n\u003ch4>检修停运\u003c/h4>\n\u003cp>调压站设备停运维护或检修时，要把系统隔离、泄压，步骤是\u003cspan class=\"cite\">公用 4.3.10\u003c/span>：\u003c/p>\n\u003col>\n\u003cli>关闭检修单元的进、出口隔离阀，把待检修设备和其他单元完全隔离。\u003c/li>\n\u003cli>打开检修单元的放散阀，放散泄压。\u003c/li>\n\u003cli>泄压完后做氮气置换天然气，放散取样处测得的甲烷体积浓度低于 1% 时，置换合格。这个合格值和气体置换一节的写法不一样\u003cspan class=\"cite\">见考点 3.2\u003c/span>。\u003c/li>\n\u003cli>降压、放散、置换的整个过程中，持续对工作区域做可燃气体检测。\u003c/li>\n\u003cli>氮气置换完成后，把氮气压力泄放到 0，才允许开始检修。\u003c/li>\n\u003cli>检修过程中也要持续检测，测得的天然气浓度超过 10%LEL（LEL 即爆炸下限），必须停止一切检修工作，查找原因并处理。\u003c/li>\n\u003c/ol>\n\u003cp>为什么氮气要泄到 0 才能开工：带压的系统一拆就会喷气，拆开的零件可能被气顶飞；氮气本身不能供人呼吸，在设备内部或通风差的地方积聚会让人窒息\u003cspan class=\"infer\">原理\u003c/span>。10%LEL，约合甲烷体积浓度 0.5%\u003cspan class=\"conv\">换算\u003c/span>。检修中到这个浓度就停工，是把界限定在离爆炸下限还很远的地方，留出足够的余量去查原因\u003cspan class=\"infer\">原理\u003c/span>。\u003c/p>\n\u003ch4>长期停运\u003c/h4>\n\u003cp>要关闭各单元的进、出口隔断球阀，逐个单元泄压、充氮置换；系统里保持约 0.3-0.5Mpa 的氮气压力；关闭所有与大气相连的阀门，以防空气进入\u003cspan class=\"cite\">公用 4.3.11\u003c/span>。系统里保持氮气正压，外面的空气和潮气进不来，管道和设备内部不容易锈蚀；有没有漏，看氮气压力掉不掉就知道\u003cspan class=\"infer\">推断：规程只写了以防空气进入\u003c/span>。\u003c/p>", "sources": [{"t": "公用规程 第 903～933 行", "lines": [[903, "4.3.8 正常停运"], [904, "1) 检查调压站具备停运条件（3 台燃机和 2 台启动锅炉全部停运）。"], [905, "2) 停止天然气增压机运行。"], [906, "3) 根据具体情况选择是否关闭调压站入口 ESD 阀或各增压机出口手阀。"], [907, "4.3.9 紧急停运"], [908, "4.3.9.1 出现以下情况应紧急退出："], [909, "1) 上游供气突然停止，管道内压力急剧下降。"], [910, "2) 天然气调压站系统发生火灾。"], [911, "3) 天然气调压站系统压力突然急剧下降。"], [912, "4.3.9.2 调压站系统紧急停运操作如下："], [913, "1) 停止天然气增压机运行。"], [918, "2) 关闭入口紧急切断阀。"], [919, "3) 打开放散阀，将天然气调压站系统的压力放散。"], [920, "4.3.10 检修停运"], [921, "调压站设备停运维护或检修时，需按下列步骤对系统隔离泄压："], [922, "1) 关闭检修单元进、出口隔离阀，将待检修设备与其他单元完全隔离。"], [923, "2) 打开检修单元的放散阀进行放散泄压。"], [924, "3) 泄压完毕后，进行氮气置换天然气操作，当放散取样处测得的甲烷体积浓度低于 1% 时，置换"], [925, "合格。"], [926, "4) 在降压、放散和置换过程中，必须持续地对工作区域进行可燃气体检测。"], [927, "5) 氮气置换完成后，将氮气压力泄放至 0，才能允许设备检修工作。"], [928, "6) 在检修过程中， 必须持续对工作区域进行可燃气体检测，如果测得的天然气浓度超过 10％LEL，"], [929, "必须停止一切检修工作查找原因并处理。"], [930, "4.3.11 长期停运规定"], [931, "1) 关闭各单元的进、出口隔断球阀，分别对每一个单元进行泄压、充氮置换操作；"], [932, "2) 保持系统氮气的压力约 0.3-0.5Mpa；"], [933, "3) 关闭所有与大气相连的阀门，以防空气进入。"]]}, {"t": "公用规程 第 634～634 行", "lines": [[634, "2) 紧急切断阀(ESD)"]]}, {"t": "公用规程 第 1010～1012 行", "lines": [[1010, "(3) 如果严重泄漏，无法隔离，应立即停机，切断调压站紧急切断阀(ESD)和出口阀，如有必要，"], [1011, "应通知上游立即切断气源。现场加装临时通风设备，待甲烷浓度低于 5％LEL 后才允许进入站内做"], [1012, "相应的检修工作。"]]}], "cards": ["D:3.4-8", "D:3.4-4", "D:3.4-1", "D:3.4-2", "D:3.4-3", "D:3.4-6", "D:3.4-7", "D:3.4-5"]}, "3.5": {"id": "3.5", "name": "进站和作业的安全规定", "cat": "三", "gist": "不许带火种、手机等可能产生火花或静电的东西进站；进站前摸静电释放装置，指示灯变绿才能进；穿防静电工作服，不穿带铁掌的鞋；操作用铜制工具，动作均匀缓慢。动火前要测可燃气体浓度，反措规定不得超过爆炸下限的 20%，其中甲烷不超过 1%。", "reg": "公用 4.3.2、4.4.1；反措 8.7.11～8.7.14、8.7.17、8.7.19", "lecture": "\u003cp>本厂规程把进站和作业的规矩写在调压站一章里\u003cspan class=\"cite\">公用 4.3.2、4.4.1\u003c/span>；反措管的是整个燃气系统区域，包括调压站、燃气轮机间、前置模块\u003cspan class=\"cite\">题库 FC-8.7.12\u003c/span>。\u003c/p>\n\u003cp>这些规矩几乎都围着一件事：不让漏出来的燃气碰上能点着它的东西。甲烷和空气混合，浓度落在爆炸极限 5.0%～15.0% 之间时就能被点燃\u003cspan class=\"cite\">公用表 2\u003c/span>。点燃它需要的能量非常小，人身上的静电放电、钢铁工具相撞打出的火花、普通电器里的电火花都够。漏出的燃气看不见，哪里有一团混合气事先不知道，所以只能把所有可能的点火源都挡在门外\u003cspan class=\"infer\">原理：可燃气体的最小点火能量很低\u003c/span>。\u003c/p>\n\u003cp>进站之前，身上不能带火种和非防爆的通讯器材\u003cspan class=\"cite\">公用 4.3.2\u003c/span>。手机、钥匙、火种以及任何可能产生火花或静电的东西，要存放在指定位置；站内的非防爆电器和通讯设备一律关闭\u003cspan class=\"cite\">公用 4.4.1\u003c/span>。反措还写明燃气区域禁止用非防爆设备照相、摄影\u003cspan class=\"cite\">题库 FC-8.7.12\u003c/span>。手机不是防爆设计，电池触点和内部电路都可能产生微小的电火花，不打电话也不能带\u003cspan class=\"infer\">推断：规程没写原因\u003c/span>。\u003c/p>\n\u003cp>进门前要消除身上的静电：按规范触摸静电释放装置，提示灯显示为绿色才可以进入\u003cspan class=\"cite\">公用 4.4.1\u003c/span>。人走路、衣服摩擦都会让身上积累静电，碰到金属时放电的火花足以点燃燃气，所以进门前先把电荷导走\u003cspan class=\"infer\">原理：静电积累和放电\u003c/span>。\u003c/p>\n\u003cp>穿着方面，规程要求穿不会产生静电的工作服，戴安全帽、耳塞，穿安全鞋\u003cspan class=\"cite\">公用 4.3.2、4.4.1\u003c/span>。反措写得更具体：穿防静电工作服，不穿带铁掌的鞋\u003cspan class=\"cite\">题库 FC-8.7.12\u003c/span>。铁掌和地面摩擦会打出火花\u003cspan class=\"infer\">推断：规程没写原因\u003c/span>。进站前还要确认可燃气体探测没有报警、显示浓度正常\u003cspan class=\"cite\">公用 4.3.2\u003c/span>。\u003c/p>\n\u003cp>在站内操作设备，要用铜制工具，防止打出火花\u003cspan class=\"cite\">公用 4.4.1\u003c/span>。钢制工具打出的火花，是撞击时崩出、被加热到在空气里燃烧的铁屑；铜比钢软，很难崩出这样的屑\u003cspan class=\"infer\">原理：机械火花的成因\u003c/span>。规程还要求操作均匀缓慢，禁止剧烈地排送，防止摩擦引起自燃\u003cspan class=\"cite\">公用 4.4.1\u003c/span>。规程没解释「排送」，从上下文看是指放散、排污这类把燃气排出去的操作：燃气高速流过阀门和管道会摩擦起电，放得越猛越容易打火\u003cspan class=\"infer\">推断：按上下文理解\u003c/span>。\u003c/p>\n\u003cp>反措要求照明工具、对讲机、气体检漏仪必须是防爆型的\u003cspan class=\"cite\">题库 FC-8.7.11_8.7.13\u003c/span>；泄漏现场消缺必须使用铜制专用工具\u003cspan class=\"cite\">题库 RJ-anti015\u003c/span>。\u003c/p>\n\u003cp>手续方面，检修工作执行工作票，设备投退、置换执行操作票；检修前要把检修部分和不检修的部分隔断，置换后才能开工\u003cspan class=\"cite\">公用 4.4.1\u003c/span>。\u003c/p>\n\u003cp>动火作业要求最严。规程写的是：动火前必须测定可燃气体浓度，合格后才允许动火；动火期间要定期检测，合格才能继续干\u003cspan class=\"cite\">公用 4.4.1\u003c/span>。规程没有写「合格」是多少。反措给了数：明火作业地点空气里的燃气浓度不得超过爆炸下限的 20%，其中甲烷浓度不得超过 1%\u003cspan class=\"cite\">题库 FC-8.7.14\u003c/span>。这两个数说的是同一个浓度：甲烷的爆炸下限是 5.0%\u003cspan class=\"cite\">公用表 2\u003c/span>，爆炸下限的 20%，约合甲烷体积浓度 1%\u003cspan class=\"conv\">换算：5.0% 的 20%\u003c/span>。只取爆炸下限的五分之一，是因为燃气分布不均匀，测点不一定是最浓的地方，动火又是明火，要留足余量\u003cspan class=\"infer\">推断：反措没写取值原因\u003c/span>。\u003c/p>\n\u003cp>反措还有两条禁止性规定\u003cspan class=\"cite\">题库 FC-8.7.17_8.7.19\u003c/span>：\u003c/p>\n\u003cul>\n\u003cli>严禁未装设阻火器的车辆在燃气轮机的警示范围或调压站内行驶。车辆排气管可能喷出火星，阻火器就是把它拦住的。\u003cspan class=\"infer\">推断：反措没写原因\u003c/span>\u003c/li>\n\u003cli>机组停运时，禁止向燃料关断阀后通入燃气，对燃气透平和其他管道设备做法兰找漏等试验和检修。反措没说「燃料关断阀」具体是哪个阀，对本厂来说，可以理解为燃料模块入口的安全切断阀 VS4-4 以及它后面的几道切断阀\u003cspan class=\"infer\">推断：反措没指明；阀门见考点 5.1\u003c/span>。这些阀后面连着燃烧室和排气通道，燃气放进去会在里面积聚，碰上火源就会爆燃\u003cspan class=\"infer\">推断：反措没写原因\u003c/span>。\u003c/li>\n\u003c/ul>\n\u003cp>题库有一道题说作业时应使用防爆工具\u003cspan class=\"cite\">题库 RJ-a83dd68f\u003c/span>，规程写的是铜制工具，两者不矛盾。\u003c/p>", "sources": [{"t": "公用规程 第 204～209 行", "lines": [[204, "表 2 天然气爆炸极限"], [205, "名称 爆炸极限（20℃，101.325kPa） 爆炸下限 爆炸上限"], [206, "着火温度"], [207, "氢气 4.0% 75.9% 约560℃"], [208, "一氧化碳 12.5% 74.2% 约644-658℃"], [209, "甲烷 5.0% 15.0% 约540℃"]]}, {"t": "公用规程 第 759～762 行", "lines": [[759, "4.3.2 投运前检查"], [760, "1) 检查确认身上没有携带火种和非防爆通讯器材，入站前须释放静电并穿着不会产生静电的工作"], [761, "服，作业中使用铜制工具。"], [762, "2) 进入调压站前检查可燃气体探测无报警，显示浓度正常。"]]}, {"t": "公用规程 第 934～955 行", "lines": [[934, "4.4 日常检查与要求"], [935, "4.4.1 一般规定"], [936, "1) 严禁携带火种、可能燃烧及产生静电的物品或工具进入调压站。"], [937, "2) 进入调压站的人员应主动将随身携带的手机、 钥匙、 火种及任何可能产生火花/静电的物件存放"], [938, "在指定位置，调压站内应关闭一切非防爆电器、通讯设备。"], [939, "3) 进入调压站须按规范要求触摸静电释放装置，装置提示灯显示为“绿色”方可进入。"], [940, "4) 进入调压站应戴安全帽、耳塞、穿工作服、穿安全鞋等必要的安全防护工具。"], [941, "5) 离开调压站区域，与生产无关的物料及时清走，保持环境整洁，锁闭好调压站大门。"], [942, "6) 参加调压站内工作的人员，应了解天然气的性质和有关防火防爆规定，对不熟悉的人员应先进"], [943, "行有关天然气的安全教育，然后方可参加天然气设备的运行和维修工作。"], [944, "7) 操作调压站设备须使用铜制工具，以防发生火花。操作时应均匀缓慢，禁止剧烈地排送，以防"], [945, "因磨擦引起自燃。"], [946, "8) 涉及天然气系统设备检修等工作，必须按要求严格执行工作票制度和检修、运行规程中的相关"], [947, "规定，确保风险管控和安全监督落实到位。"], [948, "9) 涉及调压站系统设备投退、置换等工作，必须按要求严格执行操作票制度和运行规程中的相关"], [949, "规定，确保风险管控和安全监督落实到位。"], [950, "10) 对天然气系统进行检修作业前必须将检修部分与非检修部分隔断， 并按规程规定置换后方可进"], [951, "行工作。"], [952, "11) 调压站内进行动火作业时， 动火前必须进行可燃气体浓度测定， 可燃气体浓度合格后， 方可允"], [953, "许动火。"], [954, "12) 动火期间应定期检测可燃气体浓度， 经检测可燃气体浓度合格后方可继续工作， 动火部位应备"], [955, "有适用的消防器材或灭火措施。"]]}], "cards": ["D:3.5-2", "RJ-anti015", "D:3.5-3", "D:3.5-4", "RJ-anti016", "D:3.5-1", "RJ-anti017", "D:3.5-5", "RJ-a83dd68f", "RJ-8964e8c1", "FC-8.7.14", "FC-8.7.12", "FC-8.7.17_8.7.19", "FC-8.7.11_8.7.13"]}, "3.6": {"id": "3.6", "name": "调压站的可燃气体检测和泄漏处理", "cat": "三", "gist": "调压站装了 30 台可燃气体探测器，一级报警 25% LEL，二级报警 50% LEL。% LEL 是爆炸下限的百分之几，不是体积浓度。报警后先拿便携式检测仪到现场查：没漏是探测器的问题；确实漏了，报值长、禁止无关人员进站、控制火源；严重泄漏隔离不了，就停机、关 ESD 和出口阀，通风到甲烷低于 5% LEL 才准进站。检修中超过 10% LEL 必须停工。反措规定探测器每季度校验一次。", "reg": "公用 表 2、4.2.2.12、4.3.10、4.5.4；机岛 6.2.1；反措 8.7.2、8.7.3、8.7.6、8.7.8", "lecture": "\u003cp>探测器的读数和报警值都用 % LEL 表示，意思是爆炸下限的百分之几\u003cspan class=\"cite\">见考点 1.2\u003c/span>。甲烷的爆炸下限是 5.0%\u003cspan class=\"cite\">公用表 2\u003c/span>，本考点里的几个数折成甲烷在空气里的体积浓度是：5% LEL 约 0.25%\u003cspan class=\"conv\">换算\u003c/span>，10% LEL 约 0.5%\u003cspan class=\"conv\">换算\u003c/span>，25% LEL 约 1.25%\u003cspan class=\"conv\">换算\u003c/span>，50% LEL 约 2.5%\u003cspan class=\"conv\">换算\u003c/span>。\u003c/p>\n\u003cp>调压站一共装了 30 台可燃气体泄漏探测装置，浓度以模拟量送到 DCS；每台探测器还输出两个继电器报警信号到火灾报警系统，一级报警 25% LEL，二级报警 50% LEL\u003cspan class=\"cite\">公用 4.2.2.12\u003c/span>。探测点的位置在规程附录 F 里：清管站区域 3 个（另有激光云台监测），过滤与计量单元区域 10 个，其余装在加热与调压单元区域和三个增压机间，报警在 DCS 公用画面上显示\u003cspan class=\"cite\">公用附录 F\u003c/span>。\u003c/p>\n\u003cp>两级报警都定在离爆炸下限还很远的地方。探测器装在固定位置，测到的不一定是最浓的地方，漏点旁边可能已经浓得多；报警早，才有时间去找漏点、隔离\u003cspan class=\"infer\">推断：规程没写取值原因\u003c/span>。浓度同时走 DCS 和火灾报警系统两条路，一条路出问题，另一条还能报出来\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>探测装置报警，原因只有两种：检测装置本身异常，或者天然气系统真的漏了\u003cspan class=\"cite\">公用 4.5.4.1\u003c/span>。所以处理的第一步是拿一台不相干的仪器去现场复核\u003cspan class=\"cite\">公用 4.5.4.2\u003c/span>：\u003c/p>\n\u003col>\n\u003cli>带便携式危险气体检测仪到现场查。便携仪不报警、现场没有漏，是检测装置的问题，联系检修。\u003c/li>\n\u003cli>便携仪也报警，立即报告值长，禁止一切无关人员进站，严格控制火源。少量泄漏，用仪器、检漏液等办法找出漏点，分析原因，联系检修处理。\u003c/li>\n\u003cli>严重泄漏又隔离不了，立即停机，切断调压站紧急切断阀（ESD）和出口阀，必要时通知上游切断气源；现场加装临时通风，等甲烷浓度低于 5% LEL 后，才允许进站做检修。\u003c/li>\n\u003c/ol>\n\u003cp>第 3 步的「停机」，规程没写清是停调压站还是停燃机。调压站进口的 ESD\u003cspan class=\"cite\">见考点 2.2\u003c/span>和出口阀一关，燃机就没有气源了，所以实际是燃机停机和调压站隔离一起做\u003cspan class=\"infer\">推断\u003c/span>。进口、出口两头都关，是为了既切断上游来气，也不让下游管道里的燃气倒流回漏点\u003cspan class=\"infer\">推断\u003c/span>。临时通风是把积在站里的燃气吹散，降到 5% LEL 这么低再进，给人留足余量\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>检修过程中也要一直测。降压、放散、置换和检修的全过程都要持续检测可燃气体；检修中测得天然气浓度超过 10% LEL，必须停止一切检修工作，查找原因并处理\u003cspan class=\"cite\">公用 4.3.10\u003c/span>。\u003c/p>\n\u003cp>反措对泄漏检测还有几条要求：\u003c/p>\n\u003cul>\n\u003cli>燃气泄漏探测器每季度校验一次，防止因测量偏差、拒报而发生火灾爆炸\u003cspan class=\"cite\">题库 FC-8.7.8\u003c/span>。探测器用久了读数会漂，校验就是确认它还能报\u003cspan class=\"infer\">推断\u003c/span>。\u003c/li>\n\u003cli>严禁燃气管道从管沟内敷设；从房内穿过的架空管道，穿墙套管要严密封堵，并合理设置燃气泄漏检测器\u003cspan class=\"cite\">题库 FC-8.7.2_8.7.3\u003c/span>。管沟、墙洞是半封闭的通道，漏出的燃气会在里面积聚，还会顺着它跑到别处\u003cspan class=\"infer\">推断\u003c/span>。\u003c/li>\n\u003cli>和燃气系统相邻、本身没有燃气设备、但通过地下排污管道等通道相连的封闭区域，也要装燃气泄漏探测器\u003cspan class=\"cite\">题库 FC-8.7.2_8.7.3\u003c/span>，道理和上一条一样。\u003c/li>\n\u003c/ul>\n\u003cp>题库和规程说法不一样的有两处，都以本厂规程为准：\u003c/p>\n\u003cul>\n\u003cli>题库说甲烷浓度低于爆炸下限的 10% 以后才允许进站检修\u003cspan class=\"cite\">题库 RJ-296b4eb2\u003c/span>。规程是两个数：检修中超过 10% LEL 必须停工\u003cspan class=\"cite\">公用 4.3.10\u003c/span>；严重泄漏以后，低于 5% LEL 才准进站\u003cspan class=\"cite\">公用 4.5.4.2\u003c/span>。\u003c/li>\n\u003cli>题库按反措说，燃气泄漏量达到爆炸下限的 20% 时不允许启动燃机\u003cspan class=\"cite\">题库 FC-8.7.6\u003c/span>。本厂规程的禁止启动条件写的是天然气区域燃气泄漏、浓度达到 25% LEL\u003cspan class=\"cite\">机岛 6.2.1\u003c/span>。\u003c/li>\n\u003c/ul>\n\u003cp>燃机罩壳里还有一套危险气体保护系统，见下一个考点。\u003c/p>", "sources": [{"t": "公用规程 第 204～209 行", "lines": [[204, "表 2 天然气爆炸极限"], [205, "名称 爆炸极限（20℃，101.325kPa） 爆炸下限 爆炸上限"], [206, "着火温度"], [207, "氢气 4.0% 75.9% 约560℃"], [208, "一氧化碳 12.5% 74.2% 约644-658℃"], [209, "甲烷 5.0% 15.0% 约540℃"]]}, {"t": "公用规程 第 737～740 行", "lines": [[737, "4.2.2.12 火警消防与泄漏检测"], [738, "调压站设置30台可燃气体泄漏探测装置 （详见附录F 全厂可燃气体探测点分布表） ， 对调压站内天"], [739, "然气泄漏情况进行检测， 燃气浓度以模拟量方式传递给DCS控制系统， 每台燃气体泄漏探测器输出2个继"], [740, "电器报警信号(一级报警浓度为25%LEL，二级报警浓度为50%LEL)至火灾报警系统。"]]}, {"t": "公用规程 第 920～929 行", "lines": [[920, "4.3.10 检修停运"], [921, "调压站设备停运维护或检修时，需按下列步骤对系统隔离泄压："], [922, "1) 关闭检修单元进、出口隔离阀，将待检修设备与其他单元完全隔离。"], [923, "2) 打开检修单元的放散阀进行放散泄压。"], [924, "3) 泄压完毕后，进行氮气置换天然气操作，当放散取样处测得的甲烷体积浓度低于 1% 时，置换"], [925, "合格。"], [926, "4) 在降压、放散和置换过程中，必须持续地对工作区域进行可燃气体检测。"], [927, "5) 氮气置换完成后，将氮气压力泄放至 0，才能允许设备检修工作。"], [928, "6) 在检修过程中， 必须持续对工作区域进行可燃气体检测，如果测得的天然气浓度超过 10％LEL，"], [929, "必须停止一切检修工作查找原因并处理。"]]}, {"t": "公用规程 第 995～1012 行", "lines": [[995, "4.5.4 天然气泄漏检测装置报警"], [996, "4.5.4.1 原因"], [997, "1) 检测装置异常；"], [998, "2) 天然气系统有泄漏。"], [999, "4.5.4.2 处理"], [1000, "1) 携带便携式危险气体检测仪就地检查是否有泄漏；"], [1005, "2) 若就地检查正常，无天然气泄露情况，则为检测装置异常，联系检修处理；"], [1006, "3) 若就地检查便携式危险气体检测仪有报警，则进行如下处理："], [1007, "(1) 立即报告值长，禁止一切无关人员进入调压站，严格控制火源；"], [1008, "(2) 如果少量泄漏，应采取措施，用仪器、检漏液，或其他方法，查出具体的漏气点，分析漏气的"], [1009, "原因，并立即联系检修处理；"], [1010, "(3) 如果严重泄漏，无法隔离，应立即停机，切断调压站紧急切断阀(ESD)和出口阀，如有必要，"], [1011, "应通知上游立即切断气源。现场加装临时通风设备，待甲烷浓度低于 5％LEL 后才允许进入站内做"], [1012, "相应的检修工作。"]]}, {"t": "公用规程 第 4086～4100 行", "lines": [[4086, "附 录 F 全厂可燃气体探测点分布表"], [4087, "序号 区域 探测位置 探头数量 1"], [4088, "调压站清管站区域 3 个+激光云台监测"], [4089, "2 调压站过滤与计量单元区域 10 个 3 天然气加热与调压单元区域 调压站区域"], [4090, "4 #1 增压机间 5 个 4 个 5 #2 增压机间 4 个 6 #3 增压机间 4 个 7"], [4091, "启动锅炉房 2 个 辅助区域"], [4092, "8 供氢站 8 个"], [4093, "9 #1 机组区域"], [4094, "前置模块、主厂房（天然气、"], [4095, "氢气管道）"], [4096, "29 个"], [4097, "10 #2 机组区域"], [4098, "前置模块、主厂房（天然气、"], [4099, "氢气管道）"], [4100, "26 个"]]}, {"t": "机岛规程 第 1048～1048 行", "lines": [[1048, "11) 天然气区域燃气泄漏，且浓度达到25%LEL。"]]}], "cards": ["D:3.6-2", "RJ-anti014", "D:3.6-3", "D:3.6-4", "FC-8.7.6", "D:3.6-1", "RJ-anti012", "RJ-296b4eb2", "FC-8.7.8", "FC-8.7.2_8.7.3"]}, "3.7": {"id": "3.7", "name": "燃机罩壳的危险气体保护", "cat": "三", "gist": "燃机间、发电机机端、集电端外壳装有危险气体探头。浓度变送器 96HT-1/2 高报警 7%、高高报警 11%；流量变送器 96GDHT-1/2 低报警 113.3 L/h、低低报警 56.6 L/h。流量低加浓度高或测点故障禁止启动；两个流量都低低自动停机；两个浓度都高于 11% LEL（或一个高于 11%、另一个故障）跳闸；通风管道里的 45HT-1、2 两个都高高报警时，关燃气控制阀和 SSOV、开排空阀跳机。高报警先核对、再判断是否降负荷；停机后探测系统也一直运行。", "reg": "机岛 9.8、5.2（SIF 第 5 项）、5.4（第 17 项）、6.2.1、8.4.1", "lecture": "\u003cp>燃机罩壳是半封闭的空间，里面有燃气管道、法兰，还有很热的透平缸体，漏出的燃气会在里面积聚\u003cspan class=\"infer\">推断\u003c/span>。危险气体保护系统的任务是防止机组运行时天然气泄漏在燃机间、发电机机端、集电端外壳处积聚。这些区域装了危险气体探头，浓度到设定值时报警提示运行人员处理，或者由保护动作停机\u003cspan class=\"cite\">机岛 9.8.1\u003c/span>。\u003c/p>\n\u003cp>探头有三组：\u003c/p>\n\u003cul>\n\u003cli>96HT-1、96HT-2：浓度变送器，测燃机间的危险气体浓度，单位是 % LEL（爆炸下限的百分之几）\u003cspan class=\"cite\">见考点 1.2\u003c/span>。高报警 7% LEL，高高报警 11% LEL\u003cspan class=\"cite\">机岛 9.8.2、9.8.6\u003c/span>，折成甲烷体积浓度大约是 0.35%\u003cspan class=\"conv\">换算\u003c/span>和 0.55%\u003cspan class=\"conv\">换算\u003c/span>。\u003c/li>\n\u003cli>96GDHT-1、96GDHT-2：流量变送器，测流过探测器的气样流量。低报警 113.3 L/h，低低报警 56.6 L/h\u003cspan class=\"cite\">机岛 9.8.2\u003c/span>。\u003c/li>\n\u003cli>45HT-1、45HT-2：装在通风管道里\u003cspan class=\"cite\">机岛 9.8.4\u003c/span>，规程没写是哪一根。\u003c/li>\n\u003c/ul>\n\u003cp>探测器为什么要测气样流量：规程写启动前「通过燃气探测器的流量应该高于最小探测流量」\u003cspan class=\"cite\">机岛 9.8.4\u003c/span>，可见探测器是把监测点的空气连续抽过来流过传感器测的。流量低，说明气样没抽上来，传感器测的已经不是罩壳里的空气，读数再正常也不可信\u003cspan class=\"infer\">推断：由 9.8.4 和 5.4 的写法推出\u003c/span>。所以规程把流量低当成探测器故障：自动停机清单里，「危险气体检测系统故障」就包括流量低于 56.6 L/h\u003cspan class=\"cite\">机岛 5.4\u003c/span>。\u003c/p>\n\u003cp>报警值离爆炸下限很远，是因为探头只测几个点，漏点旁边可能已经浓得多，而罩壳里有高温部件，不能等到接近爆炸下限才动作\u003cspan class=\"infer\">推断：规程没写取值原因\u003c/span>。\u003c/p>\n\u003cp>保护按严重程度分几档：\u003c/p>\n\u003cul>\n\u003cli>禁止启动：燃机间危险气体流量 96GDHT-1 低于 113.3 L/h，同时浓度传感器高于 7% 或测点故障\u003cspan class=\"cite\">机岛 9.8.3\u003c/span>；45HT-1、2 任一个出现高或高高报警\u003cspan class=\"cite\">机岛 9.8.4\u003c/span>；危险气体检测系统故障\u003cspan class=\"cite\">机岛 6.2.1\u003c/span>。\u003c/li>\n\u003cli>自动停机：两个流量都低于 56.6 L/h 或对应的浓度测点故障\u003cspan class=\"cite\">机岛 9.8.3\u003c/span>，自动停机清单写延时 2min\u003cspan class=\"cite\">机岛 5.4\u003c/span>。这时并没有测到燃气，只是两套探测器都失去了监视能力，没有眼前的危险，所以走停机程序而不跳闸\u003cspan class=\"infer\">推断\u003c/span>。\u003c/li>\n\u003cli>跳闸：机组不在停机状态时，96HT-1、2 两个都高于 11% LEL，或者一个高于 11%、另一个故障\u003cspan class=\"cite\">机岛 5.2、9.8.3\u003c/span>。\u003c/li>\n\u003cli>跳闸：45HT-1、2 两个都高高报警时，关闭燃气控制阀（GCV）、安全关断阀（SSOV）来跳机，同时打开排空阀\u003cspan class=\"cite\">机岛 9.8.4\u003c/span>。\u003c/li>\n\u003c/ul>\n\u003cp>停机状态下，危险气体探测系统也一直运行\u003cspan class=\"cite\">机岛 9.8.4\u003c/span>。\u003c/p>\n\u003cp>自动停机和跳闸不一样：自动停机是进入停机程序，机组自动减负荷、汽机脱扣、燃机降负荷直到熄火\u003cspan class=\"cite\">机岛 5.4\u003c/span>；跳闸是所有燃料阀立刻回到故障安全位置，燃料一下子切断\u003cspan class=\"cite\">机岛 9.4.5.2\u003c/span>。\u003c/p>\n\u003cp>GCV 即燃气控制阀 VGC-1～4；SSOV 即安全切断阀 VS4-4，这里写作安全关断阀，是燃料模块最上游的一道阀，它下游的 VS4-1 是辅助截止阀\u003cspan class=\"cite\">机岛 9.4.2、6.5.1.2\u003c/span>。跳闸时，燃料模块 P1、P1X、P2 三个腔室的通风阀 VA13-25、VA13-200、VA13-15 都打开，把腔室里的燃气排空\u003cspan class=\"cite\">机岛 9.4.5.2\u003c/span>。9.8 说的排空阀没写编号，应该就是这几个通风阀\u003cspan class=\"infer\">推断；阀门和腔室见考点 5.1\u003c/span>。\u003c/p>\n\u003cp>跳机为什么要开它们：阀门关上以后，两道阀之间还封着有压力的燃气，会顺着关不严的阀往燃烧室漏；把这段排空，即使某道阀关不严，漏过去的也只是没有压力的一点气\u003cspan class=\"infer\">原理：两道切断阀之间加放空，保证切断可靠\u003c/span>。\u003c/p>\n\u003cp>报警的处理\u003cspan class=\"cite\">机岛 9.8.6\u003c/span>：高报警（7% LEL）可能是泄漏也可能是仪表故障，先核对现场表计、告知值长和热控人员，再验证实际危险状况，判断是否降负荷。高高报警（11% LEL）保护跳机，确认燃料切断阀、控制阀已关，排空阀已开。一个探头故障，通知检修及时处理；两个都故障，通知检修立即处理，做好紧急停机准备。罩壳里发现燃气严重泄漏，属于申请停运的条件\u003cspan class=\"cite\">机岛 8.4.1\u003c/span>。\u003c/p>\n\u003cp>题库和规程说法不一样的有两处，以本厂规程为准：题库说发现燃气泄漏报警或浓度突升应立即停机检查\u003cspan class=\"cite\">题库 RJ-5c66fce3\u003c/span>，规程对罩壳高报警写的是先核对、再判断是否降负荷\u003cspan class=\"cite\">机岛 9.8.6.1\u003c/span>；题库说探头也装在燃料模块\u003cspan class=\"cite\">题库 RJ-7a9e8cf9\u003c/span>，规程列的区域里没有燃料模块\u003cspan class=\"cite\">机岛 9.8.1\u003c/span>。\u003c/p>", "sources": [{"t": "机岛规程 第 2722～2821 行", "lines": [[2722, "9.8 危险气体保护系统"], [2723, "9.8.1 概述"], [2724, "为防止机组运行时天然气泄漏在燃机间、 发电机机端、 集电端外壳处聚积产生危险， 机组配备有危"], [2725, "险气体保护系统。 系统在上述区域装设有危险气体探头， 当区域危险气体浓度达到设定值时系统发出报"], [2726, "警提示运行人员处理或保护动作停机。"], [2727, "主要部件：96HT-1、96HT-2、96GDHT-1、96GDHT-2、45HT-1、45HT-2危险气体探头。"], [2728, "9.8.2 设备规范"], [2729, "表 1 危险气体探测器"], [2730, "量程 0 到 99％LEL （低爆炸范围） 精确度"], [2731, "+3%LEL，从 0 到 50%满刻度"], [2732, "+5%LEL，从 50%到 100%满刻度"], [2733, "输入功率 20 到 35VDC"], [2734, "(24VDC@250mA,4.8W 额定) 响应时间 T50\u003c10 秒，100%LEL 甲烷浓度"], [2735, "T90\u003c30 秒，100%LEL 甲烷浓度"], [2736, "等级 传 感 器 ， 用 于 危 险 环 境"], [2737, "4802A，用于非危险环境 运行温度范围 传感器：-55℃到+93℃"], [2738, "4802A：-18℃到+66℃"], [2739, "湿度范围 5%到 100%相对湿度"], [2740, "表 2 热工元件整定值及功能"], [2741, "MKVI编号 名称 功能 设定值"], [2742, "96HT-1/2 危险气体探头A、B变送器 高报警"], [2743, "高高报警"], [2744, "7%"], [2745, "11%"], [2746, "96GDHT-1/2 危险气体流量变送器A、B 低报警"], [2747, "低低报警"], [2748, "113.3L/h"], [2749, "56.6L/h"], [2750, "9.8.3 联锁保护"], [2751, "1) 浓度传感器故障，96GDHT-1、2 流量低低\u003c56.6L/H，流量传感器 96GDHT-1、2 故障；"], [2752, "2) 同时满足以下条件，禁止燃机启动："], [2753, "(1) 燃机间危险气体流量低 96GDHT-1\u003c113.3L/h；"], [2754, "(2) 危险气体浓度传感器 96HT-1>7%或测点故障；"], [2755, "(3) 危险气体浓度传感器 96HT-1>7%或测点故障。"], [2756, "3) 同时满足以下条件，燃机触发自动停机："], [2757, "(1) 燃机间危险气体流量低 96GDHT-1\u003c56.6L/h 或 96HT1 测点故障；"], [2758, "(2) 燃机间危险气体流量低 96GDHT-2\u003c56.6L/h 或 96HT2 测点故障。"], [2759, "4) 同时满足以下条件，燃机跳闸："], [2760, "(1) 非停机状态时；"], [2765, "(2) 两个危险气体浓度传感器 96HT-1、2 都显示 HH＞11%LEL(爆炸极限-下限)或一个危险气体浓"], [2766, "度传感器指示 HH＞11%且另一个故障（浓度传感器故障，流量低低 56.6L/H，流量传感器"], [2767, "96GDHT-1、2 故障）。"], [2768, "9.8.4 系统运行"], [2769, "1) 启动前的检查："], [2770, "(1) 危险气体保护系统检修工作全部结束，工作票终结，安全设施拆除，现场清洁。"], [2771, "(2) 检查系统设备完好、阀位恢复至启动前状态，各表计正常投入。"], [2772, "(3) 检查仪用空气系统已投运并且压力正常。"], [2773, "(4) 检查危险气体保护系统已具备投运条件。"], [2774, "(5) 检查 MarkVIe 控制系统中危险气体保护系统的报警并进行复位。"], [2775, "2) 启动前初始状态为："], [2776, "(1) 危险气体探测系统不应该探测到监视区域内的高位或高高位报警信号。"], [2777, "(2) 通过燃气探测器的流量应该高于最小探测流量。"], [2778, "3) 正常运行时："], [2779, "(1) 当通风管道中的燃气探测器 45HT-1、2 两个中的一个产生了高或高高报警时燃机禁止启动。"], [2780, "当两个都产生高高报警时会通过关闭燃气控制阀（GCV）、安全关断阀（SSOV）来实现跳机，"], [2781, "并同时打开排空阀门。"], [2782, "(2) 当一个探测器故障或者禁用或者通过流量低，另一个检测到高高报警：当两个探测器全部故"], [2783, "障或禁用或通过流量低。这两种情况会导致燃机跳机或机组禁止启动。"], [2784, "(3) 当一个探测器故障或者禁用或者通过流量低，另一个检测到高报警时，燃机会通过燃气控制"], [2785, "阀（GCV）进行减负荷并关闭安全关断阀（SSOV），打开排空阀，以保证机组停机。"], [2786, "(4) 停机时：燃机危险气体探测系统一直运行。"], [2787, "9.8.5 日常检查与维护"], [2788, "1) 检测系统各探测元件位置正确，就地装置无泄漏现象。"], [2789, "2) 检查危险气体保护系统就地表计各参数正常。"], [2790, "9.8.6 异常及事故处理（现象、原因、处理）"], [2791, "9.8.6.1 燃机罩壳内危险气体泄漏量高(LELHAH"], [2792, "ALM，设定点：7%LEL)"], [2793, "_"], [2794, "1) 现象：燃机罩壳内危险气体检测高报警。"], [2795, "2) 原因：燃气泄漏或测量仪表故障。"], [2796, "3) 处理："], [2797, "(1) 核对实际报警状况（核对现场表计是否正常并告知值长及热控人员）。"], [2798, "(2) 检查验证实际危险状况（根据现场情况判断是否降负荷）。"], [2799, "(3) 停机后符合条件进行处理。"], [2800, "9.8.6.2 燃机罩壳内危险气体泄漏量高-高(LELHAHH"], [2801, "ALM，设定点：11%LEL)"], [2802, "_"], [2803, "1) 现象："], [2804, "(1) 燃机罩壳内危险气体检测高-高报警。"], [2805, "(2) 当达到一定条件时保护动作，机组跳闸。"], [2806, "2) 原因：燃气泄漏或测量仪表故障。"], [2807, "3) 处理："], [2808, "(1) 确认机组跳闸，燃料切断阀、控制阀关闭，排空阀打开，保证机组安全停运。"], [2809, "9.8.6.3 危险气体检测系统模拟信号故障(LELHF"], [2810, "ALM)"], [2811, "_"], [2816, "1) 现象：危险气体检测系统模拟信号故障报警。"], [2817, "2) 原因：危险气体探头检测流量低或在校验状态小于-1.56%或测点坏点小于-6.25%。"], [2818, "3) 处理："], [2819, "(1) 核对实际报警状况，确定故障原因。"], [2820, "(2) 出现一个探头故障时，应通知检修及时处理。"], [2821, "(3) 当出现两个探头故障时，应通知检修立即处理并汇报领导,并做好紧急停机准备。"]]}, {"t": "机岛规程 第 520～523 行", "lines": [[520, "5 Trip Hazardous Gas Detection SIF Trip Request（燃机间危险气体跳闸）"], [521, "非停机状态时， 两个危险气体浓度传感器 96HT-1、 2 都显示 HH＞11%LEL(爆炸极限-下限)"], [522, "或一个危险气体浓度传感器指示 HH＞11%且另一个故障（浓度传感器故障，流量低低"], [523, "56.6L/H，流量传感器 96GDHT-1、2 故障）"]]}, {"t": "机岛规程 第 667～669 行", "lines": [[667, "5.4 自动停机"], [668, "为机组自动停机条件。"], [669, "机组自动停机：进入自动停机程序，机组自动减负荷、汽机脱扣、燃机降负荷直至燃机熄火，以下"]]}, {"t": "机岛规程 第 843～852 行", "lines": [[843, "17 Hazardous Gas SIF GT Shutdown（燃机危险气体 SIF 停机）"], [844, "（1） 危险气体检测 1 系统故障且危险气体检测 2 系统故障，延时 2min"], [845, "（2）"], [846, "危险气体检测 1 系统故障："], [847, "①96GDHT1 是好点且 96GDHT1 流量＜56.6L/h"], [848, "②在危险气体处于非维护模式时 96HT1 传感器故障或 96GDHT1 传感器故障"], [849, "（3）"], [850, "危险气体检测 2 系统故障："], [851, "①96GDHT2 是好点且 96GDHT2 流量＜56.6L/h"], [852, "②在危险气体处于非维护模式时 96HT2 传感器故障或 96GDHT2 传感器故障"]]}, {"t": "机岛规程 第 1047～1047 行", "lines": [[1047, "10) 危险气体检测系统故障。"]]}, {"t": "机岛规程 第 1234～1235 行", "lines": [[1234, "5) 转速大于36rpm时，检查SSOV（安全关断阀VS4-4）已经打开，燃气轮机执行泄漏试验，试验合"], [1235, "格后继续进行。"]]}, {"t": "机岛规程 第 1699～1699 行", "lines": [[1699, "(3) 罩壳内发现燃气严重泄漏；"]]}, {"t": "机岛规程 第 2163～2172 行", "lines": [[2163, "9.4.2 设备规范"], [2164, "代码 描述 阀型 说明"], [2165, "VS4-4 安全切断阀 气动 防止气体燃料流入气体控制橇"], [2166, "VA13-25 安全切断通风阀 气动 P1 腔室进行减压"], [2167, "VS4-1 辅助截止阀 气动 切断气体燃料，使下游设备与气体供应隔离"], [2168, "VA13-200 P1X 腔通风阀 气动 排出 P1X 腔室的气体"], [2169, "VGS-1 燃气截止阀 气动 快速关闭流向燃烧系统的气体燃料"], [2170, "VSC-1 启动控制阀 气动 在启动时调节下游压力"], [2171, "VA13-15 P2 腔通风阀 气动 排出 P2 腔室的气体"], [2172, "VGC-1/2/3/4 燃气控制阀 电动 根据 GT 负载和燃烧模式将燃气分别流进每个"]]}, {"t": "机岛规程 第 2304～2307 行", "lines": [[2304, "9.4.5.2 燃机跳机"], [2305, "在燃机跳闸时，所有阀门均返回故障安全位置：燃气截止阀VS4-4、VS4-1、VGS-1、VSC-1(若点火/"], [2306, "启动阶段跳闸)、VGC关闭。P1、P1x和P2腔排气阀（VA13-25,VA13-200和VA13-15）是开启的，以排空腔"], [2307, "室。"]]}], "cards": ["D:3.7-4", "RJ-5c66fce3", "D:3.7-7", "D:3.7-6", "RJ-7a9e8cf9", "D:3.7-1", "D:3.7-8", "RJ-97f77a6a", "D:3.7-5", "D:3.7-2", "D:3.7-3"]}, "3.8": {"id": "3.8", "name": "天然气管线着火和爆炸的处理", "cat": "三", "gist": "着火和爆炸的第一步都是关闭气源和有影响的电源，然后汇报、报警 119。着火点形成稳定燃烧后，义务消防队先扑灭附近可燃物的明火，再对附近管线不间断冷却，消防队到场后交出指挥权；在下风方向设警戒线，禁止机动车通行。爆炸时还要疏散人员、设警戒线，抢险人员按规定配备防护用品。", "reg": "公用 10.10.4、10.10.5", "lecture": "\u003cp>公用规程第 10.10 节写了天然气管线起火和爆炸两种事故的处理。两种情况的第一步相同：先关闭气源和有影响的电源\u003cspan class=\"cite\">公用 10.10.4、10.10.5\u003c/span>。\u003c/p>\n\u003cp>先关气源，是因为管线着火烧的就是漏出来的燃气，只要气源不断，火就一直有燃料，灭了也还会再着\u003cspan class=\"infer\">原理：切断燃料是扑灭气体火灾的根本办法\u003c/span>。规程没写具体关哪个阀。调压站入口的紧急切断阀（ESD）就是为站内发生泄漏、火灾时迅速切断气源设的，可以在现场手动关，也可以在集控室远程关\u003cspan class=\"cite\">公用 4.2.2.2\u003c/span>；清管站的气液联动阀也能远程关阀，用来缩小燃气管道的事故范围\u003cspan class=\"cite\">公用 4.2.2.1\u003c/span>。实际关哪一道，要看着火点在哪一段，原则是在着火点上游、离得最近又能安全操作的那道阀\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>「有影响的电源」规程也没列。一般是指着火区域里的用电设备电源：一是防止电气设备在火里短路、漏电伤到灭火的人，用水灭火之前尤其要断电；二是防止电火花把还在泄漏的燃气再次点着\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>天然气管线起火\u003cspan class=\"cite\">公用 10.10.4\u003c/span>：\u003c/p>\n\u003col>\n\u003cli>首先关闭气源和有影响的电源。\u003c/li>\n\u003cli>立即汇报，同时报警「119」，请求地方公安消防队支援。\u003c/li>\n\u003cli>着火点（也就是泄漏处）形成稳定燃烧以后，公安消防队到达之前，由义务消防队从消防栓铺设水带，先扑灭着火点附近可燃物的明火，再对着火点附近的管线进行不间断冷却。公安消防队到达后，把指挥权交给公安消防队。\u003c/li>\n\u003cli>抢险人员在保证安全的前提下赶到现场，在指挥小组统一指挥下抢修泄漏处，把重要物资和设备转移到安全处。\u003c/li>\n\u003cli>注意风向，在现场下风方向设置警戒线，不准有明火；禁止机动车辆通行。\u003c/li>\n\u003cli>联系当地医疗部门，派救护车和医护人员到现场抢救伤员。\u003c/li>\n\u003c/ol>\n\u003cp>第 3 步要注意：规程要求扑灭的是着火点「附近可燃物」的明火，对附近的管线「不间断冷却」，并没有要求去扑灭泄漏处本身的稳定火焰。规程没写原因，道理是这样的：泄漏处的火焰稳定地烧着，漏出来的燃气随漏随烧，不会积聚；如果把这团火扑灭而燃气还在漏，漏出的燃气就会在周围积成一大片可燃混合气，碰到一点火源就是爆炸，比着火严重得多。所以正确的做法是关掉气源，让火焰随着管内燃气耗尽自己熄灭\u003cspan class=\"infer\">推断：按燃气火灾的一般处置原则\u003c/span>。\u003c/p>\n\u003cp>扑灭附近可燃物的火，是不让火势蔓延；冷却附近的管线，是因为管子被火烤热以后强度下降、管内压力升高，可能被烧穿或爆裂，把一处着火变成更大的泄漏\u003cspan class=\"infer\">推断\u003c/span>。警戒线设在下风方向，是因为烟和没烧完的燃气都顺风飘\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>天然气管线爆炸\u003cspan class=\"cite\">公用 10.10.5\u003c/span>：\u003c/p>\n\u003col>\n\u003cli>首先关闭气源和有影响的电源，确保人身和机组安全。\u003c/li>\n\u003cli>值班人员立即汇报，采取切换流程措施，保护站场主要设备；同时报警「119」，请求公安消防队支援。\u003c/li>\n\u003cli>对现场人员、邻近居民的安全和环境保护采取果断措施，组织疏散，维护现场秩序。\u003c/li>\n\u003cli>设置警戒线，限制车辆和人员进入危险区，组织义务消防队灭火。\u003c/li>\n\u003cli>规定统一的指挥信号，抢险人员佩戴醒目标志，按需要配备防毒面具、呼吸器、阻燃服、可燃气体氧气检测仪等防护用品，对讲机要用防爆型的，还要有防静电的防护用品。\u003c/li>\n\u003cli>联系医院抢救伤员，做好事故处理过程记录，及时向上级汇报。\u003c/li>\n\u003c/ol>\n\u003cp>「切换流程措施」规程没展开。推断是把爆炸损坏的那一段管线或设备隔离出去，燃气改走没有损坏的另一路，比如调压站里切到备用的那一路过滤或调压线\u003cspan class=\"cite\">见考点 2.3、2.5\u003c/span>，这样既保护主要设备，也尽量不中断供气\u003cspan class=\"infer\">推断\u003c/span>。抢险人员要用防爆对讲机、穿防静电用品，道理和进站的规定一样：现场可能还有燃气，不能再带进点火源\u003cspan class=\"cite\">见考点 3.5\u003c/span>。\u003c/p>", "sources": [{"t": "公用规程 第 3688～3725 行", "lines": [[3688, "10.10.4 天然气管线起火"], [3689, "1) 发生火灾时，应首先关闭气源和有影响的电源。"], [3690, "2) 立即汇报,采取正确流程措施，确保人身和机组安全，将损失降低到最小，同时报警“119”"], [3691, "，"], [3692, "请求地方公安消防队支援。"], [3693, "3) 当着火点（泄漏处）形成稳定燃烧后，在公安消防队没有到达以前，义务消防队首先从消防栓"], [3694, "处铺设水带， 扑灭着火点附近可燃物的明火， 然后对着火点附近的管线进行不间断冷却， 公安消防"], [3695, "队到达现场后，将指挥权交给公安消防队。"], [3696, "4) 指挥小组到达现场后，迅速组成由指挥小组、地方消防队及本单位领导参加的抢险灭火领导小"], [3697, "组，统一指挥灭火抢险工作。"], [3698, "5) 抢险人员接到报警后，在保证安全的前提下，迅速出动，在较短时间内赶到现场，在指挥小组"], [3699, "统一指挥下，抢修泄漏处的故障，抢救一些重要的物资和设备，并将其转移至安全处。"], [3700, "6) 注意风向变化，要根据现场情况，发布动员令，动员现场周围特别是下风向的居民一致行动，"], [3701, "迅速隔绝火源； 应在现场下风方向设置警戒线， 不准有明火出现； 禁止机动车辆通行， 如有可能与"], [3702, "地方交通部门取得联系，断绝交通。"], [3703, "7) 后勤人员在指挥小组领导下，组织好物资及消防器材的供应工作，做好参战人员的饮食保障工"], [3704, "作。"], [3705, "8) 发生火灾后立即与当地医疗部门联系，请求派救护车与医护人员到达现场，抢救受伤人员，做"], [3706, "好现场与其他部门和单位的通讯保障工作。"], [3707, "10.10.5 天然气管线爆炸"], [3708, "1) 发生爆炸事故时，应首先关闭气源和有影响的电源，确保人身和机组安全。"], [3709, "2) 根据现场具体情况，值班人员立即汇报。采取切换流程措施，保护站场主要设备，将损失降低"], [3710, "到最小，同时报警“119”"], [3711, "，请求公安消防队支援。"], [3712, "3) 对现场人员、邻近居民的安全和环境保护及时采取果断措施，并组织疏散人员，维护好现场环"], [3713, "境和秩序。"], [3714, "4) 设置警戒线，做好现场警戒保卫工作，限制车辆和人员进入现场危险区，组织义务消防队做好"], [3715, "灭火工作。"], [3716, "5) 规定统一的指挥信号，配带醒目标志；抢险人员根据需要配备防毒面具、氧（空）气呼吸器、"], [3717, "耳塞、护目镜、阻燃服、防尘口罩、安全帽、手套、无钉鞋，可燃气体氧气检测仪，并根据安全要"], [3718, "求和需要，配备防爆型对讲机，及其需要防静电的防护用品。"], [3723, "6) 积极主动联系医院，做好伤病员的抢救工作。"], [3724, "7) 保证抢险人员的生活供给，做好后勤保障。"], [3725, "8) 做好事故处理过程记录，及时向上级汇报事态的发展，以便及时作出相应的对策。"]]}, {"t": "公用规程 第 612～616 行", "lines": [[612, "1) 气液联动阀"], [613, "气液联动阀可通过实现阀门开关， 缩小燃气管道的事故范围及减轻事故造成的危害。 气液联动阀以"], [614, "燃气管线中天然气为动力，以液压油为传动介质，驱动阀门开启或关闭。可以实现远程开关阀门、ESD"], [615, "和保护关阀、 就地气动开关阀门以及手动液压泵开关阀门， 即使失电失气状态也能就地开关， 确保下游"], [616, "设备安全。"]]}, {"t": "公用规程 第 623～639 行", "lines": [[623, "入口单元配置有绝缘接头、入口球阀、紧急关断阀(ESD)、紧急放散阀，以及其他必要的辅助设备"], [624, "等。"], [629, "入口单元主要功能是当调压站与外部气源连接时， 站内发生泄漏、 火灾或其它类似事件， 通过紧急"], [630, "关断阀（ESD）迅速切断气源，保证下游管道设备及电厂安全。"], [631, "1) 绝缘接头"], [632, "绝缘接头主要用于燃气输配系统和燃气调压站中， 其作用是将上、 下游管线间或调压站与外部管线"], [633, "间相互绝缘隔离，保护其不受电化学腐蚀，延长使用寿命。"], [634, "2) 紧急切断阀(ESD)"], [635, "调压站进口设置1个100%容量的ESD阀， 调压站及燃机在发生火灾或其他危险情况时， 能够紧急切断"], [636, "上游供气，确保整个供气系统及电厂的安全。"], [637, "紧急切断阀(ESD)为气动执行机构， 动力气源采用仪用压缩空气， 配置为失气关阀， 设置有旁路阀，"], [638, "用于平衡ESD阀前后压力， 便于开启ESD阀。 当发生需要紧急切断阀关闭的情况时， 可以现场手动或在集"], [639, "控室远程操作关闭阀门。阀位开关可以将紧急切断阀的开关位置反馈给DCS系统。"]]}], "cards": ["D:3.8-1", "D:3.8-3", "D:3.8-2", "D:3.8-7", "D:3.8-6", "D:3.8-4", "D:3.8-5"]}, "4.1": {"id": "4.1", "name": "前置模块的流程和绝对分离器", "cat": "四", "gist": "从调压站来的燃气依次经过两台并联的绝对分离器、科氏流量计 96VM-1、性能加热器。每台绝对分离器分两级：第一级惯性分离，除去大液滴和颗粒；第二级聚结式过滤器，除去 0.3 μm 以下的液体和固体。差压超过 103.425 kPa（15 psi）报警，要切到备用台、换滤芯；聚结过滤器液位高高跳闸。", "reg": "机岛 9.3.1、9.3.2、9.3.3.4、9.3.6.2、9.3.7.1、9.3.7.2、5.3.1（第 10 项）、5.4（第 5 项）、6.4.5", "lecture": "\u003cp>前置模块夹在调压站和燃料模块之间，调压站送来的天然气在这里处理后，以合适的压力、温度和流量送到燃机的燃烧组件\u003cspan class=\"cite\">题库 RJ-37c58d96\u003c/span>。里面主要有三样设备：两台 100% 容量的绝对分离器，一台燃气科氏流量计 96VM-1，一台性能加热器。燃气先过绝对分离器，再过 96VM-1，然后进性能加热器\u003cspan class=\"cite\">机岛 9.3.1\u003c/span>。性能加热器在下一个考点讲。\u003c/p>\n\u003cp>调压站里已经有旋风分离器和精过滤器\u003cspan class=\"cite\">见考点 2.3\u003c/span>，这里还要再分离一次，因为前置模块是燃气进燃烧室前的最后一道把关，过了它再没有过滤设备。燃料喷嘴的通道很细，颗粒会磨损、堵塞喷嘴和燃料阀，液滴带进燃烧室会让燃烧不稳、局部过热；越靠近燃烧室，漏过去的杂质越没有机会再被拦下，所以把关越严\u003cspan class=\"infer\">推断：规程没写原因\u003c/span>。「绝对」的叫法规程没解释，大概指它几乎能除净极细的液滴和颗粒\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>两台绝对分离器垂直并联布置，一台运行、一台备用，每台都是两级过滤分离\u003cspan class=\"cite\">机岛 9.3.1\u003c/span>：\u003c/p>\n\u003cul>\n\u003cli>第一级靠惯性分离，除去较大的液滴和颗粒。燃气在分离器里被迫急转弯，气体能跟着拐过去，大液滴和颗粒惯性大，来不及拐弯，撞到壁面上被截留\u003cspan class=\"infer\">原理：惯性分离\u003c/span>。\u003c/li>\n\u003cli>第二级是聚结式过滤器（规程也写作凝聚式、聚凝式，是同一样东西，下文统一叫聚结式），能去除 99.5% 直径不大于 0.3μm 的液体和固体\u003cspan class=\"cite\">机岛 9.3.1\u003c/span>。这么小的液滴惯性太小，会跟着气流走。聚结滤芯由很细的纤维层组成，微小液滴被纤维拦住，相互碰撞合并成大滴，大到一定程度就靠重力流下来，离开气流\u003cspan class=\"infer\">原理：聚结分离\u003c/span>。\u003c/li>\n\u003c/ul>\n\u003cp>每个容器下部、上部各有一个受控排水阀，由液位变送器按冷凝液液位自动开关，上部的液位变送器还用于报警和 RB\u003cspan class=\"cite\">题库 RJ-fc4ef6cf\u003c/span>。\u003c/p>\n\u003cp>科氏流量计 96VM-1 主要用于性能测试时测燃气流量，它利用燃气流过振动的测量管时产生的、和振动与质量流量成正比的科里奥利力，直接测出质量流量\u003cspan class=\"cite\">题库 RJ-99dbca49\u003c/span>。平时画面上的燃气流量取自哪个表，规程没写。\u003c/p>\n\u003cp>规程 9.3.3.4 列的报警和保护是：\u003c/p>\n\u003cul>\n\u003cli>96GCF-1、96GCF-2：两台绝对分离器的差压，大于 103.425 kpa 报警\u003c/li>\n\u003cli>71AS-1B、71AS-2B：#1、#2 聚结式过滤器液位高，报警\u003c/li>\n\u003cli>71AS-1A、71AS-2A：#1、#2 聚结式过滤器液位高高，跳闸\u003c/li>\n\u003cli>96AS-1、96AS-2：#1、#2 聚结式过滤器分离器液位，报警\u003c/li>\n\u003c/ul>\n\u003cp>滤芯截住的杂质越多，燃气穿过的阻力越大，进出口差压就越大\u003cspan class=\"infer\">原理\u003c/span>。日常维护写差压超过 1.03 barg（15 psig）时切换过滤器并更换滤芯\u003cspan class=\"cite\">机岛 9.3.6.2\u003c/span>。这和报警值是同一个数：psi 是英制压力单位（磅力每平方英寸），15 psi 约合 103.4 kPa\u003cspan class=\"conv\">换算\u003c/span>，1.03 bar 约合 103 kPa\u003cspan class=\"conv\">换算\u003c/span>。末尾的 g 表示表压\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>差压高时，先核对测量元件准不准，确实是滤网脏污，就切到备用台\u003cspan class=\"cite\">机岛 9.3.7.1\u003c/span>。切换时先确认备用台出口压力和系统压力相等，缓慢打开备用台出口阀，再缓慢关闭原运行台出口阀，压力下降就停止关阀\u003cspan class=\"cite\">机岛 9.3.6.2\u003c/span>。先开后关，是保证供气不中断\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>液位异常可能是液位控制系统或液位计故障、天然气含水量高、疏水系统故障；处理是检查控制系统和液位计并排污，恢复不了就投备用台，液位还是高就做好停机准备\u003cspan class=\"cite\">机岛 9.3.7.2\u003c/span>。\u003c/p>\n\u003cp>液位高高要保护动作，是因为集液的地方满了，分离下来的液体会被气流重新卷起，直接带进燃料模块和燃烧室\u003cspan class=\"infer\">推断\u003c/span>。规程保护表写液位高高跳闸\u003cspan class=\"cite\">机岛 9.3.3.4\u003c/span>。另外两处写得更细：燃机并网时，聚结式过滤器上部疏水液位高高（约 150 mm\u003cspan class=\"conv\">换算自 5.9 in\u003c/span>，三取二）触发 1 倍 RB\u003cspan class=\"cite\">机岛 5.3.1\u003c/span>；转速大于 95% 且未并网时，同样条件自动停机\u003cspan class=\"cite\">机岛 5.4\u003c/span>。RB 是快速减负荷，控制系统让燃料指令按规定速率往下降，1 倍、3 倍是速率的倍数\u003cspan class=\"cite\">机岛 5.3\u003c/span>。以现场逻辑为准。题库和快减负荷清单一致，还给了 3.9 in 的报警值\u003cspan class=\"cite\">题库 RJ-fc4ef6cf\u003c/span>。\u003c/p>\n\u003cp>题库说前置模块接口处（双联过滤器进口）压力要求 4.03 MPa.g 以上\u003cspan class=\"cite\">题库 RJ-2a260f05\u003c/span>，在规程启动前入口压力 3.74～4.5 MPa 的范围里\u003cspan class=\"cite\">机岛 6.4.5\u003c/span>。\u003c/p>", "sources": [{"t": "机岛规程 第 1995～2019 行", "lines": [[1995, "9.3.1 概述"], [1996, "天然气前置模块系统主要包括两个100％的绝对分离器、燃气科氏流量计（96VM-1）、"], [1997, "一套性能加"], [1998, "热器（PCHE）及相关测量表计。"], [1999, "来自调压站的燃气首先经过两个绝对分离器为两级过滤/分离装置，垂直并联布置，第一级用惯性"], [2000, "分离除去较大的液滴和颗粒，第二级是聚凝式过滤器，可以去除99.5%直径≤0.3μm的液体和固体。燃"], [2001, "气从过滤分离器出来，经过燃气科氏流量计（96VM-1)后进入性能加热器模块。性能加热器将气体加热"], [2002, "至其要求的温度。加热热源取自余热锅炉中压（IP）省煤器出口给水，回水至凝结水母管。"], [2003, "9.3.2 设备规范"], [2004, "名称 单位 数值"], [2005, "绝对分离器"], [2006, "型式 垂直，双重"], [2007, "配置 分离器部分+聚结过滤器部分"], [2008, "流量 m"], [2009, "3/min 267.6～1125.88"], [2010, "进出口压力范围 Kpag 3137.11～3447.38"], [2011, "进出口温度范围C -1～55"], [2012, "性能加热器"], [2013, "型式 印刷电路板换热器（PCHE)"], [2014, "加热器数量 1"], [2015, "主体材质 304L"]]}, {"t": "机岛规程 第 2033～2042 行", "lines": [[2033, "9.3.3.4 设备保护逻辑"], [2034, "代码 描述 动作 整定值"], [2035, "96GCF-1 绝对分离器差压 报警 >103.425kpa 报警"], [2036, "96GCF-2 绝对分离器差压 报警 >103.425kpa 报警"], [2037, "71AS-1B #1 凝聚式过滤器液位高 报警 出厂时已确定报警位置"], [2038, "71AS-1A #1 凝聚式过滤器液位高高 跳闸 出厂时已确定报警位置"], [2039, "71AS-2B #2 凝聚式过滤器液位高 报警 出厂时已确定报警位置"], [2040, "71AS-2A #2 凝聚式过滤器液位高高 跳闸 出厂时已确定报警位置"], [2041, "96AS-1 #1 凝聚式过滤器分离器液位 报警 出厂时已确定报警位置"], [2042, "96AS-2 #2 凝聚式过滤器分离器液位 报警 出厂时已确定报警位置"]]}, {"t": "机岛规程 第 2102～2135 行", "lines": [[2102, "9.3.6.2 绝对分离器的切换"], [2103, "当绝对分离器差压超过1.03barg（15psig）时，切换过滤器并更换滤芯。"], [2104, "1) 切换前检查备用过滤器处于良好备用状态（进口阀打开、出口阀关闭，废水排放系统正常等）"], [2105, "2) 切换操作"], [2106, "(1) 确定备用过滤器出口压力与系统压力相等。"], [2111, "(2) 缓慢地打开过滤器出口阀。确保在过滤器切换过程，系统压力保持平稳。"], [2112, "(3) 确定所有状态正常，过滤器运行时，未出现系统报警。"], [2113, "(4) 缓慢关闭原运行过滤器出口阀， 应监控系统压力变化。 若系统压力下降， 应停止关闭出口阀。"], [2114, "(5) 出口阀关闭后，确认系统运行正常，完成切换操作。"], [2115, "(6) 按检修要求是否关闭过滤器进口阀进行隔离。"], [2116, "9.3.7 异常及事故处理"], [2117, "9.3.7.1 绝对分离器差压高"], [2118, "1) 现象：绝对分离器差压高报警。"], [2119, "2) 原因：绝对分离器滤网脏污或测量故障。"], [2120, "3) 处理："], [2121, "(1) 核对测量元件的准确性"], [2122, "(2) 如滤网脏污切换到备用绝对分离器。"], [2123, "9.3.7.2 绝对分离器液位异常"], [2124, "包括：绝对分离器下段高液位、绝对分离器上段高液位、绝对分离器液位传感器故障。"], [2125, "1) 现象：相关信号报警发出。"], [2126, "2) 原因："], [2127, "(1) 液位控制系统故障。"], [2128, "(2) 液位计故障。"], [2129, "(3) 天然气含水量高。"], [2130, "(4) 疏水系统故障。"], [2131, "3) 处理："], [2132, "(1) 检查控制系统和液位计。"], [2133, "(2) 检查绝对分离器中的疏水液位，并进行排污。"], [2134, "(3) 如运行绝对分离器不能及时恢复正常，应将备用绝对分离器投入运行。"], [2135, "(4) 如果液位仍然高，应做好停机准备。"]]}, {"t": "机岛规程 第 588～591 行", "lines": [[589, "GT-RUNBACK 由 MarK VIe 自动控制执行，控制系统使 FSR 以规定的速率降低直到故障排除为止，如"], [590, "果故障不能在规定的时间极限范围内排除，控制系统将发出指令使机组在全速空载 FSNL 状态运行。燃"], [591, "机快速自动减负荷有 1 倍速率和 3 倍速率两种。"]]}, {"t": "机岛规程 第 639～647 行", "lines": [[639, "10 Absolute Gas Fuel Seperator Runback（绝对燃料分离器请求 RB-1X）"], [640, "（1） 燃机并网，GCF1 运行时，绝对分离器 A 凝聚式过滤器上部疏水液位 HH（＞5.9in）(三"], [641, "取二)或全坏点或 1 个 HH 且坏点（三取二）"], [642, "（2） 燃机并网，GCF2 运行时，绝对分离器 B 凝聚式过滤器上部疏水液位 HH（＞5.9in）(三"], [643, "取二)或全坏点或 1 个 HH 且坏点（三取二）"], [644, "（3）"], [645, "燃机并网,任一 GCF 运行时，绝对分离器 A 凝聚式过滤器上部疏水液位 HH（＞5.9in"], [646, "）(三取二)或全坏点或 1 个 HH 且坏点（三取二）或绝对分离器 B 凝聚式过滤器上部疏"], [647, "水液位 HH(2/3)或全坏点或 1 个 HH 且坏点（三取二）"]]}, {"t": "机岛规程 第 714～722 行", "lines": [[714, "5 Shutdown-Absolute Gas Fuel Separator（绝对气体燃料分离器停机）"], [715, "（1） 转速＞95%且未并网，GCF1 运行时，绝对分离器 A 凝聚式过滤器上部疏水液位 HH（＞"], [716, "5.9in）(三取二)或全坏点或 1 个 HH 且坏点（三取二）"], [717, "（2） 转速＞95%且未并网，GCF2 运行时，绝对分离器 B 凝聚式过滤器上部疏水液位 HH（＞"], [718, "5.9in）(三取二)或全坏点或 1 个 HH 且坏点(三取二)"], [719, "（3）"], [720, "转速＞95%且未并网,任一 GCF 运行时， 绝对分离器 A 凝聚式过滤器上部疏水液位 HH （＞"], [721, "5.9in）(三取二)或全坏点或 1 个 HH 且坏点(三取二)或绝对分离器 B 凝聚式过滤器上部"], [722, "疏水液位 HH（＞5.9in）(三取二)或全坏点或 1 个 HH 且坏点(三取二)"]]}, {"t": "机岛规程 第 1202～1202 行", "lines": [[1202, "2) 天然气调压站系统已投运，前置模块入口压力控制在3.74MPa～4.5MPa。"]]}], "cards": ["D:4.1-2", "RJ-37c58d96", "D:4.1-6", "D:4.1-7", "RJ-99dbca49", "D:4.1-5", "RJ-fc4ef6cf", "D:4.1-4", "D:4.1-1", "D:4.1-3"]}, "4.2": {"id": "4.2", "name": "性能加热器的投入", "cat": "四", "gist": "性能加热器是一台印刷电路板换热器（PCHE），用余热锅炉中压省煤器出口的给水加热燃气，回水去凝结水母管。燃机点火后自动投入。投入条件：给水压力比燃气压力高 3.5 bar 以上，给水温度比燃气温度高 20 ℃ 以上，燃气入口温度高于 5 ℃，水侧出口压力没有上升。顺控先开入口侧阀门，等 5 分钟确认没有泄漏，再开出口侧阀门。", "reg": "机岛 9.3.1、9.3.2、9.3.3.1、9.3.4.2、9.3.4.3", "lecture": "\u003cp>性能加热器在前置模块里，排在绝对分离器和科氏流量计 96VM-1 的后面\u003cspan class=\"cite\">见考点 4.1\u003c/span>，作用是把燃气加热到燃机要求的温度。热源取自余热锅炉中压（IP）省煤器出口的给水，换热后的回水去凝结水母管\u003cspan class=\"cite\">机岛 9.3.1\u003c/span>。规程列的前置模块设备里只有这一台加热器，没有电加热器\u003cspan class=\"cite\">机岛 9.3.1\u003c/span>。\u003c/p>\n\u003cp>题库说，提高燃料温度可以减少达到目标燃烧温度所需的燃料量，从而提高燃机效率\u003cspan class=\"cite\">题库 RJ-12680f3e\u003c/span>。燃烧室把空气烧到一定温度需要的热量是一定的，燃料自己带进去的热越多，要烧掉的燃料就越少\u003cspan class=\"infer\">原理\u003c/span>。加热用的给水热量也是燃气烧出来的，但它是排气在余热锅炉里放出的余热，温度不高，留在汽水系统里只能在汽轮机里变成很少的功。把这部分低品位的热挪来替代一部分燃料的化学能，汽轮机少发的电不多，燃机省下的燃料却是实打实的，整个联合循环的效率就提高了\u003cspan class=\"infer\">推断：按热量的品位分析\u003c/span>。回水送到凝结水母管，是因为换热后水温已经降下来，回到锅炉的低温段还能再吸收一次排气余热\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>它是一台印刷电路板换热器（PCHE）\u003cspan class=\"cite\">机岛 9.3.2\u003c/span>。名字来自加工方法：在薄钢板上像做印刷电路板那样蚀刻出很细的流道，一层走燃气、一层走水交替叠起来，压成一整块\u003cspan class=\"infer\">推断：这类换热器的一般结构\u003c/span>。题库说它用扩散焊把钢板层连在一起，不容易泄漏\u003cspan class=\"cite\">题库 RJ-62a486fd\u003c/span>。板间没有垫片，所以耐高压\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>投入方式有两种\u003cspan class=\"cite\">机岛 9.3.3.1\u003c/span>。一是自动：燃机发启动令，而且没有选 offcrank、cooldown、limitedcrank 这几种模式，点火后自动投入。二是在 TCS（燃机控制系统）上手动投入。那几种模式规程没解释，从名字看都是只让燃机转起来、不点火的模式，不烧燃料也就用不着加热\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>投入条件\u003cspan class=\"cite\">机岛 9.3.4.2\u003c/span>，每条后面是它防的东西：\u003c/p>\n\u003cul>\n\u003cli>水压力大于燃气压力加 3.5 Bar（1 bar 约合 0.1 MPa\u003cspan class=\"conv\">换算\u003c/span>）。换热器万一内漏，水压高，就是水往燃气侧漏，燃气不会窜进给水系统。燃气进了给水，会跑到锅炉、凝结水系统这些没有防爆措施的地方释放出来\u003cspan class=\"infer\">推断\u003c/span>。\u003c/li>\n\u003cli>没有发现水侧出口压力（96PH-4A、4B）增加。投入前水侧的水是排空的、压力低，如果水侧压力自己往上涨，说明燃气正从气侧漏到水侧\u003cspan class=\"infer\">推断\u003c/span>。\u003c/li>\n\u003cli>中压给水温度大于燃气温度加 20 ℃。温差太小，热量换不过去，投了也加热不起来\u003cspan class=\"infer\">推断\u003c/span>。\u003c/li>\n\u003cli>上游燃气入口温度高于 5 ℃。燃气在调压站已经加热过\u003cspan class=\"cite\">见考点 2.4\u003c/span>，温度这么低说明上游不正常\u003cspan class=\"infer\">推断\u003c/span>。\u003c/li>\n\u003cli>系统所有运行参数正常，没有报警。\u003c/li>\n\u003c/ul>\n\u003cp>加热器水侧有六个阀，按位置分两组\u003cspan class=\"cite\">机岛 9.3.4.3\u003c/span>：\u003c/p>\n\u003cul>\n\u003cli>入口侧：给水入口阀 VA41-3、入口侧隔离阀 VA41-6、入口侧排水阀 VA41-8\u003c/li>\n\u003cli>出口侧：给水出口阀 VA41-4、温度控制阀 VA41-9、出口侧排水阀 VA41-7\u003c/li>\n\u003c/ul>\n\u003cp>启动前两个排水阀开，其余四个关\u003cspan class=\"cite\">机岛 9.3.4.3\u003c/span>，水侧放空、不带压，这样才能靠第二个条件发现内漏\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>顺控启动还要求：中压给水泵在运行；给水与天然气压力差大于允许值；没有加热器跳闸条件（同时是进、出水阀的开允许）；值班员手动投入或燃机点火\u003cspan class=\"cite\">机岛 9.3.4.3\u003c/span>。\u003c/p>\n\u003cp>顺控分两步\u003cspan class=\"cite\">机岛 9.3.4.3\u003c/span>。第一步开入口侧：开 VA41-6，关 VA41-8，开 VA41-3，给水进入加热器。入口侧阀门到位后等 5 分钟，确认加热器没有泄漏，才走第二步开出口侧：开 VA41-4，关 VA41-7，VA41-9 自动开到预设的最小流量控制位置，建立流量。\u003c/p>\n\u003cp>先开入口侧、等 5 分钟，是让水先充满水侧、升到给水压力，看有没有漏；出口侧还没接通，万一有漏，关掉入口侧就能退出，不牵连回水系统\u003cspan class=\"infer\">推断：规程只写了「若加热器无泄漏」\u003c/span>。\u003c/p>\n\u003cp>题库和规程不一样的地方，以本厂规程为准：题库说加热到 227 ℃\u003cspan class=\"cite\">题库 RJ-12680f3e\u003c/span>，规程没写目标温度，只写了燃气温度高于 238 ℃（460 ℉）跳加热器\u003cspan class=\"cite\">机岛 9.3.3.2\u003c/span>。题库的投入条件里测点写作 MBP36CP002A/B，还多了一条「连续提供加热功能维持所需燃气温度」\u003cspan class=\"cite\">题库 RJ-5708a389\u003c/span>，规程写的是 96PH-4A、4B，也没有这一条\u003cspan class=\"cite\">机岛 9.3.4.2\u003c/span>。\u003c/p>", "sources": [{"t": "机岛规程 第 1995～2002 行", "lines": [[1995, "9.3.1 概述"], [1996, "天然气前置模块系统主要包括两个100％的绝对分离器、燃气科氏流量计（96VM-1）、"], [1997, "一套性能加"], [1998, "热器（PCHE）及相关测量表计。"], [1999, "来自调压站的燃气首先经过两个绝对分离器为两级过滤/分离装置，垂直并联布置，第一级用惯性"], [2000, "分离除去较大的液滴和颗粒，第二级是聚凝式过滤器，可以去除99.5%直径≤0.3μm的液体和固体。燃"], [2001, "气从过滤分离器出来，经过燃气科氏流量计（96VM-1)后进入性能加热器模块。性能加热器将气体加热"], [2002, "至其要求的温度。加热热源取自余热锅炉中压（IP）省煤器出口给水，回水至凝结水母管。"]]}, {"t": "机岛规程 第 2012～2030 行", "lines": [[2012, "性能加热器"], [2013, "型式 印刷电路板换热器（PCHE)"], [2014, "加热器数量 1"], [2015, "主体材质 304L"], [2020, "换热面积 ㎡ 391"], [2021, "设计压力 MPa 水侧：11/气侧：4.89"], [2022, "设计温度 ℃ 水侧：-20/318/气侧：-20/318"], [2023, "科氏流量计"], [2024, "电压 V 230"], [2025, "9.3.3 联锁保护"], [2026, "9.3.3.1 性能加热器投入"], [2027, "1) 燃机发启动令，未选offcrank、cooldown、limitedcrank模式，点火后性能加热器自动投入。"], [2028, "2) TCS上手动投入。"], [2029, "9.3.3.2 燃气温度逻辑条件"], [2030, "1) P1腔燃气高高460℉(238℃)，跳性能加热器。"]]}, {"t": "机岛规程 第 2050～2079 行", "lines": [[2050, "9.3.4.2 性能加热器投入"], [2051, "1) 性能加热器投入条件："], [2052, "(1) 水压力>燃气压力+3.5Bar"], [2053, "(2) 未发现性能加热器水侧出口压力（96PH-4A\\4B）增加"], [2054, "(3) 中压给水温度>燃气温度+20℃"], [2055, "(4) 上游气体入口温度高于 5℃"], [2056, "(5) 检查系统所有运行参数正常且无报警。"], [2057, "(6) 值班员从燃机操作画面上选择性能加热器启动后，启动程序自动完成。"], [2058, "9.3.4.3 性能加热器顺序控制"], [2059, "1) 检查确认阀门在启动准备位置："], [2060, "(1) 性能加热器给水入口阀 VA41-3 关（自动）。"], [2061, "(2) 性能加热器给水入口侧排水阀 VA41-8 开（自动）。"], [2066, "(3) 性能加热器给水入口侧隔离阀 VA41-6 关（自动）。"], [2067, "(4) 性能加热器给水出口阀 VA41-4 关（自动）。"], [2068, "(5) 性能加热器给水出口侧排水阀 VA41-7 开（自动）。"], [2069, "(6) 性能加热器温度控制阀 VA41-9 关（自动）。"], [2070, "2) 顺控启动条件："], [2071, "(1) 中压给水泵运行。"], [2072, "(2) 中压给水压力与天然气压力差大于允许值。"], [2073, "(3) 无加热器跳闸条件（同时作为进、出水阀开允许条件）。"], [2074, "(4) 值班员手动投性能加热器或燃机点火。"], [2075, "3) 加热器顺序启动过程："], [2076, "(1) 发出入口系统阀门启动指令：开启 VA41-6，关闭 VA41-8，开启 VA41-3"], [2077, "(2) 发出加热器入口阀门启动指令，入口系统阀门到位 5 分钟后，若加热器无泄漏，发出出口系"], [2078, "统阀门启动指令：开启 VA41-4，关闭 VA41-7，自动打开 VA41-9 至预设的最小流量控制位置来建"], [2079, "立流量。"]]}], "cards": ["D:4.2-1", "RJ-62a486fd", "D:4.2-3", "D:4.2-7", "RJ-12680f3e", "D:4.2-5", "D:4.2-2", "RJ-5708a389", "D:4.2-6", "D:4.2-4"]}, "4.3": {"id": "4.3", "name": "性能加热器的退出、跳闸和燃气温度保护", "cat": "四", "gist": "停机令发出、转速低于 95% 时自动退出。P1 腔燃气温度超过 238 ℃（460 ℉）跳性能加热器；低于约 38 ℃（100 ℉）燃机 3 倍 RB；两个温度测点都坏了，燃机自动停机。加热器跳闸后，要确认控制系统已经转到冷燃料控制模式、负荷已经减下来。", "reg": "机岛 9.3.3.2、9.3.5、9.3.7.3、5.3.2、5.4、8.2.3、11.3.8", "lecture": "\u003cp>性能加热器退出有两种：停机时按顺序正常退出，运行中出了问题跳闸。另外，加热后燃气的温度有一组保护，测点在 P1 腔，也就是燃料模块最前面安全切断阀 VS4-4 和辅助截止阀 VS4-1 之间的那段管子\u003cspan class=\"cite\">机岛 9.4.2；腔室见考点 5.1\u003c/span>。\u003c/p>\n\u003cp>先说正常退出。燃机发停机令，转速小于 95%（TNH，燃机转速占额定转速的百分数），性能加热器自动退出\u003cspan class=\"cite\">机岛 9.3.5\u003c/span>。停机时燃料越烧越少，加热已经没有意义\u003cspan class=\"infer\">推断\u003c/span>。退出也是顺控，先关入口侧、再关出口侧\u003cspan class=\"cite\">机岛 9.3.4.3\u003c/span>：\u003c/p>\n\u003col>\n\u003cli>关 VA41-3 给水入口阀，关 VA41-6 入口侧隔离阀，开 VA41-8 入口侧排水阀。\u003c/li>\n\u003cli>入口侧阀门关好后，关 VA41-4 给水出口阀，开 VA41-7 出口侧排水阀，关 VA41-9 温度控制阀。\u003c/li>\n\u003c/ol>\n\u003cp>先切断来水，再关回水，最后两个排水阀都开着，水侧放空，回到投入前的准备状态\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>性能加热器跳闸的条件有五条\u003cspan class=\"cite\">机岛 9.3.5\u003c/span>。原文是华氏度（℉）和 psig（磅力每平方英寸，表压），这里换成常用单位：\u003c/p>\n\u003cul>\n\u003cli>水侧进口温度低于约 45 ℃\u003cspan class=\"conv\">换算自 113 ℉\u003c/span>，延时 5s\u003c/li>\n\u003cli>水侧阀门故障，指令和反馈偏差超过 5%\u003c/li>\n\u003cli>进水滤网压差大于约 400 kPa\u003cspan class=\"conv\">换算自 58.0 psig\u003c/span>\u003c/li>\n\u003cli>P1 腔燃气温度高于 238 ℃（460 ℉），延时 10s\u003cspan class=\"cite\">机岛 9.3.3.2、9.3.5\u003c/span>\u003c/li>\n\u003cli>性能加热器出口水温低于约 10 ℃\u003cspan class=\"conv\">换算自 50 ℉\u003c/span>\u003c/li>\n\u003c/ul>\n\u003cp>规程没写每一条的原因。进口水温低、出口水温低、滤网堵、阀门失控，说明加热水的温度或流量不对，加热器已经不能可靠地把燃气加热到要求的温度；燃气温度过高则是加热过了头\u003cspan class=\"infer\">推断\u003c/span>。规程在异常处理里列的跳闸原因是：温控阀故障，给水压力和天然气压力的差值过小，燃料加热控制系统故障\u003cspan class=\"cite\">机岛 9.3.7.3\u003c/span>。压差过小就是失去了「水压高于气压」这道防线\u003cspan class=\"infer\">推断；见考点 4.2\u003c/span>。\u003c/p>\n\u003cp>跳闸以后，先检查加热器是否已经退出、进出口阀是否已经关闭；再确认控制系统已经转到冷燃料控制模式、负荷已经减下来；然后检查燃机控制系统参数，判断运行是否安全，不安全就停机\u003cspan class=\"cite\">机岛 9.3.7.3\u003c/span>。「冷燃料控制模式」规程没解释，意思应该是控制系统按没加热的燃料来控制燃烧，并把负荷限制在冷燃料下能稳定燃烧的范围\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>P1 腔燃气温度的保护，测点是 FTG（燃料气温度）传感器 FTG-1A/1B，规程写了三条\u003cspan class=\"cite\">机岛 9.3.3.2\u003c/span>：\u003c/p>\n\u003cul>\n\u003cli>燃气温度高高，238 ℃（460 ℉），跳性能加热器\u003c/li>\n\u003cli>FTG-1A/1B 两个测点都是坏点，延时 2s，燃机自动停机\u003c/li>\n\u003cli>燃气温度低于约 38 ℃\u003cspan class=\"conv\">换算自 100 ℉\u003c/span>，燃机 3 倍 RB，RB 清单写延时 10s\u003cspan class=\"cite\">机岛 5.3.2\u003c/span>\u003c/li>\n\u003c/ul>\n\u003cp>RB 是快速减负荷，控制系统让燃料指令按规定速率往下降，3 倍 RB 的速率是 1 倍的三倍\u003cspan class=\"cite\">机岛 5.3\u003c/span>。\u003c/p>\n\u003cp>燃气温度为什么要管住：燃料进燃烧室的热量，取决于燃气的热值、密度和温度。华白数\u003cspan class=\"cite\">见考点 1.1\u003c/span>是热值除以相对密度的平方根，再把燃气温度算进去，就是修正华白指数\u003cspan class=\"infer\">原理\u003c/span>。规程 3 倍 RB 清单里有一条就是燃料修正华白指数超出范围\u003cspan class=\"cite\">机岛 5.3.2\u003c/span>。燃烧器的喷嘴按一定的修正华白指数设计，燃气太冷，这个指数偏高，太热则偏低，同样的阀门开度送进去的热量就不对，预混燃烧的燃料和空气配比偏离设计，容易燃烧脉动甚至熄火、回火\u003cspan class=\"infer\">推断：按修正华白指数的定义推出\u003c/span>。燃气太冷还可能有重烃和水分析出成液滴\u003cspan class=\"infer\">推断\u003c/span>。所以温度低要快速减负荷，不让燃机在燃料不合适的状态下带高负荷\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>温度高只跳加热器，是因为热是加热器给的，切掉热源，燃气温度自然回落\u003cspan class=\"infer\">推断\u003c/span>。规程「天然气温度高」的现象里也写了燃机减负荷、加热器退出\u003cspan class=\"cite\">机岛 11.3.8\u003c/span>。两个温度测点都坏了，看不见燃气温度，也就无法判断燃料状态，所以停机\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>燃气温度异常升高，原因可能是中压省煤器出口水温异常升高、回水温控阀调节失灵、温度测量元件故障。处理是检查锅炉中压汽水系统；温控阀失灵，联系检修；温度控制不住、持续升高，做好停机准备\u003cspan class=\"cite\">机岛 11.3.8\u003c/span>。\u003c/p>\n\u003cp>正常停机步骤里写的是转速降到 2820rpm 时性能加热器给水侧自动退出\u003cspan class=\"cite\">机岛 8.2.3\u003c/span>，和 95%（约 2850 rpm\u003cspan class=\"conv\">换算\u003c/span>）差得不多，以现场为准。\u003c/p>", "sources": [{"t": "机岛规程 第 2025～2032 行", "lines": [[2025, "9.3.3 联锁保护"], [2026, "9.3.3.1 性能加热器投入"], [2027, "1) 燃机发启动令，未选offcrank、cooldown、limitedcrank模式，点火后性能加热器自动投入。"], [2028, "2) TCS上手动投入。"], [2029, "9.3.3.2 燃气温度逻辑条件"], [2030, "1) P1腔燃气高高460℉(238℃)，跳性能加热器。"], [2031, "2) P1腔燃气温度FTG传感器（FTG-1A/1B）测点A、B均为坏点，延时2s，燃机自动停机"], [2032, "3) P1腔燃气温度\u003c100℉，燃机3倍RB。"]]}, {"t": "机岛规程 第 2080～2092 行", "lines": [[2080, "4) 加热器顺控停止过程："], [2081, "(1) 停止过程阀门顺序动作：关闭 VA41-3，关闭 VA41-6，开启 VA41-8。"], [2082, "(2) 入口侧阀门关闭后，关闭出口侧阀门：关闭 VA41-4，开启 VA41-7，关闭 VA41-9。"], [2083, "(3) 发出顺序停止指令 60 秒内，6 个阀门未按要求到位，则发出顺控停止故障信号。"], [2084, "9.3.5 性能加热器退出"], [2085, "1) 正常退出："], [2086, "燃机发停机令，燃机转速小于 95%，性能加热器自动退出"], [2087, "2) 性能加热器跳闸："], [2088, "(1) 水侧进口温度\u003c113℉，延时 5s。"], [2089, "(2) 水侧阀门故障（指令与反馈偏差超过 5％）。"], [2090, "(3) 进水滤网压差大>58.0psig。"], [2091, "(4) P1 腔天然气温度>460℉延时 10s。"], [2092, "(5) 性能加热器出口水温\u003c50℉。"]]}, {"t": "机岛规程 第 2136～2149 行", "lines": [[2136, "9.3.7.3 性能加热器跳闸"], [2137, "1) 现象："], [2138, "性能加热器跳闸报警。"], [2139, "2) 原因："], [2140, "(1) 性能加热器温控阀故障。"], [2141, "(2) 给水压力与天然气压力差值过小"], [2142, "(3) 燃料加热控制系统故障。"], [2143, "3) 处理："], [2144, "(1) 检查性能加热器是否退出，控制系统是否已经按照系统工况作出了反应，性能加热器进、出"], [2145, "口阀是否关闭。"], [2146, "(2) 验证控制系统是否已转换到冷燃料控制模式，是否已减小负荷以满足燃机相应参数要求。"], [2147, "(3) 应检查燃气轮机控制系统参数以便确定系统运行是否安全，如不安全则应实施停机。"], [2148, "(4) 如果实施停机，则应在降速惰走过程中监控系统，观察有何异常情况。"], [2149, "(5) 如未实施停机，则应在故障诊断和检修过程中监控系统观察有何异常情况。"]]}, {"t": "机岛规程 第 2163～2168 行", "lines": [[2163, "9.4.2 设备规范"], [2164, "代码 描述 阀型 说明"], [2165, "VS4-4 安全切断阀 气动 防止气体燃料流入气体控制橇"], [2166, "VA13-25 安全切断通风阀 气动 P1 腔室进行减压"], [2167, "VS4-1 辅助截止阀 气动 切断气体燃料，使下游设备与气体供应隔离"], [2168, "VA13-200 P1X 腔通风阀 气动 排出 P1X 腔室的气体"]]}, {"t": "机岛规程 第 588～591 行", "lines": [[589, "GT-RUNBACK 由 MarK VIe 自动控制执行，控制系统使 FSR 以规定的速率降低直到故障排除为止，如"], [590, "果故障不能在规定的时间极限范围内排除，控制系统将发出指令使机组在全速空载 FSNL 状态运行。燃"], [591, "机快速自动减负荷有 1 倍速率和 3 倍速率两种。"]]}, {"t": "机岛规程 第 660～666 行", "lines": [[660, "差压全坏点。"], [661, "4 Gas Fuel System RB-3X Nominal Rate（燃料系统 RB-3X）"], [662, "（1） CDM 系统退出且燃料修正华白指数﹥44.34 或＜36.28"], [663, "（2） 四个 GCV 任一最大开度﹥95% ，延时 5s"], [664, "（3） 四个 GCV 任一 GCV ratio LL（（燃料腔 2 压力+环境压力）/（燃料腔 2 压力+环境压力-"], [665, "燃料控制阀前后压差））﹤1.055 ，延时 5s"], [666, "（4） P1 腔燃料温度 FTG﹤100℉，延时 10s"]]}, {"t": "机岛规程 第 1627～1627 行", "lines": [[1627, "12) 燃机转速降至2820rpm时，前置模块的性能加热器给水侧自动退出。"]]}, {"t": "机岛规程 第 6789～6802 行", "lines": [[6789, "11.3.8 天然气温度高"], [6790, "1) 现象："], [6791, "(1) 性能加热器出口温度异常升高报警。"], [6792, "(2) 性能加热器回水温控阀关小。"], [6793, "(3) 燃机减负荷。"], [6794, "(4) 性能加热器出口天然气温度高，性能加热器退出。"], [6795, "2) 原因："], [6796, "(1) 中压省煤器出口水温异常升高。"], [6797, "(2) 性能加热器回水温控阀调节失灵。"], [6798, "(3) 天然温度测量元件故障"], [6799, "3) 处理："], [6800, "(1) 检查锅炉中压汽水系统工况是否正常。"], [6801, "(2) 若性能加热器回水温控阀调节失灵，联系检修处理。"], [6802, "(3) 若天然气温度不可控制，持续升高，做好停机准备。"]]}], "cards": ["D:4.3-5", "D:4.3-8", "D:4.3-3", "D:4.3-7", "D:4.3-1", "D:4.3-4", "D:4.3-2", "D:4.3-6"]}, "5.1": {"id": "5.1", "name": "燃料模块的阀门和腔室", "cat": "五", "gist": "顺着气流：安全切断阀 VS4-4（也叫 SSOV）→ P1 腔（通风阀 VA13-25）→ 辅助截止阀 VS4-1 → P1X 腔（通风阀 VA13-200）→ 并联的燃气截止阀 VGS-1 和启动控制阀 VSC-1 → P2 腔（通风阀 VA13-15）→ 四个燃气控制阀 VGC-1～4 → PM1、PM2、PM3、AFS 四根歧管。另外有一路点火用的支路（VGST-1、VGCT-1），和一组清吹信用阀（VIS-1、VIS-2、VIS-3、VIV-1）。", "reg": "机岛 9.4.1、9.4.2；6.5.1.2", "lecture": "\u003cp>燃料模块在前置模块的下游，是天然气进燃烧室之前的最后一段。规程给它定了三个任务：在启动阶段控制压力，按燃烧的需要分配燃料，跳闸时把燃气隔离开\u003cspan class=\"cite\">机岛 9.4.1\u003c/span>。\u003c/p>\n\u003cp>模块主路上的阀门，顺着气流排是这样的\u003cspan class=\"infer\">推断：顺序由设备表、泄漏试验和升速步骤几处原文拼出\u003c/span>：\u003c/p>\n\u003col>\n\u003cli>安全切断阀 VS4-4\u003c/li>\n\u003cli>辅助截止阀 VS4-1\u003c/li>\n\u003cli>燃气截止阀 VGS-1 和启动控制阀 VSC-1，两个是并联的\u003c/li>\n\u003cli>四个燃气控制阀 VGC-1/2/3/4，出口分别接 PM1、PM2、PM3、AFS 四根燃料歧管\u003cspan class=\"cite\">题库 RJ-167f8139\u003c/span>\u003cspan class=\"cite\">见考点 5.4\u003c/span>\u003c/li>\n\u003c/ol>\n\u003cp>相邻两道阀之间的那段管子叫腔室，每个腔室配一个通风阀，用来把腔室里的燃气排掉\u003cspan class=\"cite\">机岛 9.4.2\u003c/span>：\u003c/p>\n\u003cul>\n\u003cli>P1 腔：VS4-4 和 VS4-1 之间，通风阀 VA13-25。压力由 96FG-1 测量\u003cspan class=\"cite\">机岛 9.4.3.1\u003c/span>\u003c/li>\n\u003cli>P1X 腔：VS4-1 和 VGS-1、VSC-1 之间，通风阀 VA13-200\u003c/li>\n\u003cli>P2 腔：VGS-1、VSC-1 和燃气控制阀之间，通风阀 VA13-15。P2 压力就是燃气控制阀前的压力，泄漏试验和启动阶段的保护都看它\u003c/li>\n\u003c/ul>\n\u003cp>规程别处还有几种写法。启动步骤里的 SSOV 就是 VS4-4\u003cspan class=\"cite\">机岛 6.5.1.2\u003c/span>。「燃气辅助关断阀」是 VS4-1，「燃气关断阀」和紧急停机操作里的 GSV-1 是 VGS-1，GCV 是燃气控制阀 VGC\u003cspan class=\"infer\">推断：由阀名和编号对照\u003c/span>。\u003c/p>\n\u003cp>为什么要串三道截止阀。任何一道截止阀都可能关不严。两道阀串在一起、中间腔室的通风阀开着，上游那道阀漏过来的燃气就从通风阀排走，中间腔室接近大气压；下游那道阀两侧没有压差，燃气也就不会从它漏过去。三道阀夹出两个这样的腔室：VS4-4 和 VS4-1 夹着 P1 腔，VS4-1 和 VGS-1、VSC-1 夹着 P1X 腔\u003cspan class=\"infer\">原理：截止阀隔断的一般做法，规程没写\u003c/span>。三道阀的分工也不同：VS4-4 防止燃气流入气体控制橇，停机时把燃气挡在模块外；VS4-1 把下游和气源隔开，泄漏试验和点火前加压都靠开它放气进来；VGS-1 快速关闭流向燃烧系统的燃气\u003cspan class=\"cite\">机岛 9.4.2\u003c/span>。VGS-1 紧挨在控制阀前面，它一关，下游剩下的燃气最少\u003cspan class=\"infer\">推断：由阀的位置推出\u003c/span>。\u003c/p>\n\u003cp>为什么 VGS-1 和 VSC-1 并联。VSC-1 是调节阀，在启动时调节下游压力，也就是 P2 压力\u003cspan class=\"cite\">机岛 9.4.2\u003c/span>，启动时燃料很少，靠它把 P2 压低、跟着转速往上调。VGS-1 是截止阀，只管全开全关，要求关得快，带负荷以后一直走它。调压力、大流量压降小、关得快，一个阀不好兼顾，所以分成两个\u003cspan class=\"infer\">推断：由两阀的用途推出\u003c/span>。两阀怎么倒换\u003cspan class=\"cite\">见考点 5.3\u003c/span>。\u003c/p>\n\u003cp>四个燃气控制阀是电动的，其余都是气动的\u003cspan class=\"cite\">机岛 9.4.2\u003c/span>。跳机时所有阀回到故障安全位置：截止阀关，三个腔的通风阀开\u003cspan class=\"cite\">机岛 9.4.5.2\u003c/span>。\u003c/p>\n\u003cp>主路之外还有两组阀。\u003c/p>\n\u003cp>一组是点火用的支路，规程也叫火炬点火系统、点火腔，这里统一用设备表的叫法：引燃截止阀 VGST-1，引燃调节阀 VGCT-1，引燃腔室通风阀 VA13T-1，引燃上游通风阀 VAST-10\u003cspan class=\"cite\">机岛 9.4.2\u003c/span>。\u003c/p>\n\u003cp>另一组是清吹信用系统，有 VIS-1、VIS-2、VIS-3 三个截止阀和通风阀 VIV-1。规程写这三个阀在「吹扫免除操作」期间打开，VIS-2 对 P2 腔加压，VIS-3 对引燃点火腔加压，燃机运行期间关闭\u003cspan class=\"cite\">机岛 9.4.2\u003c/span>。\u003c/p>\n\u003cp>「清吹信用」「吹扫免除」规程没解释，应是英文 purge credit 的两种译法，和启动清吹有关\u003cspan class=\"infer\">推断\u003c/span>。启动清吹是启动时在 735rpm 吹 11.5min，把燃机和余热锅炉排气通道里可能积下的燃气吹走\u003cspan class=\"cite\">机岛 6.5.1.2\u003c/span>\u003cspan class=\"cite\">见考点 6.3\u003c/span>。停机期间如果能证明燃气一直没进过燃机，上次吹过的就算作「信用」，下次启动可以免吹。证明的办法是开 VIS 阀把空气送进 P2 腔和引燃腔，让它们保持压力，上游截止阀就算漏一点，燃气也进不了压力比它高的空腔\u003cspan class=\"infer\">推断：按 purge credit 的一般含义和「对 P2 腔室加压」推出\u003c/span>。点火失败跳闸条件里的「P2 腔和点火腔阻塞压力」\u003cspan class=\"cite\">机岛 5.2\u003c/span>，应就是这个空气压力\u003cspan class=\"infer\">推断\u003c/span>。本厂什么时候用吹扫免除，规程没写。相关跳闸条件\u003cspan class=\"cite\">见考点 5.6\u003c/span>。\u003c/p>\n\u003cp>题库有几处和规程不一样，以本厂规程为准。原题把 SSOV 叫「前置模块安全关断阀」\u003cspan class=\"cite\">题库 RJ-68abc983\u003c/span>，规程把 VS4-4 列在气体燃料系统里\u003cspan class=\"cite\">机岛 9.4.1\u003c/span>。从「防止气体燃料流入气体控制橇」这句看，VS4-4 可能装在燃料模块橇的入口外侧，所以有两种算法\u003cspan class=\"infer\">推断\u003c/span>。原题把「测量燃气总质量流量」也算作燃料模块的功能\u003cspan class=\"cite\">题库 RJ-28323585\u003c/span>，规程只写三项，流量计 96VM-1 在前置模块\u003cspan class=\"cite\">机岛 9.3.1\u003c/span>。原题说燃料模块有两个燃气过滤器防微颗粒\u003cspan class=\"cite\">题库 RJ-167f8139\u003c/span>，规程只列了临时过滤器 FA105，巡检查进口滤网差压\u003cspan class=\"cite\">机岛 9.4.2、9.4.6.1\u003c/span>。\u003c/p>", "sources": [{"t": "机岛规程 第 2151～2187 行", "lines": [[2151, "9.4.1 概述"], [2152, "气体燃料系统主要在燃机启动阶段控制压力， 根据燃烧需要控制燃料分配， 以及隔离气体燃料以防"], [2157, "跳闸事件。"], [2158, "气体燃料系统包括燃料控制系统、火炬点火系统、清吹信用系统。燃料控制系统包括安全切断阀"], [2159, "VS4-4、安全切断通风阀VA13-25、辅助截止阀VS4-1、P1X腔通风阀VA13-200、燃气截止阀VGS-1、启动"], [2160, "控制阀VSC-1、P2腔通风阀VA13-15、四个燃气控制阀VGC-1/2/3/4以及相关的测量元件。火炬点火系统"], [2161, "包括截止阀VGST-1、两个通风阀VA13T-1/VAST-10、调节阀VGCT-1。清吹信用系统包括过三个截止阀和"], [2162, "一个排气阀VIS-1、VIS-2、VIS-3、VIV-1。"], [2163, "9.4.2 设备规范"], [2164, "代码 描述 阀型 说明"], [2165, "VS4-4 安全切断阀 气动 防止气体燃料流入气体控制橇"], [2166, "VA13-25 安全切断通风阀 气动 P1 腔室进行减压"], [2167, "VS4-1 辅助截止阀 气动 切断气体燃料，使下游设备与气体供应隔离"], [2168, "VA13-200 P1X 腔通风阀 气动 排出 P1X 腔室的气体"], [2169, "VGS-1 燃气截止阀 气动 快速关闭流向燃烧系统的气体燃料"], [2170, "VSC-1 启动控制阀 气动 在启动时调节下游压力"], [2171, "VA13-15 P2 腔通风阀 气动 排出 P2 腔室的气体"], [2172, "VGC-1/2/3/4 燃气控制阀 电动 根据 GT 负载和燃烧模式将燃气分别流进每个"], [2173, "燃气管道"], [2174, "VGST-1 引燃截止阀 气动"], [2175, "在点火期间跳闸的情况下阻止气体燃料流入"], [2176, "引燃系统， 并在不使用时将引燃系统与主气体"], [2177, "燃料供应隔离"], [2178, "VA13T-1 引燃腔室通风阀 气动 引燃截止阀和调节阀之间进行排气"], [2179, "VAST-10 引燃上游通风阀 气动 对引燃调节阀和引燃点火器之间进行排气"], [2180, "VGCT-1 引燃调节阀 气动 调节进入引燃系统的阀门流量"], [2181, "FA105 过滤器 - 临时过滤器"], [2182, "VIS-1 吹扫管路入口供应阀 气动 吹扫免除操作期间打开， 在燃机运行期间关闭"], [2183, "VIS-2 吹扫管路出口至 P2 腔"], [2184, "室供应阀 气动 吹扫免除操作期间打开，对 P2 腔室加压"], [2185, "VIS-3 吹扫管路出口至引燃腔"], [2186, "室供应阀 气动 吹扫免除操作期间打开， 以对引燃点火腔加压"], [2187, "VIV-1 吹扫管路通风阀 气动 排出吹扫免除截止阀之间的气体"]]}, {"t": "机岛规程 第 2240～2240 行", "lines": [[2240, "96FG-1 （P1） 气体燃料进气压力变送器 \u003c3068.275kpa 报警"]]}, {"t": "机岛规程 第 2304～2307 行", "lines": [[2304, "9.4.5.2 燃机跳机"], [2305, "在燃机跳闸时，所有阀门均返回故障安全位置：燃气截止阀VS4-4、VS4-1、VGS-1、VSC-1(若点火/"], [2306, "启动阶段跳闸)、VGC关闭。P1、P1x和P2腔排气阀（VA13-25,VA13-200和VA13-15）是开启的，以排空腔"], [2307, "室。"]]}, {"t": "机岛规程 第 2317～2320 行", "lines": [[2317, "1) 检测系统各阀门位置正确，就地装置无泄漏现象。"], [2318, "2) 检查燃气控制系统就地表计各参数正常。"], [2319, "3) 燃气模块入口气压正常。"], [2320, "4) 燃料模块进口滤网差压正常。"]]}, {"t": "机岛规程 第 1234～1237 行", "lines": [[1234, "5) 转速大于36rpm时，检查SSOV（安全关断阀VS4-4）已经打开，燃气轮机执行泄漏试验，试验合"], [1235, "格后继续进行。"], [1236, "6) 转速达到14%TNH（420rpm），延时30s后检查排气框架风机88TK自动投运。"], [1237, "7) 转速升至清吹转速735rpm，开始清吹倒计时11.5min。"]]}, {"t": "机岛规程 第 575～576 行", "lines": [[575, "火检传感器故障： 清吹进行时(TNH>24.3%,余热锅炉清吹未完成， BPCS 有清吹允许信号或"], [576, "吹扫系统投入时 P2 腔和点火腔阻塞压力正常的情况下)，任一火检传感器检测到火焰或"]]}, {"t": "机岛规程 第 2000～2002 行", "lines": [[2000, "分离除去较大的液滴和颗粒，第二级是聚凝式过滤器，可以去除99.5%直径≤0.3μm的液体和固体。燃"], [2001, "气从过滤分离器出来，经过燃气科氏流量计（96VM-1)后进入性能加热器模块。性能加热器将气体加热"], [2002, "至其要求的温度。加热热源取自余热锅炉中压（IP）省煤器出口给水，回水至凝结水母管。"]]}], "cards": ["D:5.1-3", "RJ-28323585", "D:5.1-5", "D:5.1-6", "RJ-68abc983", "D:5.1-4", "RJ-167f8139", "D:5.1-2", "D:5.1-1"]}, "5.2": {"id": "5.2", "name": "启动时的燃气泄漏试验", "cat": "五", "gist": "每次启动转速超过 36 rpm、VS4-4 打开后做。试验 A：P1X 腔带压，P2 腔排空后关住通风阀，P2 压力上升，说明 VGS-1 或 VSC-1 漏。试验 B：开 VGS-1 给 P2 腔充压后关上，P2 压力下降，说明 VGC-1～4、VIS-2 或 VA13-15 漏。试验通过后关 VS4-1，打开 P1X、P2 腔的通风阀泄压；不通过就报警，合格后才继续启动。", "reg": "机岛 9.4.4.2、6.5.1.2；反措 8.5.2", "lecture": "\u003cp>燃机每次启动都要做一次燃气泄漏试验，检查燃料模块里的几道阀关得严不严。启动升速到转速大于 36 rpm 时，先确认安全切断阀 VS4-4 已经打开，然后做泄漏试验，试验合格才继续往下走\u003cspan class=\"cite\">机岛 6.5.1.2\u003c/span>。按启动步骤的顺序，泄漏试验在前，升到 735rpm 做启动清吹在后\u003cspan class=\"cite\">机岛 6.5.1.2\u003c/span>\u003cspan class=\"cite\">见考点 6.3\u003c/span>。\u003c/p>\n\u003cp>整个试验只看一个量：P2 腔\u003cspan class=\"cite\">见考点 5.1\u003c/span>的压力怎么变化\u003cspan class=\"cite\">机岛 9.4.4.2\u003c/span>。试验分 A、B 两步。\u003c/p>\n\u003cp>试验 A 检查 VGS-1 和 VSC-1。先让 P1X 腔带上压：关住 P1X 腔和 P2 腔的通风阀，打开 VS4-1，燃气就进到 P1X 腔。这时 VGS-1 和 VSC-1 都关着，P2 腔里本来没有压力。如果 P2 腔的压力往上涨，说明燃气从 VGS-1 或 VSC-1 漏过去了。\u003c/p>\n\u003cp>试验 B 检查 VGC-1～4、VIS-2 和 VA13-15。先打开 VGS-1 给 P2 腔充压，充上以后再关掉 VGS-1，P2 腔就被封在中间。它的下游是四个燃气控制阀，旁边接着 P2 腔通风阀 VA13-15 和清吹信用阀 VIS-2。如果 P2 腔的压力往下掉，说明燃气从这几个阀里漏出去了。\u003c/p>\n\u003cp>所以两步查的是 P2 腔两侧的阀：试验 A 查进口那一侧，看压力涨不涨；试验 B 查出口和旁边的阀，看压力掉不掉。\u003c/p>\n\u003cp>两步都通过后，VS4-1 重新关上，打开 VA13-200 和 VA13-15，把 P1X 腔和 P2 腔的压力泄掉。试验 A 或试验 B 不合格，控制系统会报警，运行人员可以用主复位命令（Master Reset）重新做一次泄漏试验\u003cspan class=\"cite\">机岛 9.4.4.2\u003c/span>。这个命令在 TCS 哪个画面上操作，规程没写。\u003c/p>\n\u003cp>为什么每次启动都要先做这个试验，规程没写。接下来的启动清吹要用空气把燃机和余热锅炉的排气通道吹干净，点火前燃气也不能提前漏进燃烧室。这段时间挡住燃气的，就是 VS4-1、VGS-1 和 VSC-1 这几道阀：试验通过后 VS4-1 关着，VS4-4 还开着，P1 腔一直带着燃气压力，而 P1X 腔通风阀开着，VGS-1 和 VSC-1 两侧没有压差。先把这几道阀试一遍，确认它们关得严，才能放心往下吹扫、点火\u003cspan class=\"infer\">推断：由启动步骤的先后和泄漏试验后的阀位推出\u003c/span>。\u003c/p>\n\u003cp>反措对这件事的要求是：燃气关断阀和燃气控制阀应能关闭严密；新投产机组和大修后的机组要做调节系统静态试验和关闭时间测试，阀门开关迅速、无卡涩；燃气阀自检试验不合格，严禁启动燃气轮机\u003cspan class=\"cite\">题库 FC-8.5.2\u003c/span>。每次启动的泄漏试验查的是关得严不严，静态试验和关闭时间测试查的是动作快不快、卡不卡\u003cspan class=\"infer\">推断：由两者的内容对照\u003c/span>。\u003c/p>", "sources": [{"t": "机岛规程 第 2248～2259 行", "lines": [[2248, "9.4.4.2 燃气启动泄漏试验"], [2249, "燃机启动时执行泄漏试验。该试验监控 P2 腔内的压力变化，以确保燃气阀的密封性良好。"], [2250, "1) 试验 A（执行 VGS-1、VSC-1 泄漏试验）"], [2251, "燃气管道先加压P1腔。P1x和P2腔排气阀关闭，VS4-1阀打开，燃料气体对P1X腔加压。对P2腔内压"], [2252, "力变化率进行实时监控。若燃料气体通过VGS-1和VSC-1时存在泄漏，则P2腔内压力增大。"], [2253, "2) 试验 B（VGC-1 到 4、VIS-2、VA13-15 泄漏测试）"], [2254, "打开VGS-1给P2腔加压。"], [2255, "一旦P2腔增压， VGS-1关闭。 对P2腔内压力变化率进行实时监控。 若燃气阀"], [2256, "VGC-1到4、VIS-2和VA13-15之间的泄漏，则P2腔内的压力降低。"], [2257, "一旦整个泄漏试验通过，截止阀VS4-1再次关闭，打开VA13-200和VA13-15排气阀，对P1X和P2腔进"], [2258, "行减压。如果试验A或试验B失败，将启动报警，操作员可以通过启动主复位命令（MasterReset）重新"], [2259, "运行气体泄漏试验。"]]}, {"t": "机岛规程 第 1234～1237 行", "lines": [[1234, "5) 转速大于36rpm时，检查SSOV（安全关断阀VS4-4）已经打开，燃气轮机执行泄漏试验，试验合"], [1235, "格后继续进行。"], [1236, "6) 转速达到14%TNH（420rpm），延时30s后检查排气框架风机88TK自动投运。"], [1237, "7) 转速升至清吹转速735rpm，开始清吹倒计时11.5min。"]]}], "cards": ["D:5.2-3", "RJ-anti001", "D:5.2-4", "D:5.2-5", "RJ-std016", "D:5.2-2", "FC-8.5.2", "RJ-dc508a1a", "D:5.2-1", "RJ-fb87ce2a"]}, "5.3": {"id": "5.3", "name": "从点火到全速空载，燃料阀怎么动", "cat": "五", "gist": "点火前关 P1X、P2 和点火腔的通风阀，开 VS4-1 给上游加压。点火时 VSC-1 慢慢开到点火需要的 P2 压力，VGC-1、2 开到点火位置，点火支路的阀打开，火花塞通电；检测到火焰后关点火支路并吹扫。升速时由 VSC-1 让 P2 压力跟着转速变；VSC-1 全开后开 VGS-1，VGS-1 全开后关 VSC-1。", "reg": "机岛 9.4.4.3～9.4.4.5、6.5.1.3、6.5.1.4", "lecture": "\u003cp>启动清吹（735rpm 吹燃机和余热锅炉的排气通道）结束后燃机降速\u003cspan class=\"cite\">机岛 6.5.1.2\u003c/span>\u003cspan class=\"cite\">见考点 6.3\u003c/span>。转速降到 13.3%TNH（400rpm）以下时，LCI（静态变频启动装置，把发电机当电动机拖燃机）再次输出功率，把燃机拖到点火转速 14%TNH（420rpm），启动点火程序\u003cspan class=\"cite\">机岛 6.5.1.3\u003c/span>。TNH 是燃机转速，用额定转速的百分数表示。点火转速比启动清吹的转速低得多：启动清吹要大风量，点火要空气少，燃料和空气的比例才落在能点着的范围里\u003cspan class=\"infer\">推断：规程没写点火转速的选择依据\u003c/span>。\u003c/p>\n\u003cp>点火前先给管路加压。关闭 P1X 腔、P2 腔\u003cspan class=\"cite\">见考点 5.1\u003c/span>和引燃腔的通风阀 VA13-200、VA13-15、VA13T-1，然后辅助截止阀 VS4-1 全开，燃气充到燃气截止阀 VGS-1、启动控制阀 VSC-1 和引燃截止阀 VGST-1 的前面\u003cspan class=\"cite\">机岛 9.4.4.3\u003c/span>。\u003c/p>\n\u003cp>点火时，VSC-1 逐渐开启，把 P2 腔压力开到点火所需的数值；同时 PM1、PM2 的燃气控制阀 VGC-1 和 VGC-2 逐渐开到点火位置。引燃支路先开引燃截止阀 VGST-1，再开引燃调节阀 VGCT-1，由 VGCT-1 控制点火器所需的压力，然后火花塞通电\u003cspan class=\"cite\">机岛 9.4.4.4\u003c/span>。点火步骤里把这两个阀叫点火腔截止阀、点火腔控制阀，就是引燃截止阀、引燃调节阀\u003cspan class=\"cite\">见考点 5.1\u003c/span>。#3、#4 燃烧室点火，检测到火焰后进入 Mode 3S 燃烧模式\u003cspan class=\"cite\">机岛 6.5.1.3\u003c/span>\u003cspan class=\"cite\">见考点 5.4\u003c/span>。\u003c/p>\n\u003cp>检测到火焰以后，引燃支路退出：关闭 VGST-1 和 VGCT-1，打开 VA13T-1 把引燃腔排空；再打开 VAST-10，用燃烧室回流的空气把 VGCT-1 和点火器之间的燃气吹掉，吹完关闭 VAST-10\u003cspan class=\"cite\">机岛 9.4.4.4\u003c/span>。「回流」是这样来的：这段管子一头通燃烧室，燃烧室里是压气机压过的空气，压力比大气高；VAST-10 一开，这段管子通了大气，空气就从燃烧室经点火器倒着流出来，把里面的燃气带走\u003cspan class=\"infer\">推断：由 VAST-10 的位置推出\u003c/span>。如果 VAST-10 或 VGCT-1 泄漏导致压差过高，控制系统启动正常停机\u003cspan class=\"cite\">机岛 9.4.4.4\u003c/span>。\u003c/p>\n\u003cp>点火前送进燃机的燃气量，由 P2 腔的压力和温度传感器 96FG-25A、25B 和 FTG-2A、2B 测量，超过安全限度可能导致点火中止、机组跳闸\u003cspan class=\"cite\">机岛 9.4.4.4\u003c/span>。\u003c/p>\n\u003cp>点火以后升速。从点火到 60%TNH，调节 VSC-1 让 P2 压力和转速相匹配；VGC-1、VGC-2 部分开启，按预先确定的 P2 压力，使燃料按规定的比例进入 PM1、PM2\u003cspan class=\"cite\">机岛 9.4.4.5\u003c/span>。为什么要靠 VSC-1 把 P2 压低：燃气控制阀的流量由阀前压力和开度共同决定。启动时需要的燃料很少，如果 P2 直接是来气的满压，控制阀只能开一条缝，开度稍微一变流量就变很多，很难控准。先把 P2 压低，控制阀就能在较大的开度上细调；转速升高、燃料需要多了，再让 P2 跟着升\u003cspan class=\"infer\">原理：阀门小开度时流量难控\u003c/span>。\u003c/p>\n\u003cp>到 60%TNH 时，VSC-1 必须全开，以减少阀门的压降；VSC-1 全开后 VGS-1 打开，VGS-1 全开时关闭 VSC-1\u003cspan class=\"cite\">机岛 9.4.4.5\u003c/span>。全速空载（FSNL）以后 VGS-1 一直全开，各歧管分多少燃气由燃气控制阀来调\u003cspan class=\"cite\">机岛 9.4.4.6\u003c/span>。为什么这样倒换：到这时燃料量已经大到控制阀自己能调好，不再需要 VSC-1 压低 P2，它就全开退出调节。先让 VSC-1 全开，P2 就已经接近来气压力，这时再开 VGS-1，P2 不会突然跳一下，燃料量也就不会冲一下。然后改走 VGS-1、关掉 VSC-1，是因为带负荷以后流量大，VGS-1 作为截止阀全开时压降小，跳闸时又关得快；VSC-1 是为启动小流量调压用的，不适合长期通大流量\u003cspan class=\"infer\">推断：规程只写了「减少阀门的压降」，其余由两阀的用途推出\u003c/span>。\u003c/p>\n\u003cp>升速过程中还有几个节点：约 68%TNH（2040rpm）燃烧模式由 M3S 转为 M4S，PM2 和 AFS 的燃料管路清吹阀开启\u003cspan class=\"cite\">见考点 6.1\u003c/span>；91%TNH（2730rpm）燃机达到自持转速，LCI 停止输出；95%TNH 时开始燃料管路清吹，用冷却后的压气机排气吹扫没有进燃气的歧管\u003cspan class=\"cite\">机岛 6.5.1.4、9.4.4.5\u003c/span>。\u003c/p>\n\u003cp>VSC-1 全开的转速规程另一处写的是约 42%TNH（1260rpm），动作顺序相同，以现场为准\u003cspan class=\"cite\">机岛 6.5.1.4\u003c/span>。题库有一道原题把 VGST-1、VGCT-1 叫作「预混截止阀」「预混控制阀」，以本厂规程为准\u003cspan class=\"cite\">题库 RJ-a05823df\u003c/span>。\u003c/p>", "sources": [{"t": "机岛规程 第 2260～2290 行", "lines": [[2260, "9.4.4.3 点火前燃气管道系统的加压"], [2261, "P1X、P2和点火腔排气阀（VA13-200、VA13-15和VA13T-1）应关闭。排气阀关闭后，截止阀VS4-1"], [2262, "全开，对燃气管路上游的燃气截止阀VGS-1、启动控制阀VSC-1、点火腔截止阀VGST-1加压。"], [2263, "9.4.4.4 点火"], [2264, "启动控制阀（VSC-1）逐渐开启，达到所需的P2点火压力。同时，PM1和PM2燃气控制阀（VGC-1和2）"], [2269, "逐渐开启至点火所需的位置，打开点火腔截止阀（VGST-1）后，打开点火腔控制阀(VGCT-1)，控制上游"], [2270, "点火腔点火器点火所需的压力，火花塞通电。当检测到火焰后，关闭点火腔截止阀和控制阀（VGST-1"], [2271, "和VGCT-10）为了排空点火腔腔，打开排气阀（VA13T-10）。"], [2272, "点火完成之后，开启VAST-10阀门，启动点火腔吹扫顺序。目的是快速清除点火腔控制阀和点火腔"], [2273, "点火器之间的气体，用来自燃烧室的回流空气对管道进行吹扫。当点火腔吹扫完成后，关闭VAST-10阀"], [2274, "门。如果出现VAST-10或VGCT-1泄漏导致压差过高，则启动正常停机顺序。P2腔压力和温度传感器"], [2275, "（96FG-25A、 25B/FTG-2A、 2B） 用于测量燃机点火前送至燃气轮机的燃气质量。 如果燃气量超过安全限"], [2276, "度，可能会导致点火中止，机组跳闸。"], [2277, "9.4.4.5 燃机加速至全速空载(FSNL)"], [2278, "从点火到60%TNH， 调节VSC-1， 可以使P2值与燃机转速相匹配。 燃气控制阀VGC-1和VGC-2部分开启，"], [2279, "以符合预先确定的P2压力， 满足燃料流量在PM1、 PM2管线中的分配比。 在60%TNH时， 启动控制阀必须全"], [2280, "开，以减少阀门的压降。启动控制阀全开后，燃气截止阀(VGS-1)打开。当VGS-1全开时，应关闭启动控"], [2281, "制阀VSC-1。"], [2282, "在95%TNH时，燃料清吹系统对所有未进入燃气的管路上进行吹扫。避免燃料回流，导致喷嘴损坏、"], [2283, "燃料混合物自动点火。"], [2284, "9.4.4.6 FSNL到FSFL的过程"], [2285, "全速空载FSNL与基本负荷之间(加载、卸载)，燃气截止阀(VGS-1)全开，燃气控制阀调节各管路之"], [2286, "间的燃料分配。 在全速空载(FSNL)至全速全载(FSFL)之间， 燃机将根据燃机负荷使用不同的燃烧模式运"], [2287, "行。"], [2288, "1) 模式 4：此模式适用于燃机初始加载阶段。M4 模式下只有 PM1 和 PM3 管路加燃气：VGC-1 和 3"], [2289, "调节燃气流量，VGC-2 和 4 关闭。空气吹扫 PM2 和 AFS 管路(VAS-3、4、7、8 打开,VAV-2、4 关"], [2290, "闭)。"]]}, {"t": "机岛规程 第 1237～1261 行", "lines": [[1237, "7) 转速升至清吹转速735rpm，开始清吹倒计时11.5min。"], [1238, "8) 清吹结束LCI停止输出功率，燃机开始降速。"], [1239, "6.5.1.3 燃机点火"], [1240, "1) 燃机转速降至13.3%TNH （400rpm） 以下时， LCI再次输出功率， 转速升至点火转速14%TNH （420rpm） ，"], [1241, "燃机启动点火程序。"], [1242, "2) 燃机转速降至13.3%TNH （400rpm） 以下时， LCI再次输出功率， 转速升至点火转速14%TNH （420rpm） ，"], [1243, "燃机启动点火程序。"], [1244, "3) 点火变压器带电，#3、#4燃烧室点火，火焰探测器检测到火焰信号，燃机点火成功进入Mode 3S"], [1245, "燃烧模式。"], [1246, "4) 点火后检查性能加热器自动投入正常。"], [1251, "6.5.1.4 燃机升速"], [1252, "1) 燃机点火升速过程中，检查天然气调节系统正常。检查润滑油温、油压、油位正常。轴承金属"], [1253, "温度、轴振、瓦振、燃烧脉动、排气分散度等均正常。危险气体检测系统无异常。"], [1254, "2) 转速升至40%TNH（1200rpm），检查GT 的“Compressor”画面，压气机4个抽气流量调节阀EFM"], [1255, "（VA44-1、VA44-2、VA44-3、VA44-4）处于全开位置。"], [1256, "3) 转速升至约42%TNH （1260rpm） 左右， 检查启动控制阀 （VSC-1） 完全打开后， 燃气关断阀 （VGS-1）"], [1257, "开始打开，当燃气关断阀完全打开后，启动控制阀开始关闭。"], [1258, "4) 转速升至约68%TNH（2040rpm），DLN Mode由M3S转换为M4S燃烧模式。此时，PM2和AFS燃料管路"], [1259, "的清吹阀开启正确，检查压气机排气温度、压力正常，清吹冷却空气温度正常。"], [1260, "5) 转速达到75%TNH（2250rpm）时，防喘放气阀（VA2-1、VA2-2）由100%关至37%。"], [1261, "6) 转速升至91%TNH（2730rpm）时，燃机达到自持转速，LCI停止输出。"]]}], "cards": ["D:5.3-2", "RJ-a05823df", "D:5.3-5", "D:5.3-4", "RJ-41a28e2d", "D:5.3-3", "D:5.3-6", "D:5.3-8", "D:5.3-1", "D:5.3-7"]}, "5.4": {"id": "5.4", "name": "燃烧模式和四根歧管", "cat": "五", "gist": "本机 16 个 DLN2.6e 燃烧室，每个都有 PM1、PM2、PM3、AFS 四路燃料管线，#3、#4 燃烧室有火花塞。点火后进入 M3S，PM1、PM2 进燃气；约 68% 转速换成 M4S。全速空载以后按负荷换模式：M4 只有 PM1、PM3 进燃气；M6.2 是 PM1、PM2、PM3；M6.2A 四根全进。暂时不进燃气的歧管用清吹空气吹扫。", "reg": "机岛 4.1.2.2、3.2、9.4.4.6、9.5.4.2、6.5.1.3、6.5.1.4", "lecture": "\u003cp>本厂燃烧室是 DLN2.6e 干式低氮燃烧室，逆流分管式，共 16 个。每个燃烧室有 4 路燃料管线（PM1、PM2、PM3、AFS）接喷嘴。#3、#4 燃烧室有火花塞，其余靠联焰管传火；4 个紫外线火焰探测器装在 #13、#14、#15、#16 燃烧室\u003cspan class=\"cite\">机岛 4.1.2.2\u003c/span>。DLN 是干式低氮燃烧，不往燃烧室喷水或蒸汽，靠燃料和空气先混匀再烧来压低氮氧化物（NOx）\u003cspan class=\"infer\">推断：DLN 的一般含义\u003c/span>。\u003c/p>\n\u003cp>PM 规程没解释，应是预混（premix）的意思；三路各对应喷嘴上哪一部分，规程没写\u003cspan class=\"infer\">推断\u003c/span>。AFS 应是轴向燃料分级（axial fuel staging）的缩写\u003cspan class=\"infer\">推断\u003c/span>。规程术语里说，轴向燃料分级是把燃料喷注在过渡段头部，分级燃烧，提升部分负荷效率、降低燃料热耗、提高基本负荷出力\u003cspan class=\"cite\">机岛 3.2\u003c/span>。过渡段在燃烧室出口和透平之间，也就是在主火焰的下游再补一部分燃料\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>四路燃料由燃料模块出口的四个燃气控制阀分配：VGC-1 接 PM1，VGC-2 接 PM2，VGC-3 接 PM3，VGC-4 接 AFS\u003cspan class=\"cite\">机岛 9.4.4.4、9.4.5.3\u003c/span>。一种燃烧模式，就是一种「哪几根歧管进燃气」的组合\u003cspan class=\"infer\">推断：规程没有给燃烧模式下定义\u003c/span>。\u003c/p>\n\u003cp>为什么要按负荷换模式。NOx 主要在火焰温度高的地方生成。预混燃烧让燃料和空气先混匀、整体偏稀地烧，火焰温度低，NOx 就少。代价是偏稀的预混火焰能稳定燃烧的燃料空气比范围很窄：再稀一点就熄火或燃烧脉动变大，浓一点火焰温度和 NOx 又上去。低负荷时总燃料少，如果平均分给所有喷嘴，每一路都太稀，火焰稳不住；所以先只给少数几路进燃气，让这几路的比例落在稳定范围里。负荷上来、燃料多了，再逐步加歧管。AFS 最后加，是因为它在主火焰下游补燃料，要等主燃烧区够热才烧得稳，高负荷时靠它多加燃料又不用再提高主火焰温度\u003cspan class=\"infer\">原理：预混燃烧的稳定范围\u003c/span>。\u003c/p>\n\u003cp>启动阶段用 M3 类模式。点火成功后进入 Mode 3S\u003cspan class=\"cite\">机岛 6.5.1.3\u003c/span>，M3 模式是 PM1 和 PM2 进燃气，PM3 和 AFS 不进\u003cspan class=\"cite\">机岛 9.5.4.2\u003c/span>。约 68%TNH（2040rpm，TNH 是燃机转速的百分数）燃烧模式由 M3S 转为 M4S，这时 PM2 和 AFS 的燃料管路清吹阀开启\u003cspan class=\"cite\">机岛 6.5.1.4\u003c/span>。M3S、M4S 和 M3、M4 是不是一回事，规程没说；S 可能表示启动阶段用的版本\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>全速空载（FSNL）以后，VGS-1 全开，由燃气控制阀调节各歧管的燃料分配\u003cspan class=\"cite\">机岛 9.4.4.6\u003c/span>：\u003c/p>\n\u003cul>\n\u003cli>模式 4：初始加载阶段。只有 PM1 和 PM3 进燃气，VGC-2 和 VGC-4 关闭，PM2 和 AFS 用空气吹扫\u003c/li>\n\u003cli>模式 6.2：低负荷。PM1、PM2、PM3 进燃气，VGC-4 关闭，AFS 用压气机排气吹扫（规程写「CPD 空气」，CPD 是压气机排气压力）\u003c/li>\n\u003cli>模式 6.2A：部分负荷或基本负荷。四根歧管都进燃气，清吹阀全关，排空阀全开\u003c/li>\n\u003c/ul>\n\u003cp>不进燃气的歧管要用空气吹，这就是燃料管路清吹\u003cspan class=\"cite\">见考点 6.1\u003c/span>，目的是不让燃气在管子里积聚、不让燃烧回流\u003cspan class=\"cite\">机岛 9.5.1\u003c/span>。三根可能停用的歧管各有一根清吹管：PM2 的是清吹阀 VAS-3、VAS-4 和排空阀 VAV-2，PM3 的是 VAS-5、VAS-6 和 VAV-3，AFS 的是 VAS-7、VAS-8 和 VAV-4\u003cspan class=\"cite\">机岛 9.5.1\u003c/span>。对照各模式的阀位能看出一条规律：某根歧管进燃气时，两个清吹阀关、排空阀开；不进燃气时反过来，两个清吹阀开、排空阀关\u003cspan class=\"infer\">推断：由 9.4.4.6 和 9.5.4.2 归纳\u003c/span>。道理和燃料模块的截止阀一样\u003cspan class=\"cite\">见考点 5.1\u003c/span>。进燃气时两道清吹阀把燃气和压气机来的空气隔开，中间开着排空阀，漏过来的燃气直接排走；吹扫时关上排空阀，空气才吹得进歧管\u003cspan class=\"infer\">推断：双阀隔断、中间放空的原理\u003c/span>。\u003c/p>\n\u003cp>规程另一处（9.5.4.2）写 M4 模式「主要在燃机启动或停机时使用」，和上面的「初始加载阶段」说法不同；那一处写的 M4 阀位也和上面有出入，以 DCS 逻辑为准。\u003c/p>", "sources": [{"t": "机岛规程 第 154～160 行", "lines": [[154, "3.2 轴向燃料分级 axial fuel staging"], [159, "燃料喷注在过渡段头部， 采用燃烧系统的分级燃烧， 提升了机组部分负荷效率， 降低燃料热耗， 提"], [160, "高基本负荷出力。"]]}, {"t": "机岛规程 第 194～198 行", "lines": [[194, "4.1.2.2 燃烧室概况"], [195, "燃烧室型式为 DLN2.6e 干式低氮燃烧室，为逆流分管式结构。燃烧室共有 16 个，呈圆周布置，顺"], [196, "气流方向看为逆时针排列，顶部 12 点（时钟）位置为 16 号。每个燃烧室内包括 4 路（PM1、PM2、PM3、"], [197, "AFS） 燃料管线连接喷嘴。 #3、 #4 燃烧室设有高压电极火花塞， 其余燃烧室通过点火后联焰管联通火焰。"], [198, "4 个火焰探测器为紫外线探测器，分别布置在#13、#14、#15、#16 燃烧室内。"]]}, {"t": "机岛规程 第 2264～2264 行", "lines": [[2264, "启动控制阀（VSC-1）逐渐开启，达到所需的P2点火压力。同时，PM1和PM2燃气控制阀（VGC-1和2）"]]}, {"t": "机岛规程 第 2284～2298 行", "lines": [[2284, "9.4.4.6 FSNL到FSFL的过程"], [2285, "全速空载FSNL与基本负荷之间(加载、卸载)，燃气截止阀(VGS-1)全开，燃气控制阀调节各管路之"], [2286, "间的燃料分配。 在全速空载(FSNL)至全速全载(FSFL)之间， 燃机将根据燃机负荷使用不同的燃烧模式运"], [2287, "行。"], [2288, "1) 模式 4：此模式适用于燃机初始加载阶段。M4 模式下只有 PM1 和 PM3 管路加燃气：VGC-1 和 3"], [2289, "调节燃气流量，VGC-2 和 4 关闭。空气吹扫 PM2 和 AFS 管路(VAS-3、4、7、8 打开,VAV-2、4 关"], [2290, "闭)。"], [2291, "2) 模式 6.2：此模式用于燃机低负荷。在 6.2 模式下，PM1 上，PM2 和 PM3 管路加燃气：VGC-1、"], [2292, "-2 和 3 调节燃气流量，VGC-4 关闭。AFS 管路用 CPD 空气吹扫(VAS-7、8 打开，VAV-4 关闭)。"], [2293, "3) 模式 6.2A：此模式用于燃机部分负荷或基本负荷。在 6.2A 模式下，所有燃料管路(PM1、PM2、"], [2294, "PM3、 AFS)均加燃气： VGC-1、"], [2295, "-2、"], [2296, "-3、"], [2297, "-4 调节燃气流量。 空气吹扫阀关闭， 吹扫排气阀打开(VAS-3、"], [2298, "4、5、6、7、8 关闭，VAV-2、3、4 开启)。"]]}, {"t": "机岛规程 第 2308～2310 行", "lines": [[2308, "9.4.5.3 燃机甩负荷"], [2309, "至FSNL所需的行程状态。"], [2310, "如果燃机甩负荷，关闭PM3和AFS的燃气控制阀（VGC-3&4），PM1和PM2的燃气控制阀（VGC-1&2）关"]]}, {"t": "机岛规程 第 2346～2352 行", "lines": [[2346, "当燃机转速大于95%TNH时， 部分抽出的压气机排气经冷却后吹扫未投入使用的燃气喷嘴流道， 防止"], [2347, "燃气管道中形成燃气积聚和燃烧回流，同时保持燃气管道处于热状态，以防止管道中形成凝结水。"], [2348, "一个吹扫空气冷却器HX-4-2；"], [2349, "一个通向PM2歧管的清吹管路 （清吹阀VAS-3和VAS-4以及排空阀VAV-2） ；"], [2350, "一个通向PM3歧管的清吹管路 （清吹阀VAS-5和VAS-6以及排空阀VAV-3） ；"], [2351, "一个同向AFS歧管的清吹管路(清"], [2352, "吹阀VAS-7和VAS-8以及排空阀VAV-4)；在PM2、PM3和AFS清吹管路腔室之间分别设有冗余压力变送器"]]}, {"t": "机岛规程 第 2410～2428 行", "lines": [[2410, "9.5.4.2 系统运行"], [2411, "1) 机组启动前和加速过程中，清吹阀关闭，排空阀打开。"], [2412, "2) 在正常的气体燃料运行期间，当燃气轮机转速高于95%时，所有未加燃料的回路都需进行吹扫。"], [2413, "3) 在M3模式期间，PM1和PM2管路加燃料，PM3和AFS管路不加燃料。关闭吹扫阀20VAS-3、20VAS-4"], [2414, "，开启排气阀VAV-2。开启吹扫阀20VAS-5、20VAS-6、20VAS-7、20VAS-8，关闭排气阀VAV-3、"], [2415, "VAV-4。这种模式主要在燃机启动或时使用。"], [2420, "4) M4模式，PM1和PM3管路加燃料，PM2和AFS管路不加燃料。开启吹扫阀20VAS-3、20VAS-4，开启"], [2421, "排气阀VAV-2。开启吹扫阀VAS-5、VAS-6、VAS-7、VAS-8，关闭排气阀VAV-3、VAV-4。这种模式"], [2422, "主要在燃机启动或停机时使用。"], [2423, "5) 在M6.2模式期间，PM1、PM2、PM3管路加燃料，AFS管路不加燃料。关闭吹扫阀VAS-3、VAS-4、"], [2424, "VAS-5、VAS-6，开启排气阀VAV-2、VAV-3。开启吹扫阀VAS-7、VAS-8，关闭排气阀VAV-4。这种"], [2425, "模式主要是在燃机低负荷运行时使用。"], [2426, "6) 在M6.2A模式期间， PM1、 PM2、 PM3、 AFS管路均加燃料。 所有吹扫阀VAS-3、 VAS-4、 VAS-5、 20VAS-6"], [2427, "、VAS-7、VAS-8关闭，所有排气阀VAV-2、VAV-3、VAV-4开启。当燃机在部分负荷和基本负荷下"], [2428, "工作时，使用此模式。"]]}, {"t": "机岛规程 第 1244～1245 行", "lines": [[1244, "3) 点火变压器带电，#3、#4燃烧室点火，火焰探测器检测到火焰信号，燃机点火成功进入Mode 3S"], [1245, "燃烧模式。"]]}, {"t": "机岛规程 第 1258～1259 行", "lines": [[1258, "4) 转速升至约68%TNH（2040rpm），DLN Mode由M3S转换为M4S燃烧模式。此时，PM2和AFS燃料管路"], [1259, "的清吹阀开启正确，检查压气机排气温度、压力正常，清吹冷却空气温度正常。"]]}], "cards": ["D:5.4-4", "D:5.4-3", "D:5.4-2", "D:5.4-5", "D:5.4-6", "D:5.4-1", "D:5.4-8", "D:5.4-7"]}, "5.5": {"id": "5.5", "name": "停机、跳机和甩负荷时燃料阀怎么动", "cat": "五", "gist": "正常停机：到熄火转速关 VGC-1、2 熄火，再关 VGS-1、VS4-1、VS4-4，打开 P1X、P2 腔的通风阀，P1 腔的通风阀 VA13-25 保持关。跳机：所有阀回到故障安全位置，燃料阀全关，P1、P1X、P2 三个腔的通风阀都打开。甩负荷：关 PM3、AFS 的 VGC-3、4（规程这一条原文不完整）。", "reg": "机岛 9.4.5、5.2、8.5.2", "lecture": "\u003cp>这个考点讲燃料阀怎么把燃气断掉。规程按正常停机、跳机、甩负荷三种情况分别写\u003cspan class=\"cite\">机岛 9.4.5\u003c/span>。最容易混的，是 P1 腔\u003cspan class=\"cite\">见考点 5.1\u003c/span>的通风阀 VA13-25 开不开。\u003c/p>\n\u003cp>正常停机时，燃机先按卸载顺序减到全速空载（FSNL），然后逐渐减小燃气流量，让转速降下来。到熄火转速时，关闭燃气控制阀 VGC-1 和 2，燃机熄火。随后关闭燃气截止阀 VGS-1、辅助截止阀 VS4-1 和安全切断阀 VS4-4，打开 VA13-200 和 VA13-15，排空 P1X 腔和 P2 腔。P1 腔的通风阀 VA13-25 保持关闭\u003cspan class=\"cite\">机岛 9.4.5.1\u003c/span>。熄火转速是多少，规程没写。\u003c/p>\n\u003cp>跳机时，所有阀门回到故障安全位置：VS4-4、VS4-1、VGS-1 关闭，燃气控制阀关闭，VSC-1 在点火或启动阶段跳闸时也关闭；P1、P1X、P2 三个腔的通风阀 VA13-25、VA13-200、VA13-15 全部打开，把三个腔排空\u003cspan class=\"cite\">机岛 9.4.5.2\u003c/span>。紧急停机操作里也要检查 P1 腔放空阀打开，排空残留的燃气\u003cspan class=\"cite\">机岛 8.5.2\u003c/span>。\u003c/p>\n\u003cp>两种情况的差别就在 VA13-25，规程没写原因，可以这样理解。正常停机是有准备的，燃料系统本身没毛病。VS4-4 和 VS4-1 一关，P1 腔里就封着一段带压的燃气；P1X 腔的通风阀开着，VS4-1 就算漏一点，燃气也从 P1X 腔排走，进不了燃机。这时再把 P1 腔排空，只是白白往大气里放一腔燃气，下次启动还得重新充\u003cspan class=\"infer\">推断：由 9.4.5.1 的阀位推出\u003c/span>。题库一道原题给 VA13-25 保持关闭的理由也是「避免向大气中排放大量燃气」，不过它说的是跳闸的情况，见最后一段\u003cspan class=\"cite\">题库 RJ-e6257906\u003c/span>。\u003c/p>\n\u003cp>跳机不一样。跳机可能正是燃料系统出了故障引起的，比如阀门卡涩、内漏，这时不能指望哪一道阀一定关严。所有阀失去指令，回到最保守的位置：截止阀全关，三个腔全部通大气，每一道关着的阀两侧都没有压差，燃气最难漏进燃机\u003cspan class=\"infer\">推断：由「故障安全位置」推出\u003c/span>。\u003c/p>\n\u003cp>规程几处对这些阀的叫法不一样。紧急停机操作写的是「辅助关断阀 VS4-1，燃气截止阀 VS4-4，燃气关断阀 GSV-1，燃气控制阀 GCV-1/2/3/4」\u003cspan class=\"cite\">机岛 8.5.2\u003c/span>。这里的「燃气截止阀」指 VS4-4，和设备表里叫燃气截止阀的 VGS-1 不是一个阀；GSV-1 应就是 VGS-1，GCV 就是 VGC\u003cspan class=\"infer\">推断：由阀名和编号对照\u003c/span>。\u003c/p>\n\u003cp>燃料管路清吹\u003cspan class=\"cite\">见考点 6.1\u003c/span>的阀在跳机时也回到故障安全位置：失去命令信号，清吹阀关闭，排空阀打开\u003cspan class=\"cite\">机岛 9.5.4.2\u003c/span>。道理一样，失电失信号时，隔断燃气的阀关、放空的阀开\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>甩负荷时，关闭 PM3 和 AFS 的燃气控制阀 VGC-3 和 4\u003cspan class=\"cite\">机岛 9.4.5.3\u003c/span>。这一条原文语序是乱的，前面还有半句「至 FSNL 所需的行程状态」，拼起来应是 VGC-1、VGC-2 关到全速空载所需的开度\u003cspan class=\"infer\">推断：由原文残句拼出\u003c/span>。甩负荷是机组带着负荷时出口开关突然跳开，负荷一下没了，燃料不马上减下来转速就会飞升；全速空载只要很少的燃料，所以留 PM1、PM2 两路，其余两路直接关掉\u003cspan class=\"infer\">推断：甩负荷的一般含义\u003c/span>。\u003c/p>\n\u003cp>题库有一处和规程不一样。原题说燃机「非安全」跳闸时只打开燃气模块的通风阀，VA13-25 保持关闭\u003cspan class=\"cite\">题库 RJ-e6257906\u003c/span>。规程 9.4.5.2 写跳机时三个腔的通风阀都打开，没有按跳闸种类区分，以本厂规程为准。\u003c/p>", "sources": [{"t": "机岛规程 第 1735～1735 行", "lines": [[1735, "8.5.2 紧急停机操作"]]}, {"t": "机岛规程 第 1751～1752 行", "lines": [[1751, "(8) 检查辅助关断阀 VS4-1，燃气截止阀 VS4-4，燃气关断阀 GSV-1，燃气控制阀 GCV-1/2/3/4 迅"], [1752, "速关闭，燃料流量到零；P1 腔放空阀打开，排空残留的气体燃料。"]]}, {"t": "机岛规程 第 2163～2171 行", "lines": [[2163, "9.4.2 设备规范"], [2164, "代码 描述 阀型 说明"], [2165, "VS4-4 安全切断阀 气动 防止气体燃料流入气体控制橇"], [2166, "VA13-25 安全切断通风阀 气动 P1 腔室进行减压"], [2167, "VS4-1 辅助截止阀 气动 切断气体燃料，使下游设备与气体供应隔离"], [2168, "VA13-200 P1X 腔通风阀 气动 排出 P1X 腔室的气体"], [2169, "VGS-1 燃气截止阀 气动 快速关闭流向燃烧系统的气体燃料"], [2170, "VSC-1 启动控制阀 气动 在启动时调节下游压力"], [2171, "VA13-15 P2 腔通风阀 气动 排出 P2 腔室的气体"]]}, {"t": "机岛规程 第 2299～2310 行", "lines": [[2299, "9.4.5 系统停运"], [2300, "9.4.5.1 燃机正常停机"], [2301, "按照卸载顺序燃机处于FSNL状态。 逐渐减小燃气流量以降低燃机速度。 当达到熄火转速时， 关闭燃"], [2302, "气控制阀VGC-1和2以熄火。 关闭燃气截止阀VGS-1、 辅助截止阀VS4-1和安全关断阀VS4-4， 排空P1x、 P2"], [2303, "腔(VA13-200和VA13-15开启)。P1排气阀(VA13-25)保持关闭。"], [2304, "9.4.5.2 燃机跳机"], [2305, "在燃机跳闸时，所有阀门均返回故障安全位置：燃气截止阀VS4-4、VS4-1、VGS-1、VSC-1(若点火/"], [2306, "启动阶段跳闸)、VGC关闭。P1、P1x和P2腔排气阀（VA13-25,VA13-200和VA13-15）是开启的，以排空腔"], [2307, "室。"], [2308, "9.4.5.3 燃机甩负荷"], [2309, "至FSNL所需的行程状态。"], [2310, "如果燃机甩负荷，关闭PM3和AFS的燃气控制阀（VGC-3&4），PM1和PM2的燃气控制阀（VGC-1&2）关"]]}, {"t": "机岛规程 第 2429～2431 行", "lines": [[2429, "7) 当燃气轮机停机信号启动时， 当汽轮机转速降至95%以下时， 清吹停止， 清吹阀关闭， 排空阀打"], [2430, "开。如果燃气轮机跳闸，清吹空气系统的阀门将进入其故障安全位置：由于失去将阀门置于所"], [2431, "需位置的命令信号，清吹阀关闭，排空阀打开。"]]}], "cards": ["D:5.5-3", "RJ-std007", "D:5.5-2", "RJ-e6257906", "D:5.5-6", "D:5.5-4", "D:5.5-7", "D:5.5-5", "D:5.5-1"]}, "5.6": {"id": "5.6", "name": "燃料系统的保护", "cat": "五", "gist": "点火前 P2 压力高，禁止点火并跳闸；点火后到暖机结束，P2 压力过低或过高跳闸；燃气控制阀指令与反馈偏差大于 2% 报警、大于 5% 跳闸；PM2、PM3、AFS 环管温度大于约 427 ℃（800 ℉）跳闸；启动燃料流量过大跳闸；P1 压力低于 3068 kPa 报警。清吹信用阀状态不对、P1X 带压时清吹信用压力高，也会跳机。几处定值在保护定值表和跳闸清单里写法不同。", "reg": "机岛 9.4.3.1、5.2（第 4、12、17 项）、5.4（第 11 项）", "lecture": "\u003cp>燃料系统的保护写在两处：设备保护定值表\u003cspan class=\"cite\">机岛 9.4.3.1\u003c/span>和跳闸清单第 4 项「燃烧器燃料跳闸」\u003cspan class=\"cite\">机岛 5.2\u003c/span>。下面一条条说它在防什么。异常处理\u003cspan class=\"cite\">见考点 5.8\u003c/span>。\u003c/p>\n\u003cp>规程里的 psi 是英制压力单位「磅每平方英寸」，psig 指表压，规程两种写法混用，这里都按表压理解\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>P2 压力，点火前。P2 腔\u003cspan class=\"cite\">见考点 5.1\u003c/span>是燃气控制阀前面那一段。点火前 P2&gt;6Psi（约 41 kPa\u003cspan class=\"conv\">换算\u003c/span>）且点火条件不满足，延时 5s 跳闸，规程叫它「点火前 P2 压力高，点火禁止」\u003cspan class=\"cite\">机岛 9.4.3.1\u003c/span>。点火前 VGS-1、VSC-1 都关着，P2 本来不该有压力；压力起来了，说明有燃气漏进来，没点火就进了燃烧室和排气通道，点火时可能爆燃。名字叫点火禁止、动作是跳闸：这时跳闸就是中止启动、关掉所有燃料阀，火也就点不了\u003cspan class=\"infer\">推断：由点火前的阀门状态推出\u003c/span>。\u003c/p>\n\u003cp>P2 压力，点火后。从点火到暖机结束，P2&lt;28Psi（约 193 kPa\u003cspan class=\"conv\">换算\u003c/span>）延时 15S 跳闸，P2&gt;43.75Psi（约 302 kPa\u003cspan class=\"conv\">换算\u003c/span>）延时 5S 跳闸\u003cspan class=\"cite\">机岛 9.4.3.1\u003c/span>。启动时 P2 由 VSC-1 按转速调出来\u003cspan class=\"cite\">见考点 5.3\u003c/span>，偏离太多说明燃料量不对：太低可能熄火，太高热部件会超温。燃料多比燃料少来得危险，所以压力高的延时短\u003cspan class=\"infer\">推断\u003c/span>。「暖机」是点火后用较小燃料量让热部件慢慢升温的一段，规程没写何时算结束\u003cspan class=\"infer\">推断\u003c/span>。跳闸清单对这条的写法是暖机压力参考值的 125% 和 80%\u003cspan class=\"cite\">机岛 5.2\u003c/span>，28 和 43.75 正好是同一个数的 80% 和 125%，两处应是同一条保护的两种写法，以 DCS 逻辑为准\u003cspan class=\"infer\">推断：由两组定值反算\u003c/span>。\u003c/p>\n\u003cp>燃气控制阀，也就是跳闸清单里的 GCV\u003cspan class=\"cite\">见考点 5.1\u003c/span>。指令与反馈偏差大于 2%，延时 2s 报阀位波动；偏差大于 5%，延时 5s 跳闸\u003cspan class=\"cite\">机岛 9.4.3.1\u003c/span>。控制阀允许动作时通讯故障、DVP（数字阀门定位器）执行器报故障，也延时 5s 跳闸\u003cspan class=\"cite\">机岛 5.2\u003c/span>。阀位跟不上指令，各歧管实际进的燃气就和控制系统算的不一样，预混燃烧可能不稳、熄火或局部过热\u003cspan class=\"infer\">推断：由 DLN 燃烧的特点推出\u003c/span>\u003cspan class=\"cite\">见考点 5.4\u003c/span>。\u003c/p>\n\u003cp>歧管温度。PM2、PM3、AFS 的天然气环管温度 FTG4A/B、FTG5A/B、FTG6A/B 任一高于约 427 ℃\u003cspan class=\"conv\">换算自 800 ℉\u003c/span>，延时 5s 跳闸\u003cspan class=\"cite\">机岛 5.2\u003c/span>。这三根歧管不进燃气时要用压气机排气吹扫，吹扫空气先经清吹冷却器从 510℃ 降到 260℃\u003cspan class=\"cite\">机岛 9.5.2\u003c/span>。歧管温度比这还高得多，多半是燃烧室的热燃气倒流进了歧管，歧管里有燃气时就可能在管内烧起来、烧坏喷嘴\u003cspan class=\"infer\">推断：由 9.5.1 燃料管路清吹防「燃烧回流」推出\u003c/span>。这几个测点在自动停机清单里叫清吹温度传感器：某一路在做燃料管路清吹，而它的 A、B 测点都坏了，延时 60min 自动停机\u003cspan class=\"cite\">机岛 5.4\u003c/span>。\u003c/p>\n\u003cp>引燃腔压力。火焰检测成功后，点火腔 2 压力 96PGT-2A/B＞43.5psig（约 300 kPa\u003cspan class=\"conv\">换算\u003c/span>），延时 10s 跳闸\u003cspan class=\"cite\">机岛 5.2\u003c/span>。有火以后引燃支路应该已经关闭排空\u003cspan class=\"cite\">见考点 5.3\u003c/span>，这里还憋着压，说明引燃的阀没关严\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>阀位故障。点火前没有火焰时，燃气辅助关断阀（VS4-1）有开指令却没有反馈，跳闸\u003cspan class=\"cite\">机岛 9.4.3.1\u003c/span>。阀到底开没开确认不了，就不能往下点火\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>启动燃料流量过大。条件是不在泄漏试验过程中、暖机未结束，且 SRV 开度&gt;20%，跳闸\u003cspan class=\"cite\">机岛 9.4.3.1\u003c/span>。启动阶段燃料本该很少，多了点火易爆燃、升速易超温\u003cspan class=\"infer\">推断\u003c/span>。SRV 是速比阀，GE 较早机型用它按转速调控制阀前的压力，作用相当于本机的 VSC-1；本机设备表里没有速比阀，这条和「速比阀阀位故障跳闸」可能是旧模板留下的，以 DCS 逻辑为准\u003cspan class=\"infer\">推断：由 9.4.2 设备表推出\u003c/span>。\u003c/p>\n\u003cp>P1 压力。P1 腔压力 96FG-1 低于 3068.275kpa（约 3.07 MPa\u003cspan class=\"conv\">换算\u003c/span>）报警\u003cspan class=\"cite\">机岛 9.4.3.1\u003c/span>。来气压力低，控制阀全开也送不够燃料，所以先报警\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>清吹信用系统\u003cspan class=\"cite\">见考点 5.1\u003c/span>。跳闸条件有三条\u003cspan class=\"cite\">机岛 5.2\u003c/span>：\u003c/p>\n\u003cul>\n\u003cli>VIS-1 和 VIS-2，或 VIS-1 和 VIS-3，没有开指令却不在关位，延时 6s；\u003c/li>\n\u003cli>VIS-1 有开指令，同时 VIS-2 或 VIS-3 有开指令，同时 VS4-1 有开指令、或在做泄漏试验、或点火允许，延时 6s；\u003c/li>\n\u003cli>P1X＞58Psig（约 400 kPa\u003cspan class=\"conv\">换算\u003c/span>）时，两个清吹信用压力 96PC_1A/B 都＞29psig（约 200 kPa\u003cspan class=\"conv\">换算\u003c/span>），或都故障，或一个超限一个故障。\u003c/li>\n\u003c/ul>\n\u003cp>VIS 阀只在吹扫免除操作期间打开，燃机运行期间关闭\u003cspan class=\"cite\">机岛 9.4.2\u003c/span>。前两条防的是燃气要进来了，空气通路还开着，燃气会窜进清吹信用管路。第三条是 P1X 腔已有燃气，清吹信用管路却有压力，说明燃气已经漏进这条管路\u003cspan class=\"infer\">推断：由 VIS 阀的用途推出\u003c/span>。\u003c/p>", "sources": [{"t": "机岛规程 第 372～385 行", "lines": [[372, "4 Combustion Gas Fuel Trip(燃烧器燃料跳闸)"], [373, "（1） 火焰检测成功后，点火腔 2 压力(96PGT-2A/B)＞43.5psig，延时 10s"], [374, "（2） 无点火允许,燃机启动允许或转速＜14%且非泄漏试验且吹扫信用空气系统可用时， 气体燃"], [3
