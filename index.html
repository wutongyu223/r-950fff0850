<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>燃机学习 · 燃料系统</title><style>/* 版式：仿 Word 文档。灰色桌面上一张白纸，正文用 Word 默认中文字体，标题用 Word「标题」样式的蓝色。 */
:root{
  --desk:#e9e9e9; --paper:#fff; --ink:#1f1f1f; --text:#262626; --mute:#6e6e6e; --faint:#a6a6a6;
  --rule:#d9d9d9; --title:#2f5496; --blue:#2b579a; --blue-2:#dce6f4; --shade:#f2f2f2;
  --hl:#fff2cc; --hl-edge:#e2c46b; --ok:#2e7d32; --ok-bg:#e8f3e9; --bad:#c62828; --bad-bg:#fbeaea;
  --note:#595959;
  --body:"DengXian","等线","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",sans-serif;
  --head:"DengXian Light","等线 Light","DengXian","Microsoft YaHei","PingFang SC",sans-serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:var(--desk)}
body{margin:0;background:var(--desk);color:var(--text);font:16.5px/1.85 var(--body);letter-spacing:.01em}
a{color:var(--blue);text-decoration:none}
a:hover{text-decoration:underline}

/* 顶栏：像 Word 的标题栏，一条细细的蓝 */
header.top{position:sticky;top:0;z-index:6;background:var(--blue);color:#fff;height:44px;display:flex;align-items:center;justify-content:center;padding:0 16px}
header.top h1{margin:0;font:600 15px/1 var(--body);letter-spacing:.04em}
#readbar{position:fixed;top:44px;left:0;height:3px;background:#8fb0e0;z-index:6;width:0;transition:width .15s}

/* 纸 */
main{max-width:820px;margin:24px auto 96px;background:var(--paper);min-height:70vh;padding:56px 72px 64px;box-shadow:0 0 0 1px #d6d6d6,0 2px 8px rgba(0,0,0,.08)}
@media (max-width:720px){main{margin:0 0 72px;padding:22px 20px 40px;box-shadow:none;min-height:calc(100vh - 44px)}}

/* 标题样式：标题 1 / 标题 2 / 标题 3 */
.kptitle,.card.done h2{font:400 26px/1.35 var(--head);color:var(--title);margin:0 0 6px}
h2.sec{font:400 22px/1.4 var(--head);color:var(--title);margin:36px 0 10px;padding-bottom:4px;border-bottom:1px solid var(--rule)}
.cat h3,main>h3{font:600 17px/1.5 var(--body);color:var(--title);margin:26px 0 6px}
.lecture h4{font:600 17px/1.5 var(--body);color:var(--title);margin:1.4em 0 .4em}
.crumb{color:var(--mute);font-size:13px;letter-spacing:.03em}

/* 正文段落 */
.lecture p{margin:0 0 .9em;text-align:justify}
.lecture ul,.lecture ol{margin:.3em 0 1em;padding-left:1.6em}
.lecture li{margin:.25em 0}
.lecture li::marker{color:var(--mute)}
/* 出处像脚注标号：小、灰 */
.cite{color:var(--faint);font-size:12px;margin:0 1px;white-space:nowrap}
.cite::before{content:"〔"}.cite::after{content:"〕"}
/* 推断、原理：像 Word 的批注，斜体灰字，前面标个小签 */
.infer{color:var(--note);font-style:italic;font-size:13.5px;margin:0 2px}
.infer::before{content:"【注】";font-style:normal;color:var(--faint);font-size:12px}
.conv{color:var(--faint);font-size:12px;margin-left:2px}

/* 「要能说出」：像 Word 里加了底纹的段落 */
.gist{background:var(--shade);border-left:3px solid var(--title);padding:10px 14px;margin:14px 0 22px;font-size:15px;line-height:1.8}
.lbl{display:inline-block;font-size:12px;font-weight:700;color:var(--mute);margin-right:8px;letter-spacing:.06em}
.gist .lbl{color:var(--title)}

/* 首页 */
.hero{display:block;border:1px solid var(--rule);border-left:4px solid var(--blue);padding:14px 18px;margin:0 0 12px;color:var(--ink);text-decoration:none;background:#fff}
.hero:hover{background:#f7f9fc;text-decoration:none}
.hero-t{font:400 21px/1.4 var(--head);color:var(--title)}
.hero-s{color:var(--mute);font-size:14px;margin-top:2px}
.bar{height:4px;background:#e6e6e6;margin-top:10px}.bar i{display:block;height:100%;background:var(--blue)}
.stats{display:flex;border:1px solid var(--rule);margin:14px 0}
.stats div{flex:1;text-align:center;padding:10px 4px}
.stats div+div{border-left:1px solid var(--rule)}
.stats b{display:block;font:400 22px/1.3 var(--head);color:var(--ink)}
.stats span{font-size:12.5px;color:var(--mute)}
.how p{margin:.5em 0;font-size:15px}

/* 目录：像 Word 自动生成的目录，前导点 */
.kplist{list-style:none;margin:0 0 6px;padding:0}
.kplist a{display:flex;align-items:baseline;gap:6px;padding:5px 0;color:var(--text);text-decoration:none}
.kplist a:hover{color:var(--blue)}
.kplist .kpn{flex:0 1 auto}
.kplist .dots{flex:1 1 20px;border-bottom:1px dotted var(--faint);transform:translateY(-4px);min-width:16px}
.kplist small{flex:0 0 auto;color:var(--mute);font-size:13px;white-space:nowrap}
.kplist small.read{color:var(--ok)}
.kplist small.part{color:var(--blue)}

/* 刷题 */
.flowhead{display:flex;justify-content:space-between;color:var(--mute);font-size:13px;margin:-6px 0 14px;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.banner{color:var(--title);font-size:14px;margin:0 0 10px}
.banner.new{display:inline-block;background:var(--hl);color:#7a5a00;padding:1px 8px;font-weight:600}
.card{margin:0 0 8px}
.card.lec{margin-top:6px}
.card.done{text-align:center;padding:40px 0}
.card.done .btn{margin:6px}
.meta{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:6px;font-size:12.5px;color:var(--mute)}
.pill{letter-spacing:.04em}
.pill.orig::before{content:"■ ";color:#c9a227}
.pill.drill::before{content:"■ ";color:var(--blue)}
.pill+.pill::before{content:"｜";color:var(--faint);margin-right:6px}
.stem{font-size:18px;line-height:1.8;color:var(--ink);white-space:pre-wrap}
.opts{margin:12px 0 0;display:flex;flex-direction:column}
.opt{display:block;width:100%;text-align:left;font:inherit;font-size:16.5px;line-height:1.7;background:none;color:var(--text);border:0;border-bottom:1px solid #eee;padding:9px 6px;cursor:pointer}
.opt b{font-weight:600;color:var(--mute)}
.opt:hover{background:#f7f9fc}
.opt.sel{background:var(--blue-2)}
.opt.right{background:var(--ok-bg)}.opt.right b{color:var(--ok)}
.opt.wrong{background:var(--bad-bg)}.opt.wrong b{color:var(--bad)}

/* 按钮：Word 那种方方正正的按钮 */
.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.btn{display:inline-block;font:inherit;font-size:15px;line-height:1.4;border:1px solid var(--blue);border-radius:2px;padding:8px 18px;background:var(--blue);color:#fff;text-decoration:none;cursor:pointer}
.btn:hover{background:#1e4379;text-decoration:none}
.btn.ghost{background:#fff;color:var(--blue);border-color:#8a8886}
.btn.ghost:hover{background:#f3f2f1}
.btn.bad{background:var(--bad);border-color:var(--bad)}
.btn.on{background:var(--ok);border-color:var(--ok)}
.actions.sticky{position:sticky;bottom:58px;background:linear-gradient(transparent,#fff 30%);padding:18px 0 6px;margin:0}

/* 答案：分隔线下面，像正文后面的「答案」一节 */
.answer{margin-top:18px;border-top:1px solid var(--rule);padding-top:12px}
.answer>div{margin:8px 0}
.ans{white-space:pre-wrap;color:var(--ink)}
.verdict{font-weight:600}.verdict.ok{color:var(--ok)}.verdict.bad{color:var(--bad)}
.why{white-space:pre-wrap;font-size:16px}
/* 本厂规程：像 Word 里用荧光笔标过的段落 */
.plant{background:var(--hl);border-left:3px solid var(--hl-edge);padding:8px 12px;font-size:15.5px}
.plant .lbl{color:#7a5a00}
.kplink{display:inline-block;margin-top:4px;font-size:15px}

/* 折叠块：规程原文、怎么用、题目列表 */
details{margin:12px 0}
summary{cursor:pointer;color:var(--blue);font-size:15px;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"▸ ";color:var(--faint)}
details[open]>summary::before{content:"▾ "}
.src-item{margin-top:8px}.src-t{font-size:12.5px;color:var(--mute)}
.src-block pre{white-space:pre-wrap;font:14px/1.75 "FangSong","仿宋","STFangsong",var(--body);color:#333;background:#fafafa;border:1px solid #eee;padding:10px 12px;margin:4px 0;overflow-x:auto}
.qitem{border-bottom:1px solid #eee;margin:0;padding:6px 0}
.qitem summary{color:var(--text)}
.qitem .card{padding:8px 0 4px 16px}

/* 词条 */
.terms{font-size:14px;color:var(--mute)}
.chip{font:inherit;font-size:13px;border:0;border-bottom:1px dashed var(--blue);background:none;color:var(--blue);padding:0 2px;margin:0 6px 0 0;cursor:pointer}
.termbody{margin-top:6px;font-size:15px;color:var(--text);background:var(--shade);padding:6px 10px}
.termbody:empty{display:none}
.src{color:var(--faint);font-size:12.5px}
.term{padding:10px 0;border-bottom:1px solid #eee}
.term h3{margin:0 0 2px;font:600 16px/1.5 var(--body);color:var(--title)}
.term p{margin:0}
.hint{color:var(--mute);font-size:14.5px}

/* 讲解页：已读按钮、继续阅读提示 */
.readbox{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:28px 0 8px;padding-top:14px;border-top:1px solid var(--rule);color:var(--mute);font-size:14px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:10px;border:1px solid var(--rule);border-left:4px solid #c9a227;padding:10px 14px;margin:0 0 12px;font-size:14.5px}
.resume b{font-weight:600;color:var(--ink)}
.back{display:inline-block;margin:0 0 10px;font-size:14px}
.row{display:block;margin:12px 0}
select{font:inherit;padding:3px 8px;border:1px solid #8a8886;border-radius:2px;background:#fff;color:var(--ink)}

/* 底部导航：白底，选中项蓝色下划线 */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;display:flex;justify-content:center;background:#fff;border-top:1px solid #d6d6d6;padding-bottom:env(safe-area-inset-bottom)}
nav.tabs a{flex:0 1 160px;text-align:center;padding:11px 0 9px;color:var(--mute);font-size:14.5px;border-bottom:2px solid transparent;text-decoration:none}
nav.tabs a.on{color:var(--blue);border-bottom-color:var(--blue);font-weight:600}
#toast{position:fixed;left:50%;bottom:74px;transform:translateX(-50%);background:#323130;color:#fff;padding:7px 16px;border-radius:2px;font-size:14px;opacity:0;transition:opacity .2s;pointer-events:none;z-index:9}
#toast.show{opacity:.95}
#totop{position:fixed;right:16px;bottom:72px;z-index:6;width:38px;height:38px;border:1px solid #c8c6c4;background:#fff;color:var(--mute);font-size:18px;line-height:36px;text-align:center;cursor:pointer;display:none}
#totop.show{display:block}
.resume .btn,.readbox .btn{white-space:nowrap;flex:0 0 auto}
/* 讲解页：顶部小导航、底部上一篇下一篇 */
.topnav{display:flex;justify-content:space-between;gap:12px;font-size:14px;margin:0 0 12px}
.pager{display:flex;justify-content:space-between;gap:12px;margin:18px 0 26px}
.pager a{flex:1 1 0;display:block;border:1px solid var(--rule);padding:10px 14px;color:var(--ink);text-decoration:none;font-size:15px;line-height:1.5}
.pager a:hover{border-color:var(--blue);background:#f7f9fc}
.pager a small{display:block;color:var(--mute);font-size:12px}
.pager .next{text-align:right}
/* 同步面板 */
.syncbox{margin:22px 0;padding-top:12px;border-top:1px solid var(--rule)}
.syncbox .row{display:flex;align-items:center;gap:8px;margin:8px 0}
.syncbox .lbl{width:48px;flex:0 0 48px}
.inp{flex:1;min-width:0;font:inherit;font-size:15px;padding:6px 8px;border:1px solid #8a8886;border-radius:2px;background:#fff;color:var(--ink)}
.inp.short{flex:0 1 180px}
</style></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div><noscript>请启用 JavaScript。</noscript><script type="application/json" id="data">{"title": "燃机学习 · 燃料系统", "sync": {"base": "https://gt-sync-1279.pages.dev"}, "storageKey": "gt-study-v1", "packName": "燃料系统", "cats": [{"id": "一", "name": "天然气本身（公用 4.1.2）", "kps": ["1.1", "1.2"]}, {"id": "二", "name": "调压站的设备（公用 4.1.1、4.2）", "kps": ["2.1", "2.2", "2.3", "2.4", "2.5", "2.6", "2.7", "2.8"]}, {"id": "三", "name": "调压站的运行和燃气安全（公用 4.3～4.5、10.10；机岛 9.8）", "kps": ["3.1", "3.2", "3.3", "3.4", "3.5", "3.6", "3.7", "3.8"]}, {"id": "四", "name": "前置模块（机岛 9.3）", "kps": ["4.1", "4.2", "4.3"]}, {"id": "五", "name": "燃料模块（机岛 9.4、5.2）", "kps": ["5.1", "5.2", "5.3", "5.4", "5.5", "5.6", "5.7", "5.8"]}, {"id": "六", "name": "清吹（机岛 9.5、6.5.1.2）", "kps": ["6.1", "6.2", "6.3"]}, {"id": "七", "name": "规程之外", "kps": ["7.1", "7.2"]}], "kps": {"1.1": {"id": "1.1", "name": "本厂天然气的成分和热值", "cat": "一", "gist": "本厂天然气里甲烷占 93.56 mol%，其余主要是乙烷和丙烷；按 20 ℃ 计量，高位热值 39.322 MJ/m³，低位热值 35.496 MJ/m³，华白数 50.877 MJ/m³。题库还考：影响燃机效率的是低位热值；华白数等于热值除以相对密度的平方根；热耗率、气耗率、标煤耗怎么换算。", "reg": "公用 4.1.2、表 1", "lecture": "\u003cp>本厂烧的天然气，主要成分是甲烷，另外含有乙烷、丙烷、丁烷等烃类气体，以及氮、二氧化碳、硫化氢、水蒸气等非烃类气体\u003cspan class=\"cite\">公用 4.1.2\u003c/span>。表 1 的组成用 mol%（摩尔百分数）表示，同温同压下气体的摩尔数和体积成正比，可以直接当体积百分数看\u003cspan class=\"infer\">原理：理想气体的性质\u003c/span>。\u003c/p>\n\u003cul>\n\u003cli>甲烷（CH4）93.56 mol%\u003c/li>\n\u003cli>乙烷（C2H6）4.18 mol%\u003c/li>\n\u003cli>丙烷（C3H8）1.42 mol%\u003c/li>\n\u003cli>氮气 0.38 mol%；丁烷、戊烷很少；氢、氧、二氧化碳、硫化氢都是 0\u003c/li>\n\u003c/ul>\n\u003cp>不是烃类的只有 0.38 mol% 的氮气\u003cspan class=\"cite\">公用 表 1\u003c/span>。题库说天然气里碳氢化合物的含量在 90% 以上\u003cspan class=\"cite\">题库 RJ-6432e245\u003c/span>，本厂来气远高于这个数。同一道题把乙烷写成了 C2H4，规程表 1 写的是 C2H6，以规程为准\u003cspan class=\"cite\">题库 RJ-6432e245\u003c/span>\u003cspan class=\"cite\">公用 表 1\u003c/span>。\u003c/p>\n\u003cp>表 1 是用气相色谱法分析的，各项指标按 20℃ 计量\u003cspan class=\"cite\">公用 表 1\u003c/span>。规程没写取样时间，来气成分会随气源变化，调压站计量单元的色谱分析仪就是分析来气组分的\u003cspan class=\"cite\">见考点 2.1\u003c/span>\u003cspan class=\"infer\">推断：规程只写了它把结果传给流量计\u003c/span>。\u003c/p>\n\u003ch4>高热值和低热值\u003c/h4>\n\u003cp>热值也叫发热量，是燃烧一定体积或质量的燃气能放出的热量\u003cspan class=\"cite\">题库 RJ-ec4eb246\u003c/span>。表 1 给了高热值 39.322 MJ/m³、低热值 35.496 MJ/m³\u003cspan class=\"cite\">公用 表 1\u003c/span>。\u003c/p>\n\u003cp>天然气里的氢烧完变成水蒸气。高热值把水蒸气凝结成水放出的热也算进去，低热值不算\u003cspan class=\"infer\">原理：高、低位热值的定义\u003c/span>。燃烧生成的水蒸气随高温排气离开燃机，这部分凝结热用不上，所以燃机算效率、算耗气量都以低位热值为基准\u003cspan class=\"infer\">原理\u003c/span>。题库说天然气品质里对燃机效率影响最大的是低位热值\u003cspan class=\"cite\">题库 RJ-a5092182\u003c/span>，意思就是衡量「烧进去多少能用的热」要用低位热值；热值高低本身主要决定要烧多少气\u003cspan class=\"infer\">推断：题目没有解释\u003c/span>。\u003c/p>\n\u003cp>题库把天然气归为高热值气体燃料，主要成分是 CH4\u003cspan class=\"cite\">题库 RJ-8f0812f6\u003c/span>；低热值气体燃料的主要成分是 CO、H2、N2\u003cspan class=\"cite\">题库 RJ-3203e596\u003c/span>。天然气热值主要在 29.8～44.7 MJ/Nm3\u003cspan class=\"cite\">题库 RJ-1f7a5d08\u003c/span>，液化石油气在 85.7～119.2 MJ/Nm3\u003cspan class=\"cite\">题库 RJ-0f72ed79\u003c/span>。\u003c/p>\n\u003ch4>m³（20℃）和 Nm³ 是不是一回事\u003c/h4>\n\u003cp>同样 1 立方米，0 ℃ 下装的气比 20 ℃ 下多约 7%\u003cspan class=\"conv\">换算：按绝对温度 293 与 273 之比\u003c/span>。Nm³ 的 N 表示「标准状态」，习惯上多指 0 ℃；本厂规程表 3 却写「334519（1atm，20℃）Nm³/h」，这里的 Nm³ 是按 20 ℃ 算的\u003cspan class=\"cite\">公用 表 3\u003c/span>。看到 Nm³ 要看它注明的温度，不能只看符号\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>题库计算题用的低位发热量是 38000 kJ/Nm³\u003cspan class=\"cite\">题库 RJ-16bc2855\u003c/span>，表 1 的低热值 35.496 MJ/m³ 换成 0 ℃ 基准约 38.1 MJ/m³\u003cspan class=\"conv\">换算：乘以 293/273\u003c/span>，两者很接近\u003cspan class=\"cite\">公用 表 1\u003c/span>。\u003c/p>\n\u003ch4>华白数有什么用\u003c/h4>\n\u003cp>华白数（规程叫沃泊指数）等于热值除以相对密度的平方根，表 1 的值是 50.877 MJ/m³\u003cspan class=\"cite\">公用 表 1\u003c/span>。用高热值 39.322 除以相对密度 0.597 的平方根，得约 50.9\u003cspan class=\"conv\">换算\u003c/span>，可见表 1 是用高热值算的\u003cspan class=\"cite\">公用 表 1\u003c/span>。\u003c/p>\n\u003cp>喷嘴前后压差不变时，燃气越轻流得越快，每秒流过的体积和相对密度的平方根成反比；送进燃烧室的热量等于体积流量乘以热值，所以正比于华白数\u003cspan class=\"infer\">原理：喷嘴流量公式\u003c/span>。因此来气成分变了，只要华白数变化不大，送进去的热量就基本不变；华白数变化大，热量和火焰偏离设计，燃烧可能不稳\u003cspan class=\"infer\">推断\u003c/span>。题库说热值变化大会引起燃烧不稳定，指的就是这件事\u003cspan class=\"cite\">见考点 2.3\u003c/span>\u003cspan class=\"cite\">题库 RJ-4bb9d488\u003c/span>。\u003c/p>\n\u003cp>题库计算题：相对密度 0.75÷1.29=0.5814，39 MJ/m3 除以它的平方根，得高华白数 51.1475 MJ/m3\u003cspan class=\"cite\">题库 RJ-da51f19a\u003c/span>。\u003c/p>\n\u003ch4>热耗率、气耗率和标煤耗\u003c/h4>\n\u003cp>热耗率是发一千瓦时（kWh，即一度）电要烧进去多少热，数越小越省\u003cspan class=\"infer\">原理\u003c/span>。一千瓦时是一千瓦持续 3600 秒，等于 3600 千焦\u003cspan class=\"infer\">原理\u003c/span>\u003cspan class=\"cite\">题库 RJ-16bc2855\u003c/span>。\u003c/p>\n\u003cp>供电效率 40%，就是烧进去的热只有 40% 变成送出的电，要送出 3600 千焦的电，得烧进去 3600÷40%=9000 kJ，这就是供电热耗率 9000 kJ/（kWh）\u003cspan class=\"cite\">题库 RJ-16bc2855\u003c/span>。热耗率等于 3600 除以效率，和效率说的是同一件事\u003cspan class=\"infer\">原理\u003c/span>\u003cspan class=\"cite\">题库 RJ-16bc2855\u003c/span>。\u003c/p>\n\u003cp>9000 kJ 除以天然气低位发热量 38000 kJ/Nm³，得供电气耗率 0.237 Nm³/（kWh）\u003cspan class=\"cite\">题库 RJ-16bc2855\u003c/span>。除以标煤热值 29270 kJ/kg，得供电标煤耗 0.307 kg/（kWh）\u003cspan class=\"cite\">题库 RJ-16bc2855\u003c/span>，折成标煤是为了和烧煤的电厂比较能耗\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>", "sources": [{"t": "公用规程 第 169～203 行", "lines": [[169, "4.1.2 设备规范"], [170, "天然气主要成分为甲烷，含有乙烷、丙烷、丁烷等烃类气体，以及氮、二氧化碳、硫化氢、水蒸气"], [171, "及微量氢、氦、氩等非烃类气体，是一种热值高、燃烧稳定、清洁环保的优质能源。在空气中的爆炸下"], [172, "限为5%、爆炸上限为15%。天然气参数见表1"], [173, "表 1 天然气参数"], [174, "项目 数值 单位"], [175, "甲烷（CH4） 93.56 mol%"], [176, "乙烷(C2H6 4.18 mol%"], [177, "丙烷(C3H8) 1.42 mol%"], [182, "异丁烷(i-C4H10) 0.22 mol%"], [183, "正丁烷(n-C4H10) 0.20 mol%"], [184, "新戊烷(neo-C5H10) 0.01 mol%"], [185, "异戊烷(i-C5H10） 0.02 mol%"], [186, "正戊烷(n-C5H10） 0 mol%"], [187, "己烷及重组份 0 mol%"], [188, "氦(He) 0 mol%"], [189, "氢(H2) 0 mol%"], [190, "氧(O2) 0 mol%"], [191, "氮气(N2) 0.38 mol%"], [192, "二氧化碳(CO2) 0 mol%"], [193, "硫化氢(H2S) 0 mol%"], [194, "高热值 39.322 MJ/m"], [196, "低热值 35.496 MJ/m"], [198, "相对密度 0.597"], [199, "密度 0.719 kg/m"], [201, "沃泊指数（华白数） 50.877 MJ/m"], [203, "注 1：检测依据 GB/T13610-20 天然气的组成分析气相色谱法，各指标剂量计算温度为 20℃。"]]}, {"t": "公用规程 第 217～220 行", "lines": [[217, "表 3 调压站总体参数"], [218, "序号 名称 数值 单位"], [219, "1 天然气系统设计流量 334519（1atm,20℃） Nm"], [220, "3/h"]]}], "cards": ["D:1.1-3", "RJ-4b9ad7a2", "D:1.1-2", "RJ-ec4eb246", "RJ-8f0812f6", "D:1.1-5", "RJ-3203e596", "RJ-da51f19a", "D:1.1-4", "RJ-1f7a5d08", "D:1.1-1", "RJ-16bc2855", "RJ-0f72ed79", "RJ-a5092182", "RJ-6432e245"]}, "1.2": {"id": "1.2", "name": "爆炸极限和着火温度", "cat": "一", "gist": "甲烷在空气中的体积浓度在 5%～15% 之间时遇火会爆炸，5% 是爆炸下限（LEL），15% 是上限。现场的可燃气体探测器和测爆仪显示的是「爆炸下限的百分之几」，显示 100% 就是体积浓度 5%。规程表 2 还列了各种气体的着火温度，甲烷约 540 ℃，乙烷约 472 ℃。", "reg": "公用 4.1.2、表 2", "lecture": "\u003cp>天然气和空气混在一起，只要浓度落在一定范围内，遇到火源就会爆炸，这个范围叫爆炸极限。规程写天然气在空气中的爆炸下限为 5%、爆炸上限为 15%\u003cspan class=\"cite\">公用 4.1.2\u003c/span>。这里的百分数是混合气里天然气所占的体积浓度\u003cspan class=\"cite\">题库 RJ-99d89302\u003c/span>。\u003c/p>\n\u003cp>为什么有上下限：燃烧要靠已经烧着的那一层放出的热，把旁边还没烧的混合气加热到能着火，火焰才能自己传下去。低于下限，燃气太稀，放出的热不够点着旁边的气；高于上限，氧气太少，同样传不下去。浓度在上下限之间，一点火，火焰就在整团混合气里迅速传开，气体受热急剧膨胀，在密闭或半密闭的空间里就是爆炸\u003cspan class=\"infer\">原理：可燃气体燃烧的一般机理，规程没写\u003c/span>。\u003c/p>\n\u003cp>规程表 2 列了各种可燃气体的爆炸极限和着火温度，和本厂有关的是这几行\u003cspan class=\"cite\">公用 表 2\u003c/span>：\u003c/p>\n\u003cul>\n\u003cli>甲烷：5.0%～15.0%，着火温度约 540℃\u003c/li>\n\u003cli>乙烷：2.9%～13.0%，约 472℃\u003c/li>\n\u003cli>丙烷：2.1%～9.5%，约 510℃\u003c/li>\n\u003cli>氢气：4.0%～75.9%，约 560℃\u003c/li>\n\u003c/ul>\n\u003cp>常听到的「下限 4%」是氢气的，甲烷是 5%\u003cspan class=\"cite\">公用 表 2\u003c/span>。乙烷、丙烷的下限比甲烷低，但本厂天然气里它们只占百分之几，规程给天然气整体写的就是甲烷的 5%～15%\u003cspan class=\"cite\">公用 4.1.2\u003c/span>。\u003c/p>\n\u003ch4>%LEL 怎么换算成体积浓度\u003c/h4>\n\u003cp>现场的可燃气体探测器和测爆仪，读数一般不是体积浓度，而是 %LEL（LEL，爆炸下限；%LEL 就是「爆炸下限的百分之几」）。甲烷测爆仪的 100% 是指甲烷在空气中的体积含量为 5%，即甲烷在空气中的爆炸下限\u003cspan class=\"cite\">题库 RJ-35f80f5a\u003c/span>。所以换算方法是：甲烷体积浓度等于 %LEL 读数乘以 5%\u003cspan class=\"infer\">原理\u003c/span>。\u003c/p>\n\u003cp>调压站可燃气体探测器的一级报警是 25%LEL，约合甲烷体积浓度 1.25%\u003cspan class=\"conv\">换算\u003c/span>，二级报警是 50%LEL，约合 2.5%\u003cspan class=\"conv\">换算\u003c/span>\u003cspan class=\"cite\">公用 4.2.2.12\u003c/span>。规程要求严重泄漏后甲烷浓度低于 5%LEL 才准进站\u003cspan class=\"cite\">公用 4.5.4.2\u003c/span>，约合体积浓度 0.25%\u003cspan class=\"conv\">换算\u003c/span>。报警值都设在离爆炸下限还很远的地方，是为了在燃气积到能爆炸之前留出查漏和处理的时间\u003cspan class=\"infer\">推断\u003c/span>。看读数时先分清是 %LEL 还是体积百分数，两者差 20 倍\u003cspan class=\"infer\">原理\u003c/span>。\u003c/p>\n\u003ch4>和机组有什么关系\u003c/h4>\n\u003cp>燃烧室里燃气和空气混合后，局部确实在可燃范围里，否则点不着\u003cspan class=\"infer\">原理\u003c/span>。但燃烧室里是稳定燃烧：燃气一边喷进来，一边在火焰处烧掉，积存的未燃混合气很少，不会一下子烧起一大团\u003cspan class=\"infer\">原理\u003c/span>。危险在于燃气进去了却没着火，比如点火失败或熄火：燃气积在燃烧室、排气通道和余热锅炉烟道里，浓度一旦进入爆炸范围，下次点火或碰到高温表面就会爆燃\u003cspan class=\"infer\">推断\u003c/span>。所以每次启动先做启动清吹，用空气把燃机和余热锅炉排气通道里可能残留的燃气吹走\u003cspan class=\"cite\">见考点 6.3\u003c/span>；罩壳里装危险气体探测器，也是为了在漏出的燃气积到爆炸下限之前发现它\u003cspan class=\"cite\">见考点 3.7\u003c/span>\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>着火温度是不用明火、混合气被加热到这个温度自己就会着起来的温度\u003cspan class=\"infer\">原理\u003c/span>。甲烷约 540℃\u003cspan class=\"cite\">公用 表 2\u003c/span>。燃机排气通道和透平缸体外表面温度很高，漏出来的燃气碰到这些热表面，没有明火也可能着火\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>甲烷浓度高了还会让人缺氧。题库写：空气中甲烷含量增加到 10% 以上时，氧的含量相对减少，人会感到氧气不足，进而可能失去知觉，直至死亡\u003cspan class=\"cite\">题库 RJ-04a9f5a8\u003c/span>。\u003c/p>\n\u003ch4>题库和规程说法不一样的地方\u003c/h4>\n\u003cp>以本厂规程为准：\u003c/p>\n\u003cul>\n\u003cli>爆炸范围：有一道题写 5%～14%\u003cspan class=\"cite\">题库 RJ-99d89302\u003c/span>。规程 4.1.2 和表 2 都是 5%～15%，题库另两道题也是 5%～15%\u003cspan class=\"cite\">题库 RJ-92d42d57\u003c/span>\u003cspan class=\"cite\">题库 RJ-b0470420\u003c/span>。\u003c/li>\n\u003cli>着火温度：题库叫它「燃点」，说甲烷 645℃\u003cspan class=\"cite\">题库 RJ-681fbb83\u003c/span>、乙烷 530℃\u003cspan class=\"cite\">题库 RJ-50b5e7c9\u003c/span>，规程表 2 写甲烷约 540℃、乙烷约 472℃\u003cspan class=\"cite\">公用 表 2\u003c/span>。「燃点」严格说多用于液体，指遇明火后能持续燃烧的最低温度；这两道题问的其实就是着火温度\u003cspan class=\"infer\">推断：从题目问法看\u003c/span>。着火温度和测试容器、压力、混合比都有关，不同资料的数差得不少，所以按本厂规程记\u003cspan class=\"infer\">原理\u003c/span>。\u003c/li>\n\u003c/ul>\n\u003cp>有两道题的题干末尾多出「甲A乙B」「氢气4%-75%」几个字，是出题时的笔记混进了题干，做题时不用管\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>", "sources": [{"t": "公用规程 第 169～172 行", "lines": [[169, "4.1.2 设备规范"], [170, "天然气主要成分为甲烷，含有乙烷、丙烷、丁烷等烃类气体，以及氮、二氧化碳、硫化氢、水蒸气"], [171, "及微量氢、氦、氩等非烃类气体，是一种热值高、燃烧稳定、清洁环保的优质能源。在空气中的爆炸下"], [172, "限为5%、爆炸上限为15%。天然气参数见表1"]]}, {"t": "公用规程 第 204～216 行", "lines": [[204, "表 2 天然气爆炸极限"], [205, "名称 爆炸极限（20℃，101.325kPa） 爆炸下限 爆炸上限"], [206, "着火温度"], [207, "氢气 4.0% 75.9% 约560℃"], [208, "一氧化碳 12.5% 74.2% 约644-658℃"], [209, "甲烷 5.0% 15.0% 约540℃"], [210, "乙炔 2.5% 80.0% 约305℃"], [211, "乙烯 2.7% 34.0% 约425℃"], [212, "乙烷 2.9% 13.0% 约472℃"], [213, "丙烷 2.1% 9.5% 约510℃"], [214, "正丁烷 1.5% 8.5% 约490℃"], [215, "异丁烷 1.8% 8.5% 约460℃"], [216, "硫化氢 4.3% 45.5% 约260℃"]]}, {"t": "公用规程 第 737～740 行", "lines": [[737, "4.2.2.12 火警消防与泄漏检测"], [738, "调压站设置30台可燃气体泄漏探测装置 （详见附录F 全厂可燃气体探测点分布表） ， 对调压站内天"], [739, "然气泄漏情况进行检测， 燃气浓度以模拟量方式传递给DCS控制系统， 每台燃气体泄漏探测器输出2个继"], [740, "电器报警信号(一级报警浓度为25%LEL，二级报警浓度为50%LEL)至火灾报警系统。"]]}, {"t": "公用规程 第 1010～1012 行", "lines": [[1010, "(3) 如果严重泄漏，无法隔离，应立即停机，切断调压站紧急切断阀(ESD)和出口阀，如有必要，"], [1011, "应通知上游立即切断气源。现场加装临时通风设备，待甲烷浓度低于 5％LEL 后才允许进入站内做"], [1012, "相应的检修工作。"]]}], "cards": ["D:1.2-2", "RJ-b0470420", "D:1.2-4", "RJ-681fbb83", "D:1.2-1", "RJ-50b5e7c9", "D:1.2-3", "RJ-35f80f5a", "RJ-99d89302", "RJ-92d42d57", "RJ-04a9f5a8"]}, "2.1": {"id": "2.1", "name": "调压站总体：气从哪来，送到哪去", "cat": "二", "gist": "天然气设计为两路气源：一路取自西气东输二线广深支干线求大线 17# 阀室前，另一路待建。调压站由 13 个单元组成，一进五出，供 3 台燃机和 2 台启动锅炉，由公用 DCS 控制。计量单元的超声波流量计用于和上游燃气公司贸易结算。", "reg": "公用 4.1.1、4.2.1、4.2.2.5、表 3", "lecture": "\u003cp>调压站的任务，是把上游来的天然气过滤、调压、加热，再送到每台机组的前置模块和启动锅炉\u003cspan class=\"cite\">公用 4.1.1\u003c/span>。一个调压站同时供 3 台 9HA.01 联合循环机组和 2 台启动锅炉，由电厂公用 DCS 控制，运行人员在 DCS 操作员站上集中监视和操作\u003cspan class=\"cite\">公用 4.1.1\u003c/span>。\u003c/p>\n\u003cp>规程设计了两路气源。气源 1 取自西气东输二线广深支干线求大线 17# 阀室前；气源 2 还没建，将来取自深圳市燃气集团求雨岭门站\u003cspan class=\"cite\">公用 4.1.1\u003c/span>。\u003c/p>\n\u003cp>调压站由 13 个单元组成，设计为一进五出，五个出口分别供三台燃机和两台启动锅炉\u003cspan class=\"cite\">公用 4.2.1\u003c/span>。\u003c/p>\n\u003ch4>一股气从管网到燃机\u003c/h4>\n\u003cp>下面顺着气流，把压力和温度怎么变串一遍。\u003c/p>\n\u003cp>第一步，进站。天然气管网升压以后，来气压力约 6.3 MPa\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>。进站时温度大致是地温，规程表 3 写入口单元温度范围 7.87～28.38 ℃\u003cspan class=\"cite\">公用 表 3\u003c/span>。表 3 的入口压力范围写的是 3.3～6.3 MPa，下限应是管网升压以前的情况，那时来气压力低，要靠增压机升压\u003cspan class=\"cite\">见考点 2.6\u003c/span>\u003cspan class=\"infer\">推断：规程 4.2.2.7 特意注明 6.3 MPa 是「管网升压后」\u003c/span>。本厂管网升压以后，增压机已经停运，调压站现在不升压，只减压（这是现场现状，规程里还保留着增压机的内容）。\u003c/p>\n\u003cp>第二步，清管、分离过滤、计量。依次经过清管站、入口单元、旋风分离器、精过滤器、计量单元\u003cspan class=\"cite\">见考点 2.2、2.3\u003c/span>\u003cspan class=\"infer\">推断：由 4.2.1 的列举顺序和 4.2.2.7 拼出，规程没有画出完整流程\u003c/span>。这一段压力几乎不变，表 3 写入口单元阻力损失只有 0.01 MPa\u003cspan class=\"cite\">公用 表 3\u003c/span>。计量单元设 4 台流量计，省管网流量计两用一备，厂内流量计单独一台并设旁路，检修时可以走旁路继续供气；另有 1 套色谱分析仪，通过通讯把结果传给流量计\u003cspan class=\"cite\">公用 4.2.2.5\u003c/span>。流量计是超声波流量计，用于电厂和上游天然气公司的贸易结算\u003cspan class=\"cite\">公用 4.1.1\u003c/span>。结算要按统一状态下的体积或热量算，流量计需要知道燃气组分，所以要用色谱分析仪的结果\u003cspan class=\"infer\">推断：规程只写了传给流量计\u003c/span>。\u003c/p>\n\u003cp>第三步，加热和减压。天然气先经加热单元用循环水加热，再经调压单元，压力由 6.3 MPa 降到 4.05 MPa，送往三台机组\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>。减压时天然气会降温，所以要先加热\u003cspan class=\"cite\">见考点 2.4\u003c/span>，调压器怎么动作\u003cspan class=\"cite\">见考点 2.5\u003c/span>。规程 4.2.2.7 写送往机组的天然气温度＞50℃\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>，这个数有疑问，放在加热单元那一篇里说\u003cspan class=\"cite\">见考点 2.4\u003c/span>。\u003c/p>\n\u003cp>第四步，进前置模块。机岛规程的启动前检查要求前置模块入口压力控制在 3.74MPa～4.5MPa\u003cspan class=\"cite\">机岛 6.4.5\u003c/span>，和调压站出口的 4.05 MPa 接得上。前置模块里，燃气先经两台并联的绝对分离器再过滤一遍，然后经科氏流量计 96VM-1，进性能加热器\u003cspan class=\"cite\">机岛 9.3.1\u003c/span>\u003cspan class=\"cite\">见考点 4.1\u003c/span>。\u003c/p>\n\u003cp>第五步，第二次加热。性能加热器用余热锅炉中压（IP）省煤器出口给水加热燃气，把气体加热至其要求的温度\u003cspan class=\"cite\">机岛 9.3.1\u003c/span>。规程没写加热到多少度，只给了 P1 腔（燃料模块入口的第一段腔室）燃气温度的上下限：高于 238℃ 跳性能加热器，低于约 38 ℃\u003cspan class=\"conv\">换算自 100 ℉\u003c/span>，燃机 3 倍 RB（RB，快速减负荷）\u003cspan class=\"cite\">机岛 9.3.3.2\u003c/span>\u003cspan class=\"cite\">见考点 4.2、4.3\u003c/span>。\u003c/p>\n\u003cp>第六步，进燃料模块，经过几道切断阀和控制阀，分到各燃料歧管进燃烧室\u003cspan class=\"cite\">见考点 5.1\u003c/span>。\u003c/p>\n\u003cp>所以燃料要加热两次：一次在调压站，一次在前置模块的性能加热器。把管网压力降下来这一步，在调压站做。\u003c/p>\n\u003ch4>题库的说法\u003c/h4>\n\u003cp>题库说前置模块接口处（双联过滤器进口）压力要求 4.03MPa.g（表压）以上\u003cspan class=\"cite\">题库 RJ-2a260f05\u003c/span>，在 3.74MPa～4.5MPa 的范围里\u003cspan class=\"cite\">机岛 6.4.5\u003c/span>。题库说的「双联过滤器」，本厂规程叫绝对分离器，两台并联\u003cspan class=\"cite\">机岛 9.3.1\u003c/span>。\u003c/p>\n\u003cp>题库把燃气轮机气体燃料系统分成调压装置、加热装置和主控系统三部分\u003cspan class=\"cite\">题库 RJ-d8bedb1f\u003c/span>。对到本厂：调压在调压站；加热分两段，调压站的加热单元和前置模块的性能加热器；主控系统对应燃料模块的阀门和燃机控制\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>", "sources": [{"t": "公用规程 第 155～168 行", "lines": [[155, "4.1 概述及规范"], [156, "4.1.1 概述"], [157, "天然气调压站系统的主要作用是将上游来的天然气通过调压站过滤、 调压和加热后送至每台机组的"], [158, "前置模块、 启动锅炉， 为燃气轮机及启动锅炉提供符合燃烧压力、 温度要求的洁净天然气。 主要设备包"], [159, "括清管站、旋风分离器、挡板/凝聚式过滤器、超声波流量计、加热器、调压单元、增压机、冷凝液储"], [160, "罐、放散塔及相关阀门和排污管道。"], [161, "天然气设计为两路气源，气源1取自西气东输二线从广深支干线求大线17#阀室前，气源2（待建）"], [162, "取自深圳市燃气集团求雨岭门站。两路气源有各自的进口（绝缘与火警切断）单元、过滤分离单元、计"], [163, "量单元。 调压站内配备有火警安全切断阀， 电厂发生火灾时进行紧急切断， 计量单元可用于电厂与上游"], [164, "天然气公司的贸易结算。"], [165, "天然气调压站由电厂公用DCS系统进行控制， 运行人员通过DCS操作员站对调压站设备进行集中控制、"], [166, "监视以及运行管理。"], [167, "天然气调压站能同时满足3台9HA.01联合循环机组及2台启动锅炉的燃料需求， 满足燃机从点火到满"], [168, "负荷各阶段燃料需求。"]]}, {"t": "公用规程 第 217～233 行", "lines": [[217, "表 3 调压站总体参数"], [218, "序号 名称 数值 单位"], [219, "1 天然气系统设计流量 334519（1atm,20℃） Nm"], [220, "3/h"], [221, "2 天然气调压系统出口压力 4.2 MPa"], [222, "3 天然气调压系统出口压力波动范围 ±1% MPa"], [223, "4 天然气调压系统出口温度 6 或 22 ℃"], [224, "5 天然气调压系统出口温度波动范围 ±1 ℃"], [225, "6 系统设计温度 50 ℃"], [226, "7 天然气入口单元压力范围 3.3～6.3 MPa"], [231, "8 天然气入口单元阻力损失 0.01 MPa"], [232, "9 天然气入口单元温度范围 7.87～28.38 ℃"], [233, "10 生产厂家 大连派斯"]]}, {"t": "公用规程 第 600～604 行", "lines": [[600, "4.2 调压站系统组成及功能"], [601, "4.2.1 调压站系统组成"], [602, "调压站系统由清管站、入口单元、旋风分离器单元、精过滤单元、计量单元、启动锅炉调压单元、"], [603, "天然气增压机单元、天然气加热及调压单元、制氮单元、出口单元、冷凝储罐单元、放散单元、仪表空"], [604, "气储罐单元，共13个单元组成，设计为一进五出，分别供三台燃机和两台启动锅炉用气。"]]}, {"t": "公用规程 第 655～672 行", "lines": [[655, "4.2.2.5 计量单元"], [656, "流量计用于计量流过调压站的天然气流量。"], [657, "整个单元设置4台流量计，其中省管网流量计采用两用一备布置，厂内流量计采用单个布置，另外"], [658, "厂内流量计设置一条旁路， 当流量计进行检修维护时， 可以通过旁路向下游继续供气， 保证电厂正常供"], [659, "气。同时，设置有1套色谱分析仪，通过通讯将结果传送给流量计。"], [660, "4.2.2.6 增压机单元"], [661, "增压单元用于改善天然气压力不足， 提高天然气供气压力， 满足燃机所需的压力， 每台燃气轮机各"], [662, "配置 1 套天然气增压机，当管网天然气压力低时，启动天然气增压机运行。"], [663, "增压机系统由整体压缩机、驱动电机、油箱、冷油器、辅助油泵、润滑油过滤器等组成。压缩机采"], [664, "用多级齿轮离心管线式压缩机， 主要进行气体压缩， 通过离心力提高气体流速， 将动能转化为气体的压"], [665, "力能。"], [666, "4.2.2.7 天然气加热及调压单元"], [667, "天然气经清管站、过滤单元、计量单元后，供气压力为6.3MPa（天然气管网升压后），为满足燃机"], [668, "燃烧天然气压力及温度要求，天然气经加热单元和调压单元，分别向三台机组提供压力为4.05MPa、温"], [669, "度＞50℃的天然气。"], [670, "1、加热单元"], [671, "为满足燃气轮机在各种工况下对燃料温度要求， 防止低温下调压单元工作异常， 设置天然气加热单"], [672, "元，布置在计量单元后。"]]}, {"t": "公用规程 第 686～689 行", "lines": [[686, "2、调压单元"], [687, "通过调压单元（天然气管网升压后），将管网供气压力由6.3MPa降压至4.05MPa。采用机组单元制"], [688, "控制方式，每台机组两路，"], [689, "一运一备运行方式。"]]}, {"t": "机岛规程 第 1995～2002 行", "lines": [[1995, "9.3.1 概述"], [1996, "天然气前置模块系统主要包括两个100％的绝对分离器、燃气科氏流量计（96VM-1）、"], [1997, "一套性能加"], [1998, "热器（PCHE）及相关测量表计。"], [1999, "来自调压站的燃气首先经过两个绝对分离器为两级过滤/分离装置，垂直并联布置，第一级用惯性"], [2000, "分离除去较大的液滴和颗粒，第二级是聚凝式过滤器，可以去除99.5%直径≤0.3μm的液体和固体。燃"], [2001, "气从过滤分离器出来，经过燃气科氏流量计（96VM-1)后进入性能加热器模块。性能加热器将气体加热"], [2002, "至其要求的温度。加热热源取自余热锅炉中压（IP）省煤器出口给水，回水至凝结水母管。"]]}, {"t": "机岛规程 第 2029～2032 行", "lines": [[2029, "9.3.3.2 燃气温度逻辑条件"], [2030, "1) P1腔燃气高高460℉(238℃)，跳性能加热器。"], [2031, "2) P1腔燃气温度FTG传感器（FTG-1A/1B）测点A、B均为坏点，延时2s，燃机自动停机"], [2032, "3) P1腔燃气温度\u003c100℉，燃机3倍RB。"]]}, {"t": "机岛规程 第 1202～1202 行", "lines": [[1202, "2) 天然气调压站系统已投运，前置模块入口压力控制在3.74MPa～4.5MPa。"]]}], "cards": ["D:2.1-3", "RJ-d8bedb1f", "D:2.1-5", "D:2.1-7", "RJ-2a260f05", "D:2.1-6", "D:2.1-2", "D:2.1-1", "D:2.1-4"]}, "2.2": {"id": "2.2", "name": "清管站和入口单元", "cat": "二", "gist": "清管站接收在管道里跑的清管器，清掉管道里析出的水、轻质油和铁屑。入口单元有绝缘接头（隔开站内外管线，防电化学腐蚀）、ESD 紧急关断阀和紧急放散阀。ESD 阀是 100% 容量，用仪用压缩空气驱动，失气就关。入口压力高时，先用就地压力表核对变送器，确实是上游压力高就联系管网调整。", "reg": "公用 4.2.2.1、4.2.2.2、4.5.1", "lecture": "\u003cp>管网来的天然气进厂，先到清管站，再到入口单元\u003cspan class=\"infer\">推断：由 4.2.1 的单元列举顺序和「清管站至厂内电动阀」这个阀名推出\u003c/span>。\u003c/p>\n\u003ch4>清管站\u003c/h4>\n\u003cp>天然气在管道里长距离输送，温度、压力一变，会析出冷凝水和轻质油；管道内壁还有腐蚀产生的铁屑。这些杂质靠在管道里跑的清管器来清除，清管站就是接收清管器和天然气的地方\u003cspan class=\"cite\">公用 4.2.2.1\u003c/span>。\u003c/p>\n\u003cp>清管器靠上游天然气的压力推着走，一路刮下管壁上的沉积物往前推。到了清管站的收球室，切换阀门把它隔离在收球室里，打开收球室的盲板取出清管器，清掉筒里的污物\u003cspan class=\"cite\">公用 4.2.2.1\u003c/span>。多久通一次清管器，规程没写，要问现场。\u003c/p>\n\u003cp>清管站上有一个气液联动阀，用来缩小燃气管道的事故范围。它以管线里的天然气为动力，以液压油为传动介质来开关阀门，能远程开关和 ESD 关阀（ESD，紧急切断），失电失气时也能就地开关\u003cspan class=\"cite\">公用 4.2.2.1\u003c/span>。它不靠电，也不靠仪用压缩空气，这是它和入口 ESD 阀最大的不同\u003cspan class=\"infer\">推断：由两阀的驱动方式对比\u003c/span>。\u003c/p>\n\u003ch4>入口单元\u003c/h4>\n\u003cp>入口单元配有绝缘接头、入口球阀、紧急关断阀（ESD 阀）和紧急放散阀\u003cspan class=\"cite\">公用 4.2.2.2\u003c/span>。\u003c/p>\n\u003cul>\n\u003cli>绝缘接头：把调压站和外部管线绝缘隔开，保护管线不受电化学腐蚀\u003cspan class=\"cite\">公用 4.2.2.2\u003c/span>。\u003c/li>\n\u003cli>ESD 阀：调压站进口设 1 个 100% 容量的 ESD 阀，调压站或燃机发生火灾等危险情况时，紧急切断上游供气\u003cspan class=\"cite\">公用 4.2.2.2\u003c/span>。\u003c/li>\n\u003cli>紧急放散阀：需要紧急放散时，在集控室远程打开\u003cspan class=\"cite\">公用 4.2.2.2\u003c/span>。\u003c/li>\n\u003c/ul>\n\u003cp>ESD 阀是气动执行机构，动力气源用仪用压缩空气，配置为失气关阀\u003cspan class=\"cite\">公用 4.2.2.2\u003c/span>。失气关是故障安全的设计：驱动它的气一旦没了，阀门自己回到关闭这个安全位置，不会因为失去动力而开在那里切不断\u003cspan class=\"infer\">原理：故障安全设计\u003c/span>。代价是仪用气一丢，调压站就断气，三台燃机都没有燃料\u003cspan class=\"infer\">推断\u003c/span>。所以仪用气设了两路气源，一路来自全厂压缩空气系统，一路来自天然气增压机配套空压机\u003cspan class=\"cite\">公用 4.2.2.11\u003c/span>。增压机停运以后，第二路气源还用不用，规程没写，要到现场确认。\u003c/p>\n\u003cp>ESD 阀设了旁路阀，用途是平衡 ESD 阀前后的压力，便于开 ESD 阀，不是用来绕开 ESD 阀供气的\u003cspan class=\"cite\">公用 4.2.2.2\u003c/span>。前后压差大为什么不好开：阀门关着时，上游高压把阀芯压在下游一侧的阀座上，压差越大压得越紧，摩擦力越大，执行机构可能转不动；硬打开，高压气从刚开的一条缝里高速冲过去，会冲刷阀座密封面，下游压力也会猛涨\u003cspan class=\"infer\">原理：阀门两侧压差的作用\u003c/span>。先开小旁路让下游慢慢充压，两边压力差不多了再开主阀，就没有这些问题。充天然气投运时入口阀也是这样先开旁路\u003cspan class=\"cite\">见考点 3.3\u003c/span>。需要关 ESD 阀时，可以现场手动关，也可以在集控室远程关\u003cspan class=\"cite\">公用 4.2.2.2\u003c/span>。\u003c/p>\n\u003ch4>出事时关哪个阀\u003c/h4>\n\u003cp>规程的紧急停运写的是关入口紧急切断阀，再开放散阀泄压\u003cspan class=\"cite\">公用 4.3.9.2\u003c/span>；严重泄漏无法隔离时，切断调压站 ESD 阀和出口阀，如有必要，通知上游立即切断气源\u003cspan class=\"cite\">公用 4.5.4.2\u003c/span>。两处都没提气液联动阀。气液联动阀在 ESD 阀上游，关它能把入口单元也隔开，而且不靠电和仪用气，可以作为 ESD 阀关不上、或入口单元本身出事时的后备\u003cspan class=\"infer\">推断：由两阀的位置和驱动方式推出，规程没写什么时候用它\u003c/span>。\u003c/p>\n\u003cp>题库说 ESD 阀又名紧急关断阀，作用是紧急切断天然气供应\u003cspan class=\"cite\">题库 RJ-70319aa3\u003c/span>，和规程一致。\u003c/p>\n\u003ch4>入口压力高\u003c/h4>\n\u003cp>入口的超压保护，规程表 14 列了调压站入口安全阀，设定值 10 MPa\u003cspan class=\"cite\">公用 表 14\u003c/span>。它比正常来气压力高出很多，只防上游压力严重失控\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>调压站入口天然气压力高，规程列了两种原因：压力变送器故障，或者上游气源压力确实异常高\u003cspan class=\"cite\">公用 4.5.1\u003c/span>。处理分两步：\u003c/p>\n\u003col>\n\u003cli>先看就地压力表，和压力变送器的读数对比。就地压力正常，就是变送器的问题，联系检查处理压力变送器。\u003c/li>\n\u003cli>对比后压力确实偏高，就是上游供气压力升高了，及时联系管网调整上游供气压力\u003cspan class=\"cite\">公用 4.5.1\u003c/span>。\u003c/li>\n\u003c/ol>", "sources": [{"t": "公用规程 第 443～445 行", "lines": [[443, "表 14 安全放散阀设定值"], [444, "序号 名称 设定值 单位"], [445, "1 调压站入口安全阀 10 MPa"]]}, {"t": "公用规程 第 606～642 行", "lines": [[606, "4.2.2.1 清管站"], [607, "天然气在管道内进行长距离输送过程中， 会因温度、 压力变化析出冷凝水和轻质油， 天然气管道内"], [608, "壁也有腐蚀产生的铁屑， 使用清管器来清除管道内的杂质、 水分和沉积物， 清管站就是用于接收清管器"], [609, "和天然气，以保障管道系统的安全和效率。"], [610, "清管站单元主要由气液联动阀、 收球室入口电动阀、 收球室、 收球室回气电动阀、 清管站至厂内电"], [611, "动阀、压力测量元件、温度测量元件、排污池、管道排污及放散相关阀门组成。"], [612, "1) 气液联动阀"], [613, "气液联动阀可通过实现阀门开关， 缩小燃气管道的事故范围及减轻事故造成的危害。 气液联动阀以"], [614, "燃气管线中天然气为动力，以液压油为传动介质，驱动阀门开启或关闭。可以实现远程开关阀门、ESD"], [615, "和保护关阀、 就地气动开关阀门以及手动液压泵开关阀门， 即使失电失气状态也能就地开关， 确保下游"], [616, "设备安全。"], [617, "2) 收球室"], [618, "收球室主要是用于接收和回收清管器的装置。 清管器存于发球筒中， 通过切换阀门， 利用上游天然"], [619, "气压力将清管器从发球筒推入主管道。 清管器在管道内随气流移动， 刮削管壁上的沉积物， 并将其推向"], [620, "前方。清管器到达清管站的收球室后，通过阀门切换隔离在收球室内，打开收球室的盲板取出清管器，"], [621, "并清除筒内积存的污物。"], [622, "4.2.2.2 入口单元"], [623, "入口单元配置有绝缘接头、入口球阀、紧急关断阀(ESD)、紧急放散阀，以及其他必要的辅助设备"], [624, "等。"], [629, "入口单元主要功能是当调压站与外部气源连接时， 站内发生泄漏、 火灾或其它类似事件， 通过紧急"], [630, "关断阀（ESD）迅速切断气源，保证下游管道设备及电厂安全。"], [631, "1) 绝缘接头"], [632, "绝缘接头主要用于燃气输配系统和燃气调压站中， 其作用是将上、 下游管线间或调压站与外部管线"], [633, "间相互绝缘隔离，保护其不受电化学腐蚀，延长使用寿命。"], [634, "2) 紧急切断阀(ESD)"], [635, "调压站进口设置1个100%容量的ESD阀， 调压站及燃机在发生火灾或其他危险情况时， 能够紧急切断"], [636, "上游供气，确保整个供气系统及电厂的安全。"], [637, "紧急切断阀(ESD)为气动执行机构， 动力气源采用仪用压缩空气， 配置为失气关阀， 设置有旁路阀，"], [638, "用于平衡ESD阀前后压力， 便于开启ESD阀。 当发生需要紧急切断阀关闭的情况时， 可以现场手动或在集"], [639, "控室远程操作关闭阀门。阀位开关可以将紧急切断阀的开关位置反馈给DCS系统。"], [640, "3) 紧急放散阀"], [641, "发生需要紧急放散的情况时， 可以在集控室远程操作打开阀门， 阀位开关可以将紧急放散阀的开关"], [642, "位置反馈给DCS系统。"]]}, {"t": "公用规程 第 732～735 行", "lines": [[732, "2) 仪表空气储罐单元：为气动阀提供驱动气源，共设两路仪用气气源，"], [733, "一路来自全厂压缩空气系"], [734, "统，"], [735, "一路来自天然气增压机配套空压机气源。"]]}, {"t": "公用规程 第 907～919 行", "lines": [[907, "4.3.9 紧急停运"], [908, "4.3.9.1 出现以下情况应紧急退出："], [909, "1) 上游供气突然停止，管道内压力急剧下降。"], [910, "2) 天然气调压站系统发生火灾。"], [911, "3) 天然气调压站系统压力突然急剧下降。"], [912, "4.3.9.2 调压站系统紧急停运操作如下："], [913, "1) 停止天然气增压机运行。"], [918, "2) 关闭入口紧急切断阀。"], [919, "3) 打开放散阀，将天然气调压站系统的压力放散。"]]}, {"t": "公用规程 第 969～978 行", "lines": [[969, "4.5 异常及事故处理"], [970, "4.5.1 调压站入口天然气压力高"], [971, "4.5.1.1 原因"], [972, "1) 压力变送器故障；"], [973, "2) 上游气源压力异常高。"], [974, "4.5.1.2 处理"], [975, "力变送器；"], [976, "厂内供气安全。"], [977, "1) 检查就地压力表指示是否正常，与压力变送器进行对比，若就地压力正常，则联系检查处理压"], [978, "2) 若检查对比后压力确实偏高，则为上游供气压力升高，及时联系管网调整上游供气压力，确保"]]}, {"t": "公用规程 第 1010～1011 行", "lines": [[1010, "(3) 如果严重泄漏，无法隔离，应立即停机，切断调压站紧急切断阀(ESD)和出口阀，如有必要，"], [1011, "应通知上游立即切断气源。现场加装临时通风设备，待甲烷浓度低于 5％LEL 后才允许进入站内做"]]}], "cards": ["D:2.2-6", "RJ-70319aa3", "D:2.2-2", "D:2.2-8", "D:2.2-3", "D:2.2-5", "D:2.2-7", "D:2.2-1", "D:2.2-4"]}, "2.3": {"id": "2.3", "name": "旋风分离器和精过滤器", "cat": "二", "gist": "旋风分离器靠离心力分出 10 μm 以上的颗粒和液滴。精过滤器两台一用一备，是挡板加凝聚式滤芯，除更小的颗粒和液滴；差压到 50 kPa 要换滤芯，不许超过 80 kPa。分离出来的液体按液位自动排污（液位高 240 mm 开排污阀，低 140 mm 关），排进冷凝液储罐。", "reg": "公用 4.2.2.3、4.2.2.4、4.2.2.11、表 20、表 21、4.5.2、4.5.3", "lecture": "\u003cp>天然气过了入口单元，要先把里面的液滴和颗粒除掉，再去计量、加热和调压。除杂分两级：先过旋风分离器，再过精过滤器\u003cspan class=\"infer\">推断：由 4.2.1 的单元列举顺序和两者的分离精度推出，规程没有直接写先后\u003c/span>。\u003c/p>\n\u003ch4>为什么要除干净\u003c/h4>\n\u003cp>题库有一道简答题问气体燃料品质对燃机运行的影响，标准答案有五条\u003cspan class=\"cite\">题库 RJ-4bb9d488\u003c/span>：\u003c/p>\n\u003cul>\n\u003cli>液滴会引起火焰温度剧烈下降而熄火\u003c/li>\n\u003cli>固态颗粒会阻塞燃料喷嘴，使燃烧温度分布不均，甚至局部烧蚀\u003c/li>\n\u003cli>热值变化大会引起燃烧不稳定\u003c/li>\n\u003cli>燃料里的硫和微量碱金属会腐蚀热通道\u003c/li>\n\u003cli>供气压力不符合要求，会使燃烧不稳，甚至烧坏部件\u003c/li>\n\u003c/ul>\n\u003cp>前两条靠分离器和过滤器解决。液滴进了燃烧室要先吸热蒸发才能烧，把局部火焰温度拉下来；颗粒堵住喷嘴上的小孔，各孔出气不均，火焰就偏\u003cspan class=\"infer\">原理\u003c/span>。后三条和分离器无关，热值变化见华白数\u003cspan class=\"cite\">见考点 1.1\u003c/span>，供气压力\u003cspan class=\"cite\">见考点 2.5\u003c/span>，答题时要答全。\u003c/p>\n\u003ch4>旋风分离器\u003c/h4>\n\u003cp>旋风分离器只有 1 台，100% 容量，带旁路\u003cspan class=\"cite\">公用 4.2.2.3\u003c/span>。天然气进去以后形成旋流，固、液颗粒比燃气密度大得多，在离心力作用下，10μm 以上的较大颗粒和液滴被甩出来，落到底部由排污口排走\u003cspan class=\"cite\">公用 4.2.2.3\u003c/span>。颗粒越小离心力越小，容易跟着气流走，所以它只管大颗粒\u003cspan class=\"infer\">原理\u003c/span>。\u003c/p>\n\u003ch4>精过滤器\u003c/h4>\n\u003cp>精过滤单元配了 2 台聚结式精过滤器（规程写作凝聚式），一用一备\u003cspan class=\"cite\">公用 4.2.2.4\u003c/span>。天然气先经过滤芯，分出较小的固体颗粒和一部分液滴；再经过除沫器，把小液滴进一步分出来\u003cspan class=\"cite\">公用 4.2.2.4\u003c/span>。聚结式滤芯让细小液滴在滤材纤维上相互碰撞、聚成大滴，大滴靠重力落下；除沫器再拦住被气流带走的小液滴\u003cspan class=\"infer\">原理：聚结过滤的一般原理\u003c/span>。\u003c/p>\n\u003cp>过滤器差压送到 DCS，差压到 50kPa 及以上要换滤芯，不许超过 80kPa\u003cspan class=\"cite\">公用 4.2.2.4\u003c/span>。差压反映滤芯被脏物堵了多少，差压太大，滤芯可能被压坏，脏物就直接冲到下游\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003ch4>为什么要分离这么多道\u003c/h4>\n\u003cp>调压站有旋风分离器、精过滤器两道，前置模块还有两台绝对分离器\u003cspan class=\"cite\">见考点 4.1\u003c/span>，它的第二级能去除 99.5% 直径≤0.3μm 的液体和固体\u003cspan class=\"cite\">机岛 9.3.1\u003c/span>。三道一道比一道细：旋风分离器先除掉大颗粒和大部分液体，免得精过滤器很快堵死；绝对分离器装在机组跟前，拦住调压站之后管道里新生的锈渣和减压降温析出的液体，是进燃料模块之前的最后一道\u003cspan class=\"infer\">推断：由三者的位置和精度推出\u003c/span>。\u003c/p>\n\u003ch4>自动排污\u003c/h4>\n\u003cp>分出来的液体靠液位自动排污。旋风分离器、过滤器上部、过滤器下部三处各有液位开关，定值相同\u003cspan class=\"cite\">公用 表 20、表 21\u003c/span>：\u003c/p>\n\u003cul>\n\u003cli>液位高 240mm，延时 3 秒，联锁开排污气动阀\u003c/li>\n\u003cli>液位高高 300mm，延时 3 秒，保护开排污气动阀\u003c/li>\n\u003cli>液位低 140mm，延时 3 秒，联锁关排污气动阀\u003c/li>\n\u003cli>液位低低 80mm，延时 3 秒，保护关排污气动阀\u003c/li>\n\u003c/ul>\n\u003cp>联锁和保护的区别规程没解释。一般做法是：联锁开、关是正常的自动排污动作；保护开、关的定值更靠外，是联锁没动作时的后备，级别更高\u003cspan class=\"infer\">推断：按 DCS 联锁、保护的一般分级\u003c/span>。\u003c/p>\n\u003cp>液位低了必须关阀，是为了在底部留一层液体把排污口封住。液体排空了阀还开着，分离器里的高压天然气就会直接冲进排污管和冷凝液储罐\u003cspan class=\"infer\">推断\u003c/span>。冷凝液储罐的设计压力只有 1.0 MPa\u003cspan class=\"cite\">公用 表 12\u003c/span>，远低于管网来气压力。\u003c/p>\n\u003cp>排出来的液体进一台 2m³ 的冷凝液储罐（规程这一条里也叫它疏液罐），它同时收集电加热器的冷凝液。储罐高液位报警值 600mm，低液位报警值 100mm\u003cspan class=\"cite\">公用 4.2.2.11\u003c/span>。\u003c/p>\n\u003ch4>异常处理\u003c/h4>\n\u003cp>过滤器液位异常，原因可能是液位计故障、自动排污阀故障或排污管道堵塞\u003cspan class=\"cite\">公用 4.5.2\u003c/span>。先就地手动排污，确认过滤器内的液位：液位降下来了，说明是自动排污阀不能正常动作，联系检修处理；手动排污后液位计还是不动，就联系检查液位计和排污管道是否堵塞\u003cspan class=\"cite\">公用 4.5.2\u003c/span>。\u003c/p>\n\u003cp>过滤器差压高，原因可能是差压开关、变送器故障，或者滤网堵塞\u003cspan class=\"cite\">公用 4.5.3\u003c/span>。先查差压开关和差压变送器，是表计故障就联系检修；确认是滤网脏了，就把过滤器切到备用过滤器或旁路运行，联系检修清理或更换滤网\u003cspan class=\"cite\">公用 4.5.3\u003c/span>。\u003c/p>", "sources": [{"t": "公用规程 第 429～434 行", "lines": [[429, "表 12 冷凝液储罐参数"], [430, "序号 名称 数值 单位"], [431, "1 容积 2 m"], [433, "2 设计压力 1.0 MPa"], [434, "3 设计温度 50oC"]]}, {"t": "公用规程 第 529～591 行", "lines": [[529, "表 20 液位设定值"], [530, "序号 名称 低低液位设"], [531, "定值"], [532, "低液位设定"], [533, "值"], [534, "高液位设定"], [535, "值"], [536, "高高液位设"], [537, "定值 单位"], [538, "1 旋风分离器液位 80 140 240 300 mm"], [539, "2 挡板凝聚式过滤器上部液位 80 140 240 300 mm"], [540, "3 挡板凝聚式过滤器下部液位 80 140 240 300 mm"], [541, "4 冷凝储罐液位 100 600 1000 mm"], [542, "表 21 联锁保护"], [543, "序号 设备 描述 定值"], [544, "连锁开：旋风分离器液位高（液位开关）延时3秒，开排污气"], [545, "动阀。"], [546, "240mm"], [547, "保护开：旋风分离器液位高高（液位开关）延时3秒，开排污"], [548, "气动阀。"], [549, "300mm"], [550, "1 旋风分离器排污"], [551, "气动阀"], [552, "连锁关：旋风分离器液位低（液位开关）延时3秒，关排污气"], [553, "动阀。"], [554, "140mm"], [555, "保护关：旋风分离器液位低低（液位开关）延时3秒，关排污"], [556, "气动阀。"], [557, "80mm"], [558, "连锁开：#1/#2过滤器上部液位高（液位开关）延时3秒，开"], [559, "排污气动阀。"], [560, "240mm"], [562, "#1/#2过滤器上部"], [563, "排污气动阀"], [564, "保护开：#1/#2过滤器上部液位高高（液位开关）延时3秒，"], [565, "开排污气动阀。"], [566, "300mm"], [567, "连锁关：#1/#2过滤器上部液位低（液位开关）延时3秒，关"], [568, "排污气动阀。"], [569, "140mm"], [574, "保护关：#1/#2过滤器上部液位低低（液位开关）延时3秒，"], [575, "关排污气动阀。"], [576, "80mm"], [577, "连锁开：#1/#2过滤器下部液位高（液位开关）延时3秒，开"], [578, "排污气动阀。"], [579, "240mm"], [580, "保护开：#1/#2过滤器下部液位高高（液位开关）延时3秒，"], [581, "开排污气动阀。"], [582, "300mm"], [584, "#1/#2过滤器下部"], [585, "排污气动阀"], [586, "连锁关：#1/#2过滤器下部液位低（液位开关）延时3秒，关"], [587, "排污气动阀。"], [588, "140mm"], [589, "保护关：#1/#2过滤器下部液位低低（液位开关）延时3秒，"], [590, "关排污气动阀。"], [591, "80mm"]]}, {"t": "公用规程 第 643～654 行", "lines": [[643, "4.2.2.3 旋风分离单元"], [644, "旋风分离单元配置有1台流量为100%容量的旋风分离器及其旁路、自动排污系统、安全阀、放空手"], [645, "动门和其他必要的辅助设备等。 天然气进入旋风分离器时， 在管内形成旋流， 由于固、 液颗粒和燃气的"], [646, "密度差异，在离心力的作用下会使10μm以上较大的颗粒及液滴从气流中分离出来，清洁燃气从上导管"], [647, "排出，固液颗粒从下导管落入分离器底部，从排污口排走，保护下游设备的安全。"], [648, "4.2.2.4 精过滤单元"], [649, "精过滤单元设备配有2台凝聚式精过滤器，"], [650, "一用一备， 每台过滤器设计流量为334519Nm³/h。 天然气"], [651, "从进口管进入过滤器， 在过滤器第一阶段， 气体经过滤芯将较小的固体颗粒和部分液滴分离出来， 然后"], [652, "进入过滤器的第二阶段， 天然气经过除沫器， 进一步将天然气内的小液体颗粒分离出来。 过滤器上安装"], [653, "的差压变送器可以发送差压信号给DCS， 当差压值≥50kPa时， 需要更换过滤器内的滤芯， 差压值禁止超"], [654, "过80kPa。"]]}, {"t": "公用规程 第 724～731 行", "lines": [[724, "4.2.2.11 其他单元"], [725, "1) 冷凝储罐单元：配置一台 2m³的冷凝液储罐及烃泵、液位计和必要的隔断阀门；用于收集旋风"], [726, "分离器、过滤分离器中分离、过滤出来的液体和电加热器的冷凝液。疏液罐高液位报警值 600mm，"], [731, "疏液罐低液位报警值 100mm。"]]}, {"t": "公用规程 第 979～994 行", "lines": [[979, "4.5.2 过滤器液位异常"], [980, "4.5.2.1 原因"], [981, "1) 过滤器液位计故障；"], [982, "2）自动排污阀故障；"], [983, "3）排污管道堵塞。"], [984, "4.5.2.2 处理"], [985, "1) 就地手动排污确认过滤器内液位， 若液位下降， 则为自动排污阀不能正常动作， 联系检修处理；"], [986, "2) 若就地手动排位后液位计仍无变动，联系检查液位计和排污管道是否堵塞。"], [987, "4.5.3 调压站精过滤器、粗过滤器差压高"], [988, "4.5.3.1 原因"], [989, "1) 差压开关、变送器故障；"], [990, "2) 过滤器滤网堵塞。"], [991, "4.5.3.2 处理"], [992, "1) 检查差压开关、差压变送器是否故障，若为差压开关、差压变送器故障，及时联系检修处理；"], [993, "2) 若经检查经检查确认为过滤器滤网脏，应进行过滤器切换操作，将过滤器切至备用过滤器或旁"], [994, "路运行，联系检修对脏滤网进行清理或更换。"]]}, {"t": "机岛规程 第 1999～2000 行", "lines": [[1999, "来自调压站的燃气首先经过两个绝对分离器为两级过滤/分离装置，垂直并联布置，第一级用惯性"], [2000, "分离除去较大的液滴和颗粒，第二级是聚凝式过滤器，可以去除99.5%直径≤0.3μm的液体和固体。燃"]]}], "cards": ["D:2.3-3", "D:2.3-5", "D:2.3-4", "D:2.3-6", "D:2.3-2", "D:2.3-7", "D:2.3-1", "RJ-4bb9d488"]}, "2.4": {"id": "2.4", "name": "加热单元", "cat": "二", "gist": "加热单元装在计量单元之后、调压单元之前，规程写的目的是满足燃机对燃料温度的要求，并防止低温下调压单元工作异常。两台热水换热器一运一备，热源是冷却塔回水，经循环水升压泵送来，换热后回循环水前池；循环水温度低时用启动电加热器。", "reg": "公用 4.2.2.7（加热单元）、表 3、表 15、表 16、表 18", "lecture": "\u003cp>加热单元布置在计量单元后面，天然气先过加热单元，再过调压单元，然后送往三台机组\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>。规程写的设置目的是：满足燃气轮机在各种工况下对燃料温度的要求，防止低温下调压单元工作异常\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>。\u003c/p>\n\u003ch4>减压为什么会降温\u003c/h4>\n\u003cp>天然气流过调压器，是从阀口的窄缝里挤过去，压力突然降低，这叫节流。节流后气体膨胀，分子间距离拉大要克服分子间的吸引力，这部分能量出自气体自身，所以温度下降\u003cspan class=\"infer\">原理：节流降温，也叫焦耳—汤姆逊效应\u003c/span>。题库给了一个经验数：「压力降低1MPA时其温度降低约5℃」\u003cspan class=\"cite\">题库 RJ-c10da99b\u003c/span>。本厂调压单元把 6.3 MPa 降到 4.05 MPa，降了约 2.25 MPa，天然气要降温约 11 ℃\u003cspan class=\"infer\">推断：按题库每降 1 MPa 约降 5 ℃ 估算\u003c/span>。\u003c/p>\n\u003ch4>露点\u003c/h4>\n\u003cp>规程的术语解释：有一定压力的气体冷却到某一温度，其所含的未饱和水蒸气变成饱和水蒸气析出，此温度就是该气体的压力露点\u003cspan class=\"cite\">公用 第 3 章\u003c/span>。题库说露点是湿度达到饱和时的温度\u003cspan class=\"cite\">题库 RJ-56ef8734\u003c/span>，是同一个意思。\u003c/p>\n\u003cp>天然气里除了少量水蒸气，还有丙烷、丁烷、戊烷这些较重的烃\u003cspan class=\"cite\">见考点 1.1\u003c/span>。它们和水蒸气一样，温度低到一定程度就凝成液体，这个温度叫烃露点\u003cspan class=\"infer\">原理\u003c/span>。规程给启动锅炉加热单元写的目的，就是把天然气加热到高于相应压力下的水、烃露点，防止天然气结露\u003cspan class=\"cite\">公用 4.2.2.9\u003c/span>。\u003c/p>\n\u003ch4>为什么加热放在减压之前\u003c/h4>\n\u003cp>降温发生在调压器的阀口。如果先减压，天然气在调压器里就降到露点以下，水和重烃直接在阀口和调压器的取压管里析出；温度再低，水还会结冰，或者和天然气结合成像冰一样的水合物，堵住阀口和取压管，调压器就动作不正常\u003cspan class=\"infer\">原理：高压天然气节流时析出液体、生成水合物\u003c/span>。先加热，给天然气留出降温的余量，减压降温以后仍然高于露点；减压后再加热就晚了\u003cspan class=\"infer\">推断：由减压降温和 4.2.2.9 防结露的写法推出，主加热单元这一层原因规程没写\u003c/span>。\u003c/p>\n\u003ch4>设备\u003c/h4>\n\u003cp>加热单元由热水换热器和启动电加热器组成，两者串联布置\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>。\u003c/p>\n\u003cp>热水换热器共 2 台，一运一备，是单流程管壳式换热器\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>。加热介质是机组的循环水：水从三台冷却塔的回水管上接出，经循环水升压泵升压，送到热水换热器加热天然气，再回到循环水前池；循环水升压泵也是一运一备\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>。冷却塔回水本来就要进冷却塔散热，用它加热天然气等于回收废热\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>启动电加热器只有 1 台，循环水温度低时使用\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>。\u003c/p>\n\u003cp>换热器里天然气走管程，设计压力 7.0 MPa；热水走壳程，设计压力 0.8 MPa\u003cspan class=\"cite\">公用 表 16\u003c/span>。安全阀按两侧分开定：气侧 6.93 MPa，水侧 0.78 MPa；天然气电加热器安全阀 6.93 MPa\u003cspan class=\"cite\">公用 表 14\u003c/span>。加热单元在调压单元上游，天然气侧承受管网来气的全压，所以气侧定值高\u003cspan class=\"infer\">推断\u003c/span>。换热管一旦漏，高压天然气会窜进低压的水侧，水侧安全阀就是防壳体被憋坏的\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003ch4>两段加热\u003c/h4>\n\u003cp>本厂燃料加热分两段。调压站这一段用循环水，目的是让减压后的天然气仍高于露点；前置模块的性能加热器用余热锅炉中压省煤器出口给水\u003cspan class=\"cite\">机岛 9.3.1\u003c/span>，把燃气加热到燃机要求的温度\u003cspan class=\"cite\">见考点 4.2\u003c/span>。循环水温度不高，只能把天然气加热一点；中压给水温度高得多，才能把燃气加到燃机需要的温度\u003cspan class=\"infer\">推断：由两者的热源推出，规程没写两段各加到多少度\u003c/span>。\u003c/p>\n\u003cp>规程 4.2.2.7 写调压站向机组提供温度＞50℃ 的天然气\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>。用循环水能不能加到 50 ℃ 以上，要看循环水温度，规程没写\u003cspan class=\"infer\">推断\u003c/span>。规程表 3 另写调压系统出口温度 6 或 22 ℃，没解释是什么工况，和 50 ℃ 差得多，以现场 DCS 上的实际温度为准\u003cspan class=\"cite\">公用 表 3\u003c/span>。\u003c/p>\n\u003ch4>题库和规程说法不一样的地方\u003c/h4>\n\u003cp>以本厂规程为准：\u003c/p>\n\u003cul>\n\u003cli>加热装置的型式：题库说调压站的加热装置有水浴炉加热器与电加热器两种\u003cspan class=\"cite\">题库 RJ-a388d6bf\u003c/span>。本厂没有水浴炉，用的是热水换热器（循环水加热）加启动电加热器\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>。\u003c/li>\n\u003cli>入口温度：题库说调压站入口天然气温度正常在 -19~38℃\u003cspan class=\"cite\">题库 RJ-7b0c61b1\u003c/span>，规程表 3 写入口单元温度范围是 7.87～28.38 ℃\u003cspan class=\"cite\">公用 表 3\u003c/span>。\u003c/li>\n\u003c/ul>", "sources": [{"t": "公用规程 第 149～151 行", "lines": [[149, "6) 压力露点"], [150, "是指有一定压力的气体冷却到某一温度， 其所含的未饱和水蒸气变成饱和水蒸气析出， 此温度就是"], [151, "该气体的压力露点。"]]}, {"t": "公用规程 第 217～233 行", "lines": [[217, "表 3 调压站总体参数"], [218, "序号 名称 数值 单位"], [219, "1 天然气系统设计流量 334519（1atm,20℃） Nm"], [220, "3/h"], [221, "2 天然气调压系统出口压力 4.2 MPa"], [222, "3 天然气调压系统出口压力波动范围 ±1% MPa"], [223, "4 天然气调压系统出口温度 6 或 22 ℃"], [224, "5 天然气调压系统出口温度波动范围 ±1 ℃"], [225, "6 系统设计温度 50 ℃"], [226, "7 天然气入口单元压力范围 3.3～6.3 MPa"], [231, "8 天然气入口单元阻力损失 0.01 MPa"], [232, "9 天然气入口单元温度范围 7.87～28.38 ℃"], [233, "10 生产厂家 大连派斯"]]}, {"t": "公用规程 第 459～463 行", "lines": [[459, "15 #1天然气循环水热交换器水侧安全阀 0.78 MPa"], [460, "16 #2天然气循环水热交换器水侧安全阀 0.78 MPa"], [461, "17 #1天然气循环水热交换器气侧安全阀 6.93 MPa"], [462, "18 #2天然气循环水热交换器气侧安全阀 6.93 MPa"], [463, "19 天然气电加热器安全阀 6.93 MPa"]]}, {"t": "公用规程 第 485～496 行", "lines": [[485, "表 16 天然气循环水热交换器参数"], [486, "序号 名称 数值 单位"], [487, "1 型式 SWA-RQ124376"], [488, "2 设计单位 江苏盛伟燃气科技有限公司"], [489, "3 设计压力（管程） 7.0 MPa"], [490, "4 设计压力（壳程） 0.8 MPa"], [491, "5 设计温度（管程） -10/60 ℃"], [492, "6 设计温度（壳程） 60 ℃"], [493, "7 壳程介质 热水"], [494, "8 管程介质 天然气"], [495, "9 筒体材质 Q345R"], [496, "10 换热管材料 S31603"]]}, {"t": "公用规程 第 666～689 行", "lines": [[666, "4.2.2.7 天然气加热及调压单元"], [667, "天然气经清管站、过滤单元、计量单元后，供气压力为6.3MPa（天然气管网升压后），为满足燃机"], [668, "燃烧天然气压力及温度要求，天然气经加热单元和调压单元，分别向三台机组提供压力为4.05MPa、温"], [669, "度＞50℃的天然气。"], [670, "1、加热单元"], [671, "为满足燃气轮机在各种工况下对燃料温度要求， 防止低温下调压单元工作异常， 设置天然气加热单"], [672, "元，布置在计量单元后。"], [673, "加热单元由热水换热器和启动电加热器组成，采取串联布置。"], [678, "1）设置2台热水换热器，"], [679, "一运一备， 型式为单流程管壳式换热器， 配有进口气动关断阀、 出口手动"], [680, "关断阀、旁路阀、手动放空阀、安全阀、排污阀、充氮口、压力及温度测量元件等设备。采用机组循环"], [681, "水作为加热介质，配有2台循环水升压泵，"], [682, "一运一备，加热水源从三台冷却塔回水管上接出，经循环水"], [683, "升压泵升压，至热水换热器加热天然气后回至循环水前池。"], [684, "2）设置1台启动电加热器， 当循环水温度低时使用。 电加热器配有进出口手阀、 安全阀、 排放阀及"], [685, "温度测量元件等设备。"], [686, "2、调压单元"], [687, "通过调压单元（天然气管网升压后），将管网供气压力由6.3MPa降压至4.05MPa。采用机组单元制"], [688, "控制方式，每台机组两路，"], [689, "一运一备运行方式。"]]}, {"t": "公用规程 第 709～711 行", "lines": [[709, "4.2.2.9 启动锅炉加热单元"], [710, "启动锅炉加热单元用于加热天然气使其温度满足启动锅炉的要求并高于相应压力下的水/烃露点，"], [711, "防止天然气结露。"]]}, {"t": "机岛规程 第 1999～2002 行", "lines": [[1999, "来自调压站的燃气首先经过两个绝对分离器为两级过滤/分离装置，垂直并联布置，第一级用惯性"], [2000, "分离除去较大的液滴和颗粒，第二级是聚凝式过滤器，可以去除99.5%直径≤0.3μm的液体和固体。燃"], [2001, "气从过滤分离器出来，经过燃气科氏流量计（96VM-1)后进入性能加热器模块。性能加热器将气体加热"], [2002, "至其要求的温度。加热热源取自余热锅炉中压（IP）省煤器出口给水，回水至凝结水母管。"]]}], "cards": ["D:2.4-3", "RJ-56ef8734", "D:2.4-2", "RJ-7b0c61b1", "D:2.4-4", "RJ-a388d6bf", "D:2.4-1", "RJ-c10da99b", "D:2.4-5"]}, "2.5": {"id": "2.5", "name": "调压单元", "cat": "二", "gist": "每台机组两路调压线，一运一备。每路从上游到下游依次是入口手动阀、安全切断阀、监控调压器、工作调压器、出口手动阀，调压器都是自力式（用阀后燃气自己驱动）。正常由工作调压器调出口压力；工作调压器坏了，监控调压器接管；压力再升到安全切断阀的定值，就切断这一路。定值：工作调压器两路分别 4.25、4.15 MPa，监控调压器 4.35 MPa，工作调压器后安全阀 4.8 MPa，安全切断阀 4.9、5.0 MPa。", "reg": "公用 4.2.2.7（调压单元）、表 13、表 14、表 17", "lecture": "\u003cp>调压站给每台燃机配了两路调压线，一运一备。调压线的任务是把管网来的天然气从 6.3 MPa 降到 4.05 MPa，再送往机组\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>。\u003c/p>\n\u003cp>一路调压线上，从上游到下游串着五样东西：入口手动阀、安全切断阀、监控调压器、工作调压器、出口手动阀。每路调压线另外还装了安全阀和放散管\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>。\u003c/p>\n\u003ch4>自力式调压器靠什么动作\u003c/h4>\n\u003cp>两个调压器都是自力式的，规程写的是「利用调压器后管路的天然气进行调压」\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>，不接外部气源，也不接电。\u003c/p>\n\u003cp>它的动作原理是：调压器里有一张膜片，膜片一侧通过取压管接到调压器后面的管道，感受出口压力；另一侧压着弹簧，弹簧的力就是设定值。膜片带着阀芯一起动。出口压力高于设定值，膜片把阀芯往关的方向推，阀口变小，过去的气少了，出口压力降下来；出口压力低于设定值，弹簧把阀芯往开的方向推，阀口变大，出口压力回升。阀芯最后停在出口压力刚好等于设定值的位置\u003cspan class=\"infer\">原理：自力式调压器的一般结构，本厂调压器的具体结构规程没写\u003c/span>。推动阀芯的力来自天然气自己的压力，所以叫自力式。\u003c/p>\n\u003ch4>正常时谁在调\u003c/h4>\n\u003cp>正常运行时，出口压力由工作调压器调节。工作调压器出了故障，监控调压器自动接过来调。如果下游压力还在往上涨，涨到安全切断阀的设定压力，安全切断阀就关掉这一路\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>。\u003c/p>\n\u003cp>规程表 13、表 14 给出的定值是：\u003c/p>\n\u003cul>\n\u003cli>安全切断阀：#1 调压线 4.9 MPa，#2 调压线 5 MPa\u003c/li>\n\u003cli>工作调压器：#1 调压线 4.25 MPa，#2 调压线 4.15 MPa\u003c/li>\n\u003cli>监控调压器：两路都是 4.35 MPa\u003c/li>\n\u003cli>工作调压器后的安全阀：4.8 MPa\u003c/li>\n\u003c/ul>\n\u003cp>题库说监控调压阀的设定值略高于工作调压阀\u003cspan class=\"cite\">题库 RJ-a592c6cd\u003c/span>，和表 13 一致。\u003c/p>\n\u003cp>监控调压器串在工作调压器上游，感受的也是调压线出口的压力。正常时出口压力被工作调压器控制在 4.25 MPa 附近，低于监控调压器的设定值 4.35 MPa。对监控调压器来说这是「压力不够」，弹簧就把它推到全开，它只让气通过，不参与调节。所以题库说正常时监控调压阀处于全开状态\u003cspan class=\"cite\">题库 RJ-4616d080\u003c/span>\u003cspan class=\"infer\">原理：由自力式调压器的动作方式和表 13 的定值推出，规程没写这句话\u003c/span>。\u003c/p>\n\u003cp>只有工作调压器失灵、阀口开得过大，出口压力涨过 4.35 MPa，监控调压器才开始往小关，把出口压力管住。压力继续涨到 4.8 MPa，工作调压器后的安全阀起跳，放掉一部分气；到 4.9 MPa，安全切断阀把这一路切掉\u003cspan class=\"infer\">推断：按定值高低推出的配合关系，规程没写\u003c/span>。安全阀放散时这一路还在供气，安全切断阀一关就断了，定值这样排，是让后果轻的动作先来\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>规程写「监控调压器为事故常关配置，如果监控调压器发生故障，则该调压支路关闭」\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>。这说的是监控调压器自己坏了以后会关死，这一路就断了，说的不是它平时的状态。调压器坏了停在哪个位置，是设计时选定的：监控调压器选坏了就关，它自己出故障时宁可让这一路断气，也不让下游失去这一道超压保护\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003ch4>两路工作调压器定值为什么错开\u003c/h4>\n\u003cp>两路工作调压器的定值不一样，#1 调压线 4.25 MPa，#2 调压线 4.15 MPa，规程没写原因\u003cspan class=\"cite\">公用 表 13\u003c/span>。如果两路的手动阀都开着，出口压力由定值高的 #1 调压线维持在 4.25 MPa 附近；#2 的工作调压器感受到的压力高于自己的 4.15 MPa，就一直关着。#1 被安全切断阀切掉以后，出口压力往下掉，掉到 4.15 MPa，#2 自己开始调节，不用人去切换\u003cspan class=\"infer\">推断：按两路定值推出\u003c/span>。\u003c/p>\n\u003cp>所以两路都投着的时候，实际在跑的总是定值高的 #1 调压线；要让 #2 做运行线，就得把 #1 隔离\u003cspan class=\"infer\">推断\u003c/span>。现场手动阀平时怎么摆，DCS 上怎么看哪一路在运行，规程没写，要到现场确认。\u003c/p>\n\u003ch4>出口压力对不上\u003c/h4>\n\u003cp>规程写调压单元把压力降至 4.05 MPa，表 13 的工作调压器定值却是 4.25 和 4.15 MPa，两处对不上，以现场为准\u003cspan class=\"cite\">公用 4.2.2.7、表 13\u003c/span>。\u003c/p>", "sources": [{"t": "公用规程 第 686～695 行", "lines": [[686, "2、调压单元"], [687, "通过调压单元（天然气管网升压后），将管网供气压力由6.3MPa降压至4.05MPa。采用机组单元制"], [688, "控制方式，每台机组两路，"], [689, "一运一备运行方式。"], [690, "每路调压线均由入口手动阀、安全切断阀、监控调压器、工作调压器、出口手动阀的串联在一起，"], [691, "实现安全、 监控式减压的功能。 正常工况下， 工作调压器调节天然气调压站出口压力， 当工作调压器故"], [692, "障， 监控调压器自动投入运行； 监控调压器为事故常关配置， 如果监控调压器发生故障， 则该调压支路"], [693, "关闭。 当下游压力异常上升至安全切断阀设定压力时， 安全切断阀关闭以保证系统安全， 每路调压线都"], [694, "设有安全阀和放散管路。"], [695, "调压线的工作调压器和监控调压器均为自力式调压器，即利用调压器后管路的天然气进行调压。"]]}, {"t": "公用规程 第 435～443 行", "lines": [[435, "表 13 天然气调压单元设定值"], [436, "序号 名称 设定值 单位"], [437, "1 机组#1 调压线安全切断阀设定压力 4.9 MPa"], [438, "2 机组#2 调压线安全切断阀设定压力 5 MPa"], [439, "3 机组#1 调压线工作调压器设定压力 4.25 MPa"], [440, "4 机组#2 调压线工作调压器设定压力 4.15 MPa"], [441, "5 机组#1 调压线监控调压器设定压力 4.35 MPa"], [442, "6 机组#2 调压线监控调压器设定压力 4.35 MPa"], [443, "表 14 安全放散阀设定值"]]}, {"t": "公用规程 第 464～473 行", "lines": [[464, "20 #1机组#1调压线工作调压器后安全阀 4.8 MPa"], [469, "21 #1机组#2调压线工作调压器后安全阀 4.8 MPa"], [470, "22 #2机组#1调压线工作调压器后安全阀 4.8 MPa"], [471, "23 #2机组#2调压线工作调压器后安全阀 4.8 MPa"], [472, "24 #3机组#1调压线工作调压器后安全阀 4.8 MPa"], [473, "25 #3机组#2调压线工作调压器后安全阀 4.8 MPa"]]}], "cards": ["D:2.5-2", "RJ-4616d080", "D:2.5-4", "RJ-a592c6cd", "D:2.5-5", "D:2.5-1", "D:2.5-3", "D:2.5-6"]}, "2.6": {"id": "2.6", "name": "增压机", "cat": "二", "gist": "管网压力低时启动，每台燃机一套，把天然气从约 2.9 MPa 升到 4.3 MPa。密封是干气密封，主密封用天然气，次密封用氮气。启动前润滑油温要在 21 ℃ 以上，进气温度在 10 ℃ 以上；先投主密封，再投次密封。停机后辅助油泵继续运行；要退密封时，先退次密封，再退主密封，防止增压机进油。", "reg": "公用 4.2.2.6、表 7、表 14、4.3.5", "lecture": "\u003cp>本厂管网升压以后，增压机已经停运，规程里还按原设计写着它。规程 4.2.2.7 写，天然气管网升压后，供气压力为 6.3MPa，由调压单元降到 4.05MPa 送往三台机组\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>。来气压力已经比机组要的高，只需要减压，用不着升压。\u003c/p>\n\u003cp>增压机是为管网压力低的时候设的：每台燃气轮机配一套，管网天然气压力低时启动，把供气压力提上去\u003cspan class=\"cite\">公用 4.2.2.6\u003c/span>。按表 7，设计入口压力 2.9 MPa，出口压力 4.3 MPa\u003cspan class=\"cite\">公用 表 7\u003c/span>。这一节保留，是因为离心压缩、干气密封、润滑油系统的原理在别的转动设备上也用得到；启停步骤只作了解。\u003c/p>\n\u003ch4>离心压缩\u003c/h4>\n\u003cp>表 7 写增压机的型式是齿轮增速式\u003cspan class=\"cite\">公用 表 7\u003c/span>。规程对原理的说法是：通过离心力提高气体流速，把动能转化为气体的压力能\u003cspan class=\"cite\">公用 4.2.2.6\u003c/span>。展开说，气体从叶轮中心进入，被高速旋转的叶片甩向外缘，速度和压力都升高；出了叶轮进入扩压段，通道逐渐变宽，气流减速，降下来的那部分速度变成压力\u003cspan class=\"infer\">原理：离心压缩机的一般工作原理\u003c/span>。叶轮外缘线速度越高，交给气体的能量越多，所以电机和叶轮之间要用齿轮把转速增上去\u003cspan class=\"infer\">原理：同上\u003c/span>。\u003c/p>\n\u003ch4>干气密封\u003c/h4>\n\u003cp>压缩机的轴穿出机壳的地方必须密封，否则机壳里的天然气会顺着轴漏出来。增压机用干气密封，主密封用天然气，次密封用氮气\u003cspan class=\"cite\">公用 表 7\u003c/span>。\u003c/p>\n\u003cp>干气密封是不接触的端面密封：一个动环随轴转，一个静环不转，动环端面上刻着很浅的槽。轴转起来后，槽把密封气压进两个端面之间，形成一层很薄的气膜把两环顶开，两环不接触、不磨损，只有很少的密封气从气膜漏过去\u003cspan class=\"infer\">原理：干气密封的一般结构，规程没写\u003c/span>。\u003c/p>\n\u003cp>主密封在里侧，挨着机壳里的天然气，密封气压力比机内略高，气流从密封往机内走。主密封气用天然气，漏进机内的是同一种气，不会弄脏工艺气\u003cspan class=\"infer\">推断：串联式干气密封的一般做法\u003c/span>。次密封在外侧，是主密封的后备。次密封用氮气，从外侧漏出、靠近轴承箱和大气那一边的就是不燃的氮气，不会在轴承附近形成可燃混合气\u003cspan class=\"infer\">推断：同上\u003c/span>。这路氮气由制氮系统供给\u003cspan class=\"cite\">见考点 2.7\u003c/span>，压力 0.4 MPa\u003cspan class=\"cite\">公用 表 7\u003c/span>。\u003c/p>\n\u003cp>规程要求投密封气时先投主密封、再投次密封；退出时先退次密封、再退主密封\u003cspan class=\"cite\">公用 4.3.5.2、4.3.5.3\u003c/span>。这样主密封一侧的压力始终不低于次密封一侧，氮气不会反过来压向主密封，干气密封一般承受不了这种反向压差\u003cspan class=\"infer\">推断：规程没写原因\u003c/span>。\u003c/p>\n\u003ch4>润滑油系统\u003c/h4>\n\u003cp>轴承的润滑油就在密封外侧不远处。要退出密封系统时，规程要求先停辅助油泵、再停油雾风机，然后才退密封，并注明顺序不能颠倒，为的是防止增压机进油\u003cspan class=\"cite\">公用 4.3.5.3\u003c/span>。只要油泵在转，油和油雾就会沿着轴往里窜，是密封气一直往外吹才把油挡住；先撤气后停油，油就可能窜进密封端面，甚至进到压缩机里\u003cspan class=\"infer\">推断：规程没写机理\u003c/span>。\u003c/p>\n\u003cp>油箱要保持真空，防止油封中渗油\u003cspan class=\"cite\">公用 4.3.5.3\u003c/span>。油雾风机把油箱和轴承箱抽成微负压，油封外面压力高、里面低，空气只会往里吸，油和油雾就不会往外渗\u003cspan class=\"infer\">原理\u003c/span>。\u003c/p>\n\u003cp>停机时按 stop 按钮，辅助润滑油泵随即启动，增压机自动停下\u003cspan class=\"cite\">公用 4.3.5.3\u003c/span>。停机期间辅助油泵要一直运行，防止环境温度低于 10℃ 时增压机传动装置冷凝或腐蚀\u003cspan class=\"cite\">公用 4.3.5.3\u003c/span>。油一直在循环，齿轮和轴承表面始终有油膜把金属和潮湿空气隔开；天冷时静止的金属表面温度低，水汽容易凝在上面锈蚀齿面和轴承\u003cspan class=\"infer\">原理\u003c/span>。增压机停运 30 分钟内，冷却水和油系统也继续运行，带走余热\u003cspan class=\"cite\">公用 4.3.5.3\u003c/span>。\u003c/p>\n\u003ch4>启停步骤（了解）\u003c/h4>\n\u003cp>启动前要确认增压机系统已置换成天然气、严密无泄漏，润滑油温在 21℃ 以上，天然气进气温度在 10℃ 以上\u003cspan class=\"cite\">公用 4.3.5.1\u003c/span>。启动顺序是：投密封气（先主后次），启动油雾风机，启动辅助润滑油泵，启动增压机；油压、油温正常后辅助润滑油泵自动停止转备用\u003cspan class=\"cite\">公用 4.3.5.2\u003c/span>。主密封流量原文写「60-70sfcm」，sfcm 很可能是 scfm（标准立方英尺每分钟）的笔误\u003cspan class=\"infer\">推断：规程没解释这个单位\u003c/span>。\u003c/p>", "sources": [{"t": "公用规程 第 280～303 行", "lines": [[280, "表 7 天然气增压机参数"], [281, "序号 名称 数值 单位"], [282, "1 型式 齿轮增速式"], [283, "2 天然气额定流量 121190 Nm"], [284, "3/h"], [285, "3 天然气最大流量 143585 Nm"], [286, "3/h"], [287, "4 天然气入口压力 2.9 MPa"], [288, "5 天然气出口压力 4.3 MPa"], [289, "6 压比 1.467"], [290, "7 转速 2981 rpm"], [291, "8 入口调节阀调节范围 60-100 %"], [292, "9 回流调节范围 0-100 %"], [293, "10 天然气增压机电机功率 2000 kW"], [294, "11 天然气增压机电机电压 6 KV"], [295, "12 回流冷却器容量 110 %"], [296, "13 回流冷却器冷却水流量 180 t/h"], [297, "14 回流冷却器阻力 ≤60 kPa"], [298, "15 天然气增压机密封型式 干气密封"], [299, "16 天然气增压机密封介质 主密封为天然气，次密封为氮气"], [300, "17 密封气耗量（氮气） ≤25 m"], [301, "3/h"], [302, "18 密封气压力（氮气） 0.4 MPa"], [303, "19 压缩级数 1 级"]]}, {"t": "公用规程 第 660～669 行", "lines": [[660, "4.2.2.6 增压机单元"], [661, "增压单元用于改善天然气压力不足， 提高天然气供气压力， 满足燃机所需的压力， 每台燃气轮机各"], [662, "配置 1 套天然气增压机，当管网天然气压力低时，启动天然气增压机运行。"], [663, "增压机系统由整体压缩机、驱动电机、油箱、冷油器、辅助油泵、润滑油过滤器等组成。压缩机采"], [664, "用多级齿轮离心管线式压缩机， 主要进行气体压缩， 通过离心力提高气体流速， 将动能转化为气体的压"], [665, "力能。"], [666, "4.2.2.7 天然气加热及调压单元"], [667, "天然气经清管站、过滤单元、计量单元后，供气压力为6.3MPa（天然气管网升压后），为满足燃机"], [668, "燃烧天然气压力及温度要求，天然气经加热单元和调压单元，分别向三台机组提供压力为4.05MPa、温"], [669, "度＞50℃的天然气。"]]}, {"t": "公用规程 第 686～687 行", "lines": [[686, "2、调压单元"], [687, "通过调压单元（天然气管网升压后），将管网供气压力由6.3MPa降压至4.05MPa。采用机组单元制"]]}, {"t": "公用规程 第 700～700 行", "lines": [[700, "天然气增压机配置了 2 套制氮系统， 为天然气增压机提供密封用氮气及置换用氮气。制氮系统由 2"]]}, {"t": "公用规程 第 823～855 行", "lines": [[823, "4.3.5 增压机启停操作"], [824, "4.3.5.1 启动前检查"], [825, "1) 检查相关检修工作已终结， 无关人员撤离， 四周清洁无杂物。 检查增压机系统已置换成天然气，"], [826, "系统严密无泄漏。"], [827, "2) 检查调压站及前置模块具备启动条件。"], [828, "3) 检查润滑油箱油位在 1/2 以上，启动前润滑油温在 21℃以上，检查润滑油冷却水、滤网投入正"], [829, "常。"], [830, "4) 联系测量增压机、辅助油泵、油雾风机电机绝缘，合格后送电，恢复备用。"], [831, "5) 检查增压机控制间 PLC 控制面板带电，PLC 界面出现“"], [832, "compressor is ready to start”"], [833, ",增压"], [834, "机投备完成。"], [835, "6) 检查增压机电机冷却水投入正常。"], [836, "7) 检查热工仪表正常投入。"], [837, "8) 检查增压机的天然气进气温度在 10℃以上。"], [838, "4.3.5.2 启动"], [839, "1) 检查天然气增压机具备启动条件。"], [840, "2) 投运增压机密封气系统，先投主密封（60-70sfcm），再投次密封，检查密封气流量正常。"], [841, "3) 启动油箱油雾风机，检查油箱真空正常。"], [842, "4) 启动辅助润滑油泵，检查润滑油压力正常 0.14Mpa 左右，轴承入口润滑油温正常 43～55℃。"], [843, "5) 启动增压机，检查增压机出力正常；"], [844, "6) 检查润滑油压力、温度正常后，辅助润滑油泵自动停止备用。"], [845, "7) 检查天然气和润滑油系统无泄漏。"], [846, "4.3.5.3 停运"], [847, "1) 按下控制面板上的“"], [848, "stop”按钮，辅助润滑油泵启动，检查增压机自动停止。。"], [849, "2) 在停机期间需保持辅助油泵的运行， 防止环境温度低于 10℃的情况下， 增压机传动装置冷凝或"], [850, "腐蚀。"], [851, "3) 在辅助油泵或增压机运行时，保持油箱真空正常，防止油封中渗油。"], [852, "4) 停止仪表气源供应。"], [853, "5) 增压机停运 30 分钟内，维持冷却水和油系统的运行，降低系统热量，防止损坏系统。"], [854, "6) 若增压机需退出密封系统运行，应先停运辅助油泵，再停运油雾风机；先退次密封，再退主密"], [855, "封（操作先后顺序不能颠倒，防止增压机进油）。"]]}], "cards": ["D:2.6-2", "D:2.6-5", "D:2.6-3", "D:2.6-1", "D:2.6-6", "D:2.6-4"]}, "2.7": {"id": "2.7", "name": "制氮系统", "cat": "二", "gist": "两套，给增压机提供密封用和置换用的氮气。流程是：空压机压缩空气 → 过滤去水和油 → 干燥 → 超精过滤 → 活性炭罐除油和烃 → 两台装碳分子筛的吸附器做氮氧分离 → 氮气储罐。氮气纯度不合格时手动放空，直到合格。", "reg": "公用 4.2.2.8、表 8、4.3.6、4.3.7", "lecture": "\u003cp>规程写，调压站给天然气增压机配了 2 套制氮系统，提供密封用氮气和置换用氮气\u003cspan class=\"cite\">公用 4.2.2.8\u003c/span>。本厂管网升压以后增压机已经停运\u003cspan class=\"cite\">见考点 2.6\u003c/span>，密封用氮这一项现在用不上了。置换用氮还在：调压站的气体置换，靠充氮系统加上各单元的充氮接头和放散系统来完成\u003cspan class=\"cite\">公用 4.3.3\u003c/span>；长期停运时各单元也要充氮保压\u003cspan class=\"cite\">公用 4.3.11\u003c/span>。现在置换用的氮气是这套系统现制的，还是另用氮气瓶，规程没写，要到现场问。\u003c/p>\n\u003ch4>氮和氧是怎么分开的\u003c/h4>\n\u003cp>空气里大部分是氮气，其次是氧气，制氮就是把氧去掉。本厂用的是变压吸附\u003cspan class=\"cite\">公用 表 8\u003c/span>，吸附器里装的是碳分子筛\u003cspan class=\"cite\">公用 4.2.2.8\u003c/span>。碳分子筛上布满极细的微孔，氧分子比氮分子略小，钻进微孔的速度比氮分子快得多。压缩空气从吸附器下部通进去，在带压而且时间很短的情况下，氧气大部分被吸进微孔，氮气来不及被吸住，就从上部出去成为产品氮气\u003cspan class=\"infer\">原理：碳分子筛变压吸附的一般原理\u003c/span>。一台吸附器吸满以后，把它泄压到常压，微孔里的氧气在低压下放出来排掉，吸附剂就再生了。两台吸附器一台加压吸附、一台泄压再生，轮流切换，压力一高一低地变，所以叫「变压」吸附\u003cspan class=\"infer\">原理：同上\u003c/span>。规程要求运行中检查「各吸附器压力循环是否正常」，查的就是这个切换\u003cspan class=\"cite\">公用 4.3.7\u003c/span>。\u003c/p>\n\u003ch4>空气为什么要先处理\u003c/h4>\n\u003cp>碳分子筛怕油和水：油会把微孔堵死，水汽会占住吸附的位置，分离效果就下降\u003cspan class=\"infer\">原理\u003c/span>。所以空气进吸附器之前要先处理一遍\u003cspan class=\"cite\">公用 4.2.2.8\u003c/span>：\u003c/p>\n\u003col>\n\u003cli>空压机加压，两台精密过滤器除去大部分液态水和油污。\u003c/li>\n\u003cli>干燥机把压缩空气的压力露点降到约 -45℃，除去大量水分。\u003c/li>\n\u003cli>超精过滤器进一步除去固体颗粒。\u003c/li>\n\u003cli>活性碳罐除去大部分油类、烃类。\u003c/li>\n\u003cli>经空气缓冲罐进入两台吸附器做氮氧分离；氮气进氮气缓冲罐，经精密过滤器过滤后送到用气点。\u003c/li>\n\u003c/ol>\n\u003cp>压力露点，是压缩空气在它自己的工作压力下冷却到多少度开始析出水。它和天然气的水露点\u003cspan class=\"cite\">见考点 2.4\u003c/span>是同一个意思，都是「在当前压力下，温度降到这里就结露」，只是一个说压缩空气，一个说天然气\u003cspan class=\"infer\">原理\u003c/span>。压力露点越低，空气越干。\u003c/p>\n\u003cp>干燥机的型式，规程两处写得不一样：4.2.2.8 的流程写「冷冻式干燥机」，表 8 写「微热再生吸附式」\u003cspan class=\"cite\">公用 表 8\u003c/span>。4.3.6.2 的启动步骤写两个吸附组「一工作组开始再生另一工作组开始吸附」，是吸附式的动作方式\u003cspan class=\"cite\">公用 4.3.6.2\u003c/span>。冷冻式干燥机靠制冷析水，露点做不到零下很多度，约 -45℃ 的压力露点只有吸附式做得到，所以本厂干燥机应当是吸附式，流程里的「冷冻式」多半是笔误\u003cspan class=\"infer\">推断：由表 8、启动步骤和露点数值推出，以现场设备为准\u003c/span>。吸附式干燥机的道理和制氮吸附器相近，也是两组轮流，一组吸水、一组再生\u003cspan class=\"infer\">原理\u003c/span>。\u003c/p>\n\u003ch4>启停（了解）\u003c/h4>\n\u003cp>启动按空压机、干燥机、制氮机的顺序，也就是先有压缩空气，再干燥，最后进制氮机\u003cspan class=\"cite\">公用 4.3.6.2\u003c/span>。下面几个细节背后是同一个道理：不合格的气不往下游送。\u003c/p>\n\u003cul>\n\u003cli>干燥机启动后，要等程序运行 3～5 周期，才缓慢打开出气阀门，把干燥后的空气并入压缩空气储罐\u003cspan class=\"cite\">公用 4.3.6.2\u003c/span>。刚启动时吸附组还没进入稳定切换，出口空气不够干，早开会把湿空气送进储罐和制氮机\u003cspan class=\"infer\">推断：规程没写原因\u003c/span>。\u003c/li>\n\u003cli>制氮机启动后，氮气缓冲罐压力升到 0.6MPa 时先打开放空装置，等氮气纯度合格，再关放空阀、开出口阀\u003cspan class=\"cite\">公用 4.3.6.2\u003c/span>。刚起来的吸附器还没进入稳定循环，出来的氮气纯度不够，先排掉\u003cspan class=\"infer\">推断：规程没写原因\u003c/span>。\u003c/li>\n\u003cli>运行中氮气分析仪显示纯度不合格，也要手动放空，直到合格\u003cspan class=\"cite\">公用 4.3.7\u003c/span>。\u003c/li>\n\u003c/ul>\n\u003cp>停运的顺序是：关氮气储罐出口手阀，停制氮机，关压缩空气储罐出口手阀，停空压机，最后停干燥机\u003cspan class=\"cite\">公用 4.3.6.3\u003c/span>。先关出口，是把合格的氮气留在储罐里，并和用户隔开；干燥机放在最后，可能是让它在空压机停下后把正在进行的再生做完，不带着潮气停下\u003cspan class=\"infer\">推断：规程没写原因\u003c/span>。\u003c/p>", "sources": [{"t": "公用规程 第 699～708 行", "lines": [[699, "4.2.2.8 制氮单元"], [700, "天然气增压机配置了 2 套制氮系统， 为天然气增压机提供密封用氮气及置换用氮气。制氮系统由 2"], [701, "台空压机、1 台空气冷却器、2 台空气干燥机、1 台 6.5m³压缩空气储罐、2 台变压吸附制氮装置、1 台"], [702, "5m³氮气储罐等设备组成。"], [703, "制氮流程：由空气经压缩机加压，进入两台精密过滤器，通过螺旋、凝聚、表面三级过滤除去大部"], [704, "分液态水和油污，然后进入冷冻式干燥机，将压缩空气的压力露点降至约-45℃，除去大量的水分，之"], [705, "后进入超精过滤器，进一步除去压缩空气中含有的固体颗粒，使压缩空气品质达到 0.01um，接着进入"], [706, "一台活性碳罐，除去大部分的油类、烃类等，然后经空气缓冲罐，空气被导入吸附分离系统，进行氮氧"], [707, "分离。该分离系统由两台填装碳分子筛的吸附器组成，当吸附塔工作时，压缩空气自吸附器下部流进。"], [708, "氮气自上部位阀门流进氮气缓冲罐经精密过滤器过滤后输送到用气点。"]]}, {"t": "公用规程 第 320～351 行", "lines": [[320, "表 8 制氮设备参数"], [321, "序号 名称 数值 单位"], [322, "一"], [323, "、制氮机"], [324, "1 型式 变压吸附式"], [329, "2 氮气产量 3 氮气纯度 4 工作压力 5 氮气露点 6 功率 7 电压 8 进气气源质量"], [330, "要求"], [331, "进气温度 进气含油量 二、干燥机"], [332, "1 型式 2 型号 3 处理量 4 进气温度 5 进气压力 6 再生耗气量 7 功率 8 电压 三、高精过滤器"], [333, "1 型号 2 处理量 3 精度 四、空压机"], [334, "1 型式 2 处理量 3 电机功率 4 电压 5 转速 五、压缩空气冷却器"], [335, "1 参数名称 2 工作压力 3 设计压力 4 工作温度进/出 5 设计温度 6 介质 7 容积 六、压缩空气储罐"], [336, "1 工作压力 2 设计压力 3 工作温度 4 设计温度 5 介质 6 容积 6"], [337, "75 Nm"], [338, "3/h"], [339, "96-99.999 %"], [340, "0.6（可调） MPa"], [341, "≤-45 ℃"], [342, "0.5 kW"], [343, "220 V"], [344, "≤45 ℃"], [345, "≤200 mg/m"], [347, "微热再生吸附式"], [348, "ASY067"], [349, "6.7 m³/min"], [350, "≤45 ℃"], [351, "0.6-1.0 MPa"]]}, {"t": "公用规程 第 776～777 行", "lines": [[776, "用氮气置换系统中的空气或天然气。 调压站的气体置换工作通过充氮系统与调压站各单元模块配置"], [777, "的充氮接头及放散系统来完成。整个系统可以一次完成置换工作，也可以分单元模块单独进行。"]]}, {"t": "公用规程 第 856～902 行", "lines": [[856, "4.3.6 制氮系统启停操作"], [857, "4.3.6.1 启动前检查"], [858, "1) 确认制氮系统检修工作已结束，系统管道、阀门完好，现场整洁无异物。"], [859, "2) 按阀门检查卡确认系统阀门的状态位置正确。"], [860, "3) 确认闭式水系统已投入，水压、水温正常。"], [861, "4) 检查各热控仪表投入正常。"], [862, "5) 检查设备绝缘正常，设备已送电。"], [863, "6) 油气分离器、除尘过滤器底部疏水手动门打开，放尽存水后关闭。"], [864, "4.3.6.2 制氮系统启动"], [865, "1) 空压机启动"], [866, "(1) 确认电源已经送上，控制屏上无报警，检查参数设定值设置正确。"], [867, "(2) 检查控制版面上显示“READY.TO.START”"], [868, "。"], [873, "(3) 在控制面板上点击“启动”按钮。"], [874, "(4) 检查空压机运行正常。"], [875, "2) 干燥机启动"], [876, "(1) 确认电源已经送上，控制屏上无报警，检查参数设定值设置正确。"], [877, "(2) 缓慢开启进气阀门，使干燥机建立压力（ 注意观察压力表的指针指示，确保两个吸附组同处"], [878, "于吸附填充状态，且升压速率要一致）；"], [879, "(3) 在控制面板上点击“启动”按钮，干燥机启动运行正常；"], [880, "(4) 待程序（即一工作组开始再生另一工作组开始吸附）运行 3～5 周期后，缓慢打开出气阀门，"], [881, "使经干燥机干燥后的气体并入压缩空气储罐。"], [882, "(5) 检查干燥机运行正常。"], [883, "3) 制氮机启动"], [884, "(1) 启动前确认制氮机入口空气储气罐压力正常，打开储气罐底部放水阀充分放水后关闭。"], [885, "(2) 确认电源已经送上，控制屏上无报警，检查参数设定值设置正确。"], [886, "(3) 合上氮气分析仪开关。"], [887, "(4) 打开压缩空气储罐出口手阀。"], [888, "(5) 在制氮机控制面板上点击“启动”按钮，检查制氮机运行正常。"], [889, "(6) 待氮气缓冲罐压力升到 0.6MPa 时，缓缓打开放空装置，等氮气纯度合格后，关闭放空阀，打"], [890, "出口阀，使流量逐步升到额定产气量。"], [891, "4.3.6.3 制氮系统停运"], [892, "1) 关闭氮气储罐出口手阀。"], [893, "2) 在制氮机控制面板上点击“停止”按钮，检查制氮机已停运。"], [894, "3) 关闭压缩空气储罐出口手阀。"], [895, "4) 在空压机控制面板上点击“停止”按钮，检查空压机已停运。"], [896, "5) 在干燥机控制面板上点击“停止”按钮，检查干燥机已停运。"], [897, "4.3.7 运行注意事项"], [898, "1) 系统在运行过程中， 需定期检查各设备运行情况， 如空压机是否处于工作状态， 温度是否正常，"], [899, "各吸附器压力循环是否正常，成品氮气浓度是否符合要求。"], [900, "2) 注意氮气分析仪显示氮气纯度是否合格，若不合格需进行手动放空直至合格。"], [901, "3) 精密过滤器及催化净化器的过滤材料需定期维护保养，连续 24 小时使用建议 6 个月更换一次,"], [902, "非连续使用情况建议 12 个月更换一次。"]]}, {"t": "公用规程 第 930～933 行", "lines": [[930, "4.3.11 长期停运规定"], [931, "1) 关闭各单元的进、出口隔断球阀，分别对每一个单元进行泄压、充氮置换操作；"], [932, "2) 保持系统氮气的压力约 0.3-0.5Mpa；"], [933, "3) 关闭所有与大气相连的阀门，以防空气进入。"]]}], "cards": ["D:2.7-3", "D:2.7-8", "D:2.7-4", "D:2.7-5", "D:2.7-7", "D:2.7-6", "D:2.7-1", "D:2.7-2"]}, "2.8": {"id": "2.8", "name": "启动锅炉的加热和调压", "cat": "二", "gist": "每台启动锅炉配一台电加热器，把天然气加热到高于水露点和烃露点，防止结露；再经两条调压线（一用一备，各有安全切断阀、监控调压阀、工作调压阀）把压力降到 0.07 MPa 左右。", "reg": "公用 4.2.2.9、4.2.2.10、表 9～表 11、表 14、表 21", "lecture": "\u003cp>调压站设计为一进五出，除了三台燃机，还给两台启动锅炉供气\u003cspan class=\"cite\">公用 4.2.1\u003c/span>。去启动锅炉的这一路上，电加热器和启动锅炉调压单元串联安装\u003cspan class=\"cite\">公用 4.2.2.9\u003c/span>。\u003c/p>\n\u003ch4>为什么先加热\u003c/h4>\n\u003cp>规程写加热的目的是：让天然气温度满足启动锅炉的要求，并高于相应压力下的水/烃露点，防止天然气结露\u003cspan class=\"cite\">公用 4.2.2.9\u003c/span>。\u003c/p>\n\u003cp>这一路的压力降得特别多。表 11 写启动锅炉调压器阀前压力 3.3～6.3 MPa，阀后 0.07 MPa\u003cspan class=\"cite\">公用 表 11\u003c/span>，几乎是从管网压力一直降到接近常压。天然气流过调压阀、压力大幅下降时，温度会明显降低，这叫节流降温；压降越大，温度掉得越多\u003cspan class=\"infer\">原理：节流效应\u003c/span>。不先加热，调压阀后的气温可能掉到露点以下，水和较重的烃析出来，严重时在阀芯处结冰或生成水合物，把调压器卡住或堵住\u003cspan class=\"infer\">原理\u003c/span>。所以电加热器装在调压单元前面，先加热、再降压\u003cspan class=\"infer\">推断：由串联顺序和加热目的推出\u003c/span>。\u003c/p>\n\u003cp>燃机那一路是用循环水加热的\u003cspan class=\"cite\">见考点 2.4\u003c/span>。启动锅炉用在机组还没起来的时候，那时没有热的循环水可用，所以单独配电加热器\u003cspan class=\"infer\">推断：规程没写为什么用电加热\u003c/span>。\u003c/p>\n\u003ch4>电加热器\u003c/h4>\n\u003cp>每台启动锅炉配一套电加热器，由可控硅输出电流到加热管来加热；设有旁路手动阀，加热器检修时下游照样能用气\u003cspan class=\"cite\">公用 4.2.2.9\u003c/span>。可控硅是一种电力电子开关，改变它每个周波导通的时间，就能连续调节加热功率\u003cspan class=\"infer\">原理\u003c/span>。\u003c/p>\n\u003cp>规程写的是「2000Nm³/h 加热量」\u003cspan class=\"cite\">公用 4.2.2.9\u003c/span>。Nm³/h 是标准状态下的体积流量（标准立方米每小时），不是热量单位。对照表 9，加热器电功率 35 kW，气体流量 2000 Nm³/h\u003cspan class=\"cite\">公用 表 9\u003c/span>，这里的意思是加热器按每小时 2000 标准立方米的天然气流量设计\u003cspan class=\"infer\">推断：规程措辞不准确\u003c/span>。电加热器安全阀定 7.5 MPa\u003cspan class=\"cite\">公用 表 14\u003c/span>。\u003c/p>\n\u003cp>加热到多少度，按 4.2.2.9，电加热器的控制温度范围是 40-50℃\u003cspan class=\"cite\">公用 4.2.2.9\u003c/span>。DCS 联锁（表 21）按出口温度自动启停：出口温度低于 24℃ 自动启，高于 30℃ 自动停\u003cspan class=\"cite\">公用 表 21\u003c/span>。表 21「保护停」一栏下列了三条：#1 加热器管束温度高于 120℃，超温报警（温度开关）高于 80℃，出口温度高于 45℃\u003cspan class=\"cite\">公用 表 21\u003c/span>。表 9 写出口温度 20-25℃，和表 21 的自动启停温度相近，却和 40-50℃ 对不上，以现场为准\u003cspan class=\"cite\">公用 表 9\u003c/span>。\u003c/p>\n\u003ch4>调压\u003c/h4>\n\u003cp>每台启动锅炉配 2 条调压线，一用一备，每条设计流量 2000Nm³/h；工作调压线失效关闭时，备用调压线自动参与调压。每条线有 1 个安全切断阀、1 个监控调压阀、1 个工作调压阀，另有进出口手阀、安全阀等\u003cspan class=\"cite\">公用 4.2.2.10\u003c/span>。调压器是自力式\u003cspan class=\"cite\">公用 表 11\u003c/span>，靠阀后的天然气压力动作，原理同燃机调压线\u003cspan class=\"cite\">见考点 2.5\u003c/span>。\u003c/p>\n\u003cp>按 4.2.2.10 的写法，工作调压线投入时，先由监控调压阀把压力由 3.3～6.3MPa 调至 0.3MPa，再进工作调压阀调至 0.07MPa\u003cspan class=\"cite\">公用 4.2.2.10\u003c/span>。这里的监控调压阀和燃机调压线上的监控调压器干的活不一样。燃机那边，监控调压器平时基本不参与调节，只在工作调压器失灵时接手\u003cspan class=\"cite\">见考点 2.5\u003c/span>；启动锅炉这边，按规程写法，监控调压阀承担第一级降压，工作调压阀做第二级\u003cspan class=\"cite\">公用 4.2.2.10\u003c/span>。从管网压力一下降到接近常压，压比太大，一个调压器很难调得稳；分两级，每级压差小一些，调得更准，节流降温也分摊到两级\u003cspan class=\"infer\">原理：多级减压的一般道理\u003c/span>。\u003c/p>\n\u003cp>启动锅炉调压单元出口安全阀定 0.35 MPa\u003cspan class=\"cite\">公用 表 14\u003c/span>，是防止调压器失灵时，高压气直接冲到启动锅炉的低压管路上\u003cspan class=\"infer\">推断：规程没写原因\u003c/span>。\u003c/p>\n\u003cp>4.2.2.10 同一句里，工作调压阀的进口压力写成「2.0～1.0MPa」，和上一级出来的 0.3MPa 接不上，以现场为准\u003cspan class=\"cite\">公用 4.2.2.10\u003c/span>。\u003c/p>", "sources": [{"t": "公用规程 第 602～604 行", "lines": [[602, "调压站系统由清管站、入口单元、旋风分离器单元、精过滤单元、计量单元、启动锅炉调压单元、"], [603, "天然气增压机单元、天然气加热及调压单元、制氮单元、出口单元、冷凝储罐单元、放散单元、仪表空"], [604, "气储罐单元，共13个单元组成，设计为一进五出，分别供三台燃机和两台启动锅炉用气。"]]}, {"t": "公用规程 第 709～723 行", "lines": [[709, "4.2.2.9 启动锅炉加热单元"], [710, "启动锅炉加热单元用于加热天然气使其温度满足启动锅炉的要求并高于相应压力下的水/烃露点，"], [711, "防止天然气结露。"], [712, "每台启动锅炉配置一套2000Nm"], [713, "3/h加热量的电加热器，用于加热天然气；电加热器与启动锅炉调压"], [714, "单元串联安装， 设置有旁路手动阀， 在加热器检修时能保证下游正常工作。 电加热器上设置有氮气吹扫"], [715, "接口、 安全放散系统、 手动排空系统、 温度控制元件等。 电加热器由可控硅输出电流到加热管进行加热，"], [716, "控制温度范围为40-50℃。"], [717, "4.2.2.10 启动锅炉调压单元"], [718, "每台启动锅炉各配置2条调压线，"], [719, "一用一备， 每条管路的设计流量为2000Nm³/h， 当工作调压线失效"], [720, "关闭时， 备用调压线将自动参与调压。 每条管路包含1个安全切断阀、 1个监控调压阀、 1个工作调压阀、"], [721, "进出口手阀、 安全阀以及其他必要的辅助设备等。 工作调压线投入时， 通过监控调压阀将管道内天然气"], [722, "的压力由3.3～6.3MPa调至0.3MPa，然后天然气再进入工作调压阀进行调压，压力由2.0～1.0MPa调至"], [723, "0.07MPa以满足启动锅炉的运行要求。"]]}, {"t": "公用规程 第 388～428 行", "lines": [[388, "表 9 启动锅炉电加热器参数"], [389, "序号 名称 数值 单位"], [390, "1 型式 ECH-35/380-1"], [391, "2 电功率 35 kW"], [392, "3 电压 380 V"], [393, "4 电流 75 A"], [394, "5 气体流量 2000 Nm"], [395, "3/h"], [396, "6 入口温度 7.87-28.38 ℃"], [397, "7 出口温度 20-25 ℃"], [398, "8 最大温升/设计温度 30/50 ℃"], [399, "9 天然气入口压力 3.3～6.3 MPa"], [400, "10 设计压力 7.0 MPa"], [401, "11 加热元件材质 SS321"], [402, "12 防爆等级 ExdII CT4 Gb"], [403, "表 10 启动锅炉紧急切断阀参数"], [404, "序号 名称 数值 单位"], [405, "1 型式 自力式"], [406, "2 天然气流量 2000 Nm"], [407, "3/h"], [408, "3 天然气入口温度 16～28.38 ℃"], [409, "4 天然气入口压力 4.5～6.3 MPa"], [410, "5 开启时间 ≤1 s"], [411, "6 关闭时间 ≤1 s"], [412, "7 最高工作压力 6.3 MPa"], [413, "8 开启方式 手动"], [414, "9 驱动介质 天然气"], [415, "表 11 启动锅炉调压器"], [416, "序号 名称 数值 单位"], [417, "1 型式 自力式"], [418, "2 阀前压力 3.3～6.3 MPa"], [419, "3 流量 2000 Nm"], [420, "3/h"], [425, "4 阀后压力 0.07 MPa"], [426, "5 调压精度 ≤±1 %"], [427, "6 最大压力变化率 ±1 %"], [428, "7 流量调节范围 5～100 %"]]}, {"t": "公用规程 第 455～458 行", "lines": [[455, "11 1号启动锅炉电加热器安全阀 7.5 MPa"], [456, "12 2号启动锅炉电加热器安全阀 7.5 MPa"], [457, "13 1号启动锅炉调压单元出口安全阀 0.35 MPa"], [458, "14 2号启动锅炉调压单元出口安全阀 0.35 MPa"]]}, {"t": "公用规程 第 592～599 行", "lines": [[592, "自动启：#1/#2启动锅炉电加热器出口温度＜ 24℃"], [593, "自动停：#1/#2启动锅炉电加热器出口温度＞ 30℃"], [595, "#1/#2启动锅炉电"], [596, "加热器"], [597, "保护停：#1启动锅炉电加热器管束温度＞ 120℃"], [598, "#1启动锅炉电加热器超温报警（温度开关）＞ 80℃"], [599, "#1启动锅炉电加热器出口温度＞ 45℃"]]}], "cards": ["D:2.8-2", "D:2.8-4", "D:2.8-6", "D:2.8-5", "D:2.8-3", "D:2.8-7", "D:2.8-1"]}, "3.1": {"id": "3.1", "name": "投运前的严密性试验和检查", "cat": "三", "gist": "首次投运或检修后，要在充氮气和天然气之前做严密性试验：用压缩空气充压，每升 1 MPa 停下来用肥皂水查一遍漏，升到试验压力后保压 1 小时、没有压降为合格。投运前还要检查可燃气体探测无报警、管道接地良好、分离器和过滤器液位正常。", "reg": "公用 4.3.1、4.3.2；反措 8.7.4、8.7.5", "lecture": "\u003cp>调压站系统首次投运，或者检修后投运，都要先做严密性试验，确认系统不漏\u003cspan class=\"cite\">公用 4.3.1.1\u003c/span>。它排在气体置换前面，要在系统充氮气和天然气之前完成\u003cspan class=\"cite\">公用 4.3.1.2\u003c/span>。\u003c/p>\n\u003ch4>先做水压试验，再做严密性试验\u003c/h4>\n\u003cp>做严密性试验之前，输送配气管道要已经完成水压试验，并对系统做过全面吹扫\u003cspan class=\"cite\">公用 4.3.1.2\u003c/span>。两个试验查的东西不一样。水压试验主要考管道和焊缝的强度，压力打得比较高；水几乎不可压缩，万一哪里破了，压力一下就泄掉，放出的能量很小，所以强度试验用水来做比较安全\u003cspan class=\"infer\">原理：压力试验的一般做法\u003c/span>。严密性试验查的是法兰、螺纹、阀门填料这些连接处漏不漏；气体比水更容易钻过细小的缝隙，水渗不过去的地方气可能漏，所以查漏要用气\u003cspan class=\"infer\">原理\u003c/span>。强度已经由水压试验证明过，严密性试验就不必再打到很高的压力\u003cspan class=\"infer\">推断\u003c/span>。先吹扫，是把焊渣、铁锈和残水清出去，免得卡在阀座和密封面上\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003ch4>为什么用压缩空气\u003c/h4>\n\u003cp>规程要求用压缩空气给系统充压\u003cspan class=\"cite\">公用 4.3.1.3\u003c/span>。这时系统里还是空气，还没做置换。如果用天然气打压，天然气和管内空气一混，浓度就可能落进爆炸极限\u003cspan class=\"cite\">见考点 1.2\u003c/span>，查出来的漏点漏的也是可燃气。压缩空气不燃，漏了没有危险，来源也方便\u003cspan class=\"infer\">原理\u003c/span>。氮气同样不燃，但用量大，而且规程把这个试验排在充氮之前\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003ch4>试验步骤和为什么分级升压\u003c/h4>\n\u003cp>步骤是\u003cspan class=\"cite\">公用 4.3.1.3\u003c/span>：\u003c/p>\n\u003col>\n\u003cli>检查系统安装完毕，和上下游管道完全隔断，所有仪表和热控元件都已隔离。\u003c/li>\n\u003cli>用压缩空气给系统充压，注意控制升压速度。\u003c/li>\n\u003cli>压力升到 1MPa 时，用肥皂水检查各个连接处。有漏就重新紧固螺栓，直到不漏。\u003c/li>\n\u003cli>不漏就继续升压，每升 1MPa 停下来检查一遍，没问题再升，一直升到要求压力。检查无泄漏后保压 1 小时，无压降为合格。\u003c/li>\n\u003cli>系统泄压，试验结束。\u003c/li>\n\u003c/ol>\n\u003cp>分级升压的道理是：气体可压缩，同样压力下，一管子压缩空气储存的能量比一管子水大得多。如果某个连接处没紧好，在高压下突然崩开，气体膨胀的冲击很猛\u003cspan class=\"infer\">原理\u003c/span>。分级升压，就是在较低的压力下先把漏点找出来、处理掉，确认这一级没问题再往上升，不把问题带到更高的压力\u003cspan class=\"infer\">原理\u003c/span>。\u003c/p>\n\u003cp>控制升压速度，也有原理上的原因。气体被压缩会发热，升压太快，管内气温升高，压力读数偏高；停下来以后气体慢慢冷却，压力跟着往下掉，容易被误判为泄漏。保压 1 小时看压降，也要等温度稳定下来才准\u003cspan class=\"infer\">原理：气体压力随温度变化\u003c/span>。\u003c/p>\n\u003cp>仪表和热控元件为什么要先隔离，规程没写。它们的引压管接头本身也是漏点，隔离后能把仪表部分和主管路分开判断；差压变送器这类仪表，充压时可能一侧有压、另一侧没有，承受不了单侧压差\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>试验压力规程前后写得不一样：4.3.1.2 写气密试验压力为 0.6MPa，4.3.1.3 的步骤却是升到 1MPa 才第一次查漏，以现场为准。不管按哪个数，试验压力都比运行压力低得多，所以它不能代替运行压力下的查漏；充天然气升到运行压力的过程中，还要全程用便携式检测仪查漏\u003cspan class=\"cite\">见考点 3.3\u003c/span>。\u003c/p>\n\u003ch4>投运前检查\u003c/h4>\n\u003cp>除了严密性试验，投运前还要检查这些\u003cspan class=\"cite\">公用 4.3.2\u003c/span>：检修工作全部结束，工作票已终结收回；控制、仪表、动力电源已送上，仪用压缩空气压力正常，热控仪表投入，联锁试验合格，没有异常报警；消防设施完备；各管道接地良好，防止静电产生火花；旋风分离器、过滤分离器液位正常；安全阀校验合格、装在正确位置；按阀门检查卡核对阀门位置。身上不带火种、入站前释放静电、用铜制工具、进站前查可燃气体探测无报警，这几条和进站规定相同\u003cspan class=\"cite\">见考点 3.5\u003c/span>。\u003c/p>\n\u003cp>反措对这件事也有要求。新安装或检修后的管道、设备应进行系统打压试验，确保燃气系统的严密性\u003cspan class=\"cite\">题库 FC-8.7.4_8.7.5\u003c/span>。新安装的燃气管道，要在 24h 之内检查一次，并在通气后的第一周再复查一次\u003cspan class=\"cite\">题库 FC-8.7.4_8.7.5\u003c/span>。\u003c/p>", "sources": [{"t": "公用规程 第 743～770 行", "lines": [[743, "4.3.1.1 严密性试验"], [744, "系统首次投运或系统检修后投运应对系统进行严密性试验。"], [745, "4.3.1.2 严密性试验要求："], [746, "1) 系统初次投运或设备检修后应进行严密性试验。"], [747, "2) 气密性试验要在系统充氮气及天然气之前完成。"], [748, "3) 气密试验压力为 0.6MPa。"], [749, "4) 在进行严密性试验之前，需确保整个系统的输送配气管道已经完成水压试验，并对系统进行了"], [750, "全面的吹扫工作。"], [751, "4.3.1.3 严密试验的步骤如下："], [752, "1) 检查系统安装完毕，与上下游管道已完全隔断，所有仪表及热控元件已全部隔离。"], [753, "2) 用压缩空气对系统充压，注意控制升压速度。"], [754, "3) 当压力升至 1MPa 时，用肥皂水，对各个连接处进行检查，如有泄露，重新紧固螺栓，直至不泄"], [755, "露。"], [756, "4) 若无泄漏则继续升压， 每升 1MPa 停止升压， 检查无泄漏后再升压， 升至要求压力， 经检查无泄"], [757, "漏后，保压 1 小时，无压降为合格。"], [758, "5) 系统泄压，严密试验结束。"], [759, "4.3.2 投运前检查"], [760, "1) 检查确认身上没有携带火种和非防爆通讯器材，入站前须释放静电并穿着不会产生静电的工作"], [761, "服，作业中使用铜制工具。"], [762, "2) 进入调压站前检查可燃气体探测无报警，显示浓度正常。"], [763, "3) 检查所有检修工作结束，所有工作票已终结并收回，所有管道、设备完好。"], [764, "4) 确认系统有关的控制电源、仪表电源、动力电源已送上，调压站仪用压缩空气压力正常，投入"], [765, "各种热控仪表，系统相关的联锁试验合格，无异常报警信号。"], [766, "5) 检查消防设施完备，符合有关要求。"], [767, "6) 检查各管道接地良好，防止静电产生火花。"], [768, "7) 检查旋风分离器、过滤分离器液位正常。"], [769, "8) 设备上的安全阀，经校验合格，并安装在正确的位置。"], [770, "9) 按阀门检查卡检查各阀门状态正常位置正确。"]]}], "cards": ["D:3.1-2", "FC-8.7.4_8.7.5", "D:3.1-4", "D:3.1-5", "D:3.1-1", "D:3.1-7", "D:3.1-6", "D:3.1-3"]}, "3.2": {"id": "3.2", "name": "气体置换", "cat": "三", "gist": "三种置换做法基本相同：充压到 0.15～0.2 MPa，再泄压到 0.05 MPa，反复进行（天然气置换氮气、氮气置换天然气这两种，开始前先泄压到 0.05～0.1 MPa 的微正压），在放散取样处连续测三次、每次间隔 5 分钟，死角再抽测 1～3 处。合格标准各不相同：氮气置换空气，看氧含量低于 1%；天然气置换氮气，看甲烷不低于 90%（体积）；氮气置换天然气，看甲烷低于 5% LEL。置换用氮气纯度要不低于 99%，工具用铜制的。", "reg": "公用 4.3.3、4.3.10；反措 8.7.9、8.7.10、8.7.20", "lecture": "\u003cp>调压站的气体置换靠充氮系统\u003cspan class=\"cite\">见考点 2.7\u003c/span>加上各单元的充氮接头和放散系统完成，可以整个系统一次做完，也可以分单元做\u003cspan class=\"cite\">公用 4.3.3\u003c/span>。\u003c/p>\n\u003ch4>为什么中间要隔一道氮气\u003c/h4>\n\u003cp>甲烷的爆炸极限是 5.0%～15.0%\u003cspan class=\"cite\">公用 表 2\u003c/span>\u003cspan class=\"cite\">见考点 1.2\u003c/span>。如果直接用天然气去赶管道里的空气，两股气不会像活塞一样整齐地推过去，交界处会混在一起，浓度从零一路升到接近百分之百，中间必然经过爆炸极限这一段；这时管内一有火花（铁锈撞击、静电放电），就可能爆炸\u003cspan class=\"infer\">原理\u003c/span>。先用氮气赶走空气，再用天然气赶氮气，天然气始终碰不到足够的氧，混不出能烧起来的气\u003cspan class=\"infer\">原理\u003c/span>。\u003c/p>\n\u003cp>所以投运时先做氮气置换空气，合格后接着做天然气置换氮气\u003cspan class=\"cite\">题库 RJ-a37d8049\u003c/span>，置换完成才能充天然气投运\u003cspan class=\"cite\">公用 4.3.4\u003c/span>。检修时反过来，检修单元隔离、泄压后做氮气置换天然气\u003cspan class=\"cite\">公用 4.3.10\u003c/span>，然后才让空气进来。\u003c/p>\n\u003ch4>做法\u003c/h4>\n\u003cp>置换前要准备足量的高纯度氮气，浓度≥99%，以及铜制工具、甲烷浓度检测仪和可燃气体/O2 检测仪\u003cspan class=\"cite\">公用 4.3.3.1\u003c/span>。三种置换做法基本一样\u003cspan class=\"cite\">公用 4.3.3.2、4.3.3.3、4.3.3.4\u003c/span>：\u003c/p>\n\u003col>\n\u003cli>明确置换范围，完成系统隔离，验明系统内是什么气体。\u003c/li>\n\u003cli>天然气置换氮气、氮气置换天然气这两种，先把系统泄压到微正压，约 0.05-0.1MPa。\u003c/li>\n\u003cli>充压到 0.15-0.2MPa：充氮气从充氮口充，充天然气是缓慢开启置换系统入口阀旁路手阀往里注。\u003c/li>\n\u003cli>缓慢打开放散阀，降压到 0.05MPa，在放散取样处测量。\u003c/li>\n\u003cli>反复充压、放散，在放散取样处连续测三次，每次间隔 5min，都达到合格值才算合格。\u003c/li>\n\u003cli>对系统死角排污吹扫，再选取 1-3 处测一次，也要合格。\u003c/li>\n\u003cli>关闭排污阀、排放阀，停止置换。\u003c/li>\n\u003c/ol>\n\u003ch4>反复充压、放散为什么能换干净\u003c/h4>\n\u003cp>每充一次压，新气和系统里剩下的旧气混在一起；再放散，放掉的是混合气，旧气的比例就降一截。按绝对压力算（表压加约 0.1 MPa 大气压），充到 0.2 MPa 左右再放到 0.05 MPa，绝对压力大约从 0.3 降到 0.15，每一轮旧气大约剩一半\u003cspan class=\"infer\">推断：按理想混合估算\u003c/span>。空气里的氧约占五分之一，每轮减半，要反复四五轮才能降到 1% 以下\u003cspan class=\"infer\">推断：同上\u003c/span>。\u003c/p>\n\u003cp>两种带压的置换先泄到微正压，是为了从低的起点开始，每轮稀释得更多；不泄到零，是让系统始终比大气压高一点，外面的空气进不来。氮气置换空气开始时系统里本来就是常压空气，没有压力可泄\u003cspan class=\"infer\">推断：规程没写原因\u003c/span>。\u003c/p>\n\u003cp>放散取样处测到的只是放散口附近的气。支管、仪表管这类死角没有气流经过，旧气只能慢慢扩散出来，所以要隔几分钟连测三次都合格，死角还要单独吹扫、抽测\u003cspan class=\"infer\">推断：规程没写原因\u003c/span>。\u003c/p>\n\u003ch4>三种置换各看什么\u003c/h4>\n\u003cul>\n\u003cli>氮气置换空气：O2 含量低于 1% 为合格\u003cspan class=\"cite\">公用 4.3.3.2\u003c/span>。下一步要进天然气，要防的是天然气进来时有氧可烧，所以看氧。\u003c/li>\n\u003cli>天然气置换氮气：CH4 含量不低于 90%VOL（体积浓度）为合格\u003cspan class=\"cite\">公用 4.3.3.3\u003c/span>。这时系统里没有氧，不存在爆炸问题，要的是管里基本都是燃料\u003cspan class=\"infer\">原理\u003c/span>。本厂天然气里甲烷本身占 93.56 mol%\u003cspan class=\"cite\">公用 表 1\u003c/span>，测到 90% 以上，说明已经接近纯的管网天然气\u003cspan class=\"infer\">推断\u003c/span>。\u003c/li>\n\u003cli>氮气置换天然气：CH4 含量低于 5%LEL 为合格\u003cspan class=\"cite\">公用 4.3.3.4\u003c/span>。LEL 是爆炸下限，5% LEL 就是爆炸下限的百分之五，约合甲烷体积浓度 0.25%\u003cspan class=\"conv\">换算\u003c/span>。下一步是打开设备让空气进来，要防的是剩下的甲烷和空气混成爆炸气，所以看甲烷离爆炸下限有多远\u003cspan class=\"infer\">原理\u003c/span>。\u003c/li>\n\u003c/ul>\n\u003cp>检修停运一节（4.3.10）写的合格值是甲烷体积浓度低于 1%，约合 20% LEL\u003cspan class=\"conv\">换算\u003c/span>，比 4.3.3.4 宽得多，以现场为准。\u003c/p>\n\u003ch4>反措和题库\u003c/h4>\n\u003cp>反措要求：严禁在运行中的燃气轮机周围进行燃气管道燃气排放与置换作业；消缺时必须使用铜制专用工具，防止产生静电火花\u003cspan class=\"cite\">题库 FC-8.7.9_8.7.10\u003c/span>。燃气管道系统部分投入运行时，与之以阀门隔断的相邻管道必须充入氮气，并常规巡检查漏\u003cspan class=\"cite\">题库 FC-8.7.20\u003c/span>。\u003c/p>\n\u003cp>题库说天然气置换氮气时，天然气浓度高于 99% 为合格\u003cspan class=\"cite\">题库 RJ-94eef2f8\u003c/span>。规程写的是 CH4 不低于 90%VOL，99% 是规程对置换用氮气纯度的要求\u003cspan class=\"cite\">公用 4.3.3.1\u003c/span>，以本厂规程为准。\u003c/p>", "sources": [{"t": "公用规程 第 771～810 行", "lines": [[771, "4.3.3 气体置换"], [776, "用氮气置换系统中的空气或天然气。 调压站的气体置换工作通过充氮系统与调压站各单元模块配置"], [777, "的充氮接头及放散系统来完成。整个系统可以一次完成置换工作，也可以分单元模块单独进行。"], [778, "4.3.3.1 置换前准备："], [779, "1) 数量足够的高纯度氮气（浓度≥99%） 。"], [780, "2) 铜制工具、甲烷浓度检测仪和可燃气体/O2 检测仪。"], [781, "4.3.3.2 氮气置换空气"], [782, "1) 明确置换范围，完成系统隔离。"], [783, "2) 验明当前置换系统气体工质性质。"], [784, "3) 在充氮口充入氮气，提高置换系统压力至 0.15-0.2MPa。"], [785, "4) 缓慢打开放散阀，降压至 0.05MPa，在放散取样处测量。"], [786, "5) 重复 3）、4）步操作，在放散取样处，连续三次，每次间隔 5min，测量 O2 含量低于 1%，置换"], [787, "合格。"], [788, "6) 对置换系统死角进行排污吹扫，并选取 1-3 处，再次测量 O2 含量低于 1%。"], [789, "7) 关闭排污阀、排放阀、充氮阀，停止置换，根据要求，恢复系统或保持隔离。"], [790, "4.3.3.3 天然气置换氮气"], [791, "1) 明确置换范围，完成系统隔离。"], [792, "2) 验明当前置换系统内气体工质性质。"], [793, "3) 将置换系统泄压至微正压状态，约 0.05-0.1MPa。"], [794, "4) 缓慢开启置换系统入口阀旁路手阀，向系统注入天然气，提高系统压力至 0.15-0.2MPa。"], [795, "5) 缓慢打开放散阀，降压至 0.05MPa，在放散取样处测量。"], [796, "6) 重复 3） 、 4） 步操作， 在放散取样处， 连续三次， 每次间隔 5min， 测量 CH4 含量不低于 90%VOL，"], [797, "为置换合格。"], [798, "7) 对置换系统死角进行排污吹扫，并选取 1-3 处，再次测量 CH4 含量不低于 90%VOL。"], [799, "8) 关闭排污阀、排放阀，待置换系统压力与上游压力平衡时，关闭置换入口手动旁路球阀。"], [800, "9) 停止置换，根据要求，恢复系统或保持隔离。"], [801, "4.3.3.4 氮气置换天然气"], [802, "1) 明确置换范围，完成系统隔离。"], [803, "2) 验明当前置换系统内气体工质性质。"], [804, "3) 将置换系统缓慢泄压至微正压状态，约 0.05-0.1MPa。"], [805, "4) 在充氮口注入氮气，提高置换系统压力至 0.15-0.2MPa。"], [806, "5) 缓慢打开放散阀，降压至 0.05MPa，在放散取样处测量。"], [807, "6) 重复 3）、4）步操作，在放散取样处，连续三次，每次间隔 5min，测量 CH4 含量低于 5%LEL，"], [808, "为置换合格。"], [809, "7) 对置换系统死角进行排污吹扫，并选取 1-3 处，再次测量 CH4 含量低于 5%LEL。"], [810, "8) 关闭排污阀、排放阀、充氮阀，停止置换，根据要求，恢复系统或保持隔离。"]]}, {"t": "公用规程 第 811～812 行", "lines": [[811, "4.3.4 系统投运"], [812, "1) 检查需投运系统的气体置换工作已完成。"]]}, {"t": "公用规程 第 920～925 行", "lines": [[920, "4.3.10 检修停运"], [921, "调压站设备停运维护或检修时，需按下列步骤对系统隔离泄压："], [922, "1) 关闭检修单元进、出口隔离阀，将待检修设备与其他单元完全隔离。"], [923, "2) 打开检修单元的放散阀进行放散泄压。"], [924, "3) 泄压完毕后，进行氮气置换天然气操作，当放散取样处测得的甲烷体积浓度低于 1% 时，置换"], [925, "合格。"]]}, {"t": "公用规程 第 173～175 行", "lines": [[173, "表 1 天然气参数"], [174, "项目 数值 单位"], [175, "甲烷（CH4） 93.56 mol%"]]}, {"t": "公用规程 第 204～209 行", "lines": [[204, "表 2 天然气爆炸极限"], [205, "名称 爆炸极限（20℃，101.325kPa） 爆炸下限 爆炸上限"], [206, "着火温度"], [207, "氢气 4.0% 75.9% 约560℃"], [208, "一氧化碳 12.5% 74.2% 约644-658℃"], [209, "甲烷 5.0% 15.0% 约540℃"]]}], "cards": ["D:3.2-6", "RJ-94eef2f8", "D:3.2-2", "RJ-a37d8049", "D:3.2-5", "FC-8.7.20", "D:3.2-3", "FC-8.7.9_8.7.10", "D:3.2-1", "D:3.2-4"]}, "3.3": {"id": "3.3", "name": "充天然气投运", "cat": "三", "gist": "置换完成后，慢慢开入口阀的旁路阀充压，升压速度不超过 0.2 MPa/min，同时盯住压力表别超过管道设计压力，全程用便携式检测仪查漏。入口阀前后压力
