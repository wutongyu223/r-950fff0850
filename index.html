d": "intro"}, "D:5.7-1": {"id": "D:5.7-1", "kp": "5.7", "kind": "drill", "type": "fill", "tname": "填空", "stem": "启动前公用系统检查：天然气调压站系统已投运，前置模块入口压力控制在（ ）MPa～（ ）MPa。", "ans": "3.74；4.5", "src": [{"t": "机岛规程 第 1202～1202 行", "lines": [[1202, "2) 天然气调压站系统已投运，前置模块入口压力控制在3.74MPa～4.5MPa。"]]}]}, "D:5.7-2": {"id": "D:5.7-2", "kp": "5.7", "kind": "drill", "type": "judge", "tname": "判断", "stem": "燃机任一点火火花塞故障，但其余火花塞正常时，燃机可以启动。", "ans": "错", "src": [{"t": "机岛规程 第 1041～1041 行", "lines": [[1041, "4) 燃机任一点火火花塞或任一火焰探测器故障。"]]}], "key": "错", "why": "燃机任一点火火花塞或任一火焰探测器故障，属于燃机禁止启动条件。"}, "D:5.7-3": {"id": "D:5.7-3", "kp": "5.7", "kind": "drill", "type": "fill", "tname": "填空", "stem": "燃机禁止启动条件：天然气区域燃气泄漏，且浓度达到（ ）。", "ans": "25%LEL", "src": [{"t": "机岛规程 第 1048～1048 行", "lines": [[1048, "11) 天然气区域燃气泄漏，且浓度达到25%LEL。"]]}]}, "D:5.7-4": {"id": "D:5.7-4", "kp": "5.7", "kind": "drill", "type": "ask", "tname": "问答", "stem": "燃机系统启动前检查里，对燃气前置模块和天然气有什么要求？", "ans": "燃气前置模块系统无泄漏，各阀门位置正确，天然气已送至 VS4-4 阀前。", "src": [{"t": "机岛规程 第 1138～1138 行", "lines": [[1138, "20) 检查燃气前置模块系统无泄漏，各阀门位置正确，天然气已送至VS4-4阀前。"]]}]}, "D:5.7-5": {"id": "D:5.7-5", "kp": "5.7", "kind": "drill", "type": "choice", "tname": "单选", "stem": "燃机预启动试验多久自动做一次？", "ans": "B", "src": [{"t": "机岛规程 第 6510～6510 行", "lines": [[6510, "燃机预启动试验的目的是定期 （7 天） 自动试验燃机各系统的气动和电动设备， 提前发现设备问题，"]]}], "opts": [["A", "每天"], ["B", "每 7 天"], ["C", "每月"], ["D", "每次启动前"]], "key": "B"}, "D:5.7-6": {"id": "D:5.7-6", "kp": "5.7", "kind": "drill", "type": "fill", "tname": "填空", "stem": "燃气清吹预启动试验：对燃气侧阀门 VAS-（ ）执行开启测试、关闭测试；对空气侧阀门 VAS-（ ）执行开启测试、关闭测试。", "ans": "4、6、8；3、5、7", "src": [{"t": "机岛规程 第 6558～6560 行", "lines": [[6558, "9) 燃气清吹预启动试验："], [6559, "(1) 对燃气测阀门 VAS-4、6、8 执行开启测试、关闭测试；"], [6560, "(2) 对空气测阀门 VAS-3、5、7 执行开启测试、关闭测试。"]]}]}, "D:5.7-7": {"id": "D:5.7-7", "kp": "5.7", "kind": "drill", "type": "fill", "tname": "填空", "stem": "清吹系统启动前检查：燃机（ ）前的天然气已完成置换，天然气浓度和压力正常；检查（ ）排污畅通。", "ans": "P1 腔；清吹冷却器", "src": [{"t": "机岛规程 第 2406～2407 行", "lines": [[2406, "4) 燃机P1腔前的天然气已完成置换，天然气浓度和压力正常。"], [2407, "5) 检查清吹冷却器排污畅通。"]]}]}, "L:5.7": {"id": "L:5.7", "kp": "5.7", "kind": "intro"}, "D:5.8-1": {"id": "D:5.8-1", "kp": "5.8", "kind": "drill", "type": "choice", "tname": "单选", "stem": "气体燃料压力低报警，按 9.4.7.2 处理的第一步是什么？", "ans": "B", "src": [{"t": "机岛规程 第 2339～2340 行", "lines": [[2339, "3) 处理："], [2340, "(1) 判断测量元件准确性，如有异常通知检修人员及时处理。"]]}], "opts": [["A", "立即紧急停机"], ["B", "判断测量元件的准确性，有异常通知检修处理"], ["C", "联系上游提高供气压力"], ["D", "调整调压站出口压力"]], "key": "B"}, "D:5.8-2": {"id": "D:5.8-2", "kp": "5.8", "kind": "drill", "type": "judge", "tname": "判断", "stem": "启动燃料流量过大的原因之一是燃气压力过高。", "ans": "错", "src": [{"t": "机岛规程 第 2322～2329 行", "lines": [[2322, "9.4.7.1 启动燃料流量过大"], [2323, "1) 现象：启动燃料流量过大报警。"], [2324, "2) 原因："], [2325, "(1) 启动 FSR 基准值过大造成启动燃料量过大。"], [2326, "(2) 燃料控制阀故障，造成控制系统给出的流量值过大。"], [2327, "(3) 燃气管线泄漏或排气阀误开、内漏，使燃料供给压力降低。"], [2328, "(4) 燃气压力过低。"], [2329, "(5) 启动时燃料控制伺服及反馈系统故障。"]]}], "key": "错", "why": "规程列的是燃气压力过低；还有燃气管线泄漏或排气阀误开、内漏，使燃料供给压力降低。"}, "D:5.8-3": {"id": "D:5.8-3", "kp": "5.8", "kind": "drill", "type": "fill", "tname": "填空", "stem": "天然气压力低的现象：天然气压力低报警，压力持续降低（ ）；天然气管道有（ ）。", "ans": "自动降负荷；异常气流声", "src": [{"t": "机岛规程 第 6805～6806 行", "lines": [[6805, "(1) 天然气压力低报警，压力持续降低自动降负荷。"], [6806, "(2) 天然气管道有异常气流声。"]]}]}, "D:5.8-4": {"id": "D:5.8-4", "kp": "5.8", "kind": "drill", "type": "judge", "tname": "判断", "stem": "燃烧室点火失败后，查明原因即可立即再次点火。", "ans": "错", "src": [{"t": "机岛规程 第 6783～6784 行", "lines": [[6783, "(1) 点火失败应查明原因。"], [6784, "(2) 燃机高盘清吹结束后，并得到值长同意后可再次进行点火。"]]}], "key": "错", "why": "点火失败应查明原因；燃机高盘清吹（即启动清吹）结束后，并得到值长同意后可再次进行点火。"}, "D:5.8-5": {"id": "D:5.8-5", "kp": "5.8", "kind": "drill", "type": "ask", "tname": "问答", "stem": "燃烧室点火失败，规程列了哪三条原因？", "ans": "燃料控制阀未打开；火焰探测器故障探测不到火焰；点火器（火花塞）故障。", "src": [{"t": "机岛规程 第 6779～6781 行", "lines": [[6779, "(1) 燃料控制阀未打开。"], [6780, "(2) 火焰探测器故障探测不到火焰。"], [6781, "(3) 点火器（火花塞）故障。"]]}]}, "D:5.8-6": {"id": "D:5.8-6", "kp": "5.8", "kind": "drill", "type": "judge", "tname": "判断", "stem": "运行中火焰丢失，只要火焰信号很快恢复，可以不停机，继续观察运行。", "ans": "错", "src": [{"t": "机岛规程 第 6699～6710 行", "lines": [[6699, "(3) 火焰信号失去报警，机组跳闸。"], [6700, "2) 原因："], [6701, "(1) 三个以上火焰探测器故障。"], [6702, "(2) 燃料控制阀异常。"], [6703, "(3) 燃烧切换过程中，燃烧不稳定造成熄火。"], [6704, "(4) 天然气压力低或燃气中断。"], [6705, "(5) 燃料华白指数变化，燃烧不稳。"], [6706, "(6) 燃烧室部件损坏。"], [6707, "3) 处理："], [6708, "(1) 按紧急停机处理。"], [6709, "(2) 检查火焰探测器工作是否正常。"], [6710, "(3) 检查燃料控制阀和燃料压力。"]]}], "key": "错", "why": "火焰丢失时火焰信号失去报警，机组跳闸；处理按紧急停机进行，再检查火焰探测器、燃料控制阀和燃料压力、燃料供应系统等。"}, "D:5.8-7": {"id": "D:5.8-7", "kp": "5.8", "kind": "drill", "type": "judge", "tname": "判断", "stem": "燃气管路发生明显泄漏但尚未造成跳机时，可以维持运行，等停机后再处理。", "ans": "错", "src": [{"t": "机岛规程 第 1696～1698 行", "lines": [[1696, "1) 燃气轮机和余热锅炉故障申请停运条件"], [1697, "(1) 燃机排气压力和温度异常，且无好转迹象；"], [1698, "(2) 燃气管路、油管路发生明显泄漏，但尚未造成跳机；"]]}], "key": "错", "why": "燃气管路、油管路发生明显泄漏但尚未造成跳机，属于燃气轮机故障申请停运的条件。"}, "L:5.8": {"id": "L:5.8", "kp": "5.8", "kind": "intro"}, "RJ-df03cc1d": {"id": "RJ-df03cc1d", "kp": "6.1", "kind": "orig", "type": "fill", "tname": "填空", "stem": "气体燃料吹扫系统：从压气机排气中抽出气体，吹扫气体燃料喷嘴。空气流首先由热交换器冷却到所需的温度。然后用来吹扫气体燃料喷嘴。气体燃料吹扫通过流经燃烧回路的空气流防止气体燃料在管道中自动点火。启动前，吹扫阀关闭、排气阀打开。正常气体燃料运行时，当燃机速度大于（　　） 时，所有未加燃料的管路都需要吹扫。当燃机速度低于（　　） %时，所有吹扫阀关闭，所有排气阀打开。", "ans": "95%、95", "from": "技能培训"}, "RJ-std017": {"id": "RJ-std017", "kp": "6.1", "kind": "orig", "type": "fill", "tname": "填空", "stem": "按《机岛运行技术标准》9.5.1，清吹未投入使用的燃气喷嘴流道，可防止（　　）。", "ans": "燃气管道中形成燃气积聚和燃烧回流", "from": "来源训练题", "notes": [["原整理说明", "答案逐字见同题所附精确引文；本题不作跨来源推断。"], ["原文说明", "来源训练题：由原整理者依据《机岛运行技术标准》或反措原文出的训练题，不是竞赛原题库题目。"]]}, "D:6.1-1": {"id": "D:6.1-1", "kp": "6.1", "kind": "drill", "type": "fill", "tname": "填空", "stem": "清吹冷却器（ ）将压气机排气的温度从（ ）℃降低到（ ）℃，再用来吹扫燃料歧管。", "ans": "HX-4-2；510；260", "src": [{"t": "机岛规程 第 2358～2358 行", "lines": [[2358, "HX-4-2 清吹冷却器 将排气温度从 510℃降低到 260℃"]]}]}, "D:6.1-2": {"id": "D:6.1-2", "kp": "6.1", "kind": "drill", "type": "choice", "tname": "单选", "stem": "AFS 歧管清吹管路上的清吹阀和排空阀是哪几个？", "ans": "C", "src": [{"t": "机岛规程 第 2349～2352 行", "lines": [[2349, "一个通向PM2歧管的清吹管路 （清吹阀VAS-3和VAS-4以及排空阀VAV-2） ；"], [2350, "一个通向PM3歧管的清吹管路 （清吹阀VAS-5和VAS-6以及排空阀VAV-3） ；"], [2351, "一个同向AFS歧管的清吹管路(清"], [2352, "吹阀VAS-7和VAS-8以及排空阀VAV-4)；在PM2、PM3和AFS清吹管路腔室之间分别设有冗余压力变送器"]]}], "opts": [["A", "VAS-3、VAS-4 和 VAV-2"], ["B", "VAS-5、VAS-6 和 VAV-3"], ["C", "VAS-7、VAS-8 和 VAV-4"], ["D", "VIS-1、VIS-2 和 VIV-1"]], "key": "C"}, "D:6.1-3": {"id": "D:6.1-3", "kp": "6.1", "kind": "drill", "type": "judge", "tname": "判断", "stem": "PM1、PM2、PM3、AFS 四根歧管各有一条清吹管路。", "ans": "错", "src": [{"t": "机岛规程 第 2349～2352 行", "lines": [[2349, "一个通向PM2歧管的清吹管路 （清吹阀VAS-3和VAS-4以及排空阀VAV-2） ；"], [2350, "一个通向PM3歧管的清吹管路 （清吹阀VAS-5和VAS-6以及排空阀VAV-3） ；"], [2351, "一个同向AFS歧管的清吹管路(清"], [2352, "吹阀VAS-7和VAS-8以及排空阀VAV-4)；在PM2、PM3和AFS清吹管路腔室之间分别设有冗余压力变送器"]]}], "key": "错", "why": "规程只列了通向 PM2、PM3、AFS 歧管的三条清吹管路，PM1 没有。"}, "D:6.1-4": {"id": "D:6.1-4", "kp": "6.1", "kind": "drill", "type": "judge", "tname": "判断", "stem": "燃料管路清吹用的是从压气机进口直接引来的大气。", "ans": "错", "src": [{"t": "机岛规程 第 2346～2346 行", "lines": [[2346, "当燃机转速大于95%TNH时， 部分抽出的压气机排气经冷却后吹扫未投入使用的燃气喷嘴流道， 防止"]]}], "key": "错", "why": "清吹空气是部分抽出的压气机排气，经冷却后吹扫未投入使用的燃气喷嘴流道。"}, "D:6.1-5": {"id": "D:6.1-5", "kp": "6.1", "kind": "drill", "type": "fill", "tname": "填空", "stem": "清吹除了防止燃气积聚和燃烧回流，还能保持燃气管道处于（ ），以防止管道中形成（ ）。", "ans": "热状态；凝结水", "src": [{"t": "机岛规程 第 2347～2347 行", "lines": [[2347, "燃气管道中形成燃气积聚和燃烧回流，同时保持燃气管道处于热状态，以防止管道中形成凝结水。"]]}]}, "D:6.1-6": {"id": "D:6.1-6", "kp": "6.1", "kind": "drill", "type": "ask", "tname": "问答", "stem": "清吹管路两个清吹阀之间的冗余压力变送器是做什么用的？", "ans": "测量三条吹扫管线上清吹阀之间的腔内压力，以检测由于密封缺陷导致的压力增加。", "src": [{"t": "机岛规程 第 2352～2354 行", "lines": [[2352, "吹阀VAS-7和VAS-8以及排空阀VAV-4)；在PM2、PM3和AFS清吹管路腔室之间分别设有冗余压力变送器"], [2353, "96PG-2A、96PG-2B、96PG-2B、96PG-3A、96PG-3B、96PG-4A和96PG-4B测量三条吹扫管线上清吹阀之间"], [2354, "的腔内压力， 以检测由于密封缺陷导致的压力增加。 在机组启动及正常燃烧模式过程中， 清吹系统会从"]]}]}, "D:6.1-7": {"id": "D:6.1-7", "kp": "6.1", "kind": "drill", "type": "fill", "tname": "填空", "stem": "燃料管路清吹在燃机转速大于 95%TNH 时进行，95%TNH 对应的转速是（ ）rpm。", "ans": "2850", "src": [{"t": "机岛规程 第 2346～2346 行", "lines": [[2346, "当燃机转速大于95%TNH时， 部分抽出的压气机排气经冷却后吹扫未投入使用的燃气喷嘴流道， 防止"]]}, {"t": "机岛规程 第 1262～1262 行", "lines": [[1262, "7) 转速达到95%TNH （2850rpm） 时， 检查： 进气加热IBH先导控制阀VA20-2开至13%， VA20-1开至91%；"]]}]}, "D:6.1-8": {"id": "D:6.1-8", "kp": "6.1", "kind": "drill", "type": "judge", "tname": "判断", "stem": "燃料管路清吹就是启动时在清吹转速 735rpm 下进行的那次清吹。", "ans": "错", "src": [{"t": "机岛规程 第 1237～1237 行", "lines": [[1237, "7) 转速升至清吹转速735rpm，开始清吹倒计时11.5min。"]]}, {"t": "机岛规程 第 2346～2346 行", "lines": [[2346, "当燃机转速大于95%TNH时， 部分抽出的压气机排气经冷却后吹扫未投入使用的燃气喷嘴流道， 防止"]]}], "key": "错", "why": "启动时在 735rpm 进行的是启动清吹，开始清吹倒计时 11.5min；燃料管路清吹是燃机转速大于 95%TNH 时，用冷却后的压气机排气吹扫未投入使用的燃气喷嘴流道。"}, "L:6.1": {"id": "L:6.1", "kp": "6.1", "kind": "intro"}, "D:6.2-1": {"id": "D:6.2-1", "kp": "6.2", "kind": "drill", "type": "judge", "tname": "判断", "stem": "清吹冷却器出口温度传感器 PT-HX-1A/B 都故障时，只有在机组未并网的情况下才会自动停机。", "ans": "错", "src": [{"t": "机岛规程 第 667～669 行", "lines": [[667, "5.4 自动停机"], [668, "为机组自动停机条件。"], [669, "机组自动停机：进入自动停机程序，机组自动减负荷、汽机脱扣、燃机降负荷直至燃机熄火，以下"]]}, {"t": "机岛规程 第 699～699 行", "lines": [[699, "（4） 任一腔室清吹进行时，清吹冷却器出口温度传感器（PT-HX-1A/B）均故障,延时 60s"]]}], "key": "错", "why": "规程的条件是任一腔室清吹进行时，清吹冷却器出口温度传感器（PT-HX-1A/B）均故障，延时 60s 自动停机，没有限定未并网。"}, "D:6.2-2": {"id": "D:6.2-2", "kp": "6.2", "kind": "drill", "type": "choice", "tname": "单选", "stem": "机组已并网且吹扫建立后，任一吹扫回路腔间压力\u003c0.95*CPD 持续 60 秒，保护怎么动作？", "ans": "B", "src": [{"t": "机岛规程 第 2384～2385 行", "lines": [[2384, "机组并网且吹扫建立后发生以下情况，则 1 倍 RB："], [2385, "-任一吹扫回路腔间压力\u003c0.95*CPD，持续 60 秒。"]]}], "opts": [["A", "燃机跳闸"], ["B", "1 倍 RB"], ["C", "3 倍 RB"], ["D", "只发报警"]], "key": "B"}, "D:6.2-3": {"id": "D:6.2-3", "kp": "6.2", "kind": "drill", "type": "judge", "tname": "判断", "stem": "机组未并网时，吹扫回路腔间压力低于 0.95 倍 CPD 持续 60 秒，同样执行 1 倍 RB。", "ans": "错", "src": [{"t": "机岛规程 第 2391～2392 行", "lines": [[2391, "机组未并网且吹扫建立后发生以下情况，则自动停机："], [2392, "-任一吹扫回路腔间压力\u003c0.95*CPD，持续 60 秒。"]]}], "key": "错", "why": "机组未并网且吹扫建立后发生这种情况，是自动停机；1 倍 RB 是机组已并网时的动作。"}, "D:6.2-4": {"id": "D:6.2-4", "kp": "6.2", "kind": "drill", "type": "ask", "tname": "问答", "stem": "气体燃料吹扫腔间压力高报警，运行人员先怎么处理？", "ans": "停止升负荷，保持当前负荷，避免燃烧模式切换；检查燃料吹扫系统画面的阀门状态；通知检修人员查找故障原因并处理。", "src": [{"t": "机岛规程 第 2447～2450 行", "lines": [[2447, "3) 处理："], [2448, "(1) 停止升负荷，当前负荷，避免燃烧模式切换，"], [2449, "(2) 检查燃料吹扫系统画面的阀门状态"], [2450, "(3) 针对异常现象通知检修人员查找故障原因并进行处理。"]]}]}, "D:6.2-5": {"id": "D:6.2-5", "kp": "6.2", "kind": "drill", "type": "ask", "tname": "问答", "stem": "没有清吹时，两个清吹阀中有一个内漏。轻微内漏和严重内漏分别会怎样？", "ans": "轻微内漏时，排空阀 VAV-2、VAV-3、VAV-4 能把小泄漏排出去；严重内漏时，两个清吹阀之间管道中的压力升高，达到跳机上限后延时 10 秒跳机。", "src": [{"t": "机岛规程 第 2444～2446 行", "lines": [[2444, "(4) 清吹系统截至阀内漏， 当管线未被清吹时， 清吹阀关闭。 如果两个清吹阀中的一个是泄漏阀，"], [2445, "则排空阀 VAV-2、VAV-3 和 VAV-4 将能够排出小泄漏。如果严重泄漏。在这种情况下，两个清"], [2446, "吹阀之间管道中的压力将增加，达到跳机上限后机组在 10 秒延时后会直接跳机。"]]}]}, "D:6.2-6": {"id": "D:6.2-6", "kp": "6.2", "kind": "drill", "type": "choice", "tname": "单选", "stem": "清吹空气侧温度 FTPG1 达到 525℉（约 274℃）且有管路正在清吹，延时 60s，保护怎么动作？", "ans": "B", "src": [{"t": "机岛规程 第 606～607 行", "lines": [[606, "5 Gas Fuel Purge RB-1X Nominal Rate（燃料吹扫 RB-1X）"], [607, "（1） 清吹空气侧温度 FTPG1≥525℉且任何管路清吹投入，延时 60s"]]}], "opts": [["A", "只发报警"], ["B", "燃机 1 倍 RB"], ["C", "燃机 3 倍 RB"], ["D", "燃机跳闸"]], "key": "B"}, "D:6.2-7": {"id": "D:6.2-7", "kp": "6.2", "kind": "drill", "type": "choice", "tname": "单选", "stem": "气体燃料吹扫腔间压力低，下面哪一项不是规程列出的原因？", "ans": "D", "src": [{"t": "机岛规程 第 2440～2446 行", "lines": [[2440, "(1) 压力传感器测量错误。"], [2441, "(2) 清吹管路气动截止阀气源压力低，气动执行机构故障，导致清吹管路截至阀动作缓慢或无动"], [2442, "作。"], [2443, "(3) 清吹系统截至阀卡涩，未能完全关闭"], [2444, "(4) 清吹系统截至阀内漏， 当管线未被清吹时， 清吹阀关闭。 如果两个清吹阀中的一个是泄漏阀，"], [2445, "则排空阀 VAV-2、VAV-3 和 VAV-4 将能够排出小泄漏。如果严重泄漏。在这种情况下，两个清"], [2446, "吹阀之间管道中的压力将增加，达到跳机上限后机组在 10 秒延时后会直接跳机。"]]}, {"t": "机岛规程 第 2456～2461 行", "lines": [[2456, "9.5.6.2 气体燃料吹扫腔间压力低"], [2457, "1) 现象：气体燃料吹扫腔间压力低，并发出报警，燃机1倍RB。"], [2458, "2) 原因："], [2459, "(1) 96PG-2A、96PG-2B、96PG-4A、96PG-4B 腔间压力传感器测量错误。"], [2460, "(2) 清吹管路放散阀卡涩、气动执行机构异常。"], [2461, "(3) 清吹系统放散阀内漏。"]]}], "opts": [["A", "腔间压力传感器测量错误"], ["B", "清吹管路放散阀卡涩、气动执行机构异常"], ["C", "清吹系统放散阀内漏"], ["D", "清吹系统截止阀内漏，管线未清吹时漏气"]], "key": "D", "why": "清吹截止阀（清吹阀）内漏是腔间压力高的原因：管线未清吹时两个清吹阀关着，泄漏严重会使两阀之间压力升高。压力低的原因是传感器测量错误、放散阀卡涩或内漏。"}, "D:6.2-8": {"id": "D:6.2-8", "kp": "6.2", "kind": "drill", "type": "fill", "tname": "填空", "stem": "气体燃料吹扫腔间压力高时，除了报警，现场还能听到（ ）。", "ans": "尖锐的排空气声", "src": [{"t": "机岛规程 第 2438～2438 行", "lines": [[2438, "1) 现象：气体燃料吹扫腔间压力高，并发出报警，现场能听到尖锐的排空气声。"]]}]}, "L:6.2": {"id": "L:6.2", "kp": "6.2", "kind": "intro"}, "RJ-c45d2396": {"id": "RJ-c45d2396", "kp": "6.3", "kind": "orig", "type": "single", "tname": "单选", "stem": "燃气轮机清吹时间要根据排气道容积来确定，至少能将整个排气道体积（　　）倍的空气吹除掉。", "ans": "C", "from": "集团2025", "opts": [["A", "1"], ["B", "2"], ["C", "3"], ["D", "4。"]], "key": "C", "note": "本厂规程没写「3 倍容积」，只写 735 rpm 清吹 11.5 分钟（机岛 6.5.1.2）。"}, "RJ-4997d157": {"id": "RJ-4997d157", "kp": "6.3", "kind": "orig", "type": "multi", "tname": "多选", "stem": "解决燃机点火时的爆燃问题的措施：", "ans": "AB", "from": "技能培训", "opts": [["A", "在天然气的供气管路上安装双重阀门，保证机组停运时不使天然气漏到燃烧室中去"], ["B", "在启动过程中必须使机组在点火转速下先通风5min左右，力求把滞留在燃烧室中的天然气吹扫干净，然后才能点火升速，这样就能保证机组安全可靠地运行。"], ["C", "不必清吹"], ["D", "多加空气"]], "key": "AB", "note": "本厂是在 735 rpm 清吹 11.5 分钟，吹完降速，再升到 420 rpm 点火（机岛 6.5.1.2、6.5.1.3），不是在点火转速下通风。"}, "RJ-anti013": {"id": "RJ-anti013", "kp": "6.3", "kind": "orig", "type": "fill", "tname": "填空", "stem": "按《二十五项反措》8.7.7，点火失败后重新点火前必须进行（　　）。", "ans": "足够时间的清吹", "from": "来源训练题", "notes": [["原整理说明", "答案逐字见同题所附精确引文；本题不作跨来源推断。"], ["原文说明", "来源训练题：由原整理者依据《机岛运行技术标准》或反措原文出的训练题，不是竞赛原题库题目。"]]}, "FC-8.7.7": {"id": "FC-8.7.7", "kp": "6.3", "kind": "orig", "type": "fill", "tname": "填空", "stem": "按反措 8.7.7，（　　）后，重新点火前必须进行（　　）的清吹，防止燃气轮机和（　　）通道内的燃气浓度达到（　　）而产生爆燃事故。", "ans": "点火失败；足够时间；余热锅炉；爆炸极限", "from": "反措题卡", "notes": [["原文说明", "题卡依据《防止电力生产事故的二十五项重点要求》（2023版）原文自制，不是竞赛原题库题目；答案以附带原文为准。"]]}, "D:6.3-1": {"id": "D:6.3-1", "kp": "6.3", "kind": "drill", "type": "fill", "tname": "填空", "stem": "启动时转速升至清吹转速（ ）rpm，开始清吹倒计时（ ）min；清吹结束后（ ）停止输出功率，燃机开始降速。", "ans": "735；11.5；LCI", "src": [{"t": "机岛规程 第 1237～1238 行", "lines": [[1237, "7) 转速升至清吹转速735rpm，开始清吹倒计时11.5min。"], [1238, "8) 清吹结束LCI停止输出功率，燃机开始降速。"]]}]}, "D:6.3-2": {"id": "D:6.3-2", "kp": "6.3", "kind": "drill", "type": "judge", "tname": "判断", "stem": "启动清吹结束后，燃机保持在清吹转速，直接启动点火程序。", "ans": "错", "src": [{"t": "机岛规程 第 1238～1241 行", "lines": [[1238, "8) 清吹结束LCI停止输出功率，燃机开始降速。"], [1239, "6.5.1.3 燃机点火"], [1240, "1) 燃机转速降至13.3%TNH （400rpm） 以下时， LCI再次输出功率， 转速升至点火转速14%TNH （420rpm） ，"], [1241, "燃机启动点火程序。"]]}], "key": "错", "why": "清吹结束 LCI 停止输出功率，燃机降速；转速降至 13.3%TNH（400rpm）以下时 LCI 再次输出功率，转速升至点火转速 14%TNH（420rpm），才启动点火程序。"}, "D:6.3-3": {"id": "D:6.3-3", "kp": "6.3", "kind": "drill", "type": "choice", "tname": "单选", "stem": "本厂燃机的点火转速是多少？", "ans": "A", "src": [{"t": "机岛规程 第 1240～1241 行", "lines": [[1240, "1) 燃机转速降至13.3%TNH （400rpm） 以下时， LCI再次输出功率， 转速升至点火转速14%TNH （420rpm） ，"], [1241, "燃机启动点火程序。"]]}], "opts": [["A", "14%TNH（420rpm）"], ["B", "13.3%TNH（400rpm）"], ["C", "735rpm"], ["D", "40%TNH（1200rpm）"]], "key": "A"}, "D:6.3-4": {"id": "D:6.3-4", "kp": "6.3", "kind": "drill", "type": "ask", "tname": "问答", "stem": "启动清吹进行时，火焰检测器出现什么情况会触发点火失败跳闸？", "ans": "任一火检传感器检测到火焰，或至少有两个火检传感器不健康。", "src": [{"t": "机岛规程 第 572～578 行", "lines": [[572, "16 Trip Failure To Ignite SIF Trip Request（点火失败跳闸）"], [573, "（1） 点火 10s 后，火焰检测器（28FD-13、14、15、16）未检测到火焰，四取三"], [574, "（2）"], [575, "火检传感器故障： 清吹进行时(TNH>24.3%,余热锅炉清吹未完成， BPCS 有清吹允许信号或"], [576, "吹扫系统投入时 P2 腔和点火腔阻塞压力正常的情况下)，任一火检传感器检测到火焰或"], [577, "至 少 有 两 个 火 检 传 感 器 不 健 康 （ ＜ -6.25% 或 ＞ 12.5% 且 火 检 传 感 器 输 入 电 流 超 过"], [578, "3.77-21.5mA）"]]}]}, "D:6.3-5": {"id": "D:6.3-5", "kp": "6.3", "kind": "drill", "type": "fill", "tname": "填空", "stem": "点火（ ）s 后，火焰检测器（28FD-13、14、15、16）未检测到火焰（四取三），触发点火失败跳闸。", "ans": "10", "src": [{"t": "机岛规程 第 572～573 行", "lines": [[572, "16 Trip Failure To Ignite SIF Trip Request（点火失败跳闸）"], [573, "（1） 点火 10s 后，火焰检测器（28FD-13、14、15、16）未检测到火焰，四取三"]]}]}, "D:6.3-6": {"id": "D:6.3-6", "kp": "6.3", "kind": "drill", "type": "ask", "tname": "问答", "stem": "按本厂规程，燃烧室点火失败后，满足什么条件才可以再次点火？", "ans": "先查明点火失败的原因；燃机高盘清吹结束后，并得到值长同意，才可再次进行点火。", "src": [{"t": "机岛规程 第 6775～6784 行", "lines": [[6775, "11.3.7 燃烧室点火失败"], [6776, "1) 现象："], [6777, "(1) 控制系统进入点火程序失败，自动停机。"], [6778, "2) 原因："], [6779, "(1) 燃料控制阀未打开。"], [6780, "(2) 火焰探测器故障探测不到火焰。"], [6781, "(3) 点火器（火花塞）故障。"], [6782, "3) 处理："], [6783, "(1) 点火失败应查明原因。"], [6784, "(2) 燃机高盘清吹结束后，并得到值长同意后可再次进行点火。"]]}]}, "L:6.3": {"id": "L:6.3", "kp": "6.3", "kind": "intro"}, "FC-8.7.21": {"id": "FC-8.7.21", "kp": "7.1", "kind": "orig", "type": "fill", "tname": "填空", "stem": "按反措 8.7.21，做好在役地下燃气管道防腐涂层的检查与维护工作。正常情况下高压、次高压管道（（　　）＜P≤（　　））应每（　　）年一次；（　　）年以上的管道每（　　）年一次。", "ans": "0.4MPa；4.0MPa；3；10；2", "from": "反措题卡", "notes": [["原文说明", "题卡依据《防止电力生产事故的二十五项重点要求》（2023版）原文自制，不是竞赛原题库题目；答案以附带原文为准。"]]}, "FC-8.7.22": {"id": "FC-8.7.22", "kp": "7.1", "kind": "orig", "type": "fill", "tname": "填空", "stem": "按反措 8.7.22，燃气调压站内的防雷设施应处于正常运行状态。每年应进行（　　）检测，其中在（　　）前应检测一次，确保（　　）在设计范围内。", "ans": "两次；雷雨季节；接地电阻值", "from": "反措题卡", "notes": [["原文说明", "题卡依据《防止电力生产事故的二十五项重点要求》（2023版）原文自制，不是竞赛原题库题目；答案以附带原文为准。"]]}, "FC-8.7.16_8.7.18": {"id": "FC-8.7.16_8.7.18", "kp": "7.1", "kind": "orig", "type": "fill", "tname": "填空", "stem": "按反措 8.7.16，严格执行燃气轮机（　　）系统的管理制度，定期加强维护管理，防止（　　）、（　　）等设备因高温老化损坏而引起点火失败。按 8.7.18，应结合机组检修，对燃气轮机仓及燃料阀组间燃气系统进行（　　）试验，对燃气管道进行全面检查。", "ans": "点火；点火器；高压点火电缆；气密性", "from": "反措题卡", "notes": [["原文说明", "题卡依据《防止电力生产事故的二十五项重点要求》（2023版）原文自制，不是竞赛原题库题目；答案以附带原文为准。"]]}, "D:7.1-1": {"id": "D:7.1-1", "kp": "7.1", "kind": "drill", "type": "judge", "tname": "判断", "stem": "在役地下高压、次高压燃气管道投用 10 年以上以后，防腐涂层检查仍按每 3 年一次执行即可。", "ans": "错", "src": [], "key": "错", "why": "反措要求高压、次高压管道正常情况下每 3 年检查一次，10 年以上的管道要缩短到每 2 年一次。"}, "D:7.1-2": {"id": "D:7.1-2", "kp": "7.1", "kind": "drill", "type": "choice", "tname": "单选", "stem": "反措对燃气调压站防雷设施检测的要求，下列哪一项正确？", "ans": "B", "src": [], "opts": [["A", "每年检测一次，在雷雨季节后进行"], ["B", "每年检测两次，其中雷雨季节前检测一次，确保接地电阻值在设计范围内"], ["C", "每两年检测一次"], ["D", "只在机组大修时检测"]], "key": "B"}, "D:7.1-3": {"id": "D:7.1-3", "kp": "7.1", "kind": "drill", "type": "ask", "tname": "问答", "stem": "反措对燃机点火系统和燃机仓、燃料阀组间的燃气系统各提了什么定期检查要求？", "ans": "点火系统：严格执行燃机点火系统的管理制度，定期加强维护管理，防止点火器、高压点火电缆等设备因高温老化损坏而引起点火失败。燃机仓和燃料阀组间：结合机组检修，对燃气系统进行气密性试验，对燃气管道进行全面检查。", "src": []}, "L:7.1": {"id": "L:7.1", "kp": "7.1", "kind": "intro"}, "RJ-529d5127": {"id": "RJ-529d5127", "kp": "7.2", "kind": "orig", "type": "judge", "tname": "判断", "stem": "压缩天然气简称LNG。", "ans": "错误", "from": "一二阶", "key": "错"}, "RJ-dd7b5b7a": {"id": "RJ-dd7b5b7a", "kp": "7.2", "kind": "orig", "type": "single", "tname": "单选", "stem": "天然气在常压绝对温度111K(-162℃)液化，即变为液化天然气(LNG)，液化后体积缩小到（　　）左右，液化天然气升温气化后即为普通天然气。", "ans": "C", "from": "一二阶", "opts": [["A", "1/100"], ["B", "1/600"], ["C", "1/1000"], ["D", "1/10000"]], "key": "C", "note": "规程没写这个数。题库另外两题（RJ-e7c6ba61、RJ-a9426931）说约 600 倍，题库内部互相矛盾。"}, "RJ-e7c6ba61": {"id": "RJ-e7c6ba61", "kp": "7.2", "kind": "orig", "type": "single", "tname": "单选", "stem": "1个大气压下，1立方米LNG（液态天然气）气化后可得（　　）立方米天然气。", "ans": "D", "from": "集团2025", "opts": [["A", "250"], ["B", "300"], ["C", "500"], ["D", "600。"]], "key": "D"}, "RJ-e2d14153": {"id": "RJ-e2d14153", "kp": "7.2", "kind": "orig", "type": "single", "tname": "单选", "stem": "天然气常压下零下（　　）度可转化为液态。", "ans": "B", "from": "集团2025", "opts": [["A", "130"], ["B", "162"], ["C", "200"], ["D", "260。"]], "key": "B"}, "RJ-a9426931": {"id": "RJ-a9426931", "kp": "7.2", "kind": "orig", "type": "short", "tname": "简答", "stem": "什么是LNG？", "ans": "LNG是英文Liquefied Natural Gas的简称，即液化天然气，是天然气在经净化及超低温状态下（-162℃、一个大气压）冷却液化的产物。液化后的天然气其体积大大减少，约为0℃、1个大气压时天然气体积的1/600，也就是说1立方米LNG气化后可得600立方米天然气。", "from": "集团2025"}, "RJ-6e770977": {"id": "RJ-6e770977", "kp": "7.2", "kind": "orig", "type": "single", "tname": "单选", "stem": "使用以下哪种燃料，燃机检修周期最长（　　）。", "ans": "D", "from": "集团2025", "opts": [["A", "渣油"], ["B", "重油"], ["C", "轻油"], ["D", "天然气。"]], "key": "D"}, "RJ-829e62b1": {"id": "RJ-829e62b1", "kp": "7.2", "kind": "orig", "type": "single", "tname": "单选", "stem": "天然气发电NOx和CO2排放最仅为燃煤电厂的      和      。（　　）", "ans": "C", "from": "集团2025", "opts": [["A", "30%，60%"], ["B", "10%，40%"], ["C", "20%，50%"], ["D", "50%，80%。"]], "key": "C"}, "RJ-d997af06": {"id": "RJ-d997af06", "kp": "7.2", "kind": "orig", "type": "judge", "tname": "判断", "stem": "重油燃料比轻质液体燃料和气体燃料难于燃烧。", "ans": "正确", "from": "一二阶", "key": "对"}, "D:7.2-1": {"id": "D:7.2-1", "kp": "7.2", "kind": "drill", "type": "choice", "tname": "单选", "stem": "液化天然气的英文缩写是哪一个？", "ans": "B", "src": [], "opts": [["A", "CNG"], ["B", "LNG"], ["C", "LPG"], ["D", "NGL"]], "key": "B"}, "D:7.2-2": {"id": "D:7.2-2", "kp": "7.2", "kind": "drill", "type": "judge", "tname": "判断", "stem": "天然气在常压下冷却到约零下 162℃ 会液化，用绝对温度表示约为 111K。", "ans": "对", "src": [], "key": "对"}, "D:7.2-3": {"id": "D:7.2-3", "kp": "7.2", "kind": "drill", "type": "ask", "tname": "问答", "stem": "燃机烧天然气和烧油相比有什么好处？天然气发电和燃煤电厂比，排放怎样？", "ans": "在渣油、重油、轻油、天然气几种燃料里，烧天然气的燃机检修周期最长；重油比轻质液体燃料和气体燃料难于燃烧。天然气发电的 NOx 和 CO2 排放仅为燃煤电厂的 20% 和 50%。", "src": []}, "L:7.2": {"id": "L:7.2", "kp": "7.2", "kind": "intro"}}, "families": [["1.1", ["L:1.1", "D:1.1-3", "RJ-4b9ad7a2", "D:1.1-2", "RJ-ec4eb246", "RJ-8f0812f6", "D:1.1-5", "RJ-3203e596", "RJ-da51f19a", "D:1.1-4", "RJ-1f7a5d08", "D:1.1-1", "RJ-16bc2855", "RJ-0f72ed79", "RJ-a5092182", "RJ-6432e245"]], ["1.2", ["L:1.2", "D:1.2-2", "RJ-b0470420", "D:1.2-4", "RJ-681fbb83", "D:1.2-1", "RJ-50b5e7c9", "D:1.2-3", "RJ-35f80f5a", "RJ-99d89302", "RJ-92d42d57", "RJ-04a9f5a8"]], ["2.1", ["L:2.1", "D:2.1-3", "RJ-d8bedb1f", "D:2.1-5", "D:2.1-7", "RJ-2a260f05", "D:2.1-6", "D:2.1-2", "D:2.1-1", "D:2.1-4"]], ["2.2", ["L:2.2", "D:2.2-6", "RJ-70319aa3", "D:2.2-2", "D:2.2-8", "D:2.2-3", "D:2.2-5", "D:2.2-7", "D:2.2-1", "D:2.2-4"]], ["2.3", ["L:2.3", "D:2.3-3", "D:2.3-5", "D:2.3-4", "D:2.3-6", "D:2.3-2", "D:2.3-7", "D:2.3-1", "RJ-4bb9d488"]], ["2.4", ["L:2.4", "D:2.4-3", "RJ-56ef8734", "D:2.4-2", "RJ-7b0c61b1", "D:2.4-4", "RJ-a388d6bf", "D:2.4-1", "RJ-c10da99b", "D:2.4-5"]], ["2.5", ["L:2.5", "D:2.5-2", "RJ-4616d080", "D:2.5-4", "RJ-a592c6cd", "D:2.5-5", "D:2.5-1", "D:2.5-3", "D:2.5-6"]], ["2.6", ["L:2.6", "D:2.6-2", "D:2.6-5", "D:2.6-3", "D:2.6-1", "D:2.6-6", "D:2.6-4"]], ["2.7", ["L:2.7", "D:2.7-3", "D:2.7 , "D:5.3-3", "D:5.3-6", "D:5.3-8", "D:5.3-1", "D:5.3-7"]], ["5.4", ["L:5.4", "D:5.4-4", "D:5.4-3", "D:5.4-2", "D:5.4-5", "D:5.4-6", "D:5.4-1", "D:5.4-8", "D:5.4-7"]], ["5.5", ["L:5.5", "D:5.5-3", "RJ-std007", "D:5.5-2", "RJ-e6257906", "D:5.5-6", "D:5.5-4", "D:5.5-7", "D:5.5-5", "D:5.5-1"]], ["5.6", ["L:5.6", "D:5.6-3", "D:5.6-6", "D:5.6-2", "D:5.6-4", "D:5.6-7", "D:5.6-5", "D:5.6-1"]], ["5.7", ["L:5.7", "D:5.7-5", "D:5.7-3", "D:5.7-2", "D:5.7-4", "D:5.7-1", "D:5.7-7", "D:5.7-6"]], ["5.8", ["L:5.8", "D:5.8-2", "D:5.8-4", "D:5.8-1", "D:5.8-5", "D:5.8-6", "D:5.8-7", "D:5.8-3"]], ["6.1", ["L:6.1", "D:6.1-4", "RJ-std017", "D:6.1-2", "D:6.1-6", "RJ-df03cc1d", "D:6.1-3", "D:6.1-8", "D:6.1-1", "D:6.1-5", "D:6.1-7"]], ["6.2", ["L:6.2", "D:6.2-7", "D:6.2-8", "D:6.2-2", "D:6.2-4", "D:6.2-1", "D:6.2-3", "D:6.2-6", "D:6.2-5"]], ["6.3", ["L:6.3", "D:6.3-3", "RJ-4997d157", "D:6.3-2", "D:6.3-4", "RJ-anti013", "D:6.3-5", "RJ-c45d2396", "D:6.3-6", "D:6.3-1", "FC-8.7.7"]], ["7.1", ["L:7.1", "D:7.1-2", "FC-8.7.22", "D:7.1-1", "D:7.1-3", "FC-8.7.21", "FC-8.7.16_8.7.18"]], ["7.2", ["L:7.2", "D:7.2-1", "RJ-529d5127", "D:7.2-2", "D:7.2-3", "RJ-e2d14153", "RJ-d997af06", "RJ-6e770977", "RJ-a9426931", "RJ-e7c6ba61", "RJ-829e62b1", "RJ-dd7b5b7a"]]], "terms": [{"key": "RB", "match": ["RB", "RUNBACK", "快减负荷"], "src": "机岛 5.3", "text": "快速自动减负荷（Runback）。由 Mark VIe 控制系统自动执行，让 FSR 按规定速率往下降，直到故障消除；在规定时间内消除不了，就把机组降到全速空载运行。有 1 倍速率和 3 倍速率两种，3 倍降得更快。"}, {"key": "FSR", "match": ["FSR"], "src": "常识", "text": "燃料冲程基准（Fuel Stroke Reference），GE 控制系统里给燃料量的指令值。FSR 往下降，燃料量就减少、负荷跟着降。"}, {"key": "TNH", "match": ["TNH"], "src": "机岛 6.5.1.2", "text": "燃机转速，用额定转速的百分数表示。本机额定 3000 rpm，所以 14% TNH 就是 420 rpm，95% TNH 约 2850 rpm。"}, {"key": "FSNL / FSFL", "match": ["FSNL", "FSFL", "全速空载", "全速全载"], "src": "机岛 9.4.4.5、9.4.4.6", "text": "FSNL 是全速空载：转速到额定、还没带负荷。FSFL 是全速全载。"}, {"key": "CPD", "match": ["CPD"], "src": "常识", "text": "压气机排气压力（Compressor Discharge Pressure）。燃料管路清吹用的就是抽出来、冷却过的压气机排气。"}, {"key": "CPAMB", "match": ["CPAMB"], "src": "机岛 5.4", "text": "大气绝对压力值。"}, {"key": "LEL", "match": ["LEL", "爆炸下限"], "src": "公用表 2；机岛 5.2", "text": "爆炸下限（Lower Explosive Limit）。甲烷的爆炸下限是体积浓度 5%。探测器读数「10% LEL」意思是浓度达到爆炸下限的十分之一，相当于甲烷体积浓度 0.5%，不是体积浓度 10%。"}, {"key": "psi / psig / Kpag", "match": ["psi", "Psi", "psig", "Kpag", "kpag", "barg"], "src": "常识", "text": "psi 是英制压力单位，1 psi 约等于 6.895 kPa。末尾带 g（psig、Kpag、barg）表示表压，即比大气压高出多少；不带 g 的要看上下文。"}, {"key": "℉", "match": ["℉"], "src": "常识", "text": "华氏度。换算成摄氏度：℃ =（℉ − 32）÷ 1.8。例如 460 ℉ 约 238 ℃，100 ℉ 约 38 ℃。"}, {"key": "Nm³", "match": ["Nm³", "Nm3", "Nm"], "src": "常识", "text": "标准立方米，指换算到规定标准状态下的气体体积。规程表 1 的天然气参数是按 20 ℃ 计量的，比较时要注意条件是否一致。"}, {"key": "LCI", "match": ["LCI", "SFC", "静态变频"], "src": "机岛 6.5.1.2", "text": "静态变频启动装置。启动时让发电机当电动机用，带着燃机升速，燃机能自己维持转速以后退出。"}, {"key": "DLN", "match": ["DLN"], "src": "机岛 4.1.2.2", "text": "干式低氮燃烧（Dry Low NOx）。本机燃烧室是 DLN2.6e 干式低氮燃烧室，逆流分管式，共 16 个。靠燃料和空气预先混合、控制火焰温度来减少氮氧化物。"}, {"key": "PM1 / PM2 / PM3 / AFS", "match": ["PM1", "PM2", "PM3", "AFS"], "src": "机岛 4.1.2.2、3.2", "text": "每个燃烧室的四路燃料管线。PM1、PM2、PM3 是燃烧室喷嘴的三路预混燃料；AFS 是轴向燃料分级，把燃料喷在过渡段头部。四路分别由燃气控制阀 VGC-1～4 供气。"}, {"key": "P1 / P1X / P2 腔", "match": ["P1 腔", "P1X", "P2 腔", "P2腔", "P1腔"], "src": "机岛 9.4.2", "text": "燃料模块里相邻两道阀之间的管段。VS4-4 和 VS4-1 之间是 P1 腔；VS4-1 和 VGS-1、VSC-1 之间是 P1X 腔；VGS-1、VSC-1 和燃气控制阀之间是 P2 腔。每个腔各有一个通风阀。"}, {"key": "SSOV", "match": ["SSOV"], "src": "机岛 6.5.1.2", "text": "安全切断阀，就是 VS4-4。"}, {"key": "GCV", "match": ["GCV"], "src": "机岛 9.8.4", "text": "燃气控制阀，就是 VGC-1～4 这四个阀。规程有的地方写 GCV，有的写 VGC。"}, {"key": "燃料管路清吹", "match": ["燃料管路清吹"], "src": "机岛 9.5", "text": "转速 95% 以上，用冷却后的压气机排气，一直吹暂时不进燃气的燃料歧管，防止燃气积聚和燃烧回流。和启动清吹不是一回事。见考点 6.1。"}, {"key": "启动清吹", "match": ["启动清吹", "735"], "src": "机岛 6.5.1.2", "text": "启动时转速升到 735 rpm，清吹 11.5 分钟，把燃机和余热锅炉排气通道里可能残留的燃气吹走，然后降速再升到 420 rpm 点火。和燃料管路清吹不是一回事。见考点 6.3。"}, {"key": "清吹信用", "match": ["清吹信用", "吹扫免除", "VIS-"], "src": "机岛 9.4.2", "text": "气体燃料系统里的一组阀 VIS-1、VIS-2、VIS-3 和排气阀 VIV-1。规程写它们在「吹扫免除操作期间」打开，给 P2 腔和引燃点火腔加压。见考点 5.1、5.6。     const c = /^#\/flow/.test(location.hash) && getDeck()[db.pos]; return c && c.startsWith('L:') ? c.slice(2) : null; };
  function readPct() {
    const max = document.documentElement.scrollHeight - innerHeight;
    return max <= 0 ? 100 : Math.min(100, Math.round(scrollY / max * 100));
  }
  let saveT = null, restoring = false;
  function onScroll() {
    document.getElementById('totop').className = scrollY > 600 ? 'show' : '';
    const kp = kpInView(), bar = document.getElementById('readbar');
    bar.style.width = kp ? readPct() + '%' : '0';
    if (restoring) return;
    clearTimeout(saveT);
    saveT = setTimeout(() => {
      db.scroll[scrollKey()] = Math.round(scrollY);
      if (kp) {
        db.pct[kp] = Math.max(db.pct[kp] || 0, readPct());
        db.last = { hash: location.hash, kp, at: Date.now() };
      }
      save();
    }, 400);
  }
  function page(title, active, ...body) {
    $app.replaceChildren(h('header', { class: 'top' }, h('h1', {}, title)), h('main', {}, ...body), nav(active));
    const y = db.scroll[scrollKey()] || 0;
    restoring = true;
    requestAnimationFrame(() => {
      window.scrollTo(0, y);
      requestAnimationFrame(() => { restoring = false; onScroll(); });
      if (y > 300 && kpInView()) toast('已回到上次读到的位置');
    });
    const kp = kpInView();
    if (kp && !/^#\/flow/.test(location.hash)) { db.last = { hash: location.hash, kp, at: Date.now() }; save(); }
  }

  // ---------- 词条 ----------
  function termsIn(text) {
    return DATA.terms.filter(t => t.match.some(m => text.includes(m)));
  }
  function termChips(text) {
    const ts = termsIn(text);
    if (!ts.length) return null;
    const box = h('div', { class: 'terms' }, h('span', { class: 'lbl' }, '词条：'));
    const body = h('div', { class: 'termbody' });
    ts.forEach(t => box.append(h('button', { class: 'chip', onclick: () => {
      body.replaceChildren(h('b', {}, t.key), '　', t.text, h('span', { class: 'src' }, `（${t.src}）`));
    } }, t.key)));
    box.append(body);
    return box;
  }

  // ---------- 规程原文 ----------
  function sourceBlock(srcs, open) {
    if (!srcs || !srcs.length) return null;
    return h('details', { class: 'src-block', open },
      h('summary', {}, '规程原文'),
      ...srcs.map(s => h('div', { class: 'src-item' }, h('div', { class: 'src-t' }, s.t),
        h('pre', {}, s.lines.map(l => l[1]).join('\n')))));
  }

  // ---------- 一张题卡 ----------
  // mode: 'flow' 刷题（记次数）；'drill' 专练（只记对错）；'static' 考点页里的静态展示
  function questionCard(c, mode, onDone) {
    const kp = kpOf(c.kp);
    const wrap = h('div', { class: 'card' });
    const tag = c.kind === 'orig' ? `题库原题 · ${c.from}` : '规程快练';
    wrap.append(h('div', { class: 'meta' }, h('span', { class: 'pill ' + c.kind }, tag), h('span', { class: 'pill' }, c.tname)));
    wrap.append(h('div', { class: 'stem' }, c.stem));
    const ansBox = h('div', { class: 'answer', hidden: mode !== 'static' });
    let chosen = new Set(), revealed = mode === 'static';

    const isChoice = c.type === 'single' || c.type === 'choice' || c.type === 'multi';
    const optBtns = [];
    if (isChoice && c.opts) {
      const list = h('div', { class: 'opts' });
      c.opts.forEach(([k, t]) => {
        const b = h('button', { class: 'opt', onclick: () => {
          if (revealed) return;
          if (c.type === 'multi') { chosen.has(k) ? chosen.delete(k) : chosen.add(k); b.classList.toggle('sel'); }
          else { chosen = new Set([k]); reveal(); }
        } }, h('b', {}, k), '　', t);
        b.dataset.k = k; optBtns.push(b); list.append(b);
      });
      wrap.append(list);
    }
    const actions = h('div', { class: 'actions' });
    if (!revealed) {
      if (c.type === 'judge') {
        ['对', '错'].forEach(v => actions.append(h('button', { class: 'btn', onclick: () => { chosen = new Set([v]); reveal(); } }, v)));
      } else if (c.type === 'multi') {
        actions.append(h('button', { class: 'btn', onclick: () => chosen.size ? reveal() : toast('先选选项') }, '选好了，看答案'));
      } else if (!isChoice) {
        actions.append(h('button', { class: 'btn', onclick: reveal }, '想好了，看答案'));
      }
      actions.append(h('button', { class: 'btn ghost', onclick: () => { chosen = new Set(); reveal(true); } }, '不会，直接看'));
    }
    wrap.append(actions, ansBox);

    function fill(skipped) {
      const parts = [];
      let verdict = null;
      if ((isChoice || c.type === 'judge') && !skipped && mode !== 'static') {
        const pick = [...chosen].sort().join('');
        const key = c.type === 'judge' ? c.key : String(c.key).replace(/[^A-Z]/g, '');
        verdict = pick === key;
        parts.push(h('div', { class: 'verdict ' + (verdict ? 'ok' : 'bad') }, verdict ? '答对了' : `不对，你选的是 ${pick}`));
      }
      if (isChoice) optBtns.forEach(b => {
        const k = b.dataset.k, key = String(c.key || c.ans);
        if (key.includes(k)) b.classList.add('right'); else if (chosen.has(k)) b.classList.add('wrong');
      });
      let ansText = c.type === 'judge' ? `${c.key === '对' ? '正确' : '错误'}` : c.ans;
      if (isChoice && c.opts) {   // 选择题把选项内容也写出来
        const keys = String(c.key || c.ans).replace(/[^A-Z]/g, '');
        ansText = c.opts.filter(o => keys.includes(o[0])).map(o => `${o[0]}　${o[1]}`).join('\n') || c.ans;
      }
      parts.push(h('div', { class: 'ans' }, h('span', { class: 'lbl' }, '答案'), ansText));
      if (c.why) parts.push(h('div', { class: 'why' }, h('span', { class: 'lbl' }, '规程说法'), c.why));
      (c.notes || []).forEach(([k, t]) => parts.push(h('div', { class: 'why' }, h('span', { class: 'lbl' }, k), t)));
      if (c.note) parts.push(h('div', { class: 'plant' }, h('span', { class: 'lbl' }, '本厂规程'), c.note));
      const text = [c.stem, c.ans, c.why || '', c.note || '', ...(c.notes || []).map(n => n[1]), ...(c.opts || []).map(o => o[1])].join(' ');
      const chips = termChips(text); if (chips) parts.push(chips);
      if (c.src && c.src.length) parts.push(sourceBlock(c.src, false));
      if (mode !== 'static') parts.push(h('a', { class: 'kplink', href: `#/kp/${c.kp}` }, `看考点讲解：${kpLabel(kp)}`));
      ansBox.replaceChildren(...parts.filter(Boolean));
      ansBox.hidden = false;
      wrap.append(actions);          // 揭晓以后，按钮挪到答案下面
      return verdict;
    }
    function reveal(skipped) {
      if (revealed) return; revealed = true;
      actions.replaceChildren();
      const verdict = fill(skipped);
      onDone && onDone({ verdict, skipped: !!skipped, open: !(isChoice || c.type === 'judge'), chosen: [...chosen] }, actions);
    }
    if (mode === 'static') fill(true);
    wrap.reveal = reveal; wrap.restore = st => { chosen = new Set(st.chosen || []); revealed = true; actions.replaceChildren(); fill(st.skipped); };
    return wrap;
  }

  // ---------- 讲解卡 ----------
  function lectureView(kp, withQuestions) {
    const cat = catOf(kp.cat);
    const out = [h('div', { class: 'crumb' }, `${cat.id}、${cat.name}`),
      h('h2', { class: 'kptitle' }, kpLabel(kp)),
      h('div', { class: 'gist' }, h('span', { class: 'lbl' }, '要能说出'), kp.gist),
      h('article', { class: 'lecture', html: kp.lecture }),
      termChips(kp.lecture.replace(/<[^>]+>/g, '')),
      sourceBlock(kp.sources, false),
      readBox(kp)];
    if (withQuestions) out.push(...lectureQuestions(kp));
    return out.filter(Boolean);
  }
  function lectureQuestions(kp) {
    const out = [];
    {
      out.push(h('h3', {}, `这个考点的题（${kp.cards.length} 道）`),
        h('a', { class: 'btn', href: `#/drill/${kp.id}` }, '专练这个考点'));
      kp.cards.forEach(id => {
        const c = DATA.cards[id];
        out.push(h('details', { class: 'qitem' }, h('summary', {}, `${c.kind === 'orig' ? '原题' : '快练'} · ${c.tname}　${c.stem.slice(0, 40)}${c.stem.length > 40 ? '…' : ''}`),
          questionCard(c, 'static')));
      });
    }
    return out.filter(Boolean);
  }

  function readState(id) {
    if (db.read[id]) return ['read', '已读'];
    const p = db.pct[id] || 0;
    return p >= 5 ? ['part', `读到 ${p}%`] : ['', '未读'];
  }
  function readBox(kp) {
    const box = h('div', { class: 'readbox' });
    const draw = () => {
      const on = !!db.read[kp.id];
      box.replaceChildren(
        h('button', { class: 'btn ' + (on ? 'on' : 'ghost'), onclick: () => {
          if (db.read[kp.id]) delete db.read[kp.id]; else db.read[kp.id] = Date.now();
          save(); draw(); toast(db.read[kp.id] ? '已标记为已读' : '已取消已读');
        } }, on ? '✓ 已读' : '标记为已读'),
        h('span', {}, on ? `${new Date(db.read[kp.id]).toLocaleDateString('zh-CN')} 读完` : `已读到 ${db.pct[kp.id] || 0}%，进度自动保存`));
    };
    draw();
    return box;
  }

  // ---------- 首页 ----------
  function viewHome() {
    const d = getDeck();
    const seenKp = Object.keys(db.kpSeen).length, allKp = Object.keys(DATA.kps).length;
    const cont = h('a', { class: 'hero', href: '#/flow' },
      h('div', { class: 'hero-t' }, db.pos === 0 && db.round === 1 ? '开始刷题' : '继续刷题'),
      h('div', { class: 'hero-s' }, `第 ${db.round} 轮 · 第 ${db.pos + 1} / ${d.length} 张 · 每段 ${db.seg} 张`),
      h('div', { class: 'bar' }, h('i', { style: `width:${Math.round(db.pos / d.length * 100)}%` })));
    const lastKp = db.last && kpOf(db.last.kp);
    const resume = lastKp ? h('div', { class: 'resume' },
      h('span', {}, '上次读到　', h('b', {}, kpLabel(lastKp)), `　${readState(lastKp.id)[1]}`),
      h('a', { class: 'btn ghost', href: `#/kp/${lastKp.id}` }, '回到原位')) : null;
    const readN = Object.keys(db.read).filter(k => DATA.kps[k]).length;
    const stats = h('div', { class: 'stats' },
      h('div', {}, h('b', {}, db.total), h('span', {}, '刷过的卡片')),
      h('div', {}, h('b', {}, `${readN}/${allKp}`), h('span', {}, '读完的讲解')),
      h('div', {}, h('b', {}, `${seenKp}/${allKp}`), h('span', {}, '碰过的考点')),
      );
    const how = h('details', { class: 'how' }, h('summary', {}, '怎么用'),
      h('p', {}, '一张一张往下刷。新考点第一次出现时先给一张讲解卡，读完再做题；同一个考点的题会隔几张、换个题型再出现。'),
      h('p', {}, '第一次看不懂就直接看答案，不用硬想，马上下一张。第二、三次碰到同一个考点时，再试着自己先答。'),
      h('p', {}, '题目分两种：「题库原题」来自竞赛题库，答案一字未改，和本厂规程说法不一样的，答案下面会写「本厂规程」；「规程快练」是按本厂规程出的，答案下面能展开看规程原文。'));
    const cat = DATA.cats.map(c => h('section', { class: 'cat' }, h('h3', {}, `${c.id}、${c.name}`),
      h('ul', { class: 'kplist' }, c.kps.map(id => {
        const kp = kpOf(id), [cls, txt] = readState(id);
        return h('li', {}, h('a', { href: `#/kp/${id}` }, h('span', { class: 'kpn' }, kpLabel(kp)), h('span', { class: 'dots' }), h('small', { class: cls }, txt)));
      }))));
    page(DATA.title, '首页', resume, cont, stats, how, h('h2', { class: 'sec' }, `${DATA.packName}：目录`), ...cat);
  }

  // ---------- 刷题 ----------
  function viewFlow() {
    const d = getDeck();
    if (db.pos >= d.length) {
      page('刷题', '刷题', h('div', { class: 'card done' }, h('h2', {}, `第 ${db.round} 轮刷完了`),
        h('p', {}, '建议隔一天再刷下一轮。下一轮不再单独出讲解卡，同一考点的题会打乱顺序。'),
        h('button', { class: 'btn', onclick: () => { db.round++; db.pos = 0; db.segStart = 0; db.cur = null; save(); viewFlow(); } }, `开始第 ${db.round + 1} 轮`)));
      return;
    }
    // 满一段就停一下；但刚读完讲解卡时不停，让讲解和它的第一道题连着
    if (db.pos - db.segStart >= db.seg && !String(d[db.pos - 1] || '').startsWith('L:')) {
      page('刷题', '刷题', h('div', { class: 'card done' }, h('h2', {}, '这一段刷完了'),
        h('p', {}, `这一段 ${db.seg} 张。想停就停，下次打开从这里接着刷。`),
        h('button', { class: 'btn', onclick: () => { db.segStart = db.pos; save(); viewFlow(); } }, '继续下一段'),
        h('a', { class: 'btn ghost', href: '#/' }, '回首页')));
      return;
    }
    const id = d[db.pos], c = DATA.cards[id], kp = kpOf(c.kp);
    const segN = Math.floor(db.segStart / db.seg) + 1, inSeg = db.pos - db.segStart + 1;
    const head = h('div', { class: 'flowhead' },
      h('span', {}, `第 ${db.round} 轮 · 第 ${segN} 段 ${inSeg}/${db.seg}`),
      h('span', {}, `${db.pos + 1}/${d.length}`));
    const next = () => { db.pos++; db.cur = null; save(); viewFlow(); };

    if (c.kind === 'intro') {
      page('刷题', '刷题', head,
        h('div', { class: 'banner new' }, '新考点，先读讲解'),
        h('div', { class: 'card lec' }, ...lectureView(kp, false)),
        h('div', { class: 'actions sticky' }, h('button', { class: 'btn', onclick: () => {
          db.kpSeen[c.kp] = db.kpSeen[c.kp] || 0; db.read[c.kp] = db.read[c.kp] || Date.now(); db.total++; next(); } }, '读完了，下一张')));
      return;
    }
    const n = (db.kpSeen[c.kp] || 0) + 1;
    const banner = h('div', { class: 'banner' }, `${kpLabel(kp)} · 这个考点第 ${n} 次`);
    const card = questionCard(c, 'flow', (res, actions) => {
      const st = db.stat[id] || (db.stat[id] = { n: 0, ok: 0 });
      st.n++; st.last = Date.now(); if (res.verdict === true) st.ok++;
      db.kpSeen[c.kp] = n; db.total++;
      db.cur = { id, chosen: res.chosen, skipped: res.skipped };
      save();
      const nb = h('button', { class: 'btn', onclick: next }, '下一张');
      if (res.open && !res.skipped) actions.append(h('button', { class: 'btn ghost', onclick: () => { st.ok++; save(); next(); } }, '我想出来了，下一张'));
      actions.append(nb);
    });
    page('刷题', '刷题', head, banner, card);
    if (db.cur && db.cur.id === id) {           // 看过答案后去了讲解页再回来：恢复成已揭晓的样子
      card.restore(db.cur);
      const actions = card.querySelector('.actions');
      actions.append(h('button', { class: 'btn', onclick: next }, '下一张'));
    }
  }

  // ---------- 考点页、专练 ----------
  // 按目录顺序排的考点，用来找上一篇、下一篇
  const ORDER = DATA.cats.flatMap(c => c.kps);
  function pager(id) {
    const i = ORDER.indexOf(id), prev = ORDER[i - 1], next = ORDER[i + 1];
    return h('div', { class: 'pager' },
      prev ? h('a', { class: 'prev', href: `#/kp/${prev}` }, h('small', {}, '上一篇'), kpLabel(kpOf(prev))) : h('span'),
      next ? h('a', { class: 'next', href: `#/kp/${next}` }, h('small', {}, '下一篇'), kpLabel(kpOf(next))) : h('span'));
  }
  function viewKp(id) {
    const kp = kpOf(id); if (!kp) return viewHome();
    const i = ORDER.indexOf(id), next = ORDER[i + 1];
    page('考点讲解', '',
      h('div', { class: 'topnav' },
        h('a', { href: '#/' }, '← 目录'),
        next ? h('a', { href: `#/kp/${next}` }, `下一篇：${next} →`) : h('span')),
      ...lectureView(kp, false), pager(id), ...lectureQuestions(kp));
  }
  let drill = null;
  function viewDrill(id) {
    const kp = kpOf(id); if (!kp) return viewHome();
    if (!drill || drill.kp !== id) drill = { kp: id, list: GTModel.shuffle(kp.cards, Math.random), pos: 0, ok: 0 };
    if (drill.pos >= drill.list.length) {
      page('专练', '', h('div', { class: 'card done' }, h('h2', {}, `${kpLabel(kp)}：练完了`),
        h('p', {}, `一共 ${drill.list.length} 道，选择和判断答对 ${drill.ok} 道。`),
        h('button', { class: 'btn', onclick: () => { drill = null; viewDrill(id); } }, '再练一遍'),
        h('a', { class: 'btn ghost', href: `#/kp/${id}` }, '回到讲解')));
      return;
    }
    const c = DATA.cards[drill.list[drill.pos]];
    const card = questionCard(c, 'drill', (res, actions) => {
      if (res.verdict) drill.ok++;
      actions.append(h('button', { class: 'btn', onclick: () => { drill.pos++; viewDrill(id); } }, '下一道'));
    });
    page('专练', '', h('div', { class: 'flowhead' }, h('span', {}, kpLabel(kp)), h('span', {}, `${drill.pos + 1}/${drill.list.length}`)), card);
  }

  // ---------- 词条页 ----------
  function viewTerms() {
    page('词条', '词条', h('p', { class: 'hint' }, '刷题和讲解里遇到的缩写、单位和容易混的概念。写「常识」的是通用知识，不是本厂规程条文。'),
      ...DATA.terms.map(t => h('div', { class: 'term' }, h('h3', {}, t.key), h('p', {}, t.text), h('div', { class: 'src' }, t.src))));
  }

  // ---------- 同步面板 ----------
  function syncPanel() {
    if (!SYNC) return null;
    const key = h('input', { type: 'password', class: 'inp', placeholder: '粘贴同步口令', value: db.syncKey || '', autocomplete: 'off', autocapitalize: 'off', spellcheck: 'false' });
    const name = h('input', { type: 'text', class: 'inp short', value: db.deviceName || '', maxlength: '20' });
    return h('section', { class: 'syncbox' },
      h('h3', {}, '多设备同步'),
      h('p', { class: 'hint' }, '手机和电脑填同一个口令，刷题位置、阅读进度会自动合在一起。口令只存在这台设备的浏览器里。'),
      h('div', { class: 'row' }, h('span', { class: 'lbl' }, '口令'), key),
      h('div', { class: 'row' }, h('span', { class: 'lbl' }, '设备名'), name),
      h('div', { class: 'actions' },
        h('button', { class: 'btn', onclick: async () => {
          db.syncKey = key.value.replace(/\s+/g, '').slice(0, 80); db.deviceName = name.value.trim().slice(0, 20) || db.deviceName;
          persist(); syncNote = '';
          if (!db.syncKey) { refreshSync(); return toast('口令已清空，不再同步'); }
          await pullNow(true); await pushNow();
        } }, '保存并立即同步')),
      h('p', { id: 'sync-status', class: 'hint' }, syncText()));
  }

  // ---------- 记录页 ----------
  function viewRecord() {
    const d = getDeck();
    const segSel = h('select', { onchange: e => { db.seg = +e.target.value; save(); toast(`每段 ${db.seg} 张`); } },
      SEGS.map(n => h('option', { value: n, selected: n === db.seg }, `${n} 张`)));
    const answered = Object.values(db.stat), tried = answered.reduce((a, s) => a + s.n, 0), ok = answered.reduce((a, s) => a + s.ok, 0);
    const file = h('input', { type: 'file', accept: 'application/json', hidden: true, onchange: e => {
      const f = e.target.files[0]; if (!f) return;
      f.text().then(t => { const o = JSON.parse(t); if (o.v !== 1 || typeof o.pos !== 'number') throw 0; db = Object.assign(fresh(), o); save(); toast('已导入'); viewRecord(); })
        .catch(() => toast('这个文件不是本页导出的记录'));
    } });
    page('记录', '记录',
      h('div', { class: 'stats' },
        h('div', {}, h('b', {}, db.total), h('span', {}, '刷过的卡片')),
        h('div', {}, h('b', {}, tried), h('span', {}, '看过答案的次数')),
        h('div', {}, h('b', {}, ok), h('span', {}, '答对或自己想出来'))),
      h('p', {}, `第 ${db.round} 轮，刷到第 ${db.pos + 1} / ${d.length} 张。记录只存在这台设备的浏览器里。`),
      h('label', { class: 'row' }, '每段张数　', segSel),
      syncPanel(),
      h('div', { class: 'actions' },
        h('button', { class: 'btn', onclick: () => {
          const blob = new Blob([JSON.stringify(db, null, 1)], { type: 'application/json' });
          const a = h('a', { href: URL.createObjectURL(blob), download: `燃机学习记录-${new Date().toISOString().slice(0, 10)}.json` }); a.click();
        } }, '导出记录'),
        h('button', { class: 'btn ghost', onclick: () => file.click() }, '导入记录'), file),
      h('details', { class: 'danger' }, h('summary', {}, '清空记录'),
        h('p', {}, '清空后从第 1 轮第 1 张重新开始，碰过的次数也会归零。建议先导出。'),
        h('button', { class: 'btn bad', onclick: () => { if (confirm('确定清空全部学习记录？')) { db = fresh(); deck = null; save(); viewRecord(); } } }, '确定清空')));
  }

  // ---------- 路由 ----------
  function route() {
    const hash = location.hash || '#/';
    const m = hash.match(/^#\/(\w+)(?:\/(.+))?/);
    const [name, arg] = m ? [m[1], m[2] && decodeURIComponent(m[2])] : ['', null];
    if (name === 'flow') viewFlow();
    else if (name === 'kp') viewKp(arg);
    else if (name === 'drill') viewDrill(arg);
    else if (name === 'terms') viewTerms();
    else if (name === 'record') viewRecord();
    else viewHome();
  }
  document.body.append(h('div', { id: 'readbar' }), h('button', { id: 'totop', title: '回到顶部', onclick: () => scrollTo({ top: 0, behavior: 'smooth' }) }, '↑'));
  window.addEventListener('scroll', onScroll, { passive: true });
  window.addEventListener('hashchange', route);
  route();
  if (SYNC && db.syncKey) pullNow(false).then(() => scheduleSync(5000));
})();
</script></body></html>
