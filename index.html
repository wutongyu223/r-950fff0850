75, "料 P2 腔压力（96FG-2A/B）＞7psig，延时 30s"], [376, "（3） 点火后 P2 腔压力（96FG-2A、2B）高跳闸（有火焰后 30s 后，当气体燃料 P2 压力高于暖"], [377, "机压力参考值 125%），延时 5s"], [378, "（4） 点火后 P2 腔压力（96FG-2A、2B）低跳闸（有火焰后 30s 后，当气体燃料 P2 压力低于暖"], [379, "机压力参考值 80%），延时 15s"], [380, "（5） GCV-1/2/3/4 任一指令与反馈偏差＞5%，延时 5s"], [381, "（6） GCV-1/2/3/4 允许动作时通讯故障，延时 5s"], [382, "（7） DVP（数字阀门定位器）执行器报故障，延时 5s"], [383, "（8） PM2 的天然气环管温度（FTG4A/B）＞800℉，延时 5s"], [384, "（9） PM3 的天然气环管温度（FTG5A/B）＞800℉，延时 5s"], [385, "（10） AFS 的天然气环管温度 (FTG6A/B) ＞800℉，延时 5s"]]}, {"t": "机岛规程 第 464～467 行", "lines": [[464, "12 Control Purge Credit Trip（清吹信用系统跳闸）"], [465, "（1） VIS-1 和 VIS-2 没有开指令且不在关位或 VIS-1 和 VIS-3 没有开指令且不在关位， 延时 6s"], [466, "（2） VIS-1 有开指令且 （VIS-2 有开指令或有 VIS-3 有开指令） 且 （VS4-1 有开指令或燃料泄漏"], [467, "试验或点火允许），延时 6s"]]}, {"t": "机岛规程 第 579～583 行", "lines": [[579, "17 Purge Credit Pressure Status Trip（清吹信用压力高跳闸）"], [580, "P1X＞58Psig 时， 两个清吹信用压力（96PC"], [581, "_"], [582, "1A/B） ＞29psig 或全故障或一个＞29psig 一"], [583, "个故障"]]}, {"t": "机岛规程 第 764～767 行", "lines": [[764, "11 Gas Fuel System Shutdown（气体燃料系统停机）"], [765, "（1） PM2 管道清吹动作并且 PM2 路清吹温度传感器 A、B(FTG-4A/B）均为坏点，延时 60min"], [766, "（2） PM3 管道清吹动作并且 PM3 路清吹温度传感器 A、B(FTG-5A/B）均为坏点，延时 60min"], [767, "（3） AFS 管道清吹动作并且 AFS 路清吹温度传感器 A、B(FTG-6A/B）均为坏点，延时 60min"]]}, {"t": "机岛规程 第 2163～2171 行", "lines": [[2163, "9.4.2 设备规范"], [2164, "代码 描述 阀型 说明"], [2165, "VS4-4 安全切断阀 气动 防止气体燃料流入气体控制橇"], [2166, "VA13-25 安全切断通风阀 气动 P1 腔室进行减压"], [2167, "VS4-1 辅助截止阀 气动 切断气体燃料，使下游设备与气体供应隔离"], [2168, "VA13-200 P1X 腔通风阀 气动 排出 P1X 腔室的气体"], [2169, "VGS-1 燃气截止阀 气动 快速关闭流向燃烧系统的气体燃料"], [2170, "VSC-1 启动控制阀 气动 在启动时调节下游压力"], [2171, "VA13-15 P2 腔通风阀 气动 排出 P2 腔室的气体"]]}, {"t": "机岛规程 第 2178～2184 行", "lines": [[2178, "VA13T-1 引燃腔室通风阀 气动 引燃截止阀和调节阀之间进行排气"], [2179, "VAST-10 引燃上游通风阀 气动 对引燃调节阀和引燃点火器之间进行排气"], [2180, "VGCT-1 引燃调节阀 气动 调节进入引燃系统的阀门流量"], [2181, "FA105 过滤器 - 临时过滤器"], [2182, "VIS-1 吹扫管路入口供应阀 气动 吹扫免除操作期间打开， 在燃机运行期间关闭"], [2183, "VIS-2 吹扫管路出口至 P2 腔"], [2184, "室供应阀 气动 吹扫免除操作期间打开，对 P2 腔室加压"]]}, {"t": "机岛规程 第 2188～2240 行", "lines": [[2188, "9.4.3 联锁保护"], [2189, "9.4.3.1 设备保护定值"], [2190, "代码 描述 整定值"], [2191, "L2SFT"], [2192, "Startup Fuel Flow Excessive Trip"], [2193, "（启动燃料流量过大跳闸）"], [2194, "不在泄漏试验过程中且暖机未结束且 SRV 开"], [2195, "度>20%"], [2196, "L86FPG2LT"], [2197, "P2 post-ignition Low Pressure Trip"], [2198, "Logic（点火后，P2 压力低跳闸） 点火至暖机结束，P2\u003c28Psi，延时 15S"], [2199, "L86FPG2HT"], [2200, "P2 post-ignition High Pressure"], [2201, "Trip Logic （点火后， P2 压力高跳闸） 点火至暖机结束，P2>43.75Psi，延时 5S"], [2202, "L86G2CVT G2(PM1)Position High High Error 1）PM1 控制阀指令与反馈偏差>2%，延时 2s 阀"], [2207, "Indication 位波动报警。"], [2208, "2）PM1 控制阀指令与反馈偏差>5%，延时 5s 跳"], [2209, "闸"], [2210, "L86G3CVT"], [2211, "G3(PM3) Position High High Error"], [2212, "Indication"], [2213, "1）PM3 控制阀指令与反馈偏差>2%，延时 2S 阀"], [2214, "位波动报警。"], [2215, "2）PM3 控制阀指令与反馈偏差>5%，延时 5 秒"], [2216, "跳闸"], [2217, "L86G4CVT"], [2218, "G4(PM2)Position High High Error"], [2219, "Indication"], [2220, "1）PM2 控制阀指令与反馈偏差>2%，延时 2S 阀"], [2221, "位波动报警。"], [2222, "2）PM2 控制阀指令与反馈偏差>5%，延时 5 秒"], [2223, "跳闸"], [2224, "L3GRVT"], [2225, "Stop/Speed Ratio Valve Position"], [2226, "Error Trip（速比阀阀位故障跳闸） 速比阀阀位指令与反馈偏差>5%"], [2227, "L86FPG2IH"], [2228, "Pre-ignititon P2 Pressure High"], [2229, "Ignition Inhibit （点火前 P2 压力高，"], [2230, "点火禁止）"], [2231, "点火前，P2>6Psi 且点火条件不满足，延时 5s"], [2232, "跳闸。"], [2233, "L4VS4"], [2234, "PI"], [2235, "_"], [2236, "Gas Aux Stop Position Fault"], [2237, "Pre-ignition Trip （点火前燃气辅助"], [2238, "关断阀位置故障跳闸）"], [2239, "无火且燃气辅助关断阀有开指令，但无反馈。"], [2240, "96FG-1 （P1） 气体燃料进气压力变送器 \u003c3068.275kpa 报警"]]}, {"t": "机岛规程 第 2346～2358 行", "lines": [[2346, "当燃机转速大于95%TNH时， 部分抽出的压气机排气经冷却后吹扫未投入使用的燃气喷嘴流道， 防止"], [2347, "燃气管道中形成燃气积聚和燃烧回流，同时保持燃气管道处于热状态，以防止管道中形成凝结水。"], [2348, "一个吹扫空气冷却器HX-4-2；"], [2349, "一个通向PM2歧管的清吹管路 （清吹阀VAS-3和VAS-4以及排空阀VAV-2） ；"], [2350, "一个通向PM3歧管的清吹管路 （清吹阀VAS-5和VAS-6以及排空阀VAV-3） ；"], [2351, "一个同向AFS歧管的清吹管路(清"], [2352, "吹阀VAS-7和VAS-8以及排空阀VAV-4)；在PM2、PM3和AFS清吹管路腔室之间分别设有冗余压力变送器"], [2353, "96PG-2A、96PG-2B、96PG-2B、96PG-3A、96PG-3B、96PG-4A和96PG-4B测量三条吹扫管线上清吹阀之间"], [2354, "的腔内压力， 以检测由于密封缺陷导致的压力增加。 在机组启动及正常燃烧模式过程中， 清吹系统会从"], [2355, "压气机排气中抽取一部分空气冷却后对没有燃气流经的环管进行冷却吹扫。"], [2356, "9.5.2 设备规范"], [2357, "设备名称 描述 说明"], [2358, "HX-4-2 清吹冷却器 将排气温度从 510℃降低到 260℃"]]}], "cards": ["D:5.6-3", "D:5.6-6", "D:5.6-2", "D:5.6-4", "D:5.6-7", "D:5.6-5", "D:5.6-1"]}, "5.7": {"id": "5.7", "name": "启动前的燃料系统检查和禁止启动条件", "cat": "五", "gist": "启动前前置模块入口压力控制在 3.74～4.5 MPa，天然气送到 VS4-4 阀前，前置模块无泄漏，危险气体探测系统正常，清吹冷却器投运，P1 腔前天然气已置换，预启动试验全部通过（燃气清吹预启动试验每 7 天做一次，试 VAS-3～8 的开关）。禁止启动条件里和燃料有关的：任一火花塞或火焰探测器故障，任一燃料阀或执行机构故障，危险气体检测系统故障，燃气泄漏达到 25% LEL，供气压力维持不住。", "reg": "机岛 6.2.1、6.4.1、6.4.5、9.3.4.1、9.4.4.1、9.5.4.1、10.7", "lecture": "\u003cp>燃机启动前，规程在几处分别写了对燃料系统的要求。这里把它们放在一起，顺带说每条在防什么。\u003c/p>\n\u003cp>公用系统。天然气调压站系统已经投运，前置模块入口压力控制在 3.74MPa～4.5MPa\u003cspan class=\"cite\">机岛 6.4.5\u003c/span>。\u003c/p>\n\u003cp>燃机系统检查里和燃料有关的几条\u003cspan class=\"cite\">机岛 6.4.1\u003c/span>：\u003c/p>\n\u003cul>\n\u003cli>天然气供气压力正常，增压机处于良好备用状态，燃料系统运行正常；\u003c/li>\n\u003cli>闭式水系统正常投运，清吹冷却器已正常投运；\u003c/li>\n\u003cli>危险气体探测系统正常；\u003c/li>\n\u003cli>燃气前置模块系统无泄漏，各阀门位置正确，天然气已送至 VS4-4 阀前；\u003c/li>\n\u003cli>燃机预启动试验全部通过。\u003c/li>\n\u003c/ul>\n\u003cp>第一条里的增压机，现场已经对不上。本厂管网升压以后，增压机已经停运：管网来气压力约 6.3MPa，调压站直接减压到 4.05MPa 送往机组\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>。所以现在这一条实际要看的是供气压力正常，增压机那半句不用管。清吹冷却器是给燃料管路清吹用的，它把压气机排气冷下来再去吹不进燃气的歧管\u003cspan class=\"cite\">见考点 6.1\u003c/span>。天然气送到 VS4-4 阀前，就是燃气已经到了燃料模块门口，由 VS4-4 挡着\u003cspan class=\"cite\">见考点 5.1\u003c/span>。\u003c/p>\n\u003cp>各系统自己的启动前检查，大部分是每个系统都有的通用要求。燃料管路清吹系统多了几条：燃机罩壳门关闭，清吹空气系统预启动试验正常，燃机 P1 腔前的天然气已完成置换、浓度和压力正常，清吹冷却器排污畅通\u003cspan class=\"cite\">机岛 9.5.4.1\u003c/span>。「置换」是新投运或检修后，用氮气把管道里的空气赶走、再充进天然气\u003cspan class=\"cite\">见考点 3.2\u003c/span>。P1 腔前要是还有空气和燃气的混合气，一启动就会把它送进燃料模块，甚至送进燃机\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>预启动试验。燃机预启动试验每 7 天自动做一次，目的是提前发现气动和电动设备的问题，确保燃机能正常启动\u003cspan class=\"cite\">机岛 10.7.1\u003c/span>。其中「燃气清吹预启动试验」试的是燃料管路清吹的阀，对燃气侧阀门 VAS-4、6、8 和空气侧阀门 VAS-3、5、7 分别做开启测试和关闭测试\u003cspan class=\"cite\">机岛 10.7.3\u003c/span>。每根清吹管上两个清吹阀串联，燃气侧那个靠近歧管，空气侧那个靠近压气机排气来的空气\u003cspan class=\"infer\">推断：由阀门编号和 9.5.1 的配置推出\u003c/span>。\u003c/p>\n\u003cp>禁止启动条件里和燃料有关的有这几条\u003cspan class=\"cite\">机岛 6.2.1\u003c/span>：\u003c/p>\n\u003cul>\n\u003cli>燃机任一点火火花塞或任一火焰探测器故障；\u003c/li>\n\u003cli>燃气辅助关断阀、启动控制阀、燃气关断阀、燃料控制阀任一阀门或其执行机构故障；\u003c/li>\n\u003cli>危险气体检测系统故障；\u003c/li>\n\u003cli>天然气区域燃气泄漏，且浓度达到 25%LEL；\u003c/li>\n\u003cli>天然气供气压力无法维持在正常范围内。\u003c/li>\n\u003c/ul>\n\u003cp>这几条的道理\u003cspan class=\"infer\">推断：规程只列了条件，没写原因\u003c/span>：\u003c/p>\n\u003cul>\n\u003cli>本机只有 #3、#4 两个燃烧室有火花塞，靠 4 个火焰探测器判断点着没有\u003cspan class=\"cite\">见考点 5.4\u003c/span>。任何一个坏了，要么点不着，要么点着了看不见，燃气会在没确认着火的情况下继续进燃机。\u003c/li>\n\u003cli>四个燃料阀依次是 VS4-1、VSC-1、VGS-1 和燃气控制阀，泄漏试验、点火、升速都靠它们一步步动作，哪个坏了都不能启动\u003cspan class=\"infer\">推断：阀名对照见考点 5.1\u003c/span>。\u003c/li>\n\u003cli>危险气体检测系统坏了，燃气漏了也不知道。\u003c/li>\n\u003cli>LEL 是爆炸下限，25%LEL 约合甲烷体积浓度 1.25%\u003cspan class=\"conv\">换算\u003c/span>，离爆炸还远，但说明已经有明显泄漏，启动时高温和电火花都可能成为点火源\u003cspan class=\"cite\">见考点 1.2\u003c/span>。\u003c/li>\n\u003c/ul>\n\u003cp>反措的相关规定是：燃气阀自检试验不合格，严禁启动\u003cspan class=\"cite\">题库 FC-8.5.2\u003c/span>；燃气泄漏量达到爆炸下限的 20%，不允许启动\u003cspan class=\"cite\">题库 FC-8.7.6\u003c/span>。后一条比本厂规程的 25%LEL 严\u003cspan class=\"cite\">见考点 3.6\u003c/span>。\u003c/p>\n\u003cp>前置模块入口压力规程另一处写的是绝对分离器进出口压力范围 3137.11～3447.38，单位 Kpag（千帕表压），比上面的 3.74MPa～4.5MPa 低，以现场规定为准\u003cspan class=\"cite\">机岛 9.3.2\u003c/span>。\u003c/p>", "sources": [{"t": "机岛规程 第 1037～1056 行", "lines": [[1037, "6.2.1 燃机禁止启动条件"], [1038, "1) 燃机主要检测仪表、变送器故障或相应保护不能正常投入。"], [1039, "2) 压气机进气滤网破损或压气机进气道可能存在残留物。"], [1040, "3) 机组转动部分有明显的金属摩擦声。"], [1041, "4) 燃机任一点火火花塞或任一火焰探测器故障。"], [1042, "5) 燃气辅助关断阀、启动控制阀、燃气关断阀、燃料控制阀任一阀门或其执行机构故障。"], [1043, "6) IGV、VSV或防喘放气阀试验不合格。"], [1044, "7) 燃机主保护硬件故障。"], [1045, "8) 燃机水雾消防系统故障。"], [1046, "9) 燃机转速或轴系振动仪表失灵或无法正常监视。"], [1047, "10) 危险气体检测系统故障。"], [1048, "11) 天然气区域燃气泄漏，且浓度达到25%LEL。"], [1049, "12) 燃机跳闸原因未查明，故障未消除。"], [1050, "13) 燃机紧急跳闸按钮动作试验不正常。"], [1051, "14) 燃机油系统严重泄漏。"], [1052, "15) 燃机润滑油油质不合格。"], [1053, "16) 88BT、88TK、润滑油泵、密封油泵、顶轴油泵任一故障。"], [1054, "17) 天然气供气压力无法维持在正常范围内。"], [1055, "18) 仪用压缩空气压力不正常。"], [1056, "19) 直流、保安电源工作不正常。"]]}, {"t": "机岛规程 第 1118～1140 行", "lines": [[1118, "6.4.1 燃机系统检查与准备"], [1119, "1) 确认影响燃机启动的系统和设备检修工作已结束、工作票已终结，安全措施已恢复。"], [1120, "2) 检查各热工仪表、信号、保护电源已送上，各表计、监测装置完整齐全，投入正常。"], [1121, "3) 检查燃机无禁止启动条件。"], [1122, "4) 检查燃机相关保护全部投入。"], [1123, "5) 检查机组润滑油、密封油、顶轴油系统运行正常。"], [1124, "6) 检查盘车装置已投运，盘车电流正常。"], [1125, "7) 检查燃机电加热毯正常投入，上下缸温差在正常范围。"], [1126, "8) 检查透平间冷却风机88BT具备启动条件。"], [1127, "9) 检查排气框架冷却风机88TK具备启动条件。"], [1128, "10) 检查透平空间加热器电源送上，控制方式在自动模式。"], [1129, "11) 检查防喘放气阀、透平静叶抽气冷却阀、IBH阀门状态正常。"], [1130, "12) 检查天然气供气压力正常，增压机处于良好备用状态，燃料系统运行正常。"], [1131, "13) 检查IGV、VSV动作正常。"], [1132, "14) 检查燃机罩壳间门已关好。"], [1133, "15) 检查闭式水系统正常投运，确认润滑油冷却器、LCI冷却器、清吹冷却器已正常投运。"], [1134, "16) 检查进气滤网压差正常，进气系统内无杂物。"], [1135, "17) 检查燃机火灾保护（水雾喷淋）系统处于良好备用状态。"], [1136, "18) 检查燃机仪用空气压力正常。"], [1137, "19) 检查危险气体探测系统正常。"], [1138, "20) 检查燃气前置模块系统无泄漏，各阀门位置正确，天然气已送至VS4-4阀前。"], [1139, "21) 燃机预启动试验全部通过。"], [1140, "22) 检查无余热锅炉、发电机跳闸条件。"]]}, {"t": "机岛规程 第 1202～1202 行", "lines": [[1202, "2) 天然气调压站系统已投运，前置模块入口压力控制在3.74MPa～4.5MPa。"]]}, {"t": "机岛规程 第 2003～2011 行", "lines": [[2003, "9.3.2 设备规范"], [2004, "名称 单位 数值"], [2005, "绝对分离器"], [2006, "型式 垂直，双重"], [2007, "配置 分离器部分+聚结过滤器部分"], [2008, "流量 m"], [2009, "3/min 267.6～1125.88"], [2010, "进出口压力范围 Kpag 3137.11～3447.38"], [2011, "进出口温度范围C -1～55"]]}, {"t": "机岛规程 第 2401～2409 行", "lines": [[2401, "9.5.4.1 启动前的检查"], [2402, "1) 清吹空气系统检修工作已结束，燃机罩壳门关闭。"], [2403, "2) 检查清吹空气系统仪表和控制系统已正常投入无故障。"], [2404, "3) 检查AM10模块仪用压缩空气已投用，仪用压缩空气压力正常，气动阀正常动作，清吹空气系统"], [2405, "预启动实验正常。"], [2406, "4) 燃机P1腔前的天然气已完成置换，天然气浓度和压力正常。"], [2407, "5) 检查清吹冷却器排污畅通。"], [2408, "6) 按阀门卡检查确认阀门的位置。"], [2409, "7) 在MarKVIe上检查燃气清吹系统无报警。"]]}, {"t": "机岛规程 第 6508～6512 行", "lines": [[6508, "10.7 燃机预启动试验"], [6509, "10.7.1 试验目的"], [6510, "燃机预启动试验的目的是定期 （7 天） 自动试验燃机各系统的气动和电动设备， 提前发现设备问题，"], [6511, "确保燃机各系统能正常工作，确保燃机能正常启动。"], [6512, "10.7.2 试验项目"]]}, {"t": "机岛规程 第 6558～6560 行", "lines": [[6558, "9) 燃气清吹预启动试验："], [6559, "(1) 对燃气测阀门 VAS-4、6、8 执行开启测试、关闭测试；"], [6560, "(2) 对空气测阀门 VAS-3、5、7 执行开启测试、关闭测试。"]]}, {"t": "机岛规程 第 194～198 行", "lines": [[194, "4.1.2.2 燃烧室概况"], [195, "燃烧室型式为 DLN2.6e 干式低氮燃烧室，为逆流分管式结构。燃烧室共有 16 个，呈圆周布置，顺"], [196, "气流方向看为逆时针排列，顶部 12 点（时钟）位置为 16 号。每个燃烧室内包括 4 路（PM1、PM2、PM3、"], [197, "AFS） 燃料管线连接喷嘴。 #3、 #4 燃烧室设有高压电极火花塞， 其余燃烧室通过点火后联焰管联通火焰。"], [198, "4 个火焰探测器为紫外线探测器，分别布置在#13、#14、#15、#16 燃烧室内。"]]}, {"t": "公用规程 第 667～669 行", "lines": [[667, "天然气经清管站、过滤单元、计量单元后，供气压力为6.3MPa（天然气管网升压后），为满足燃机"], [668, "燃烧天然气压力及温度要求，天然气经加热单元和调压单元，分别向三台机组提供压力为4.05MPa、温"], [669, "度＞50℃的天然气。"]]}, {"t": "公用规程 第 686～689 行", "lines": [[686, "2、调压单元"], [687, "通过调压单元（天然气管网升压后），将管网供气压力由6.3MPa降压至4.05MPa。采用机组单元制"], [688, "控制方式，每台机组两路，"], [689, "一运一备运行方式。"]]}], "cards": ["D:5.7-5", "D:5.7-3", "D:5.7-2", "D:5.7-4", "D:5.7-1", "D:5.7-7", "D:5.7-6"]}, "5.8": {"id": "5.8", "name": "燃料系统的事故处理", "cat": "五", "gist": "启动燃料流量过大、天然气压力低、火焰丢失、点火失败四种异常的现象、原因和处理。天然气压力低时先查测点，再查管路泄漏、过滤器和阀门，再查调压站和上游，增压机跳闸按紧急停机处理。点火失败要查明原因，高盘清吹结束并经值长同意才能再点火。燃气管路明显泄漏、罩壳内燃气严重泄漏属于申请停运条件。", "reg": "机岛 9.4.7、11.3.2、11.3.7、11.3.9、8.4.1", "lecture": "\u003cp>规程写了四种和燃料直接相关的异常：启动燃料流量过大、燃料压力低、火焰丢失、点火失败。燃料压力低在两处都写了（9.4.7.2 和 11.3.9），下面合在一起说。\u003c/p>\n\u003cp>启动燃料流量过大\u003cspan class=\"cite\">机岛 9.4.7.1\u003c/span>。现象是启动燃料流量过大报警。原因有五条：启动 FSR 基准值过大；燃料控制阀故障，使控制系统给出的流量值过大；燃气管线泄漏或排气阀误开、内漏，使燃料供给压力降低；燃气压力过低；启动时燃料控制伺服及反馈系统故障。处理是检查设备和阀门，诊断故障并检修；现场检查发现燃气管线泄漏威胁机组安全，就停机。\u003c/p>\n\u003cp>FSR 是燃料行程基准，即控制系统要多少燃料的指令\u003cspan class=\"infer\">推断：GE 控制系统的一般含义\u003c/span>。压力低为什么会成为「流量过大」的原因，规程没解释。启动时控制系统要按转速把 P2 压力调到预定值\u003cspan class=\"cite\">见考点 5.3\u003c/span>。来气压力低，或管线漏、通风阀开着把气放掉了，要维持同样的 P2，调压力的阀就得开得更大，控制系统看到阀开度和燃料指令偏大，就报「流量过大」\u003cspan class=\"infer\">推断：由 9.4.4.5 的启动控制方式推出\u003c/span>。对应的跳闸条件正是阀开度大于 20%\u003cspan class=\"cite\">机岛 9.4.3.1\u003c/span>\u003cspan class=\"cite\">见考点 5.6\u003c/span>，看的是阀开得大不大，不一定是真的流量大\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>天然气压力低\u003cspan class=\"cite\">机岛 9.4.7.2、11.3.9\u003c/span>。现象是压力低报警，压力持续降低时机组自动降负荷，天然气管道有异常气流声。原因有：压力测量元件故障；调压站出口压力低；过滤器堵塞；天然气系统管道泄漏，阀门误开或内漏；上游天然气公司供应中断或压力低；天然气增压机跳闸。\u003c/p>\n\u003cp>处理的顺序是：先判断测量元件准不准；再派人就地查管路泄漏、过滤器堵塞、阀门误动或内漏；再查调压站，出口压力低就调整，入口压力低就联系上游提高供应压力；压力持续降低，检查机组甩负荷动作正常，必要时做好停机准备；增压机跳闸，按紧急停机处理。\u003c/p>\n\u003cp>压力低要降负荷，是因为控制阀全开也送不进满负荷所需的燃料，硬撑会燃烧不稳甚至熄火\u003cspan class=\"infer\">推断\u003c/span>。处理里说的「甩负荷」，结合现象里的「自动降负荷」，应是指压力低引起的自动减负荷，不是出口开关跳闸\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>本厂管网升压以后，增压机已经停运，来气约 6.3MPa，由调压站直接减压到 4.05MPa\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>。所以「增压机跳闸」这条原因和对应的处理，现在用不上，了解即可。\u003c/p>\n\u003cp>火焰丢失\u003cspan class=\"cite\">机岛 11.3.2\u003c/span>。现象是无火焰信号、排气分散度增大、火焰信号失去报警后机组跳闸。和燃料有关的原因是：燃料控制阀异常；燃烧切换过程中燃烧不稳定造成熄火；天然气压力低或燃气中断；燃料华白指数变化，燃烧不稳。另外两条是三个以上火焰探测器故障、燃烧室部件损坏。处理按紧急停机进行，然后检查火焰探测器、燃料控制阀和压力、燃料供应系统，以及燃烧室各部件有没有损坏。\u003c/p>\n\u003cp>这几条原因背后是同一件事：预混火焰只能在很窄的燃料空气比范围里稳定燃烧\u003cspan class=\"cite\">见考点 5.4\u003c/span>。控制阀不准、换燃烧模式时各歧管燃料重新分配、压力掉下来，都会让比例跑出这个范围。华白指数是热值除以相对密度的平方根\u003cspan class=\"cite\">见考点 1.1\u003c/span>，它变了，同样的阀开度和压力送进去的热量就变了，比例也跟着变\u003cspan class=\"infer\">推断：华白指数的一般含义\u003c/span>。火焰一丢，燃气还在往里送，就会带着没烧的燃气进排气通道和余热锅炉，所以直接按紧急停机处理\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>\n\u003cp>燃烧室点火失败\u003cspan class=\"cite\">机岛 11.3.7\u003c/span>。现象是控制系统进入点火程序失败，自动停机。原因有三条：燃料控制阀没打开，火焰探测器故障、探测不到火焰，点火器（火花塞）故障。处理是先查明原因；燃机高盘清吹结束，并且得到值长同意后，才能再次点火。「高盘清吹」应就是启动清吹，即在 735rpm 吹燃机和余热锅炉排气通道\u003cspan class=\"infer\">推断：规程没有把两个叫法对上\u003c/span>\u003cspan class=\"cite\">见考点 6.3\u003c/span>。点火失败时已经有燃气进了燃烧室和排气通道却没烧掉，再点火前必须先吹干净，否则可能爆燃\u003cspan class=\"infer\">推断\u003c/span>。是不是每次都要吹满 11.5min，规程没写。\u003c/p>\n\u003cp>申请停运。燃气管路发生明显泄漏、还没造成跳机，或者罩壳内发现燃气严重泄漏，都属于燃气轮机故障申请停运的条件\u003cspan class=\"cite\">机岛 8.4.1\u003c/span>。\u003c/p>", "sources": [{"t": "机岛规程 第 1695～1699 行", "lines": [[1695, "8.4.1 事故停机条件"], [1696, "1) 燃气轮机和余热锅炉故障申请停运条件"], [1697, "(1) 燃机排气压力和温度异常，且无好转迹象；"], [1698, "(2) 燃气管路、油管路发生明显泄漏，但尚未造成跳机；"], [1699, "(3) 罩壳内发现燃气严重泄漏；"]]}, {"t": "机岛规程 第 2321～2343 行", "lines": [[2321, "9.4.7 异常及事故处理"], [2322, "9.4.7.1 启动燃料流量过大"], [2323, "1) 现象：启动燃料流量过大报警。"], [2324, "2) 原因："], [2325, "(1) 启动 FSR 基准值过大造成启动燃料量过大。"], [2326, "(2) 燃料控制阀故障，造成控制系统给出的流量值过大。"], [2327, "(3) 燃气管线泄漏或排气阀误开、内漏，使燃料供给压力降低。"], [2328, "(4) 燃气压力过低。"], [2329, "(5) 启动时燃料控制伺服及反馈系统故障。"], [2330, "3) 处理："], [2331, "(1) 检查设备及阀门运行情况是否存在故障，对系统故障进行诊断并加以检修。"], [2332, "(2) 现场检查存在燃气管线泄漏威胁机组安全运行则应实施停机处理。"], [2333, "9.4.7.2 气体燃料压力低"], [2334, "1) 现象：气体燃料压力低报警。"], [2335, "2) 原因："], [2336, "(1) 测量元件故障。"], [2337, "(2) 调压站出口压力低。"], [2338, "(3) 过滤器堵塞、燃气管道泄漏、放气阀误开或内漏严重。"], [2339, "3) 处理："], [2340, "(1) 判断测量元件准确性，如有异常通知检修人员及时处理。"], [2341, "(2) 检查燃气管道泄漏或过滤器堵塞或阀门内漏情况，联系检修人员针对性处理。"], [2342, "(3) 确定调压站运行情况是否正常， 如有异常应及时调整调压站出口压力； 如调压站入口压力低，"], [2343, "应联系上游确定来气情况必要时采取停机处理。"]]}, {"t": "机岛规程 第 2194～2195 行", "lines": [[2194, "不在泄漏试验过程中且暖机未结束且 SRV 开"], [2195, "度>20%"]]}, {"t": "机岛规程 第 2278～2279 行", "lines": [[2278, "从点火到60%TNH， 调节VSC-1， 可以使P2值与燃机转速相匹配。 燃气控制阀VGC-1和VGC-2部分开启，"], [2279, "以符合预先确定的P2压力， 满足燃料流量在PM1、 PM2管线中的分配比。 在60%TNH时， 启动控制阀必须全"]]}, {"t": "机岛规程 第 6691～6713 行", "lines": [[6691, "11.3.2 火焰丢失"], [6692, "1) 现象："], [6693, "(1) 无火焰信号。"], [6698, "(2) 燃机排气分散度增大。"], [6699, "(3) 火焰信号失去报警，机组跳闸。"], [6700, "2) 原因："], [6701, "(1) 三个以上火焰探测器故障。"], [6702, "(2) 燃料控制阀异常。"], [6703, "(3) 燃烧切换过程中，燃烧不稳定造成熄火。"], [6704, "(4) 天然气压力低或燃气中断。"], [6705, "(5) 燃料华白指数变化，燃烧不稳。"], [6706, "(6) 燃烧室部件损坏。"], [6707, "3) 处理："], [6708, "(1) 按紧急停机处理。"], [6709, "(2) 检查火焰探测器工作是否正常。"], [6710, "(3) 检查燃料控制阀和燃料压力。"], [6711, "(4) 检查燃料供应系统。"], [6712, "(5) 检查燃烧室、火焰筒、燃料喷嘴及联焰管是否损坏。"], [6713, "(6) 检查有无其它跳机故障。"]]}, {"t": "机岛规程 第 6775～6784 行", "lines": [[6775, "11.3.7 燃烧室点火失败"], [6776, "1) 现象："], [6777, "(1) 控制系统进入点火程序失败，自动停机。"], [6778, "2) 原因："], [6779, "(1) 燃料控制阀未打开。"], [6780, "(2) 火焰探测器故障探测不到火焰。"], [6781, "(3) 点火器（火花塞）故障。"], [6782, "3) 处理："], [6783, "(1) 点火失败应查明原因。"], [6784, "(2) 燃机高盘清吹结束后，并得到值长同意后可再次进行点火。"]]}, {"t": "机岛规程 第 6803～6818 行", "lines": [[6803, "11.3.9 天然气压力低"], [6804, "1) 现象："], [6805, "(1) 天然气压力低报警，压力持续降低自动降负荷。"], [6806, "(2) 天然气管道有异常气流声。"], [6807, "2) 原因："], [6808, "(1) 天然气压力测量元件故障。"], [6809, "(2) 天然气系统管道泄漏，压力持续降低。"], [6810, "(3) 上游天然气公司供应中断或压力低。"], [6811, "(4) 天然气系统阀门误开或内漏。"], [6812, "(5) 天然气增压机跳闸。"], [6813, "3) 处理："], [6814, "(1) 立即通知检修人员检查就地测量元件是否故障。"], [6815, "(2) 全面检查天然气系统，派人去就地检查管路是否泄漏，阀门是否误动作。"], [6816, "(3) 联系上游天然气公司，检查天然气供应情况，提高供应压力。"], [6817, "(4) 若天然气压力持续降低，检查机组甩负荷正常动作，必要时做好停机准备。"], [6818, "(5) 若天然气增压机跳闸，按紧急停机处理。"]]}, {"t": "机岛规程 第 1237～1237 行", "lines": [[1237, "7) 转速升至清吹转速735rpm，开始清吹倒计时11.5min。"]]}, {"t": "公用规程 第 667～669 行", "lines": [[667, "天然气经清管站、过滤单元、计量单元后，供气压力为6.3MPa（天然气管网升压后），为满足燃机"], [668, "燃烧天然气压力及温度要求，天然气经加热单元和调压单元，分别向三台机组提供压力为4.05MPa、温"], [669, "度＞50℃的天然气。"]]}, {"t": "公用规程 第 686～689 行", "lines": [[686, "2、调压单元"], [687, "通过调压单元（天然气管网升压后），将管网供气压力由6.3MPa降压至4.05MPa。采用机组单元制"], [688, "控制方式，每台机组两路，"], [689, "一运一备运行方式。"]]}], "cards": ["D:5.8-2", "D:5.8-4", "D:5.8-1", "D:5.8-5", "D:5.8-6", "D:5.8-7", "D:5.8-3"]}, "6.1": {"id": "6.1", "name": "燃料管路清吹", "cat": "六", "gist": "燃机转速高于 95% 后，从压气机排气抽一部分空气，经清吹冷却器 HX-4-2 从 510 ℃ 冷却到 260 ℃，吹扫没有进燃气的歧管。规程写的目的有两个：防止燃气在管道里积聚和燃烧回流；让管道保持热态，不生凝结水。PM2、PM3、AFS 各有一条清吹管，每条两个清吹阀、中间一个排空阀。停机转速降到 95% 以下或跳机时，清吹阀关、排空阀开。", "reg": "机岛 9.5.1、9.5.2、9.5.4.2", "lecture": "\u003cp>本厂规程里有两种清吹，先分清楚。这一篇讲燃料管路清吹：燃机转速到 95%TNH 以上以后，用冷却过的压气机排气去吹暂时不进燃气的燃料歧管，只要这根歧管不进燃气就一直吹\u003cspan class=\"cite\">机岛 9.5.1\u003c/span>。另一种是启动清吹：每次点火之前，燃机在 735rpm 转着，用空气把燃机和余热锅炉的整个排气通道吹一遍\u003cspan class=\"cite\">机岛 6.5.1.2；见考点 6.3\u003c/span>。\u003c/p>\n\u003cp>TNH 是燃机转速，以额定转速为 100%。95%TNH 就是 2850rpm，全速空载是 3000rpm\u003cspan class=\"cite\">机岛 6.5.1.4\u003c/span>。\u003c/p>\n\u003cp>为什么要吹。每个燃烧室有 PM1、PM2、PM3、AFS 四根燃料歧管，哪几根进燃气要看燃烧模式（见考点 5.4）。不进燃气的歧管，喷嘴口仍开在燃烧室里。燃烧室压力有脉动，各喷嘴出口之间也有压差，管里气体不流动，热燃气就会趁压力波动倒灌进来；管里还留着切换前的燃气，和倒灌的热气混在一起，就可能积聚、自燃，火焰顺着喷嘴往回烧\u003cspan class=\"infer\">原理：规程只写了目的，没写倒灌怎么发生\u003c/span>。规程写的目的正是这些：防止燃气管道中形成燃气积聚和燃烧回流\u003cspan class=\"cite\">机岛 9.5.1\u003c/span>，避免燃料回流导致喷嘴损坏、燃料混合物自动点火\u003cspan class=\"cite\">机岛 9.4.4.5\u003c/span>。空气持续往外吹，热燃气就进不来。规程写的第二个目的：让管道保持热状态，防止形成凝结水\u003cspan class=\"cite\">机岛 9.5.1\u003c/span>。\u003c/p>\n\u003cp>为什么用压气机排气。气源压力必须高于燃烧室才吹得进去。压气机排气本来就是送进燃烧室的空气，燃烧室压力等于它减去燃烧室压损，所以它总比燃烧室略高，是现成的气源\u003cspan class=\"infer\">原理：气流从压气机流向燃烧室，压力逐级降低\u003c/span>。它的压力规程叫 CPD，即压气机出口压力\u003cspan class=\"cite\">机岛 5.2\u003c/span>。\u003c/p>\n\u003cp>为什么要先冷却。清吹冷却器 HX-4-2 的规范写「将排气温度从 510℃ 降低到 260℃」\u003cspan class=\"cite\">机岛 9.5.2\u003c/span>，这里的排气指压气机排气，不是燃机排气。甲烷的着火温度约 540℃\u003cspan class=\"cite\">公用 表 2\u003c/span>，510℃ 已经很接近，用它直接吹还留着燃气的歧管，燃气可能在管里自燃；冷到 260℃ 就远了\u003cspan class=\"infer\">原理：按规程给的温度比较，规程没写冷却的原因\u003c/span>。启动前检查要求确认闭式水系统投运、清吹冷却器已正常投运\u003cspan class=\"cite\">机岛 6.4.1\u003c/span>，可见它用闭式冷却水冷却\u003cspan class=\"infer\">推断：9.5 没写冷却介质\u003c/span>。\u003c/p>\n\u003cp>清吹系统的设备\u003cspan class=\"cite\">机岛 9.5.1、9.5.2、5.2\u003c/span>：\u003c/p>\n\u003cul>\n\u003cli>清吹冷却器 HX-4-2\u003c/li>\n\u003cli>PM2 清吹管路：清吹阀 VAS-3、VAS-4，排空阀 VAV-2，两阀间压力变送器 96PG-2A/2B\u003c/li>\n\u003cli>PM3 清吹管路：清吹阀 VAS-5、VAS-6，排空阀 VAV-3，压力变送器 96PG-3A/3B\u003c/li>\n\u003cli>AFS 清吹管路：清吹阀 VAS-7、VAS-8，排空阀 VAV-4，压力变送器 96PG-4A/4B\u003c/li>\n\u003c/ul>\n\u003cp>PM1 没有清吹管路，因为各个燃烧模式里 PM1 都进燃气\u003cspan class=\"infer\">推断：规程没写原因\u003c/span>。\u003c/p>\n\u003cp>为什么两个清吹阀夹一个排空阀。两个清吹阀一个在空气侧，一个在燃气侧，例如 PM2 的 VAS-3 在空气侧，VAS-4 在燃气侧\u003cspan class=\"cite\">机岛 5.3.1\u003c/span>。不吹的时候这根歧管在进燃气，两个清吹阀关、排空阀开，中间腔室通大气：燃气侧的阀漏一点，燃气从排空阀排走，进不了压气机排气那边；空气侧的阀漏一点，空气也排走，窜不进歧管\u003cspan class=\"infer\">原理：和燃料模块腔室是一个道理，见考点 5.1\u003c/span>。两阀间的变送器用来发现密封缺陷造成的压力升高\u003cspan class=\"cite\">机岛 9.5.1\u003c/span>。吹的时候反过来，两个清吹阀开、排空阀关\u003cspan class=\"cite\">题库 RJ-41a28e2d\u003c/span>。腔室压力异常的保护在考点 6.2 讲。\u003c/p>\n\u003cp>各阶段阀门的位置\u003cspan class=\"cite\">机岛 9.5.4.2\u003c/span>：\u003c/p>\n\u003cul>\n\u003cli>启动前和加速过程中：清吹阀关，排空阀开\u003c/li>\n\u003cli>正常燃气运行、转速高于 95% 时：所有没加燃料的回路都吹扫，吹哪几根随燃烧模式变\u003c/li>\n\u003cli>停机信号发出、转速降到 95% 以下：清吹停止，清吹阀关，排空阀开\u003c/li>\n\u003cli>跳闸：阀门失去命令信号，进入故障安全位置，清吹阀关，排空阀开，这是把两边隔开、中间通大气的安全位置\u003c/li>\n\u003c/ul>\n\u003cp>停机那条原文写「汽轮机转速」。本厂虽是单轴机组，但停机时汽机先脱扣惰走，汽机和燃机之间的 SSS 离合器（自动同步离合器）脱开\u003cspan class=\"cite\">机岛 8.2.3\u003c/span>，两者转速不同，这里应理解为燃机转速\u003cspan class=\"infer\">推断：清吹的其他条文都写燃机转速\u003c/span>。\u003c/p>\n\u003cp>为什么是 95%，规程没写。95% 在本厂控制逻辑里是「已到运行转速」的门槛，规程把它叫 14HS\u003cspan class=\"cite\">机岛 5.2\u003c/span>，很多保护也以转速大于 95% 为条件。到这个转速，压气机出口压力已经建立并趋于稳定，能可靠地压过燃烧室压力\u003cspan class=\"infer\">推断：规程没写选 95% 的原因\u003c/span>。\u003c/p>\n\u003cp>规程另一处写法不同：启动步骤写转速约 68%TNH 换到 M4S 模式时，PM2 和 AFS 的清吹阀就开了\u003cspan class=\"cite\">机岛 6.5.1.4\u003c/span>，比 95% 早，以现场为准。\u003c/p>", "sources": [{"t": "机岛规程 第 2344～2371 行", "lines": [[2344, "9.5 燃气清吹系统"], [2345, "9.5.1 概述"], [2346, "当燃机转速大于95%TNH时， 部分抽出的压气机排气经冷却后吹扫未投入使用的燃气喷嘴流道， 防止"], [2347, "燃气管道中形成燃气积聚和燃烧回流，同时保持燃气管道处于热状态，以防止管道中形成凝结水。"], [2348, "一个吹扫空气冷却器HX-4-2；"], [2349, "一个通向PM2歧管的清吹管路 （清吹阀VAS-3和VAS-4以及排空阀VAV-2） ；"], [2350, "一个通向PM3歧管的清吹管路 （清吹阀VAS-5和VAS-6以及排空阀VAV-3） ；"], [2351, "一个同向AFS歧管的清吹管路(清"], [2352, "吹阀VAS-7和VAS-8以及排空阀VAV-4)；在PM2、PM3和AFS清吹管路腔室之间分别设有冗余压力变送器"], [2353, "96PG-2A、96PG-2B、96PG-2B、96PG-3A、96PG-3B、96PG-4A和96PG-4B测量三条吹扫管线上清吹阀之间"], [2354, "的腔内压力， 以检测由于密封缺陷导致的压力增加。 在机组启动及正常燃烧模式过程中， 清吹系统会从"], [2355, "压气机排气中抽取一部分空气冷却后对没有燃气流经的环管进行冷却吹扫。"], [2356, "9.5.2 设备规范"], [2357, "设备名称 描述 说明"], [2358, "HX-4-2 清吹冷却器 将排气温度从 510℃降低到 260℃"], [2363, "VAS-3 PM2 清吹管路截止阀 气动阀"], [2364, "VAS-4 PM2 清吹管路截止阀 气动阀"], [2365, "VAV-2 PM2 清吹管路通风阀 气动阀"], [2366, "VAS-5 PM3 清吹管路截止阀 气动阀"], [2367, "VAS-6 PM3 清吹管路截止阀 气动阀"], [2368, "VAV-3 PM3 清吹管路通风阀 气动阀"], [2369, "VAS-7 AFS 清吹管路截止阀 气动阀"], [2370, "VAS-8 AFS 清吹管路截止阀 气动阀"], [2371, "VAV-4 AFS 清吹管路通风阀 气动阀"]]}, {"t": "机岛规程 第 2410～2431 行", "lines": [[2410, "9.5.4.2 系统运行"], [2411, "1) 机组启动前和加速过程中，清吹阀关闭，排空阀打开。"], [2412, "2) 在正常的气体燃料运行期间，当燃气轮机转速高于95%时，所有未加燃料的回路都需进行吹扫。"], [2413, "3) 在M3模式期间，PM1和PM2管路加燃料，PM3和AFS管路不加燃料。关闭吹扫阀20VAS-3、20VAS-4"], [2414, "，开启排气阀VAV-2。开启吹扫阀20VAS-5、20VAS-6、20VAS-7、20VAS-8，关闭排气阀VAV-3、"], [2415, "VAV-4。这种模式主要在燃机启动或时使用。"], [2420, "4) M4模式，PM1和PM3管路加燃料，PM2和AFS管路不加燃料。开启吹扫阀20VAS-3、20VAS-4，开启"], [2421, "排气阀VAV-2。开启吹扫阀VAS-5、VAS-6、VAS-7、VAS-8，关闭排气阀VAV-3、VAV-4。这种模式"], [2422, "主要在燃机启动或停机时使用。"], [2423, "5) 在M6.2模式期间，PM1、PM2、PM3管路加燃料，AFS管路不加燃料。关闭吹扫阀VAS-3、VAS-4、"], [2424, "VAS-5、VAS-6，开启排气阀VAV-2、VAV-3。开启吹扫阀VAS-7、VAS-8，关闭排气阀VAV-4。这种"], [2425, "模式主要是在燃机低负荷运行时使用。"], [2426, "6) 在M6.2A模式期间， PM1、 PM2、 PM3、 AFS管路均加燃料。 所有吹扫阀VAS-3、 VAS-4、 VAS-5、 20VAS-6"], [2427, "、VAS-7、VAS-8关闭，所有排气阀VAV-2、VAV-3、VAV-4开启。当燃机在部分负荷和基本负荷下"], [2428, "工作时，使用此模式。"], [2429, "7) 当燃气轮机停机信号启动时， 当汽轮机转速降至95%以下时， 清吹停止， 清吹阀关闭， 排空阀打"], [2430, "开。如果燃气轮机跳闸，清吹空气系统的阀门将进入其故障安全位置：由于失去将阀门置于所"], [2431, "需位置的命令信号，清吹阀关闭，排空阀打开。"]]}, {"t": "机岛规程 第 2444～2446 行", "lines": [[2444, "(4) 清吹系统截至阀内漏， 当管线未被清吹时， 清吹阀关闭。 如果两个清吹阀中的一个是泄漏阀，"], [2445, "则排空阀 VAV-2、VAV-3 和 VAV-4 将能够排出小泄漏。如果严重泄漏。在这种情况下，两个清"], [2446, "吹阀之间管道中的压力将增加，达到跳机上限后机组在 10 秒延时后会直接跳机。"]]}, {"t": "机岛规程 第 2282～2283 行", "lines": [[2282, "在95%TNH时，燃料清吹系统对所有未进入燃气的管路上进行吹扫。避免燃料回流，导致喷嘴损坏、"], [2283, "燃料混合物自动点火。"]]}, {"t": "机岛规程 第 1236～1237 行", "lines": [[1236, "6) 转速达到14%TNH（420rpm），延时30s后检查排气框架风机88TK自动投运。"], [1237, "7) 转速升至清吹转速735rpm，开始清吹倒计时11.5min。"]]}, {"t": "机岛规程 第 1258～1267 行", "lines": [[1258, "4) 转速升至约68%TNH（2040rpm），DLN Mode由M3S转换为M4S燃烧模式。此时，PM2和AFS燃料管路"], [1259, "的清吹阀开启正确，检查压气机排气温度、压力正常，清吹冷却空气温度正常。"], [1260, "5) 转速达到75%TNH（2250rpm）时，防喘放气阀（VA2-1、VA2-2）由100%关至37%。"], [1261, "6) 转速升至91%TNH（2730rpm）时，燃机达到自持转速，LCI停止输出。"], [1262, "7) 转速达到95%TNH （2850rpm） 时， 检查： 进气加热IBH先导控制阀VA20-2开至13%， VA20-1开至91%；"], [1263, "防喘放气阀（VA2-1、VA2-2）全关；压气机4个抽气流量调节阀EFM（VA44-1、VA44-2、VA44-3、"], [1264, "VA44-4）处于全开位置。"], [1265, "8) 转速达到98%TNH （2940rpm）时，发电机励磁交流侧开关41AC-1合闸、41AC-2分闸，发电机灭磁"], [1266, "开关41DC合闸；发电机重新建立励磁，建立额定电压22kV。"], [1267, "9) 燃机进入全速空载FSNL（3000rpm），全面检查各参数：压气机CPR、CPD、CTD正常，IGV、VSV"]]}, {"t": "机岛规程 第 1133～1133 行", "lines": [[1133, "15) 检查闭式水系统正常投运，确认润滑油冷却器、LCI冷却器、清吹冷却器已正常投运。"]]}, {"t": "机岛规程 第 1618～1618 行", "lines": [[1618, "7) 汽机开始惰走，确认SSS离合器已脱扣；汽机转速降至2640rpm时，顶轴油泵自动启动，顶轴油"]]}, {"t": "机岛规程 第 436～436 行", "lines": [[436, "（1） 传感器故障（机组并网且转速＞95%，所有 CPD 压气机出口压力传感器 96CD-1A、1B、1C"]]}, {"t": "机岛规程 第 453～463 行", "lines": [[453, "（1） 燃料清吹未启动时，燃料吹扫 PM2 回路阀间压力 96PG-2A/B＞（43.5psig 与当时 CPD*50%"], [454, "取大值）,清吹条件满足（L4=1），延时 10s"], [455, "燃料清吹未启动时，前后清吹阀开启（VAS-3,VAS-4）,清吹条件满足（L4=1），延时 10s"], [456, "（2）"], [457, "燃料清吹未启动时，燃料吹扫 PM3 回路阀间压力 96PG-3A/B＞（43.5psig 与当时 CPD*50%"], [458, "取大值）,清吹条件满足（L4=1），延时 10s"], [459, "燃料清吹未启动时，前后清吹阀开启（VAS-5,VAS-6）,清吹条件满足（L4=1），延时 10s"], [460, "（3）"], [461, "燃料清吹未启动时，燃料吹扫 AFS 回路阀间压力 96PG-4A/B＞（43.5psig 与当时 CPD*50%"], [462, "取大值）,清吹条件满足（L4=1），延时 10s"], [463, "燃料清吹未启动时，前后清吹阀开启（VAS-7,VAS-8）,清吹条件满足（L4=1），延时 10s"]]}, {"t": "机岛规程 第 477～477 行", "lines": [[477, "（1） 转速在 1.5%（14HT）至 95%(14HS)过程中任一防喘阀的位置反馈（90CB-1、2）和指令偏"]]}, {"t": "机岛规程 第 613～618 行", "lines": [[613, "（6） 当燃机已并网，#2 清吹空气侧电动（VAS-3）或者燃气侧电动阀（VAS-4）故障（或开指"], [614, "令在且反馈＜5%），延时 60s"], [615, "（7） 当燃机已并网，#3 清吹空气侧电动阀（VAS-5）或者燃气侧电动阀（VAS-6）故障（或开"], [616, "指令在且反馈＜5%），延时 60s"], [617, "（8） 当燃机已并网，#4 清吹空气侧电动阀（VAS-7）或者燃气侧电动阀（VAS-8）故障（或开"], [618, "指令在且反馈＜5%），延时 60s"]]}, {"t": "公用规程 第 204～209 行", "lines": [[204, "表 2 天然气爆炸极限"], [205, "名称 爆炸极限（20℃，101.325kPa） 爆炸下限 爆炸上限"], [206, "着火温度"], [207, "氢气 4.0% 75.9% 约560℃"], [208, "一氧化碳 12.5% 74.2% 约644-658℃"], [209, "甲烷 5.0% 15.0% 约540℃"]]}], "cards": ["D:6.1-4", "RJ-std017", "D:6.1-2", "D:6.1-6", "RJ-df03cc1d", "D:6.1-3", "D:6.1-8", "D:6.1-1", "D:6.1-5", "D:6.1-7"]}, "6.2": {"id": "6.2", "name": "清吹的保护和异常", "cat": "六", "gist": "不该清吹的管路，两个清吹阀之间压力高，说明清吹阀内漏，跳机。清吹中两阀之间压力低于 0.95 倍压气机排气压力持续 60 秒：已并网 1 倍 RB，未并网自动停机。清吹空气温度达到约 274 ℃（525 ℉）也 RB。两阀之间压力高时现场能听到尖锐的排气声，要先停止升负荷，避免燃烧模式切换。", "reg": "机岛 9.5.3、9.5.6；5.2（第 11 项）、5.3.1（第 5 项）、5.4（第 3 项）", "lecture": "\u003cp>这一篇讲燃料管路清吹（转速 95% 以上吹不进燃气的歧管，见考点 6.1）的保护，不是启动时 735rpm 的启动清吹\u003cspan class=\"cite\">机岛 9.5.1、6.5.1.2\u003c/span>。\u003c/p>\n\u003cp>先说几个词。CPD 是压气机出口压力\u003cspan class=\"cite\">机岛 5.2\u003c/span>，CPAMB 是大气绝对压力\u003cspan class=\"cite\">机岛 5.4\u003c/span>。RB 是快速减负荷，控制系统让燃料量按规定速率往下降，分 1 倍和 3 倍速率两种\u003cspan class=\"cite\">机岛 5.3\u003c/span>。自动停机是机组自动减负荷直到燃机熄火\u003cspan class=\"cite\">机岛 5.4\u003c/span>，跳闸则是燃料阀立即全部关闭\u003cspan class=\"cite\">机岛 5.2\u003c/span>。\u003c/p>\n\u003cp>保护主要盯每条清吹管上两个清吹阀之间腔室的压力，PM2、PM3、AFS 三条管分别由 96PG-2A/2B、96PG-3A/3B、96PG-4A/4B 测量\u003cspan class=\"cite\">机岛 9.5.1、5.2\u003c/span>。由阀位可知：不吹扫时清吹阀关、排空阀开，腔室通大气，压力应接近零；吹扫时清吹阀开、排空阀关，压力应接近 CPD\u003cspan class=\"infer\">推断：规程没写正常值\u003c/span>。保护就分两个方向：该低时高了，该高时低了。\u003c/p>\n\u003cp>不吹扫时压力高，说明清吹阀内漏。这根歧管不吹扫，就是正在进燃气。一个清吹阀轻微内漏，排空阀 VAV-2、VAV-3、VAV-4 能把小泄漏排出去；泄漏严重时，两阀之间压力升高，达到跳机上限后延时 10 秒跳机。现场能听到尖锐的排空气声\u003cspan class=\"cite\">机岛 9.5.6.1\u003c/span>。燃气侧的阀漏了，腔室里就是燃气，空气侧的阀再关不严，燃气就可能窜进压气机排气那一侧的清吹空气管路，和热空气混在一起，所以直接跳机\u003cspan class=\"infer\">推断：规程没写这条保护防什么\u003c/span>。同理，没有清吹指令而前后两个清吹阀都开着，两边没了隔断，延时 10s 也跳闸\u003cspan class=\"cite\">机岛 5.2\u003c/span>。\u003c/p>\n\u003cp>跳闸定值以 9.5.3.1 为准：没有清吹指令时腔间压力到高高限值 303kPa，延时 10 秒跳闸\u003cspan class=\"cite\">机岛 9.5.3.1\u003c/span>。5.2 跳闸清单写的是大于 43.5psig（psig：表压，磅每平方英寸）与当时 CPD 的 50% 中的大值\u003cspan class=\"cite\">机岛 5.2\u003c/span>；43.5psig 约合 300kPa\u003cspan class=\"conv\">换算\u003c/span>，和 303kPa 基本相同，只是 CPD 高时限值跟着抬高。9.5.6.1 另写 100kPa，以现场为准。9.5.3.1 另有条件「吹扫回路未阻塞」，规程没解释，我说不准。\u003c/p>\n\u003cp>处理：停止升负荷，维持当前负荷，避免燃烧模式切换；检查燃料吹扫系统画面的阀门状态，通知检修查原因\u003cspan class=\"cite\">机岛 9.5.6.1\u003c/span>。切换燃烧模式时，相应歧管的清吹阀都要动作\u003cspan class=\"cite\">机岛 9.5.4.2\u003c/span>；已经关不严的阀再动一次，可能漏得更厉害而跳机，所以先让阀门保持现状\u003cspan class=\"infer\">推断：规程没写原因\u003c/span>。\u003c/p>\n\u003cp>吹扫时压力低，说明吹扫空气没送足。腔间压力低于 0.95 倍 CPD，说明气源到腔室压降太大，或者空气从别处漏掉了，送到歧管的空气就挡不住热燃气倒灌\u003cspan class=\"infer\">推断：由考点 6.1 的清吹原理推出\u003c/span>。规程列的原因是：腔间压力传感器测量错误；清吹管路放散阀卡涩、气动执行机构异常；清吹系统放散阀内漏\u003cspan class=\"cite\">机岛 9.5.6.2\u003c/span>。这里的「放散阀」就是排空阀 VAV，吹扫时它关不严，空气就漏到大气\u003cspan class=\"infer\">推断：两处叫法不同\u003c/span>。\u003c/p>\n\u003cp>动作按是否并网分：任一吹扫回路腔间压力低于 0.95 倍 CPD 持续 60 秒，已并网 1 倍 RB，未并网自动停机；任何吹扫阻断阀（即清吹阀）指示关闭（低于 5%）5 秒，也按同样方式动作，因为阀没开，空气同样送不进去\u003cspan class=\"cite\">机岛 9.5.3.1\u003c/span>。并网后先按 1 倍速率减负荷，给运行人员判断的时间，未并网时没有负荷可减，就直接停机\u003cspan class=\"infer\">推断：规程没写为什么这样分\u003c/span>。出现 RB 后，检查清吹系统，判断机组运行是否安全，不安全就停机\u003cspan class=\"cite\">机岛 9.5.6.2\u003c/span>。\u003c/p>\n\u003cp>清吹空气温度高或测不到（为什么要冷却见考点 6.1）。清吹空气侧温度 FTPG1 达到约 274 ℃\u003cspan class=\"conv\">换算自 525 ℉\u003c/span>且有管路在清吹，延时 60s，1 倍 RB\u003cspan class=\"cite\">机岛 5.3.1\u003c/span>，这说明清吹冷却器没把空气冷下来\u003cspan class=\"infer\">推断：比冷却器设计出口温度高\u003c/span>。清吹进行时，清吹冷却器出口温度传感器 PT-HX-1A/B 都故障，无从知道清吹空气有多热，延时 60s 自动停机，原文没有限定未并网\u003cspan class=\"cite\">机岛 5.4\u003c/span>。\u003c/p>\n\u003cp>传感器和疏水压力。任一组腔间压力传感器故障，自动停机\u003cspan class=\"cite\">机岛 9.5.3.1\u003c/span>。清吹冷却器疏水压力也在监视：有清吹进行时，疏水压力大于等于 0.95 倍 CPD，或低于 1.05 倍 CPAMB，延时 60s，已并网 1 倍 RB，未并网自动停机\u003cspan class=\"cite\">机岛 5.3.1、5.4\u003c/span>。规程没写这个压力测在哪、为什么这样设限。可能的解释是：压力接近 CPD 说明疏水管堵了，接近大气压说明冷却器失压或疏水大量外泄\u003cspan class=\"infer\">推断：按两个限值的位置猜的，不能确定\u003c/span>。\u003c/p>", "sources": [{"t": "机岛规程 第 358～359 行", "lines": [[358, "5.2 Mark VIe 燃机跳闸（trip）部分"], [359, "燃机跳闸 （主保护、 后备保护） 后， 各燃料阀 全部关闭。"]]}, {"t": "机岛规程 第 436～436 行", "lines": [[436, "（1） 传感器故障（机组并网且转速＞95%，所有 CPD 压气机出口压力传感器 96CD-1A、1B、1C"]]}, {"t": "机岛规程 第 452～463 行", "lines": [[452, "11 Combustion Gas Fuel Purge Trip（燃烧器燃料吹扫跳闸）"], [453, "（1） 燃料清吹未启动时，燃料吹扫 PM2 回路阀间压力 96PG-2A/B＞（43.5psig 与当时 CPD*50%"], [454, "取大值）,清吹条件满足（L4=1），延时 10s"], [455, "燃料清吹未启动时，前后清吹阀开启（VAS-3,VAS-4）,清吹条件满足（L4=1），延时 10s"], [456, "（2）"], [457, "燃料清吹未启动时，燃料吹扫 PM3 回路阀间压力 96PG-3A/B＞（43.5psig 与当时 CPD*50%"], [458, "取大值）,清吹条件满足（L4=1），延时 10s"], [459, "燃料清吹未启动时，前后清吹阀开启（VAS-5,VAS-6）,清吹条件满足（L4=1），延时 10s"], [460, "（3）"], [461, "燃料清吹未启动时，燃料吹扫 AFS 回路阀间压力 96PG-4A/B＞（43.5psig 与当时 CPD*50%"], [462, "取大值）,清吹条件满足（L4=1），延时 10s"], [463, "燃料清吹未启动时，前后清吹阀开启（VAS-7,VAS-8）,清吹条件满足（L4=1），延时 10s"]]}, {"t": "机岛规程 第 589～592 行", "lines": [[589, "GT-RUNBACK 由 MarK VIe 自动控制执行，控制系统使 FSR 以规定的速率降低直到故障排除为止，如"], [590, "果故障不能在规定的时间极限范围内排除，控制系统将发出指令使机组在全速空载 FSNL 状态运行。燃"], [591, "机快速自动减负荷有 1 倍速率和 3 倍速率两种。"], [592, "5.3.1 燃机 1 倍 RUNBACK"]]}, {"t": "机岛规程 第 606～618 行", "lines": [[606, "5 Gas Fuel Purge RB-1X Nominal Rate（燃料吹扫 RB-1X）"], [607, "（1） 清吹空气侧温度 FTPG1≥525℉且任何管路清吹投入，延时 60s"], [608, "（2） 当燃机已并网，#2 清吹压力（二取均）＜0.95 倍 CPD 且#2 清吹投入,延时 60s"], [609, "（3） 当燃机已并网，#3 清吹压力（二取均）＜0.95 倍 CPD 且#4 清吹投入,延时 60s"], [610, "（4） 当燃机已并网，#4 清吹压力（二取均）＜0.95 倍 CPD 且#4 清吹投入,延时 60s"], [611, "（5） 当燃机已并网，清吹疏水压力(96DP-1A/B）≥0.95 倍 CPD 或＜1.05 倍 CPAMB（计算值）"], [612, "且任一清吹投入，延时 60s"], [613, "（6） 当燃机已并网，#2 清吹空气侧电动（VAS-3）或者燃气侧电动阀（VAS-4）故障（或开指"], [614, "令在且反馈＜5%），延时 60s"], [615, "（7） 当燃机已并网，#3 清吹空气侧电动阀（VAS-5）或者燃气侧电动阀（VAS-6）故障（或开"], [616, "指令在且反馈＜5%），延时 60s"], [617, "（8） 当燃机已并网，#4 清吹空气侧电动阀（VAS-7）或者燃气侧电动阀（VAS-8）故障（或开"], [618, "指令在且反馈＜5%），延时 60s"]]}, {"t": "机岛规程 第 667～669 行", "lines": [[667, "5.4 自动停机"], [668, "为机组自动停机条件。"], [669, "机组自动停机：进入自动停机程序，机组自动减负荷、汽机脱扣、燃机降负荷直至燃机熄火，以下"]]}, {"t": "机岛规程 第 683～711 行", "lines": [[683, "3 Combustion Gas Fuel Purge Shutdown（燃烧系统燃料吹扫停机）"], [684, "燃机未并网，PM2 清吹时，清吹腔室压力（正常信号）＜0.95 倍 CPD，延时 60s"], [685, "（1）"], [686, "PM2 清吹腔室压力（正常信号）＜0.95 倍 CPD，延时 2s 且 VAS-3 有开命令且未打开，延"], [687, "或"], [688, "时 10s"], [689, "燃机未并网，PM3 清吹时，清吹腔室压力（正常信号）＜0.95 倍 CPD，延时 60s"], [690, "（2）"], [691, "PM3 清吹腔室压力（正常信号）＜0.95 倍 CPD，延时 2s 且 VAS-5 有开命令且未打开，延"], [692, "或"], [693, "时 10s"], [694, "燃机未并网，AFS 清吹时，清吹腔室压力（正常信号）＜0.95 倍 CPD，延时 60s"], [695, "（3）"], [696, "PM4 清吹腔室压力（正常信号）＜0.95 倍 CPD，延时 2s 且 VAS-7 有开命令且未打开，延"], [697, "或"], [698, "时 10s"], [699, "（4） 任一腔室清吹进行时，清吹冷却器出口温度传感器（PT-HX-1A/B）均故障,延时 60s"], [700, "（5） PM2 或 PM3 或 AFS 清吹腔室压力传感器全坏"], [701, "未并网时，任一腔室进行清吹且清吹冷却器疏水压力≥0.95 倍 CPD，延时 60s"], [702, "（6）"], [703, "或"], [704, "延时 60s"], [705, "未并网时， 任一腔室进行清吹且清吹冷却器疏水压力≤1.05 倍 CPAMB （大气绝对压力值） ，"], [706, "（7） 未并网时，PM2 有清吹命令，VAS-3 阀位坏质量或开度≤5%或 VAS-4 阀位坏质量或开度"], [707, "≤5%，延时 60s"], [708, "（8） 未并网时，PM3 有清吹命令，VAS-5 阀位坏质量或开度≤5%或 VAS-6 阀位坏质量或开度≤"], [709, "5%，延时 60s"], [710, "（9） 未并网时，AFS 有清吹命令，VAS-7 阀位坏质量或开度≤5%或 VAS-8 阀位坏质量或开度"], [711, "≤5%，延时 60s"]]}, {"t": "机岛规程 第 1237～1237 行", "lines": [[1237, "7) 转速升至清吹转速735rpm，开始清吹倒计时11.5min。"]]}, {"t": "机岛规程 第 2346～2346 行", "lines": [[2346, "当燃机转速大于95%TNH时， 部分抽出的压气机排气经冷却后吹扫未投入使用的燃气喷嘴流道， 防止"]]}, {"t": "机岛规程 第 2352～2354 行", "lines": [[2352, "吹阀VAS-7和VAS-8以及排空阀VAV-4)；在PM2、PM3和AFS清吹管路腔室之间分别设有冗余压力变送器"], [2353, "96PG-2A、96PG-2B、96PG-2B、96PG-3A、96PG-3B、96PG-4A和96PG-4B测量三条吹扫管线上清吹阀之间"], [2354, "的腔内压力， 以检测由于密封缺陷导致的压力增加。 在机组启动及正常燃烧模式过程中， 清吹系统会从"]]}, {"t": "机岛规程 第 2372～2399 行", "lines": [[2372, "9.5.3 联锁保护"], [2373, "9.5.3.1 设备保护定值"], [2374, "信号名称 描述 整定值"], [2375, "L4GFPTP 燃气燃料吹扫跳"], [2376, "闸"], [2377, "任一清吹回路没有清吹指令且该清吹回路腔间压力到高高"], [2378, "限值（303kPa）且气体燃料吹扫回路未阻塞，延时 10 秒燃"], [2379, "机跳闸"], [2380, "L70GFPRB1"], [2381, "气体燃料吹扫回"], [2382, "路间隔压力低-"], [2383, "快速减负荷"], [2384, "机组并网且吹扫建立后发生以下情况，则 1 倍 RB："], [2385, "-任一吹扫回路腔间压力\u003c0.95*CPD，持续 60 秒。"], [2386, "-任何吹扫阻断阀指示关闭(\u003c5%)5 秒，位置反馈正常"], [2387, "L94GFPSD"], [2388, "气体燃料吹扫回"], [2389, "路间隔压力低-"], [2390, "停机"], [2391, "机组未并网且吹扫建立后发生以下情况，则自动停机："], [2392, "-任一吹扫回路腔间压力\u003c0.95*CPD，持续 60 秒。"], [2393, "-任何吹扫阻断阀指示关闭(\u003c5%)5 秒，位置反馈正常。"], [2394, "L94GFPSD"], [2395, "气体燃料吹扫间"], [2396, "隔压力故障-停"], [2397, "机"], [2398, "96PG-2A、 96PG-2B 和 96PG-3A、 96PG-3B 和 96PG-4A、 96PG-4B"], [2399, "任一组腔间压力传感器故障,则自动停机"]]}, {"t": "机岛规程 第 2410～2431 行", "lines": [[2410, "9.5.4.2 系统运行"], [2411, "1) 机组启动前和加速过程中，清吹阀关闭，排空阀打开。"], [2412, "2) 在正常的气体燃料运行期间，当燃气轮机转速高于95%时，所有未加燃料的回路都需进行吹扫。"], [2413, "3) 在M3模式期间，PM1和PM2管路加燃料，PM3和AFS管路不加燃料。关闭吹扫阀20VAS-3、20VAS-4"], [2414, "，开启排气阀VAV-2。开启吹扫阀20VAS-5、20VAS-6、20VAS-7、20VAS-8，关闭排气阀VAV-3、"], [2415, "VAV-4。这种模式主要在燃机启动或时使用。"], [2420, "4) M4模式，PM1和PM3管路加燃料，PM2和AFS管路不加燃料。开启吹扫阀20VAS-3、20VAS-4，开启"], [2421, "排气阀VAV-2。开启吹扫阀VAS-5、VAS-6、VAS-7、VAS-8，关闭排气阀VAV-3、VAV-4。这种模式"], [2422, "主要在燃机启动或停机时使用。"], [2423, "5) 在M6.2模式期间，PM1、PM2、PM3管路加燃料，AFS管路不加燃料。关闭吹扫阀VAS-3、VAS-4、"], [2424, "VAS-5、VAS-6，开启排气阀VAV-2、VAV-3。开启吹扫阀VAS-7、VAS-8，关闭排气阀VAV-4。这种"], [2425, "模式主要是在燃机低负荷运行时使用。"], [2426, "6) 在M6.2A模式期间， PM1、 PM2、 PM3、 AFS管路均加燃料。 所有吹扫阀VAS-3、 VAS-4、 VAS-5、 20VAS-6"], [2427, "、VAS-7、VAS-8关闭，所有排气阀VAV-2、VAV-3、VAV-4开启。当燃机在部分负荷和基本负荷下"], [2428, "工作时，使用此模式。"], [2429, "7) 当燃气轮机停机信号启动时， 当汽轮机转速降至95%以下时， 清吹停止， 清吹阀关闭， 排空阀打"], [2430, "开。如果燃气轮机跳闸，清吹空气系统的阀门将进入其故障安全位置：由于失去将阀门置于所"], [2431, "需位置的命令信号，清吹阀关闭，排空阀打开。"]]}, {"t": "机岛规程 第 2436～2470 行", "lines": [[2436, "9.5.6 异常及事故处理"], [2437, "9.5.6.1 气体燃料吹扫腔间压力高"], [2438, "1) 现象：气体燃料吹扫腔间压力高，并发出报警，现场能听到尖锐的排空气声。"], [2439, "2) 原因："], [2440, "(1) 压力传感器测量错误。"], [2441, "(2) 清吹管路气动截止阀气源压力低，气动执行机构故障，导致清吹管路截至阀动作缓慢或无动"], [2442, "作。"], [2443, "(3) 清吹系统截至阀卡涩，未能完全关闭"], [2444, "(4) 清吹系统截至阀内漏， 当管线未被清吹时， 清吹阀关闭。 如果两个清吹阀中的一个是泄漏阀，"], [2445, "则排空阀 VAV-2、VAV-3 和 VAV-4 将能够排出小泄漏。如果严重泄漏。在这种情况下，两个清"], [2446, "吹阀之间管道中的压力将增加，达到跳机上限后机组在 10 秒延时后会直接跳机。"], [2447, "3) 处理："], [2448, "(1) 停止升负荷，当前负荷，避免燃烧模式切换，"], [2449, "(2) 检查燃料吹扫系统画面的阀门状态"], [2450, "(3) 针对异常现象通知检修人员查找故障原因并进行处理。"], [2451, "(4) 如果出现燃机跳闸，保证机组安全停运，惰走滑行过程中监控机组，观察其有何异常情况。"], [2452, "(5) 针对异常现象通知检修人员查找故障原因并进行处理。"], [2453, "(6) 气体燃料吹扫腔间压力超过 100kPa，延时 10 秒燃机跳闸，如果出现燃机跳闸，保证机组安"], [2454, "全停运，惰走滑行过程中监控机组，观察其有何异常情况。"], [2455, "(7) 针对异常现象通知检修人员查找故障原因并进行处理。"], [2456, "9.5.6.2 气体燃料吹扫腔间压力低"], [2457, "1) 现象：气体燃料吹扫腔间压力低，并发出报警，燃机1倍RB。"], [2458, "2) 原因："], [2459, "(1) 96PG-2A、96PG-2B、96PG-4A、96PG-4B 腔间压力传感器测量错误。"], [2460, "(2) 清吹管路放散阀卡涩、气动执行机构异常。"], [2461, "(3) 清吹系统放散阀内漏。"], [2466, "3) 处理："], [2467, "(1) 如果机组出现 RB，则应检查清吹系统以便确定机组运行是否安全。如不安全，则应对燃气轮"], [2468, "机实施停机。"], [2469, "(2) 如果出现燃机跳闸，保证机组安全停运，惰走滑行过程中监控机组，观察其有何异常情况。"], [2470, "(3) 针对异常现象通知检修人员查找故障原因并进行处理。"]]}], "cards": ["D:6.2-7", "D:6.2-8", "D:6.2-2", "D:6.2-4", "D:6.2-1", "D:6.2-3", "D:6.2-6", "D:6.2-5"]}, "6.3": {"id": "6.3", "name": "启动前的排气通道清吹", "cat": "六", "gist": "启动时转速升到 735 rpm，清吹 11.5 分钟，把燃机和余热锅炉烟道里可能残留的燃气吹走。清吹结束 LCI 停止出力，转速降到 400 rpm 以下再升到 420 rpm 点火。点火失败后重新点火，也必须先充分清吹（反措 8.7.7）。题库说清吹的空气量至少是排气道容积的 3 倍，规程没写这个数。", "reg": "机岛 6.5.1.2、6.5.1.3、5.2.2（第 16 项）；反措 8.7.7", "lecture": "\u003cp>本厂规程里有两种清吹，先分清楚。这一篇讲启动清吹：每次点火之前，燃机被拖到 735rpm，用空气把燃机和余热锅炉的整个排气通道吹一遍，防的是点火时通道里有残留燃气而爆燃\u003cspan class=\"cite\">机岛 6.5.1.2\u003c/span>。另一种是燃料管路清吹：点火以后、转速 95%TNH 以上，用冷却后的压气机排气吹暂时不进燃气的燃料歧管，防的是燃气在歧管里积聚和燃烧回流\u003cspan class=\"cite\">机岛 9.5.1；见考点 6.1\u003c/span>。规程里说的「清吹转速」「高盘清吹」「余热锅炉清吹」，都是指启动清吹\u003cspan class=\"infer\">推断：由上下文判断\u003c/span>。\u003c/p>\n\u003cp>TNH 是燃机转速，用全速的百分数表示，全速空载是 3000rpm\u003cspan class=\"cite\">机岛 6.5.1.4\u003c/span>。LCI 是静态变频启动装置，启动时让发电机作为电动机运行，拖着燃机升速\u003cspan class=\"cite\">机岛 6.5.1.2\u003c/span>。\u003c/p>\n\u003cp>启动步骤是这样写的\u003cspan class=\"cite\">机岛 6.5.1.2、6.5.1.3\u003c/span>：\u003c/p>\n\u003col>\n\u003cli>转速达到 14%TNH（420rpm），延时 30s 后排气框架风机 88TK 自动投运\u003c/li>\n\u003cli>转速升至清吹转速 735rpm，开始清吹倒计时 11.5min\u003c/li>\n\u003cli>清吹结束，LCI 停止输出功率，燃机开始降速\u003c/li>\n\u003cli>转速降到 13.3%TNH（400rpm）以下时，LCI 再次输出功率，把转速升到点火转速 14%TNH（420rpm），启动点火程序\u003c/li>\n\u003c/ol>\n\u003cp>88TK 把空气送进透平排气框架和 #2 轴承隧道冷却\u003cspan class=\"cite\">机岛 9.6.1\u003c/span>，不是清吹设备。\u003c/p>\n\u003cp>为什么要吹。停机期间或上一次点火失败后，可能有燃气进入燃烧室，积在透平、排气道和余热锅炉这个很大的容积里。燃气和空气混合进入爆炸范围，一点火整个通道就会爆燃，损坏余热锅炉\u003cspan class=\"infer\">原理：规程启动步骤没写清吹的目的\u003c/span>。清吹用的空气，就是燃机被 LCI 拖着转时压气机压出的空气，经燃烧室、透平、排气道和余热锅炉从烟囱排走\u003cspan class=\"infer\">原理\u003c/span>。\u003c/p>\n\u003cp>为什么要吹够时间。要把整个通道里的气体换掉好几遍，残留燃气才会被稀释到远低于爆炸下限；余热锅炉容积大，这个转速下风量有限，所以要吹十几分钟\u003cspan class=\"infer\">推断：规程没写 11.5min 怎么定的\u003c/span>。\u003c/p>\n\u003cp>为什么在 735rpm 吹，又回到 420rpm 点火。转速高，压气机送的风量大，吹得快。点火却要在低转速做：风量小，燃烧室里风速低，需要的燃料少，火容易点着、稳住\u003cspan class=\"infer\">推断：规程没写点火转速为什么低\u003c/span>。清吹结束后 LCI 停止输出，机组靠惯性往下降，LCI 的启动过程写作「机组惰走到点火转速」\u003cspan class=\"cite\">机岛 9.11.6\u003c/span>。为什么要等降到 400rpm 以下再拉回 420rpm，而不是降到 420rpm 时直接接住，规程没写，我不能确定。可能的原因是：在略低于点火转速处让 LCI 重新出力，由它拖着稳定在点火转速再点火，比在转速还往下掉时点火稳妥\u003cspan class=\"infer\">推断：规程没写\u003c/span>。\u003c/p>\n\u003cp>清吹过程中的保护。后备保护第 16 项点火失败跳闸有两种情况：点火 10s 后，四个火焰检测器（28FD-13、14、15、16）四取三未检测到火焰；清吹进行时（TNH&gt;24.3%，余热锅炉清吹未完成），任一火检检测到火焰，或至少两个火检不健康\u003cspan class=\"cite\">机岛 5.2\u003c/span>。24.3%TNH 约合 729rpm\u003cspan class=\"conv\">换算：按 3000rpm 计\u003c/span>，就在清吹转速 735rpm 附近，所以这条管的就是清吹那段时间。清吹时燃料阀都关着，火检看到火，说明有燃气漏进来被点着了或火检有问题；两个以上火检不健康，点火后就没法按四取三判断有没有着火，所以都要跳闸\u003cspan class=\"infer\">推断：规程没写这条保护的用意\u003c/span>。原文里的 BPCS 是 Mark VIe 里的常规控制器，与安全控制器 SIL 相对\u003cspan class=\"infer\">推断：由 5.2 第 12 项的写法推出\u003c/span>。\u003c/p>\n\u003cp>点火失败后为什么必须重新清吹。点火程序已经往燃烧室送了燃气，没点着的燃气留在燃烧室和排气通道里，不吹掉就再点，等于在充了燃气的通道里点火\u003cspan class=\"infer\">原理\u003c/span>。反措 8.7.7 要求点火失败后，重新点火前必须进行足够时间的清吹，防止燃机和余热锅炉通道内燃气浓度达到爆炸极限而爆燃\u003cspan class=\"cite\">题库 FC-8.7.7\u003c/span>。本厂规程的处理是：点火失败应查明原因；燃机高盘清吹结束后，并得到值长同意，才可再次点火\u003cspan class=\"cite\">机岛 11.3.7\u003c/span>。\u003c/p>\n\u003cp>题库有两处和本厂规程不一样，以本厂规程为准。一道题说清吹至少要吹除排气道容积 3 倍的空气\u003cspan class=\"cite\">题库 RJ-c45d2396\u003c/span>，规程没写倍数，只写在 735rpm 清吹 11.5min\u003cspan class=\"cite\">机岛 6.5.1.2\u003c/span>。另一道题的 B 项说在点火转速下先通风 5min 左右\u003cspan class=\"cite\">题库 RJ-4997d157\u003c/span>，本厂是在 735rpm 清吹 11.5min，吹完降速再升到 420rpm 点火\u003cspan class=\"cite\">机岛 6.5.1.2、6.5.1.3\u003c/span>。这道题考的是「点火前先吹扫」这个做法，原题答案 AB，B 的思路没错，只是转速和时间与本厂不同。D「多加空气」不对，爆燃是因为点火前通道里已经积了燃气，点火时多给空气赶不走它们\u003cspan class=\"infer\">推断\u003c/span>。\u003c/p>", "sources": [{"t": "机岛规程 第 1231～1231 行", "lines": [[1231, "(5) 静态变频启动装置 SFC 使发电机作为电动机运行，带动燃机升速。"]]}, {"t": "机岛规程 第 1236～1245 行", "lines": [[1236, "6) 转速达到14%TNH（420rpm），延时30s后检查排气框架风机88TK自动投运。"], [1237, "7) 转速升至清吹转速735rpm，开始清吹倒计时11.5min。"], [1238, "8) 清吹结束LCI停止输出功率，燃机开始降速。"], [1239, "6.5.1.3 燃机点火"], [1240, "1) 燃机转速降至13.3%TNH （400rpm） 以下时， LCI再次输出功率， 转速升至点火转速14%TNH （420rpm） ，"], [1241, "燃机启动点火程序。"], [1242, "2) 燃机转速降至13.3%TNH （400rpm） 以下时， LCI再次输出功率， 转速升至点火转速14%TNH （420rpm） ，"], [1243, "燃机启动点火程序。"], [1244, "3) 点火变压器带电，#3、#4燃烧室点火，火焰探测器检测到火焰信号，燃机点火成功进入Mode 3S"], [1245, "燃烧模式。"]]}, {"t": "机岛规程 第 1267～1267 行", "lines": [[1267, "9) 燃机进入全速空载FSNL（3000rpm），全面检查各参数：压气机CPR、CPD、CTD正常，IGV、VSV"]]}, {"t": "机岛规程 第 2346～2347 行", "lines": [[2346, "当燃机转速大于95%TNH时， 部分抽出的压气机排气经冷却后吹扫未投入使用的燃气喷嘴流道， 防止"], [2347, "燃气管道中形成燃气积聚和燃烧回流，同时保持燃气管道处于热状态，以防止管道中形成凝结水。"]]}, {"t": "机岛规程 第 2473～2476 行", "lines": [[2473, "冷却和密封空气系统由88TK冷却风机、透平冷却空气通道、压气机抽气管道及相关组件组成。"], [2474, "在燃气轮机运行时， 从压气机第8和第11级以及压气机出口抽取适量空气， 分别作为燃机第3级静叶、"], [2475, "第2级静叶的冷却气源。 其中第8级部分抽气还用于防止压气机喘振。 从压气机转子第10级后抽取适量空"], [2476, "气作为透平转子冷却空气。88TK冷却风机将空气送入透平排气框架和#2轴承隧道进行冷却。"]]}, {"t": "机岛规程 第 3490～3495 行", "lines": [[3490, "(6) LCI 将机组加速到清吹转速设定值约 735rpm；机组保持在清吹转速；"], [3495, "(7) 清吹结束后，LCI 停止输出，机组惰走到点火转速 14％，燃机开始点火；"]]}, {"t": "机岛规程 第 549～550 行", "lines": [[549, "12 SIL-BPCS EGD Communication Timeout（安全控制器 BPCS-EGD 通信超时跳闸）"], [550, "安全控制器未通过 EGD 与 BPCS 控制器通信"]]}, {"t": "机岛规程 第 572～578 行", "lines": [[572, "16 Trip Failure To Ignite SIF Trip Request（点火失败跳闸）"], [573, "（1） 点火 10s 后，火焰检测器（28FD-13、14、15、16）未检测到火焰，四取三"], [574, "（2）"], [575, "火检传感器故障： 清吹进行时(TNH>24.3%,余热锅炉清吹未完成， BPCS 有清吹允许信号或"], [576, "吹扫系统投入时 P2 腔和点火腔阻塞压力正常的情况下)，任一火检传感器检测到火焰或"], [577, "至 少 有 两 个 火 检 传 感 器 不 健 康 （ ＜ -6.25% 或 ＞ 12.5% 且 火 检 传 感 器 输 入 电 流 超 过"], [578, "3.77-21.5mA）"]]}, {"t": "机岛规程 第 6775～6784 行", "lines": [[6775, "11.3.7 燃烧室点火失败"], [6776, "1) 现象："], [6777, "(1) 控制系统进入点火程序失败，自动停机。"], [6778, "2) 原因："], [6779, "(1) 燃料控制阀未打开。"], [6780, "(2) 火焰探测器故障探测不到火焰。"], [6781, "(3) 点火器（火花塞）故障。"], [6782, "3) 处理："], [6783, "(1) 点火失败应查明原因。"], [6784, "(2) 燃机高盘清吹结束后，并得到值长同意后可再次进行点火。"]]}], "cards": ["D:6.3-3", "RJ-4997d157", "D:6.3-2", "D:6.3-4", "RJ-anti013", "D:6.3-5", "RJ-c45d2396", "D:6.3-6", "D:6.3-1", "FC-8.7.7"]}, "7.1": {"id": "7.1", "name": "反措规定的定期检查", "cat": "七", "gist": "地下燃气管道的防腐层，高压和次高压管道每 3 年查一次，投用 10 年以上的每 2 年一次；调压站防雷每年检测两次，雷雨季前必须测一次；定期维护点火系统；结合检修对燃机仓和燃料阀组间做气密性检查。", "reg": "反措 8.7.16、8.7.18、8.7.21、8.7.22", "lecture": "\u003cp>这个考点的内容本厂规程里没有写，依据是题库里按反措出的几道题。它们规定的是隔一段时间、或者结合检修要做的检查，和日常巡检不同。\u003c/p>\n\u003cp>第一项是地下燃气管道的防腐层。反措要求做好在役地下燃气管道防腐涂层的检查和维护：高压、次高压管道，也就是压力大于 0.4MPa、不超过 4.0MPa 的管道，正常情况下每 3 年查一次，投用 10 年以上的管道，每 2 年查一次\u003cspan class=\"cite\">题库 FC-8.7.21\u003c/span>。埋在地下的管道看不见，防腐层一旦破损，管壁就会被土壤腐蚀减薄，最后漏气；管道越老，防腐层越容易老化开裂，所以投用久的要查得更勤\u003cspan class=\"infer\">原理：反措只写了周期\u003c/span>。\u003c/p>\n\u003cp>这个压力范围和本厂对不上。本厂管网来气 6.3MPa，调压后 4.05MPa 送往机组\u003cspan class=\"cite\">公用 4.2.2.7\u003c/span>，都高于反措说的 4.0MPa\u003cspan class=\"cite\">题库 FC-8.7.21\u003c/span>。按字面，这条只管这个压力范围以内的管道。本厂有没有埋地的燃气管道、更高压力的管道按什么周期查，规程没写，我不知道，要问设备管理部门\u003cspan class=\"infer\">推断：反措这条沿用的是城镇燃气管道的压力分级\u003c/span>。\u003c/p>\n\u003cp>第二项是调压站的防雷设施。防雷设施要保持正常运行状态，每年检测两次，其中雷雨季节前必须检测一次，确保接地电阻值在设计范围内\u003cspan class=\"cite\">题库 FC-8.7.22\u003c/span>。\u003c/p>\n\u003cp>第三项是点火系统。反措要求严格执行燃机点火系统的管理制度，定期维护，防止点火器、高压点火电缆这些设备因为高温老化损坏，造成点火失败\u003cspan class=\"cite\">题库 FC-8.7.16_8.7.18\u003c/span>。\u003c/p>\n\u003cp>第四项是燃机仓和燃料阀组间的气密性。反措要求结合机组检修，对燃气轮机仓和燃料阀组间的燃气系统做气密性试验，并对燃气管道做全面检查\u003cspan class=\"cite\">题库 FC-8.7.16_8.7.18\u003c/span>。\u003c/p>\n\u003cp>另外，燃气泄漏探测器每季度校验一次，这一条在「可燃气体检测和泄漏处理」考点里讲\u003cspan class=\"cite\">题库 FC-8.7.8；见考点 3.6\u003c/span>。\u003c/p>\n\u003cp>这些检查由谁做，规程没写。防腐层检测、防雷检测、气密性试验一般由检修或专业单位做，运行人员要知道周期，配合做好隔离，试验时在画面上监视\u003cspan class=\"infer\">推断：规程没写分工\u003c/span>。\u003c/p>", "sources": [{"t": "公用规程 第 686～687 行", "lines": [[686, "2、调压单元"], [687, "通过调压单元（天然气管网升压后），将管网供气压力由6.3MPa降压至4.05MPa。采用机组单元制"]]}], "cards": ["D:7.1-2", "FC-8.7.22", "D:7.1-1", "D:7.1-3", "FC-8.7.21", "FC-8.7.16_8.7.18"]}, "7.2": {"id": "7.2", "name": "天然气常识（规程没写）", "cat": "七", "gist": "LNG 是液化天然气，CNG 是压缩天然气；天然气常压下约 −162 ℃ 液化。和油相比，天然气好烧、排放少，燃机检修周期更长。", "reg": "规程无", "lecture": "\u003cp>这个考点本厂规程没有写，依据全部是题库原题。内容分两块：液化天然气是什么，以及天然气和其他燃料比有什么好处。\u003c/p>\n\u003cp>LNG 是英文 Liquefied Natural Gas 的简称，就是液化天然气。天然气经过净化，在一个大气压下冷却到 −162 ℃ 左右，就变成液体\u003cspan class=\"cite\">题库 RJ-a9426931\u003c/span>。另一道题用绝对温度表示这个温度，写作 111K\u003cspan class=\"cite\">题库 RJ-dd7b5b7a\u003c/span>。液化天然气升温气化后，又变回普通天然气\u003cspan class=\"cite\">题库 RJ-dd7b5b7a\u003c/span>。\u003c/p>\n\u003cp>压缩天然气不叫 LNG\u003cspan class=\"cite\">题库 RJ-529d5127\u003c/span>。压缩天然气通常简称 CNG，是把天然气加压储存，仍然是气态，和液化天然气不是一回事\u003cspan class=\"infer\">推断：题库只说压缩天然气不叫 LNG，没有给出它的简称\u003c/span>。\u003c/p>\n\u003cp>天然气和油类燃料比，题库有三道题讲它的好处。渣油、重油、轻油、天然气四种燃料里，烧天然气的燃机检修周期最长\u003cspan class=\"cite\">题库 RJ-6e770977\u003c/span>。原因在燃料本身：天然气经过净化，几乎不含灰分，也很少有硫、钒、钠这类会在高温下腐蚀叶片的杂质，燃烧干净，燃烧室和透平通流部分积灰、腐蚀都轻；渣油、重油杂质多，热部件损坏快，检修就得勤\u003cspan class=\"infer\">原理：题库只给了结论\u003c/span>。重油比轻质液体燃料和气体燃料难燃烧\u003cspan class=\"cite\">题库 RJ-d997af06\u003c/span>，它黏度大，要先加热、雾化成细小油滴才能烧好\u003cspan class=\"infer\">原理\u003c/span>。和燃煤电厂比，天然气发电的 NOx 和 CO2 排放分别只有燃煤电厂的 20% 和 50%\u003cspan class=\"cite\">题库 RJ-829e62b1\u003c/span>。\u003c/p>\n\u003cp>液化以后体积缩小多少，题库里的说法互相矛盾，规程没写：\u003c/p>\n\u003cul>\n\u003cli>一道单选题说液化后体积缩小到 1/1000 左右，选项里另有 1/600，答案选的是 1/1000\u003cspan class=\"cite\">题库 RJ-dd7b5b7a\u003c/span>。\u003c/li>\n\u003cli>另一道单选题说 1 立方米 LNG 气化后得到 600 立方米天然气\u003cspan class=\"cite\">题库 RJ-e7c6ba61\u003c/span>。\u003c/li>\n\u003cli>一道简答题说液化后体积约为 0℃、一个大气压时的 1/600，也就是 1 立方米 LNG 气化后得 600 立方米天然气\u003cspan class=\"cite\">题库 RJ-a9426931\u003c/span>。\u003c/li>\n\u003c/ul>\n\u003cp>后两道题说法一致，和第一道对不上。简答题写明了是按 0℃、一个大气压下的天然气体积算的\u003cspan class=\"cite\">题库 RJ-a9426931\u003c/span>。实际记 1/600 这个量级就可以：液化天然气的密度除以常压下天然气的密度，大致就是这个倍数，1/1000 那道题的说法偏大\u003cspan class=\"infer\">推断：按两种状态的密度之比估算，题库和规程都没给计算\u003c/span>。\u003c/p>", "sources": [], "cards": ["D:7.2-1", "RJ-529d5127", "D:7.2-2", "D:7.2-3", "RJ-e2d14153", "RJ-d997af06", "RJ-6e770977", "RJ-a9426931", "RJ-e7c6ba61", "RJ-829e62b1", "RJ-dd7b5b7a"]}}, "cards": {"RJ-4b9ad7a2": {"id": "RJ-4b9ad7a2", "kp": "1.1", "kind": "orig", "type": "single", "tname": "单选", "stem": "下列属于高热值气体燃料的是（　　）。", "ans": "D", "from": "一二阶", "opts": [["A", "高炉气"], ["B", "煤气"], ["C", "精炼燃气"], ["D", "天然气"]], "key": "D"}, "RJ-8f0812f6": {"id": "RJ-8f0812f6", "kp": "1.1", "kind": "orig", "type": "single", "tname": "单选", "stem": "高热值气体燃料的主要成分是（　　）。", "ans": "A", "from": "集团2025", "opts": [["A", "CH4"], ["B", "H2"], ["C", "CO"], ["D", "N2。"]], "key": "A"}, "RJ-3203e596": {"id": "RJ-3203e596", "kp": "1.1", "kind": "orig", "type": "single", "tname": "单选", "stem": "低热值气体燃料的主要成分是（　　）。", "ans": "C", "from": "集团2025", "opts": [["A", "CH4、H2、N2"], ["B", "丙烷、CO"], ["C", "CO、H2、N2"], ["D", "CH4、N2。"]], "key": "C"}, "RJ-1f7a5d08": {"id": "RJ-1f7a5d08", "kp": "1.1", "kind": "orig", "type": "single", "tname": "单选", "stem": "天然气的热值主要处于（　　）范围内。", "ans": "C", "from": "集团2025", "opts": [["A", "10.8~15.7MJ/Nm3"], ["B", "15.8~30.7MJ/Nm3"], ["C", "29.8~44.7MJ/Nm3"], ["D", "50.8~58.7MJ/Nm3。"]], "key": "C"}, "RJ-0f72ed79": {"id": "RJ-0f72ed79", "kp": "1.1", "kind": "orig", "type": "single", "tname": "单选", "stem": "液化石油气的热值主要处于（　　）范围内。", "ans": "C", "from": "集团2025", "opts": [["A", "29.8~44.7MJ/Nm3"], ["B", "50.7~85.2MJ/Nm3"], ["C", "85.7~119.2MJ/Nm3"], ["D", "120.7~138.2MJ/Nm3。"]], "key": "C"}, "RJ-6432e245": {"id": "RJ-6432e245", "kp": "1.1", "kind": "orig", "type": "fill", "tname": "填空", "stem": "天然气的主要成分为甲烷（CH4）和乙烷（C2H4）等饱和碳氢化合物。上述各种碳氢化合物在天然气中的含量在（　　）以上，除了碳氢化合物以外，天然气中还有少量的CO2、N2、H2S、SO2、 H2、C0等，因此，天然气的（　　）很高，一般为33440—41800kJ/m3或更高。", "ans": "90％、发热量", "from": "技能培训", "note": "题干把乙烷写成了 C2H4（那是乙烯）；乙烷是 C2H6（公用表 1）。"}, "RJ-ec4eb246": {"id": "RJ-ec4eb246", "kp": "1.1", "kind": "orig", "type": "short", "tname": "简答", "stem": "什么是燃气发热量？", "ans": "燃烧一定体积或质量的燃气所能放出的热量称为燃气的发热量，也称为燃气的热值。", "from": "集团2025"}, "RJ-a5092182": {"id": "RJ-a5092182", "kp": "1.1", "kind": "orig", "type": "single", "tname": "单选", "stem": "下列天然气的品质对燃气轮机效率影响最大的是（　　）。", "ans": "C", "from": "一二阶", "opts": [["A", "温度"], ["B", "热值"], ["C", "低位热值"]], "key": "C"}, "RJ-da51f19a": {"id": "RJ-da51f19a", "kp": "1.1", "kind": "orig", "type": "calc", "tname": "计算", "stem": "某天然气的高位热值为39MJ/m3，密度为0.75Kg/m3，求该天然气的高华白数。（空气密度ρ空=1.29Kg/m3）", "ans": "该天然气的相对密度S==0.75÷1.29=0.5814\n该天然气的高华白数W==39÷=51.1475MJ/m3\n答：该天然气的高华白数为51.1475MJ/m3", "from": "集团2025"}, "RJ-16bc2855": {"id": "RJ-16bc2855", "kp": "1.1", "kind": "orig", "type": "calc", "tname": "计算", "stem": "一台燃用天然气的燃机机组的供电效率为40％，天然气的低位发热量为38000kJ/Nm3，求该台燃机的供电热耗率、供电气耗率和供电标煤耗。（天然气密度为0.707kg/Nm3）", "ans": "供电热耗率：qe=3600/ηcN=3600/40%=9000kJ/（kWh）\n供电气耗率：qv= qe /Qnet=9000/38000=0.237Nm3/（kWh）\n标煤热值  Q=29270kJ/kg\n供电标煤耗：q煤= qe /Q=9000/29270=0.307 kg/（kWh）\n答：该台燃机的供电热耗率为9000kJ/（kWh），供电气耗率为0.237Nm3/（kWh），供电标煤耗率为0.307 kg/（kWh）。", "from": "集团2025"}, "D:1.1-1": {"id": "D:1.1-1", "kp": "1.1", "kind": "drill", "type": "judge", "tname": "判断", "stem": "规程表 1 中，本厂天然气里不属于烃类的组分只有氮气，二氧化碳、硫化氢的含量都是 0。", "ans": "对", "src": [{"t": "公用规程 第 191～193 行", "lines": [[191, "氮气(N2) 0.38 mol%"], [192, "二氧化碳(CO2) 0 mol%"], [193, "硫化氢(H2S) 0 mol%"]]}], "key": "对"}, "D:1.1-2": {"id": "D:1.1-2", "kp": "1.1", "kind": "drill", "type": "judge", "tname": "判断", "stem": "本厂天然气里，除甲烷以外含量最多的组分是丙烷。", "ans": "错", "src": [{"t": "公用规程 第 175～177 行", "lines": [[175, "甲烷（CH4） 93.56 mol%"], [176, "乙烷(C2H6 4.18 mol%"], [177, "丙烷(C3H8) 1.42 mol%"]]}], "key": "错", "why": "规程表 1 中含量仅次于甲烷的是乙烷，4.18 mol%；丙烷是 1.42 mol%。"}, "D:1.1-3": {"id": "D:1.1-3", "kp": "1.1", "kind": "drill", "type": "choice", "tname": "单选", "stem": "规程表 1 中，本厂天然气的低热值是多少？", "ans": "B", "src": [{"t": "公用规程 第 194～202 行", "lines": [[194, "高热值 39.322 MJ/m"], [196, "低热值 35.496 MJ/m"], [198, "相对密度 0.597"], [199, "密度 0.719 kg/m"], [201, "沃泊指数（华白数） 50.877 MJ/m"]]}], "opts": [["A", "39.322 MJ/m³"], ["B", "35.496 MJ/m³"], ["C", "50.877 MJ/m³"], ["D", "0.597 MJ/m³"]], "key": "B"}, "D:1.1-4": {"id": "D:1.1-4", "kp": "1.1", "kind": "drill", "type": "fill", "tname": "填空", "stem": "规程表 1 的天然气组成分析，检测依据是 GB/T13610，采用的方法是（ ）。", "ans": "气相色谱法", "src": [{"t": "公用规程 第 203～203 行", "lines": [[203, "注 1：检测依据 GB/T13610-20 天然气的组成分析气相色谱法，各指标剂量计算温度为 20℃。"]]}]}, "D:1.1-5": {"id": "D:1.1-5", "kp": "1.1", "kind": "drill", "type": "judge", "tname": "判断", "stem": "规程表 1 中的热值、密度等指标，是按 0℃ 计量的。", "ans": "错", "src": [{"t": "公用规程 第 203～203 行", "lines": [[203, "注 1：检测依据 GB/T13610-20 天然气的组成分析气相色谱法，各指标剂量计算温度为 20℃。"]]}], "key": "错", "why": "表 1 注 1 写明，各项指标按 20℃ 计量。"}, "L:1.1": {"id": "L:1.1", "kp": "1.1", "kind": "intro"}, "RJ-92d42d57": {"id": "RJ-92d42d57", "kp": "1.2", "kind": "orig", "type": "fill", "tname": "填空", "stem": "天然气无色无味、无毒且无腐蚀性，主要成分为（　　），天然气在空气中的爆炸极限是（　　）。", "ans": "甲烷；5%-15%", "from": "一二阶"}, "RJ-b0470420": {"id": "RJ-b0470420", "kp": "1.2", "kind": "orig", "type": "single", "tname": "单选", "stem": "天然气的爆炸极限是（　　）。氢气4%-75%", "ans": "A", "from": "一二阶", "opts": [["A", "5.0%-15.0%"], ["B", "5.0%-10.0%"], ["C", "10.0%-15.0%"], ["D", "4.0%-76.0%"]], "key": "A"}, "RJ-99d89302": {"id": "RJ-99d89302", "kp": "1.2", "kind": "orig", "type": "fill", "tname": "填空", "stem": "当天然气与空气混合物的容积浓度处在（　　）范围内时，一旦突然点着，就会发生爆炸效应。", "ans": "5％—14％、", "from": "技能培训", "note": "本厂规程写甲烷爆炸极限 5.0%～15.0%（公用表 2）。"}, "RJ-35f80f5a": {"id": "RJ-35f80f5a", "kp": "1.2", "kind": "orig", "type": "judge", "tname": "判断", "stem": "甲烷测爆仪的100%是指甲烷在空气中的体积含量为5%，即甲烷在空气中 ", "type": "fill", "tname": "填空", "stem": "按反措 8.7.12，进入燃气系统区域（如调压站、燃气轮机间、前置模块等）的人员必须穿（　　）工作服。不得穿易产生静电的服装、（　　）的鞋，不得携带（　　）及其他易燃、易爆品进入燃气系统区域。燃气区域禁止用（　　）设备照相、摄影。", "ans": "防静电；带铁掌；移动电话；非防爆", "from": "反措题卡", "notes": [["原文说明", "题卡依据《防止电力生产事故的二十五项重点要求》（2023版）原文自制，不是竞赛原题库题目；答案以附带原文为准。"]]}, "FC-8.7.17_8.7.19": {"id": "FC-8.7.17_8.7.19", "kp": "3.5", "kind": "orig", "type": "fill", "tname": "填空", "stem": "按反措 8.7.17，（　　）未装设（　　）的汽车、摩托车、电瓶车等车辆在燃气轮机的警示范围或调压站内行驶。按 8.7.19，机组停运时，（　　）采用向（　　）后通入燃气的方式对燃气透平及其他管道设备进行法兰找漏等试验、检修工作。", "ans": "严禁；阻火器；禁止；燃料关断阀", "from": "反措题卡", "notes": [["原文说明", "题卡依据《防止电力生产事故的二十五项重点要求》（2023版）原文自制，不是竞赛原题库题目；答案以附带原文为准。"]]}, "RJ-8964e8c1": {"id": "RJ-8964e8c1", "kp": "3.5", "kind": "orig", "type": "fill", "tname": "填空", "stem": "在燃气系统附近进行明火作业时，作业地点所测量的空气中含天然气量应不超过（　　），同时按规定时间间隔做好动作区域做好危险气体含量检测。", "ans": "1%", "from": "一二阶"}, "FC-8.7.14": {"id": "FC-8.7.14", "kp": "3.5", "kind": "orig", "type": "fill", "tname": "填空", "stem": "按反措 8.7.14，在燃气系统附近进行明火作业时，明火作业地点测量空气所含燃气浓度不得超过（　　）的（　　），其中甲烷浓度不得超过（　　），并经（　　）后才能进行明火作业，同时按规定间隔时间做好动火区域危险气体含量检测。", "ans": "爆炸下限；20%；1%；批准", "from": "反措题卡", "notes": [["原文说明", "题卡依据《防止电力生产事故的二十五项重点要求》（2023版）原文自制，不是竞赛原题库题目；答案以附带原文为准。"]]}, "D:3.5-1": {"id": "D:3.5-1", "kp": "3.5", "kind": "drill", "type": "fill", "tname": "填空", "stem": "进入调压站须按规范要求触摸（ ），装置提示灯显示为（ ）方可进入。", "ans": "静电释放装置；绿色", "src": [{"t": "公用规程 第 939～939 行", "lines": [[939, "3) 进入调压站须按规范要求触摸静电释放装置，装置提示灯显示为“绿色”方可进入。"]]}]}, "D:3.5-2": {"id": "D:3.5-2", "kp": "3.5", "kind": "drill", "type": "judge", "tname": "判断", "stem": "操作调压站设备时，只要动作缓慢，可以使用普通钢制扳手。", "ans": "错", "src": [{"t": "公用规程 第 944～945 行", "lines": [[944, "7) 操作调压站设备须使用铜制工具，以防发生火花。操作时应均匀缓慢，禁止剧烈地排送，以防"], [945, "因磨擦引起自燃。"]]}], "key": "错", "why": "操作调压站设备须使用铜制工具，以防发生火花；操作时应均匀缓慢，禁止剧烈地排送，以防因磨擦引起自燃。"}, "D:3.5-3": {"id": "D:3.5-3", "kp": "3.5", "kind": "drill", "type": "choice", "tname": "单选", "stem": "调压站内进行动火作业，规程对可燃气体浓度检测是怎么要求的？", "ans": "C", "src": [{"t": "公用规程 第 952～955 行", "lines": [[952, "11) 调压站内进行动火作业时， 动火前必须进行可燃气体浓度测定， 可燃气体浓度合格后， 方可允"], [953, "许动火。"], [954, "12) 动火期间应定期检测可燃气体浓度， 经检测可燃气体浓度合格后方可继续工作， 动火部位应备"], [955, "有适用的消防器材或灭火措施。"]]}], "opts": [["A", "可燃气体探测装置无报警即可动火"], ["B", "动火前测定一次，合格后动火，动火期间不必再测"], ["C", "动火前必须测定可燃气体浓度，合格后方可动火；动火期间还要定期检测，合格才能继续工作"], ["D", "动火前用氮气置换，置换合格即可动火"]], "key": "C"}, "D:3.5-4": {"id": "D:3.5-4", "kp": "3.5", "kind": "drill", "type": "ask", "tname": "问答", "stem": "进入调压站之前，随身物品和着装要怎么处理？", "ans": "确认身上没有携带火种和非防爆通讯器材；手机、钥匙、火种及任何可能产生火花或静电的物件存放在指定位置，调压站内关闭一切非防爆电器、通讯设备；入站前释放静电，穿着不会产生静电的工作服。", "src": [{"t": "公用规程 第 760～761 行", "lines": [[760, "1) 检查确认身上没有携带火种和非防爆通讯器材，入站前须释放静电并穿着不会产生静电的工作"], [761, "服，作业中使用铜制工具。"]]}, {"t": "公用规程 第 937～938 行", "lines": [[937, "2) 进入调压站的人员应主动将随身携带的手机、 钥匙、 火种及任何可能产生火花/静电的物件存放"], [938, "在指定位置，调压站内应关闭一切非防爆电器、通讯设备。"]]}]}, "D:3.5-5": {"id": "D:3.5-5", "kp": "3.5", "kind": "drill", "type": "fill", "tname": "填空", "stem": "涉及天然气系统设备检修，必须严格执行（ ）制度；涉及调压站系统设备投退、置换，必须严格执行（ ）制度。", "ans": "工作票；操作票", "src": [{"t": "公用规程 第 946～949 行", "lines": [[946, "8) 涉及天然气系统设备检修等工作，必须按要求严格执行工作票制度和检修、运行规程中的相关"], [947, "规定，确保风险管控和安全监督落实到位。"], [948, "9) 涉及调压站系统设备投退、置换等工作，必须按要求严格执行操作票制度和运行规程中的相关"], [949, "规定，确保风险管控和安全监督落实到位。"]]}]}, "L:3.5": {"id": "L:3.5", "kp": "3.5", "kind": "intro"}, "RJ-296b4eb2": {"id": "RJ-296b4eb2", "kp": "3.6", "kind": "orig", "type": "single", "tname": "单选", "stem": "在调压站等可能存在天然气泄露的地方，甲烷的浓度低于爆炸下限的（　　）以后才允许进入站内做相应的检修工作。", "ans": "B", "from": "一二阶", "opts": [["A", "5%"], ["B", "10%"], ["C", "15%"]], "key": "B", "note": "本厂规程分两种情况：检修中测得超过 10% LEL 必须停工（公用 4.3.10）；严重泄漏后甲烷低于 5% LEL 才准进站（公用 4.5.4.2）。"}, "RJ-anti012": {"id": "RJ-anti012", "kp": "3.6", "kind": "orig", "type": "fill", "tname": "填空", "stem": "按《二十五项反措》8.7.6，燃气泄漏量达到测量爆炸下限的（　　）时，不允许启动燃气轮机。", "ans": "20%", "from": "来源训练题", "notes": [["原整理说明", "答案逐字见同题所附精确引文；本题不作跨来源推断。"], ["原文说明", "来源训练题：由原整理者依据《机岛运行技术标准》或反措原文出的训练题，不是竞赛原题库题目。"]], "note": "本厂规程的禁止启动条件写的是天然气区域燃气泄漏浓度达到 25% LEL（机岛 6.2.1），比反措宽。"}, "FC-8.7.6": {"id": "FC-8.7.6", "kp": "3.6", "kind": "orig", "type": "fill", "tname": "填空", "stem": "按反措 8.7.6，燃气泄漏量达到测量（　　）的（　　）时，不允许启动燃气轮机。", "ans": "爆炸下限；20%", "from": "反措题卡", "notes": [["原文说明", "题卡依据《防止电力生产事故的二十五项重点要求》（2023版）原文自制，不是竞赛原题库题目；答案以附带原文为准。"]], "note": "本厂规程的禁止启动条件写的是天然气区域燃气泄漏浓度达到 25% LEL（机岛 6.2.1），比反措宽。"}, "RJ-anti014": {"id": "RJ-anti014", "kp": "3.6", "kind": "orig", "type": "fill", "tname": "填空", "stem": "按《二十五项反措》8.7.8，燃气泄漏探测器（　　）进行一次校验。", "ans": "每季度", "from": "来源训练题", "notes": [["原整理说明", "答案逐字见同题所附精确引文；本题不作跨来源推断。"], ["原文说明", "来源训练题：由原整理者依据《机岛运行技术标准》或反措原文出的训练题，不是竞赛原题库题目。"]]}, "FC-8.7.8": {"id": "FC-8.7.8", "kp": "3.6", "kind": "orig", "type": "fill", "tname": "填空", "stem": "按反措 8.7.8，加强对燃气泄漏探测器的定期维护，（　　）进行一次校验，确保测量可靠，防止发生因测量偏差、拒报而发生火灾爆炸。", "ans": "每季度", "from": "反措题卡", "notes": [["原文说明", "题卡依据《防止电力生产事故的二十五项重点要求》（2023版）原文自制，不是竞赛原题库题目；答案以附带原文为准。"]]}, "FC-8.7.2_8.7.3": {"id": "FC-8.7.2_8.7.3", "kp": "3.6", "kind": "orig", "type": "fill", "tname": "填空", "stem": "按反措 8.7.2，（　　）燃气管道从管沟内敷设。对于从房内穿越的架空管道，必须做好穿墙套管的（　　），合理设置现场（　　）。按 8.7.3，对于与燃气系统相邻的、自身不含燃气运行设备但可通过地下排污管道等通道相连通的（　　）区域，也应装设燃气泄漏探测器。", "ans": "严禁；严密封堵；燃气泄漏检测器；封闭", "from": "反措题卡", "notes": [["原文说明", "题卡依据《防止电力生产事故的二十五项重点要求》（2023版）原文自制，不是竞赛原题库题目；答案以附带原文为准。"]]}, "D:3.6-1": {"id": "D:3.6-1", "kp": "3.6", "kind": "drill", "type": "fill", "tname": "填空", "stem": "调压站设置（ ）台可燃气体泄漏探测装置，每台输出 2 个继电器报警信号至火灾报警系统，一级报警浓度为（ ），二级报警浓度为（ ）。", "ans": "30；25%LEL；50%LEL", "src": [{"t": "公用规程 第 738～740 行", "lines": [[738, "调压站设置30台可燃气体泄漏探测装置 （详见附录F 全厂可燃气体探测点分布表） ， 对调压站内天"], [739, "然气泄漏情况进行检测， 燃气浓度以模拟量方式传递给DCS控制系统， 每台燃气体泄漏探测器输出2个继"], [740, "电器报警信号(一级报警浓度为25%LEL，二级报警浓度为50%LEL)至火灾报警系统。"]]}]}, "D:3.6-2": {"id": "D:3.6-2", "kp": "3.6", "kind": "drill", "type": "judge", "tname": "判断", "stem": "调压站检修过程中，测得工作区域天然气浓度超过 10%LEL，应加强通风，继续检修。", "ans": "错", "src": [{"t": "公用规程 第 928～929 行", "lines": [[928, "6) 在检修过程中， 必须持续对工作区域进行可燃气体检测，如果测得的天然气浓度超过 10％LEL，"], [929, "必须停止一切检修工作查找原因并处理。"]]}], "key": "错", "why": "在检修过程中必须持续对工作区域进行可燃气体检测，如果测得的天然气浓度超过 10%LEL，必须停止一切检修工作查找原因并处理。"}, "D:3.6-3": {"id": "D:3.6-3", "kp": "3.6", "kind": "drill", "type": "choice", "tname": "单选", "stem": "调压站严重泄漏、无法隔离，停机并切断 ESD 和出口阀后，现场加装临时通风设备。甲烷浓度低于多少才允许进入站内检修？", "ans": "B", "src": [{"t": "公用规程 第 1010～1012 行", "lines": [[1010, "(3) 如果严重泄漏，无法隔离，应立即停机，切断调压站紧急切断阀(ESD)和出口阀，如有必要，"], [1011, "应通知上游立即切断气源。现场加装临时通风设备，待甲烷浓度低于 5％LEL 后才允许进入站内做"], [1012, "相应的检修工作。"]]}], "opts": [["A", "1%LEL"], ["B", "5%LEL"], ["C", "10%LEL"], ["D", "25%LEL"]], "key": "B"}, "D:3.6-4": {"id": "D:3.6-4", "kp": "3.6", "kind": "drill", "type": "ask", "tname": "问答", "stem": "调压站天然气泄漏检测装置报警后，运行人员怎么处理？", "ans": "携带便携式危险气体检测仪就地检查。就地检查正常、没有泄漏，是检测装置异常，联系检修。便携式检测仪也报警，立即报告值长，禁止一切无关人员进入调压站，严格控制火源；少量泄漏，查出漏点、分析原因，联系检修；严重泄漏无法隔离，立即停机，切断调压站紧急切断阀（ESD）和出口阀，必要时通知上游切断气源。", "src": [{"t": "公用规程 第 1000～1011 行", "lines": [[1000, "1) 携带便携式危险气体检测仪就地检查是否有泄漏；"], [1005, "2) 若就地检查正常，无天然气泄露情况，则为检测装置异常，联系检修处理；"], [1006, "3) 若就地检查便携式危险气体检测仪有报警，则进行如下处理："], [1007, "(1) 立即报告值长，禁止一切无关人员进入调压站，严格控制火源；"], [1008, "(2) 如果少量泄漏，应采取措施，用仪器、检漏液，或其他方法，查出具体的漏气点，分析漏气的"], [1009, "原因，并立即联系检修处理；"], [1010, "(3) 如果严重泄漏，无法隔离，应立即停机，切断调压站紧急切断阀(ESD)和出口阀，如有必要，"], [1011, "应通知上游立即切断气源。现场加装临时通风设备，待甲烷浓度低于 5％LEL 后才允许进入站内做"]]}]}, "L:3.6": {"id": "L:3.6", "kp": "3.6", "kind": "intro"}, "RJ-97f77a6a": {"id": "RJ-97f77a6a", "kp": "3.7", "kind": "orig", "type": "short", "tname": "简答", "stem": "燃机罩壳内危险气体泄漏量高的现象、原因分析及处理？", "ans": "（8分）\n1）现象：燃机罩壳内危险气体检测高报警。\n2）原因：燃气泄漏或测量仪表故障。\n3）处理：\n（1）核对实际报警状况（核对现场表计是否正常并告知值长及热控人员）。\n（2）检查验证实际危险状况（根据现场情况判断是否降负荷）。\n（3）停机后符合条件进行处理。", "from": "一二阶"}, "RJ-7a9e8cf9": {"id": "RJ-7a9e8cf9", "kp": "3.7", "kind": "orig", "type": "fill", "tname": "填空", "stem": "为防止机组运行时天然气、氢气泄漏在燃料模块、燃机间及发电机机端、集电端外壳处聚积产生危险，机组配备有危险气体保护系统。系统在上述区域装设有危险气体（　　）头，当区域危险气体浓度达到相应（　　）时系统发出报警提示运行人员处理或保护动作停机。", "ans": "探、设定值", "from": "技能培训", "note": "本厂规程列的探头区域是燃机间、发电机机端、集电端外壳，没有燃料模块（机岛 9.8.1）。"}, "RJ-5c66fce3": {"id": "RJ-5c66fce3", "kp": "3.7", "kind": "orig", "type": "fill", "tname": "填空", "stem": "燃气轮机机组在运行中发现燃气泄漏检测报警或检测到燃气（　　）有突升，应立即停机检查。", "ans": "浓度", "from": "一二阶", "note": "本厂规程：罩壳危险气体高报警（7% LEL）先核对、再根据现场判断是否降负荷；高高报警（11% LEL）才由保护跳机（机岛 9.8.6）。"}, "D:3.7-1": {"id": "D:3.7-1", "kp": "3.7", "kind": "drill", "type": "judge", "tname": "判断", "stem": "机组运行中，燃机间一个危险气体浓度传感器显示大于 11%LEL，另一个传感器正常且读数不高，燃机就会跳闸。", "ans": "错", "src": [{"t": "机岛规程 第 520～523 行", "lines": [[520, "5 Trip Hazardous Gas Detection SIF Trip Request（燃机间危险气体跳闸）"], [521, "非停机状态时， 两个危险气体浓度传感器 96HT-1、 2 都显示 HH＞11%LEL(爆炸极限-下限)"], [522, "或一个危险气体浓度传感器指示 HH＞11%且另一个故障（浓度传感器故障，流量低低"], [523, "56.6L/H，流量传感器 96GDHT-1、2 故障）"]]}], "key": "错", "why": "燃机间危险气体跳闸的条件是：非停机状态时，两个危险气体浓度传感器 96HT-1、2 都显示 HH＞11%LEL，或一个传感器指示 HH＞11% 且另一个故障。"}, "D:3.7-2": {"id": "D:3.7-2", "kp": "3.7", "kind": "drill", "type": "fill", "tname": "填空", "stem": "危险气体探头 96HT-1/2 的高报警设定值为（ ），高高报警设定值为（ ）；流量变送器 96GDHT-1/2 的低报警为（ ），低低报警为（ ）。", "ans": "7%；11%；113.3L/h；56.6L/h", "src": [{"t": "机岛规程 第 2740～2749 行", "lines": [[2740, "表 2 热工元件整定值及功能"], [2741, "MKVI编号 名称 功能 设定值"], [2742, "96HT-1/2 危险气体探头A、B变送器 高报警"], [2743, "高高报警"], [2744, "7%"], [2745, "11%"], [2746, "96GDHT-1/2 危险气体流量变送器A、B 低报警"], [2747, "低低报警"], [2748, "113.3L/h"], [2749, "56.6L/h"]]}]}, "D:3.7-3": {"id": "D:3.7-3", "kp": "3.7", "kind": "drill", "type": "ask", "tname": "问答", "stem": "燃机罩壳内危险气体高报警（7%LEL）时怎么处理？", "ans": "核对实际报警状况，核对现场表计是否正常，并告知值长及热控人员；检查验证实际危险状况，根据现场情况判断是否降负荷；停机后符合条件进行处理。", "src": [{"t": "机岛规程 第 2791～2799 行", "lines": [[2791, "9.8.6.1 燃机罩壳内危险气体泄漏量高(LELHAH"], [2792, "ALM，设定点：7%LEL)"], [2793, "_"], [2794, "1) 现象：燃机罩壳内危险气体检测高报警。"], [2795, "2) 原因：燃气泄漏或测量仪表故障。"], [2796, "3) 处理："], [2797, "(1) 核对实际报警状况（核对现场表计是否正常并告知值长及热控人员）。"], [2798, "(2) 检查验证实际危险状况（根据现场情况判断是否降负荷）。"], [2799, "(3) 停机后符合条件进行处理。"]]}]}, "D:3.7-4": {"id": "D:3.7-4", "kp": "3.7", "kind": "drill", "type": "judge", "tname": "判断", "stem": "燃机停机以后，危险气体探测系统可以退出运行。", "ans": "错", "src": [{"t": "机岛规程 第 2786～2786 行", "lines": [[2786, "(4) 停机时：燃机危险气体探测系统一直运行。"]]}], "key": "错", "why": "停机时燃机危险气体探测系统一直运行。"}, "D:3.7-5": {"id": "D:3.7-5", "kp": "3.7", "kind": "drill", "type": "fill", "tname": "填空", "stem": "通风管道中的燃气探测器 45HT-1、2 两个都产生高高报警时，通过关闭（ ）和（ ）实现跳机，并同时打开（ ）。", "ans": "燃气控制阀（GCV）；安全关断阀（SSOV）；排空阀门", "src": [{"t": "机岛规程 第 2779～2781 行", "lines": [[2779, "(1) 当通风管道中的燃气探测器 45HT-1、2 两个中的一个产生了高或高高报警时燃机禁止启动。"], [2780, "当两个都产生高高报警时会通过关闭燃气控制阀（GCV）、安全关断阀（SSOV）来实现跳机，"], [2781, "并同时打开排空阀门。"]]}]}, "D:3.7-6": {"id": "D:3.7-6", "kp": "3.7", "kind": "drill", "type": "ask", "tname": "问答", "stem": "危险气体检测系统出现探头模拟信号故障时怎么处理？", "ans": "核对实际报警状况，确定故障原因；一个探头故障时，通知检修及时处理；两个探头故障时，通知检修立即处理并汇报领导，并做好紧急停机准备。", "src": [{"t": "机岛规程 第 2818～2821 行", "lines": [[2818, "3) 处理："], [2819, "(1) 核对实际报警状况，确定故障原因。"], [2820, "(2) 出现一个探头故障时，应通知检修及时处理。"], [2821, "(3) 当出现两个探头故障时，应通知检修立即处理并汇报领导,并做好紧急停机准备。"]]}]}, "D:3.7-7": {"id": "D:3.7-7", "kp": "3.7", "kind": "drill", "type": "choice", "tname": "单选", "stem": "危险气体保护动作跳机时要关闭 SSOV。启动步骤里写的 SSOV 是燃料模块上的哪个阀？", "ans": "B", "src": [{"t": "机岛规程 第 1234～1235 行", "lines": [[1234, "5) 转速大于36rpm时，检查SSOV（安全关断阀VS4-4）已经打开，燃气轮机执行泄漏试验，试验合"], [1235, "格后继续进行。"]]}], "opts": [["A", "辅助截止阀 VS4-1"], ["B", "安全关断阀 VS4-4"], ["C", "燃气截止阀 VGS-1"], ["D", "燃气控制阀 VGC-1"]], "key": "B"}, "D:3.7-8": {"id": "D:3.7-8", "kp": "3.7", "kind": "drill", "type": "judge", "tname": "判断", "stem": "96GDHT1 是好点、流量低于 56.6L/h，只要 96HT1 浓度读数正常，就不算危险气体检测系统故障。", "ans": "错", "src": [{"t": "机岛规程 第 843～852 行", "lines": [[843, "17 Hazardous Gas SIF GT Shutdown（燃机危险气体 SIF 停机）"], [844, "（1） 危险气体检测 1 系统故障且危险气体检测 2 系统故障，延时 2min"], [845, "（2）"], [846, "危险气体检测 1 系统故障："], [847, "①96GDHT1 是好点且 96GDHT1 流量＜56.6L/h"], [848, "②在危险气体处于非维护模式时 96HT1 传感器故障或 96GDHT1 传感器故障"], [849, "（3）"], [850, "危险气体检测 2 系统故障："], [851, "①96GDHT2 是好点且 96GDHT2 流量＜56.6L/h"], [852, "②在危险气体处于非维护模式时 96HT2 传感器故障或 96GDHT2 传感器故障"]]}], "key": "错", "why": "自动停机清单写明：96GDHT1 是好点且 96GDHT1 流量＜56.6L/h，就是危险气体检测 1 系统故障；两套检测系统都故障，延时 2min 燃机自动停机。"}, "L:3.7": {"id": "L:3.7", "kp": "3.7", "kind": "intro"}, "D:3.8-1": {"id": "D:3.8-1", "kp": "3.8", "kind": "drill", "type": "fill", "tname": "填空", "stem": "天然气管线起火或爆炸时，首先应（ ）和（ ）。", "ans": "关闭气源；有影响的电源", "src": [{"t": "公用规程 第 3689～3689 行", "lines": [[3689, "1) 发生火灾时，应首先关闭气源和有影响的电源。"]]}, {"t": "公用规程 第 3708～3708 行", "lines": [[3708, "1) 发生爆炸事故时，应首先关闭气源和有影响的电源，确保人身和机组安全。"]]}]}, "D:3.8-2": {"id": "D:3.8-2", "kp": "3.8", "kind": "drill", "type": "judge", "tname": "判断", "stem": "天然气管线泄漏处形成稳定燃烧后，义务消防队应首先扑灭泄漏处的火焰。", "ans": "错", "src": [{"t": "公用规程 第 3693～3694 行", "lines": [[3693, "3) 当着火点（泄漏处）形成稳定燃烧后，在公安消防队没有到达以前，义务消防队首先从消防栓"], [3694, "处铺设水带， 扑灭着火点附近可燃物的明火， 然后对着火点附近的管线进行不间断冷却， 公安消防"]]}], "key": "错", "why": "规程写的是：义务消防队首先从消防栓处铺设水带，扑灭着火点附近可燃物的明火，然后对着火点附近的管线进行不间断冷却。"}, "D:3.8-3": {"id": "D:3.8-3", "kp": "3.8", "kind": "drill", "type": "choice", "tname": "单选", "stem": "天然气管线起火，公安消防队到达现场后，指挥权怎么处理？", "ans": "B", "src": [{"t": "公用规程 第 3695～3695 行", "lines": [[3695, "队到达现场后，将指挥权交给公安消防队。"]]}], "opts": [["A", "仍由值长指挥"], ["B", "交给公安消防队"], ["C", "交给义务消防队"], ["D", "由调压站运行人员指挥"]], "key": "B"}, "D:3.8-4": {"id": "D:3.8-4", "kp": "3.8", "kind": "drill", "type": "fill", "tname": "填空", "stem": "天然气管线起火时，应在现场（ ）方向设置警戒线，不准有明火出现，禁止（ ）通行。", "ans": "下风；机动车辆", "src": [{"t": "公用规程 第 3700～3702 行", "lines": [[3700, "6) 注意风向变化，要根据现场情况，发布动员令，动员现场周围特别是下风向的居民一致行动，"], [3701, "迅速隔绝火源； 应在现场下风方向设置警戒线， 不准有明火出现； 禁止机动车辆通行， 如有可能与"], [3702, "地方交通部门取得联系，断绝交通。"]]}]}, "D:3.8-5": {"id": "D:3.8-5", "kp": "3.8", "kind": "drill", "type": "fill", "tname": "填空", "stem": "天然气管线爆炸时，值班人员立即汇报，采取（ ）措施，保护（ ），将损失降低到最小，同时报警 119。", "ans": "切换流程；站场主要设备", "src": [{"t": "公用规程 第 3709～3710 行", "lines": [[3709, "2) 根据现场具体情况，值班人员立即汇报。采取切换流程措施，保护站场主要设备，将损失降低"], [3710, "到最小，同时报警“119”"]]}]}, "D:3.8-6": {"id": "D:3.8-6", "kp": "3.8", "kind": "drill", "type": "judge", "tname": "判断", "stem": "天然气管线爆炸后的抢险现场，燃气已经烧完，抢险人员可以使用普通对讲机联络。", "ans": "错", "src": [{"t": "公用规程 第 3716～3718 行", "lines": [[3716, "5) 规定统一的指挥信号，配带醒目标志；抢险人员根据需要配备防毒面具、氧（空）气呼吸器、"], [3717, "耳塞、护目镜、阻燃服、防尘口罩、安全帽、手套、无钉鞋，可燃气体氧气检测仪，并根据安全要"], [3718, "求和需要，配备防爆型对讲机，及其需要防静电的防护用品。"]]}], "key": "错", "why": "规程要求抢险人员根据安全要求和需要，配备防爆型对讲机，及其需要防静电的防护用品。"}, "D:3.8-7": {"id": "D:3.8-7", "kp": "3.8", "kind": "drill", "type": "choice", "tname": "单选", "stem": "调压站站内发生泄漏、火灾，要迅速切断外部气源，规程设计上靠的是哪个阀？", "ans": "B", "src": [{"t": "公用规程 第 623～630 行", "lines": [[623, "入口单元配置有绝缘接头、入口球阀、紧急关断阀(ESD)、紧急放散阀，以及其他必要的辅助设备"], [624, "等。"], [629, "入口单元主要功能是当调压站与外部气源连接时， 站内发生泄漏、 火灾或其它类似事件， 通过紧急"], [630, "关断阀（ESD）迅速切断气源，保证下游管道设备及电厂安全。"]]}], "opts": [["A", "调压线的出口手动阀"], ["B", "入口单元的紧急关断阀（ESD）"], ["C", "工作调压器"], ["D", "调压线的安全切断阀"]], "key": "B"}, "L:3.8": {"id": "L:3.8", "kp": "3.8", "kind": "intro"}, "RJ-37c58d96": {"id": "RJ-37c58d96", "kp": "4.1", "kind": "orig", "type": "fill", "tname": "填空", "stem": "天然气前置模块通常属于燃机本体燃烧系统配套设备，其主要功能是将来自调压站的天然气做一系列的处理后，以适当的压力、温度和流量输送到燃气轮机的（　　）组件，以满足燃气轮机启动、加速和负载要求。", "ans": "燃烧", "from": "技能培训"}, "RJ-99dbca49": {"id": "RJ-99dbca49", "kp": "4.1", "kind": "orig", "type": "fill", "tname": "填空", "stem": "前置模块科里奥利气体流量计配有1个变送器96VM-1，主要用于性能测试时燃机燃气流量的测量。科氏流量计是一种利用流体在管道中流动时产生的（　　）成正比的科里奥利力原理来直接测量质量流量的装置，由流量检测元件和转换器组成。", "ans": "振动与质量流量", "from": "技能培训"}, "RJ-fc4ef6cf": {"id": "RJ-fc4ef6cf", "kp": "4.1", "kind": "orig", "type": "fill", "tname": "填空", "stem": "天然气前置模块的双联聚结过滤器模块的每个容器都配有一个受控排水阀（下部为VA85-20和VA85-22；上部为VA85-21和VA85-23）和适当的液位仪表，以提供所需的功能。这些排水阀的开启由（　　）变送器（96-AS-1、96-AS-3或96-AS-2和96-AS-4）Mark VIe引导，同时考虑控制液位变送器分别给出的下部或上部冷凝水液位。（　　）的液位变送器96-AS-2或96-AS-4也用于报警和RB功能。如果双联凝聚式过滤器排水阀无法打开，则会触发报警（3.9in）或1X RB（5.9in）。如果自动排水阀发生故障，应关闭自动阀上下游的手动阀，并拆除自动排水阀进行维护。在自动排水阀的维护过程中，如果检测到高液位，将通过打开手动旁通阀对系统进行排水。", "ans": "液位、上部", "from": "技能培训", "note": "本厂规程这里前后不一：保护表写聚结式过滤器液位高高跳闸（机岛 9.3.3.4）；快减负荷清单写并网时液位高于 5.9 in 触发 1 倍 RB（5.3.1），和题库一致。3.9 in 报警值规程没写。"}, "D:4.1-1": {"id": "D:4.1-1", "kp": "4.1", "kind": "drill", "type": "fill", "tname": "填空", "stem": "天然气前置模块系统主要包括两个 100% 的（ ）、燃气科氏流量计（ ）、一套（ ）及相关测量表计。", "ans": "绝对分离器；96VM-1；性能加热器（PCHE）", "src": [{"t": "机岛规程 第 1996～1998 行", "lines": [[1996, "天然气前置模块系统主要包括两个100％的绝对分离器、燃气科氏流量计（96VM-1）、"], [1997, "一套性能加"], [1998, "热器（PCHE）及相关测量表计。"]]}]}, "D:4.1-2": {"id": "D:4.1-2", "kp": "4.1", "kind": "drill", "type": "choice", "tname": "单选", "stem": "来自调压站的燃气在前置模块里依次经过哪些设备？", "ans": "B", "src": [{"t": "机岛规程 第 1999～2001 行", "lines": [[1999, "来自调压站的燃气首先经过两个绝对分离器为两级过滤/分离装置，垂直并联布置，第一级用惯性"], [2000, "分离除去较大的液滴和颗粒，第二级是聚凝式过滤器，可以去除99.5%直径≤0.3μm的液体和固体。燃"], [2001, "气从过滤分离器出来，经过燃气科氏流量计（96VM-1)后进入性能加热器模块。性能加热器将气体加热"]]}], "opts": [["A", "性能加热器、绝对分离器、科氏流量计"], ["B", "绝对分离器、科氏流量计、性能加热器"], ["C", "科氏流量计、绝对分离器、性能加热器"], ["D", "绝对分离器、性能加热器、科氏流量计"]], "key": "B"}, "D:4.1-3": {"id": "D:4.1-3", "kp": "4.1", "kind": "drill", "type": "fill", "tname": "填空", "stem": "绝对分离器为两级过滤/分离装置，第一级用（ ）除去较大的液滴和颗粒，第二级是（ ），可以去除 99.5% 直径≤0.3μm 的液体和固体。", "ans": "惯性分离；聚结式过滤器（规程这里写作聚凝式过滤器）", "src": [{"t": "机岛规程 第 1999～2000 行", "lines": [[1999, "来自调压站的燃气首先经过两个绝对分离器为两级过滤/分离装置，垂直并联布置，第一级用惯性"], [2000, "分离除去较大的液滴和颗粒，第二级是聚凝式过滤器，可以去除99.5%直径≤0.3μm的液体和固体。燃"]]}]}, "D:4.1-4": {"id": "D:4.1-4", "kp": "4.1", "kind": "drill", "type": "fill", "tname": "填空", "stem": "绝对分离器差压超过（ ）barg（（ ）psig）时，切换过滤器并更换滤芯。", "ans": "1.03；15", "src": [{"t": "机岛规程 第 2103～2103 行", "lines": [[2103, "当绝对分离器差压超过1.03barg（15psig）时，切换过滤器并更换滤芯。"]]}]}, "D:4.1-5": {"id": "D:4.1-5", "kp": "4.1", "kind": "drill", "type": "judge", "tname": "判断", "stem": "切换绝对分离器时，先关闭原运行过滤器的出口阀，再打开备用过滤器的出口阀。", "ans": "错", "src": [{"t": "机岛规程 第 2106～2113 行", "lines": [[2106, "(1) 确定备用过滤器出口压力与系统压力相等。"], [2111, "(2) 缓慢地打开过滤器出口阀。确保在过滤器切换过程，系统压力保持平稳。"], [2112, "(3) 确定所有状态正常，过滤器运行时，未出现系统报警。"], [2113, "(4) 缓慢关闭原运行过滤器出口阀， 应监控系统压力变化。 若系统压力下降， 应停止关闭出口阀。"]]}], "key": "错", "why": "先确定备用过滤器出口压力与系统压力相等，缓慢打开备用过滤器出口阀，确认正常后再缓慢关闭原运行过滤器出口阀，并监控系统压力，若系统压力下降，应停止关闭出口阀。"}, "D:4.1-6": {"id": "D:4.1-6", "kp": "4.1", "kind": "drill", "type": "choice", "tname": "单选", "stem": "按规程 9.3.3.4 的设备保护逻辑表，下列哪个信号的动作是跳闸？", "ans": "C", "src": [{"t": "机岛规程 第 2035～2041 行", "lines": [[2035, "96GCF-1 绝对分离器差压 报警 >103.425kpa 报警"], [2036, "96GCF-2 绝对分离器差压 报警 >103.425kpa 报警"], [2037, "71AS-1B #1 凝聚式过滤器液位高 报警 出厂时已确定报警位置"], [2038, "71AS-1A #1 凝聚式过滤器液位高高 跳闸 出厂时已确定报警位置"], [2039, "71AS-2B #2 凝聚式过滤器液位高 报警 出厂时已确定报警位置"], [2040, "71AS-2A #2 凝聚式过滤器液位高高 跳闸 出厂时已确定报警位置"], [2041, "96AS-1 #1 凝聚式过滤器分离器液位 报警 出厂时已确定报警位置"]]}], "opts": [["A", "96GCF-1 绝对分离器差压"], ["B", "71AS-1B #1 聚结式过滤器液位高"], ["C", "71AS-1A #1 聚结式过滤器液位高高"], ["D", "96AS-1 #1 聚结式过滤器分离器液位"]], "key": "C"}, "D:4.1-7": {"id": "D:4.1-7", "kp": "4.1", "kind": "drill", "type": "ask", "tname": "问答", "stem": "绝对分离器液位异常报警，可能是什么原因？怎么处理？", "ans": "原因：液位控制系统故障、液位计故障、天然气含水量高、疏水系统故障。处理：检查控制系统和液位计；检查绝对分离器中的疏水液位并排污；运行的绝对分离器不能及时恢复正常，将备用绝对分离器投入运行；液位仍然高，做好停机准备。", "src": [{"t": "机岛规程 第 2126～2135 行", "lines": [[2126, "2) 原因："], [2127, "(1) 液位控制系统故障。"], [2128, "(2) 液位计故障。"], [2129, "(3) 天然气含水量高。"], [2130, "(4) 疏水系统故障。"], [2131, "3) 处理："], [2132, "(1) 检查控制系统和液位计。"], [2133, "(2) 检查绝对分离器中的疏水液位，并进行排污。"], [2134, "(3) 如运行绝对分离器不能及时恢复正常，应将备用绝对分离器投入运行。"], [2135, "(4) 如果液位仍然高，应做好停机准备。"]]}]}, "L:4.1": {"id": "L:4.1", "kp": "4.1", "kind": "intro"}, "RJ-12680f3e": {"id": "RJ-12680f3e", "kp": "4.2", "kind": "orig", "type": "fill", "tname": "填空", "stem": "前置模块性能加热器燃料加热通过增加进入燃机的燃料温度（将气体加热到燃机要求的温度227℃），减少达到目标燃烧温度所需要的燃料量，从而提高燃机效率。性能加热器为（1*100％容量）的热交换器，加热介质是从 HRSG 的（　　）省煤器的出口取出的热给水，气体燃料加热器排出的水流向凝结水母管。当燃气轮机点火且给水供应温度足够时，打开温度控制阀及中压省煤器出口给水，（　　）燃气性能加热器。这样可以尽早启动燃料加热，从而最大限度地减少启动期间燃料加热器热量滞后，以及启动升温时间的影响。", "ans": "中压（IP）、启动", "from": "技能培训", "note": "本厂规程没写目标温度，只写 P1 腔燃气温度高于 238 ℃（460 ℉）跳性能加热器（机岛 9.3.3.2）。"}, "RJ-5708a389": {"id": "RJ-5708a389", "kp": "4.2", "kind": "orig", "type": "short", "tname": "简答", "stem": "简述那些条件满足后，性能加热器投入运行：", "ans": "①水压力>燃气压力+3.5Bar\n②性能加热器水侧出口压力（MBP36CP002A/B）不上升\n③中压给水温度>燃气温度+20℃\n④上游气体入口温度高于5℃\n⑤性能加热器连续提供加热功能从而维持所需要的燃气温度。\n⑥检查系统所有运行参数正常且无报警存在。", "from": "技能培训", "note": "本厂规程里水侧出口压力测点写作 96PH-4A\\4B；投入条件里没有第⑤条（机岛 9.3.4.2）。"}, "RJ-62a486fd": {"id": "RJ-62a486fd", "kp": "4.2", "kind": "orig", "type": "fill", "tname": "填空", "stem": "通用电气公司在H级燃机的天然气预加热模块采用“（　　）”(Printed Circuit Heat EXchanger，以下简称 PCHE)的设计，此类型的换热器已成为GE H级燃机的标配。采用先进的扩散焊接技术，使得钢板层之间的接合达到原子级的可靠连接，不易产生泄漏。", "ans": "印刷电路板换热器", "from": "技能培训"}, "D:4.2-1": {"id": "D:4.2-1", "kp": "4.2", "kind": "drill", "type": "choice", "tname": "单选", "stem": "性能加热器换热后的回水去哪里？", "ans": "B", "src": [{"t": "机岛规程 第 2002～2002 行", "lines 能加热器水侧出口压力（96PH-4A\\4B）增加"], [2054, "(3) 中压给水温度>燃气温度+20℃"], [2055, "(4) 上游气体入口温度高于 5℃"], [2056, "(5) 检查系统所有运行参数正常且无报警。"]]}], "key": "错", "why": "投入条件里单列了一条「未发现性能加热器水侧出口压力（96PH-4A、4B）增加」，水侧出口压力上升不满足投入条件。"}, "D:4.2-7": {"id": "D:4.2-7", "kp": "4.2", "kind": "drill", "type": "ask", "tname": "问答", "stem": "性能加热器的顺控启动条件有哪几条？", "ans": "中压给水泵运行；中压给水压力与天然气压力差大于允许值；无加热器跳闸条件（同时作为进、出水阀开允许条件）；值班员手动投性能加热器或燃机点火。", "src": [{"t": "机岛规程 第 2070～2074 行", "lines": [[2070, "2) 顺控启动条件："], [2071, "(1) 中压给水泵运行。"], [2072, "(2) 中压给水压力与天然气压力差大于允许值。"], [2073, "(3) 无加热器跳闸条件（同时作为进、出水阀开允许条件）。"], [2074, "(4) 值班员手动投性能加热器或燃机点火。"]]}]}, "L:4.2": {"id": "L:4.2", "kp": "4.2", "kind": "intro"}, "D:4.3-1": {"id": "D:4.3-1", "kp": "4.3", "kind": "drill", "type": "fill", "tname": "填空", "stem": "按规程 9.3.5，性能加热器正常退出的条件是：燃机发（ ），燃机转速小于（ ），性能加热器自动退出。", "ans": "停机令；95%", "src": [{"t": "机岛规程 第 2085～2086 行", "lines": [[2085, "1) 正常退出："], [2086, "燃机发停机令，燃机转速小于 95%，性能加热器自动退出"]]}]}, "D:4.3-2": {"id": "D:4.3-2", "kp": "4.3", "kind": "drill", "type": "fill", "tname": "填空", "stem": "性能加热器跳闸条件：水侧进口温度＜（ ）℉，延时 5s；进水滤网压差大＞（ ）psig；性能加热器出口水温＜（ ）℉。", "ans": "113；58.0；50", "src": [{"t": "机岛规程 第 2088～2092 行", "lines": [[2088, "(1) 水侧进口温度\u003c113℉，延时 5s。"], [2089, "(2) 水侧阀门故障（指令与反馈偏差超过 5％）。"], [2090, "(3) 进水滤网压差大>58.0psig。"], [2091, "(4) P1 腔天然气温度>460℉延时 10s。"], [2092, "(5) 性能加热器出口水温\u003c50℉。"]]}]}, "D:4.3-3": {"id": "D:4.3-3", "kp": "4.3", "kind": "drill", "type": "judge", "tname": "判断", "stem": "P1 腔燃气温度低于 100℉ 时，性能加热器跳闸。", "ans": "错", "src": [{"t": "机岛规程 第 2030～2032 行", "lines": [[2030, "1) P1腔燃气高高460℉(238℃)，跳性能加热器。"], [2031, "2) P1腔燃气温度FTG传感器（FTG-1A/1B）测点A、B均为坏点，延时2s，燃机自动停机"], [2032, "3) P1腔燃气温度\u003c100℉，燃机3倍RB。"]]}], "key": "错", "why": "P1 腔燃气温度\u003c100℉，是燃机 3 倍 RB；P1 腔燃气高高 460℉(238℃)，才跳性能加热器。"}, "D:4.3-4": {"id": "D:4.3-4", "kp": "4.3", "kind": "drill", "type": "fill", "tname": "填空", "stem": "P1 腔燃气温度 FTG 传感器（FTG-1A/1B）测点 A、B 均为坏点，延时（ ）s，燃机（ ）。", "ans": "2；自动停机", "src": [{"t": "机岛规程 第 2031～2031 行", "lines": [[2031, "2) P : "5.1", "kind": "intro"}, "RJ-dc508a1a": {"id": "RJ-dc508a1a", "kp": "5.2", "kind": "orig", "type": "short", "tname": "简答", "stem": "简述燃气启动泄漏试验过程？", "ans": "（15分）\n燃机启动时执行泄漏试验。该试验监控 P2 腔内的压力变化，以确保燃气阀的密封性良好。\n1）试验 A（执行 VGS-1、VSC-1 泄漏试验）\n燃气管道首先加压上游 VS4-1。P1X 和 P2 腔排气。关闭 P1x 和 P2 腔排气阀，VS4-1 阀打开，\n燃料气体对 P1X 腔加压。若燃料气体通过 VGS-1 和 VSC-1 时存在泄漏，则 P2 腔内压力增大。需对\nP2 腔内压力变化率进行实时监控，以确定阀门之间是否存在过度泄漏。\n2）试验 B（VGC-1 到 4、VIS-2、VA13-15 泄漏测试）\n打开 VGS-1 给 P2 腔加压。一旦 P2 腔增压，VGS-1 被命令再次关闭。由于燃气阀 VGC-1 到 4、\nVIS-2 和 VA13-15 之间的泄漏，P2 腔内的压力降低。需对 P2 腔内压力变化率进行实时监控，以确定阀门之间是否存在过度泄漏。", "from": "一二阶"}, "RJ-fb87ce2a": {"id": "RJ-fb87ce2a", "kp": "5.2", "kind": "orig", "type": "fill", "tname": "填空", "stem": "在每次燃机启动时执行泄漏测试。该测试监控 （　　）腔内的压力变化，以确保燃气阀的密封性良好。如果泄漏测试失败，将向操作员发出警报。一旦整个泄漏测试通过，截止阀 VS4-1 再次关闭，打开 VA13-200 和 VA13-15 排气阀，对 P1X 和 P2 腔进行减压。如果测试 A或测试 B失败，将启动（　　），操作员可以通过启动主复位命令（Master Reset）重新运行气体泄漏测试试验。", "ans": "P2 、报警", "from": "技能培训"}, "RJ-std016": {"id": "RJ-std016", "kp": "5.2", "kind": "orig", "type": "fill", "tname": "填空", "stem": "按《机岛运行技术标准》9.4.4.2，燃气启动泄漏试验监控（　　），以确认燃气阀密封性。", "ans": "P2腔内的压力变化", "from": "来源训练题", "notes": [["原整理说明", "答案逐字见同题所附精确引文；本题不作跨来源推断。"], ["原文说明", "来源训练题：由原整理者依据《机岛运行技术标准》或反措原文出的训练题，不是竞赛原题库题目。"]]}, "RJ-anti001": {"id": "RJ-anti001", "kp": "5.2", "kind": "orig", "type": "fill", "tname": "填空", "stem": "按《二十五项反措》8.5.2，燃气阀自检试验不合格时，燃气轮机组（　　）。", "ans": "严禁启动", "from": "来源训练题", "notes": [["原整理说明", "答案逐字见同题所附精确引文；本题不作跨来源推断。"], ["原文说明", "来源训练题：由原整理者依据《机岛运行技术标准》或反措原文出的训练题，不是竞赛原题库题目。"]]}, "FC-8.5.2": {"id": "FC-8.5.2", "kp": "5.2", "kind": "orig", "type": "fill", "tname": "填空", "stem": "按反措 8.5.2，（　　）和（　　）（包括燃气压力和燃气流量调节阀）应能关闭严密。新投产机组及大修后机组应进行调节系统（　　）试验及（　　）测试，阀门开关动作过程迅速且无卡涩现象。自检试验不合格，燃气轮机组（　　）启动。", "ans": "燃气关断阀；燃气控制阀；静态；关闭时间；严禁", "from": "反措题卡", "notes": [["原文说明", "题卡依据《防止电力生产事故的二十五项重点要求》（2023版）原文自制，不是竞赛原题库题目；答案以附带原文为准。"]]}, "D:5.2-1": {"id": "D:5.2-1", "kp": "5.2", "kind": "drill", "type": "fill", "tname": "填空", "stem": "启动时转速大于（ ）rpm，检查安全关断阀 VS4-4 已经打开，燃机执行泄漏试验。", "ans": "36", "sr ind": "orig", "type": "fill", "tname": "填空", "stem": "燃机启动（　　）时，启动控制阀[VSC-1]逐渐开启，达到所需的 P2 点火压力。同时，PM1 和 PM2 燃气控制阀[VGC-1和2]逐渐开启至点火所需的位置，打开预混截止阀[VGST-1]后，打开预混控制阀[VGCT-1]，以控制上游预混点火器点火所需的压力，火花塞通电。当检测到火焰后，关闭预混截止阀和控制阀[VGST-1 和 VGCT-1]。为了排空预混腔，打开排气阀[VA13T-1]。P2 腔压力和温度传感器用于测量[96FG-25A, 25B / FTG-2A, 2B]燃机点火前送至燃气轮机的燃气质量。如果燃气量超过安全限度，可能会导致点火中止，机组（　　）。", "ans": "点火、跳闸", "from": "技能培训", "note": "本厂规程把 VGST-1、VGCT-1 叫点火腔截止阀、控制阀（9.4.4.4），或引燃截止阀、调节阀（9.4.2），不叫「预混」。"}, "RJ-41a28e2d": {"id": "RJ-41a28e2d", "kp": "5.3", "kind": "orig", "type": "fill", "tname": "填空", "stem": "从点火到 60% speed，调节（　　），可以使P2 值与燃机转速相匹配。燃气控制阀 VGC-1 和 VGC-2 部分开启，以符合预先确定的 （　　）压力，满足燃料流量在PM1、PM2管线中的分配比。在 60% speed时，（　　）控制阀必须全开，以减少阀门的压降。启动控制阀全开后，燃气截止阀(VGS-1)打开。当VGS-1 全开时，应关闭启动控制阀 VSC-1。吹扫程序将在 95%speed时，对所有未进入燃气的管路上（　　）。为了使燃气能够连续向前流动通过气体燃料喷嘴，避免由于回流，导致喷嘴损坏、燃料混合物自动点火的风险。无论燃烧气体或液体燃料，未加燃料的喷嘴都需要用冷却空气进行吹扫。燃气管路吹扫时吹扫阀是打开的，排气阀是关闭的。", "ans": "VSC-1、P2 、启动、执行", "from": "技能培训"}, "D:5.3-1": {"id": "D:5.3-1", "kp": "5.3", "kind": "drill", "type": "fill", "tname": "填空", "stem": "点火前给燃气管道加压：先关闭 P1X、P2 和点火腔排气阀（ ）、（ ）和（ ），排气阀关闭后，截止阀（ ）全开。", "ans": "VA13-200；VA13-15；VA13T-1；VS4-1", "src": [{"t": "机岛规程 第 2260～2262 行", "lines": [[2260, "9.4.4.3 点火前燃气管道系统的加压"], [2261, "P1X、P2和点火腔排气阀（VA13-200、VA13-15和VA13T-1）应关闭。排气阀关闭后，截止阀VS4-1"], [2262, "全开，对燃气管路上游的燃气截止阀VGS-1、启动控制阀VSC-1、点火腔截止阀VGST-1加压。"]]}]}, "D:5.3-2": {"id": "D:5.3-2", "kp": "5.3", "kind": "drill", "type": "choice", "tname": "单选", "stem": "点火时，靠哪个阀逐渐开启来达到所需的 P2 点火压力？", "ans": "B", "src": [{"t": "机岛规程 第 2264～2264 行", "lines": [[2264, "启动控制阀（VSC-1）逐渐开启，达到所需的P2点火压力。同时，PM1和PM2燃气控制阀（VGC-1和2）"]]}], "opts": [["A", "燃气截止阀 VGS-1"], ["B", "启动控制阀 VSC-1"], ["C", "辅助截止阀 VS4-1"], ["D", "点火腔截止阀 VGST-1"]], "key": "B"}, "D:5.3-3": {"id": "D:5.3-3", "kp": "5.3", "kind": "drill", "type": "judge", "tname": "判断", "stem": "点火时，PM3 和 AFS 的燃气控制阀 VGC-3、VGC-4 逐渐开到点火所需的位置。", "ans": "错", "src": [{"t": "机岛规程 第 2264～2269 行", "lines": [[2264, "启动控制阀（VSC-1）逐渐开启，达到所需的P2点火压力。同时，PM1和PM2燃气控制阀（VGC-1和2）"], [2269, "逐渐开启至点火所
